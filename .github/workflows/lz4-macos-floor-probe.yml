name: LZ4 macOS 11 dependency-floor feasibility probe

on:
  workflow_dispatch:
  push:
    branches: [spike]
    paths:
      - '.github/workflows/lz4-macos-floor-probe.yml'
      - 'scripts/macos/lz4-floor-probe.sh'

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build unmodified upstream LZ4 and inspect macOS floor
        run: bash scripts/macos/lz4-floor-probe.sh "${{ matrix.architecture }}" "$RUNNER_TEMP/results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lz4-macos-${{ matrix.architecture }}-floor-probe
          path: ${{ runner.temp }}/results/**
          if-no-files-found: warn
          retention-days: 3
