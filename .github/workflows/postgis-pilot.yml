name: PostGIS Linux feasibility pilot
on:
  workflow_dispatch:
  push:
    branches: [spike]
    paths:
      - 'scripts/postgis/**'
      - 'scripts/tiger/**'
      - 'scripts/linux/qemu-kernel-515.Dockerfile'
      - 'scripts/qemu/arm64-515.Dockerfile'
      - 'tools/emit_linux_minimum_pilot_records.py'
      - 'scripts/linux/Dockerfile'
      - 'scripts/linux/build.sh'
      - 'scripts/linux/build-in-container.sh'
      - 'scripts/linux/bundle-glibc-in-container.sh'
      - 'scripts/linux/launcher.c'
      - 'tools/write_linux_license_inventory.py'
      - 'tools/discover_builtins.py'
      - 'support.json'
      - 'tools/check_elf_dependencies.py'
      - 'tools/check_postgis_license_inventory.py'
      - 'tools/emit_postgis_pilot_record.py'
      - 'tools/create_extension_publication_receipt.py'
      - 'tools/emit_extension_publication_records.py'
      - 'tools/write_postgis_license_inventory.py'
      - 'tools/reuse_linux_core_artifact.py'
      - 'tools/create_linux_symbols.py'
      - 'tests/test_reuse_linux_core_artifact.py'
      - 'tests/test_create_linux_symbols.py'
      - 'tests/test_emit_postgis_pilot_record.py'
      - 'tests/test_emit_extension_publication_records.py'
      - 'support/verification-profiles.json'
      - '.github/workflows/postgis-pilot.yml'
jobs:
  linux-postgis:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
            docker-platform: linux/amd64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            docker-platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    env:
      PG_ARCHITECTURE: ${{ matrix.architecture }}
    timeout-minutes: 70
    permissions:
      actions: read
      contents: read
    steps:
      - name: Confirm native architecture
        run: |
          case "$PG_ARCHITECTURE" in
            x86_64) test "$(uname -m)" = x86_64 ;;
            arm64) test "$(uname -m)" = aarch64 ;;
          esac
      - uses: actions/checkout@v4
      - name: Check core archive reuse
        id: core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest tests/test_reuse_linux_core_artifact.py tests/test_emit_postgis_pilot_record.py tests/test_create_linux_symbols.py
          python3 tools/reuse_linux_core_artifact.py \
            --postgresql-version 18.6 --architecture "$PG_ARCHITECTURE" \
            --output "$RUNNER_TEMP/core" \
            --github-output "$GITHUB_OUTPUT"
      - name: Build exact PostgreSQL 18.6 Linux core archive
        if: steps.core.outputs.reused != 'true'
        run: bash scripts/linux/build.sh "$RUNNER_TEMP/core"
      - name: Build and probe PostGIS 3.6.4 against PostgreSQL 18.6
        run: bash scripts/postgis/build.sh "$RUNNER_TEMP/core" "$RUNNER_TEMP/postgis"
      - name: Verify relocated archives on clean Ubuntu 24.04
        id: current_verify
        run: bash scripts/postgis/verify.sh "$RUNNER_TEMP/core" "$RUNNER_TEMP/postgis"
      - name: Build TIGER Geocoder 2025.2 SQL archive
        run: bash scripts/tiger/build.sh "$RUNNER_TEMP/core" "$RUNNER_TEMP/tiger"
      - name: Verify TIGER Geocoder with exact PostgreSQL and PostGIS archives
        run: |
          set -o pipefail
          bash scripts/tiger/verify.sh "$RUNNER_TEMP/core" "$RUNNER_TEMP/postgis" "$RUNNER_TEMP/tiger" \
            2>&1 | tee "$RUNNER_TEMP/tiger-current.log"
      - name: Check PostGIS with older or absent host glibc
        id: portability
        run: |
          for image in ubuntu:20.04 alpine:3.22; do
            docker run --rm --platform "${{ matrix.docker-platform }}" -e PG_ARCHITECTURE \
              -v "$RUNNER_TEMP/core:/core:ro" -v "$RUNNER_TEMP/postgis:/ext:ro" \
              -v "$GITHUB_WORKSPACE:/repo:ro" \
              --entrypoint sh "$image" /repo/scripts/postgis/verify-portability.sh /core /ext
          done
      - name: Verify exact archives on Linux 5.15 in QEMU
        id: minimum_verify
        if: ${{ always() }}
        run: |
          core="$RUNNER_TEMP/core/postgresql-18.6-linux-$PG_ARCHITECTURE.tar.gz"
          extension="$RUNNER_TEMP/postgis/postgis-3.6.4-postgresql-18.6-linux-$PG_ARCHITECTURE.tar.gz"
          if [[ ! -f "$core" || ! -f "$core.sha256" || ! -f "$extension" || ! -f "$extension.sha256" ]]; then
            echo 'No minimum-kernel verification: archive bytes or checksum sidecars are unavailable'
            exit 0
          fi
          dockerfile=scripts/linux/qemu-kernel-515.Dockerfile
          if [[ "$PG_ARCHITECTURE" = arm64 ]]; then dockerfile=scripts/qemu/arm64-515.Dockerfile; fi
          docker build -f "$dockerfile" -t pg-binaries-postgis-qemu .
          mkdir -p "$RUNNER_TEMP/postgis-qemu"
          docker run --rm -e PG_ARCHITECTURE -e GITHUB_SHA \
            -v "$GITHUB_WORKSPACE:/repo:ro" -v "$RUNNER_TEMP/core:/core:ro" \
            -v "$RUNNER_TEMP/postgis:/ext:ro" -v "$RUNNER_TEMP/postgis-qemu:/work" \
            pg-binaries-postgis-qemu bash /repo/scripts/postgis/qemu-kernel-515.sh /core 18.6 /work /ext
      - name: Finalize PostGIS verification records
        if: ${{ always() }}
        env:
          GITHUB_SHA: ${{ github.sha }}
          CURRENT_VERIFY_OUTCOME: ${{ steps.current_verify.outcome }}
          PORTABILITY_OUTCOME: ${{ steps.portability.outcome }}
          MINIMUM_VERIFY_OUTCOME: ${{ steps.minimum_verify.outcome }}
        run: |
          core="$RUNNER_TEMP/core/postgresql-18.6-linux-$PG_ARCHITECTURE.tar.gz"
          extension="$RUNNER_TEMP/postgis/postgis-3.6.4-postgresql-18.6-linux-$PG_ARCHITECTURE.tar.gz"
          if [[ ! -f "$core" || ! -f "$core.sha256" || ! -f "$extension" || ! -f "$extension.sha256" ]]; then
            echo 'No PostGIS verification records: archive bytes or checksum sidecars are unavailable'
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/postgis-records"
          record_status=0
          image_id=$(docker image inspect --format '{{.Id}}' pg-binaries-postgis-verifier 2>/dev/null || true)
          if [[ "$CURRENT_VERIFY_OUTCOME" != 'skipped' && "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            current_outcome=skipped
            if [[ "$CURRENT_VERIFY_OUTCOME" == 'failure' || "$PORTABILITY_OUTCOME" == 'failure' ]]; then
              current_outcome=failed
            elif [[ "$CURRENT_VERIFY_OUTCOME" == 'success' && "$PORTABILITY_OUTCOME" == 'success' ]]; then
              current_outcome=passed
            fi
            python3 tools/emit_postgis_pilot_record.py \
              --architecture "$PG_ARCHITECTURE" --archives "$RUNNER_TEMP/postgis" \
              --core-archives "$RUNNER_TEMP/core" --output "$RUNNER_TEMP/postgis-records" \
              --image-id "$image_id" --kernel "$(uname -r)" --outcome "$current_outcome" || record_status=$?
          else
            echo 'No current-OS PostGIS record: verifier did not establish its clean image'
          fi
          evidence="$RUNNER_TEMP/postgis-qemu/evidence"
          log="$evidence/full-verifier.log"
          if [[ -f "$log" ]] && grep -q '^guest_os=Ubuntu 22.04' "$log" && grep -q '^guest_kernel=5\.15\.' "$log" && grep -q "^guest_architecture=$PG_ARCHITECTURE$" "$log"; then
            minimum_outcome=skipped
            if [[ "$MINIMUM_VERIFY_OUTCOME" == 'failure' ]]; then minimum_outcome=failed; fi
            if [[ "$MINIMUM_VERIFY_OUTCOME" == 'success' ]]; then minimum_outcome=passed; fi
            qemu_image=$(docker image inspect --format '{{.Id}}' pg-binaries-postgis-qemu 2>/dev/null || true)
            if [[ "$qemu_image" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              python3 tools/emit_postgis_pilot_record.py \
                --architecture "$PG_ARCHITECTURE" --archives "$RUNNER_TEMP/postgis" \
                --core-archives "$RUNNER_TEMP/core" --output "$RUNNER_TEMP/postgis-records" \
                --evidence "$evidence" --image-id "$qemu_image" \
                --kernel "$(uname -r)" --outcome "$minimum_outcome" || record_status=$?
            else
              echo 'No minimum-kernel PostGIS record: QEMU image identity is unavailable'
            fi
          else
            echo 'No minimum-kernel PostGIS record: clean guest identity was not established'
          fi
          exit "$record_status"
      - name: Record PostGIS publication step outcomes
        if: ${{ always() }}
        env:
          CURRENT_VERIFY_OUTCOME: ${{ steps.current_verify.outcome }}
          PORTABILITY_OUTCOME: ${{ steps.portability.outcome }}
          MINIMUM_VERIFY_OUTCOME: ${{ steps.minimum_verify.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/postgis-publication"
          printf '{"archive-suite":"%s","portability":"%s"}\n' \
            "$CURRENT_VERIFY_OUTCOME" "$PORTABILITY_OUTCOME" \
            > "$RUNNER_TEMP/postgis-publication/current-steps.json"
          printf '{"archive-suite":"%s"}\n' "$MINIMUM_VERIFY_OUTCOME" \
            > "$RUNNER_TEMP/postgis-publication/minimum-steps.json"
      - name: Emit PostGIS publication records for verified endpoints
        if: ${{ always() }}
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/core/postgresql-18.6-linux-$PG_ARCHITECTURE.tar.gz"
          extension="$RUNNER_TEMP/postgis/postgis-3.6.4-postgresql-18.6-linux-$PG_ARCHITECTURE.tar.gz"
          if [[ ! -f "$core" || ! -f "$core.sha256" || ! -f "$extension" || ! -f "$extension.sha256" ]]; then
            echo 'No publication record: assembled archive bytes or sidecars are unavailable'
            exit 0
          fi
          publication="$RUNNER_TEMP/postgis-publication"
          current_image=$(docker image inspect --format '{{.Id}}' pg-binaries-postgis-verifier 2>/dev/null || true)
          if [[ "$current_image" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            clean=false
            dependencies=failure
            if [[ "$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(all(v == "success" for v in d.values()))' "$publication/current-steps.json")" = True ]]; then
              clean=true
              dependencies=success
            fi
            . /etc/os-release
            python3 tools/create_extension_publication_receipt.py \
              --archives "$RUNNER_TEMP/postgis" --core-archives "$RUNNER_TEMP/core" \
              --receipt "$publication/current-receipt.json" \
              --profile-id "postgis-publication-current-$PG_ARCHITECTURE" \
              --project PostGIS --version 3.6.4 --postgresql-version 18.6 \
              --architecture "$PG_ARCHITECTURE" --endpoint current \
              --kernel-release "$(uname -r)" --distribution "$PRETTY_NAME" \
              --distribution-version "$VERSION_ID" --image-id "$current_image" \
              --dependency-check-result "$dependencies" --clean-system "$clean" \
              --step-results "$publication/current-steps.json"
            python3 tools/emit_extension_publication_records.py \
              --archives "$RUNNER_TEMP/postgis" --core-archives "$RUNNER_TEMP/core" \
              --receipt "$publication/current-receipt.json" --output "$publication/records"
          else
            echo 'No current-OS publication record: clean verifier image identity is unavailable'
          fi
          evidence="$RUNNER_TEMP/postgis-qemu/evidence"
          log="$evidence/full-verifier.log"
          if [[ ! -f "$log" || ! -f "$evidence/environment.txt" || ! -f "$evidence/archive-checksums.sha256" ]]; then
            echo 'No minimum-OS publication record: guest evidence is unavailable'
            exit 0
          fi
          kernel=$(sed -n 's/^guest_kernel=//p' "$log" | head -1)
          distribution=$(sed -n 's/^guest_os=//p' "$log" | head -1)
          grep -Eq '^5\.15\.' <<< "$kernel"
          grep -q '^Ubuntu 22\.04' <<< "$distribution"
          grep -Fx "guest_architecture=$PG_ARCHITECTURE" "$log"
          grep -Fx "test_revision=$GITHUB_SHA" "$evidence/environment.txt"
          case "$PG_ARCHITECTURE" in
            x86_64) image_sha=e3297e0aa6c408ac90d854348465d3991c65159b444c4ef9016f52f6807290e3 ;;
            arm64) image_sha=86e13258765945ad792dac75fac7f02f4db9fa73a4a535ffa472266e7041fa19 ;;
          esac
          grep -Fx "image_sha256=$image_sha" "$evidence/environment.txt"
          python3 - "$evidence/archive-checksums.sha256" "$core" "$extension" <<'PY'
          import hashlib
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools')
          from emit_linux_minimum_pilot_records import parse_archive_checksums
          actual = parse_archive_checksums(Path(sys.argv[1]))
          expected = {Path(path).name: hashlib.sha256(Path(path).read_bytes()).hexdigest()
                      for path in sys.argv[2:]}
          if actual != expected:
              raise SystemExit('guest archive checksums differ from publication archives')
          PY
          clean=false
          dependencies=failure
          if [[ "$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(all(v == "success" for v in d.values()))' "$publication/minimum-steps.json")" = True ]]; then
            grep -Fx 'PASS: PostGIS 3.6.4 minimum-kernel archive verification' "$log"
            clean=true
            dependencies=success
          fi
          python3 tools/create_extension_publication_receipt.py \
            --archives "$RUNNER_TEMP/postgis" --core-archives "$RUNNER_TEMP/core" \
            --receipt "$publication/minimum-receipt.json" \
            --profile-id "postgis-publication-minimum-$PG_ARCHITECTURE" \
            --project PostGIS --version 3.6.4 --postgresql-version 18.6 \
            --architecture "$PG_ARCHITECTURE" --endpoint minimum \
            --kernel-release "$kernel" --distribution "$distribution" \
            --distribution-version 22.04 --image-id "sha256:$image_sha" \
            --dependency-check-result "$dependencies" --clean-system "$clean" \
            --step-results "$publication/minimum-steps.json"
          python3 tools/emit_extension_publication_records.py \
            --archives "$RUNNER_TEMP/postgis" --core-archives "$RUNNER_TEMP/core" \
            --receipt "$publication/minimum-receipt.json" --output "$publication/records"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgis-${{ matrix.architecture }}-minimum-kernel-evidence
          path: ${{ runner.temp }}/postgis-qemu/evidence/**
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgis-linux-${{ matrix.architecture }}-feasibility
          path: |
            ${{ runner.temp }}/postgis/*.tar.gz
            ${{ runner.temp }}/postgis/*.sha256
            ${{ runner.temp }}/postgis/debug-symbols/**
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiger-${{ matrix.architecture }}-feasibility
          path: |
            ${{ runner.temp }}/tiger/*.tar.gz
            ${{ runner.temp }}/tiger/*.sha256
            ${{ runner.temp }}/tiger-current.log
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgis-${{ matrix.architecture }}-pilot-verification
          path: ${{ runner.temp }}/postgis-records/*.json
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgis-${{ matrix.architecture }}-publication-verification
          path: ${{ runner.temp }}/postgis-publication/**
          if-no-files-found: ignore
          retention-days: 3
