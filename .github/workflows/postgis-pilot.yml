name: PostGIS Linux feasibility pilot
on:
  workflow_dispatch:
    inputs:
      address_standardizer_probe:
        description: Run the Address Standardizer 3.7.0 Linux feasibility probe
        required: false
        type: boolean
      postgis_macos_arm64_probe:
        description: Build minimal-driver GDAL and probe PostGIS 3.6.4 raster support on macOS arm64 against PostgreSQL 18.6
        required: false
        type: boolean
      postgis_windows_abi_probe:
        description: Build PostgreSQL 18.6 and unmodified PostGIS 3.6.4 in MSYS2 MINGW64, then test extension creation
        required: false
        type: boolean
      postgis_windows_selected_core_probe:
        description: Build PostGIS 3.6.4 with MinGW PostgreSQL 18.6, then probe it in the selected MSVC core
        required: false
        type: boolean
      postgis_conda_macos_arm64_probe:
        description: Inspect conda-forge spatial dependencies for the macOS 11 arm64 floor
        required: false
        type: boolean
      postgis_conda_macos_arm64_build_probe:
        description: Build PostGIS 3.6.4 with conda-forge GEOS/PROJ/GDAL and probe core, raster and topology SQL on PostgreSQL 18.6 arm64
        required: false
        type: boolean
      postgis_conda_macos_arm64_sfcgal_build_probe:
        description: Build pinned upstream SFCGAL 2.3.0 with conda-forge dependencies, then build and probe four PostGIS 3.6.4 extensions on PostgreSQL 18.6 arm64
        required: false
        type: boolean
jobs:
  plan:
    if: ${{ inputs.address_standardizer_probe != true && inputs.postgis_macos_arm64_probe != true && inputs.postgis_windows_abi_probe != true && inputs.postgis_windows_selected_core_probe != true && inputs.postgis_conda_macos_arm64_probe != true && inputs.postgis_conda_macos_arm64_build_probe != true && inputs.postgis_conda_macos_arm64_sfcgal_build_probe != true }}
    runs-on: ubuntu-24.04
    outputs:
      project: ${{ steps.select.outputs.project }}
      version: ${{ steps.select.outputs.version }}
      architecture: ${{ steps.select.outputs.architecture }}
      runner: ${{ steps.select.outputs.runner }}
      group_id: ${{ steps.select.outputs.group_id }}
      postgresql_major: ${{ steps.select.outputs.postgresql_major }}
      build_postgresql_version: ${{ steps.select.outputs.build_postgresql_version }}
      range_from: ${{ steps.select.outputs.range_from }}
      range_to: ${{ steps.select.outputs.range_to }}
    steps:
      - uses: actions/checkout@v4
      - name: Assert the selected PostGIS version
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          selected = json.loads(Path('support/selected-extension-work.json').read_text())
          assert selected['project'] == 'PostGIS', selected
          assert selected['version'] == '3.6.4', selected
          PY
      - name: Resolve one selected work group
        id: select
        run: python3 tools/select_extension_work.py --selection support/selected-extension-work.json --github-output "$GITHUB_OUTPUT"

  address-standardizer:
    if: ${{ inputs.address_standardizer_probe == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build PostgreSQL 18.6 and Address Standardizer 3.7.0 in Docker
        run: scripts/address_standardizer/build.sh "$RUNNER_TEMP/address-standardizer"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: address-standardizer-3.7.0-postgresql-18.6-linux-x86_64-feasibility
          path: |
            ${{ runner.temp }}/address-standardizer/address-standardizer-3.7.0-postgresql-18.6-linux-x86_64-pilot.tar.gz
            ${{ runner.temp }}/address-standardizer/address-standardizer-3.7.0-postgresql-18.6-linux-x86_64-pilot.tar.gz.sha256
            ${{ runner.temp }}/address-standardizer/probe-output.txt
            ${{ runner.temp }}/address-standardizer/build.log
            ${{ runner.temp }}/address-standardizer/postgresql-source.sha256
            ${{ runner.temp }}/address-standardizer/address-standardizer-commit.txt
          if-no-files-found: warn
          retention-days: 3

  macos-postgis-conda-floor:
    if: ${{ inputs.postgis_conda_macos_arm64_probe == true }}
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Confirm native arm64 runner
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
      - name: Install micromamba
        run: brew install micromamba
      - name: Resolve conda-forge spatial dependencies and inspect Mach-O files
        run: |
          mkdir -p "$RUNNER_TEMP/postgis-conda-macos-arm64"
          bash experiments/postgis-conda-macos-arm64-2026-10-21/inspect.sh \
            "$RUNNER_TEMP/postgis-conda-macos-arm64"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgis-conda-macos-arm64-feasibility-${{ github.run_id }}
          path: ${{ runner.temp }}/postgis-conda-macos-arm64/**
          if-no-files-found: warn
          retention-days: 3

  macos-postgis-conda-build:
    if: ${{ inputs.postgis_conda_macos_arm64_build_probe == true }}
    runs-on: macos-15
    timeout-minutes: 100
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Confirm native arm64 runner
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
      - name: Install micromamba
        run: brew install micromamba
      - name: Resolve conda-forge spatial and PostGIS build dependencies
        run: |
          micromamba create --yes --prefix "$RUNNER_TEMP/postgis-conda-arm64-env" --channel conda-forge \
            geos proj gdal json-c libxml2 pcre2 pkg-config
      - name: Resolve selected PostgreSQL 18.6 macOS arm64 core
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p "$RUNNER_TEMP/postgis-conda-macos-arm64/core"
          cp experiments/postgis-macos-arm64-2026-10-20/base-target.json "$RUNNER_TEMP/postgis-conda-macos-arm64/base-target.json"
          bash scripts/macos/resolve-core.sh "$RUNNER_TEMP/postgis-conda-macos-arm64/base-target.json" "$RUNNER_TEMP/postgis-conda-macos-arm64/core"
      - name: Build unmodified PostGIS and probe available SQL extensions
        run: |
          bash experiments/postgis-conda-macos-arm64-2026-10-21/build-three-extensions.sh \
            "$RUNNER_TEMP/postgis-conda-macos-arm64/core" \
            "$RUNNER_TEMP/postgis-conda-macos-arm64/core/target.json" \
            "$RUNNER_TEMP/postgis-conda-arm64-env" \
            "$RUNNER_TEMP/postgis-conda-macos-arm64/output"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgis-conda-macos-arm64-build-feasibility-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/postgis-conda-macos-arm64/core/target.json
            ${{ runner.temp }}/postgis-conda-macos-arm64/output/**
          if-no-files-found: warn
          retention-days: 3

  macos-postgis-conda-sfcgal-build:
    if: ${{ inputs.postgis_conda_macos_arm64_sfcgal_build_probe == true }}
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Confirm native arm64 runner
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
      - name: Install micromamba
        run: brew install micromamba
      - name: Resolve conda-forge spatial and SFCGAL build dependencies
        run: |
          micromamba create --yes --prefix "$RUNNER_TEMP/postgis-conda-arm64-sfcgal-env" --channel conda-forge \
            geos proj gdal json-c libxml2 pcre2 pkg-config cmake \
            cgal-cpp=6.1.1 libboost-devel gmp mpfr eigen nlohmann_json
      - name: Resolve selected PostgreSQL 18.6 macOS arm64 core
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p "$RUNNER_TEMP/postgis-conda-macos-arm64-sfcgal/core"
          cp experiments/postgis-macos-arm64-2026-10-20/base-target.json "$RUNNER_TEMP/postgis-conda-macos-arm64-sfcgal/base-target.json"
          bash scripts/macos/resolve-core.sh "$RUNNER_TEMP/postgis-conda-macos-arm64-sfcgal/base-target.json" "$RUNNER_TEMP/postgis-conda-macos-arm64-sfcgal/core"
      - name: Build pinned SFCGAL and PostGIS, then probe four SQL extensions
        run: |
          bash experiments/postgis-conda-macos-arm64-2026-10-21/build-four-extensions-sfcgal.sh \
            "$RUNNER_TEMP/postgis-conda-macos-arm64-sfcgal/core" \
            "$RUNNER_TEMP/postgis-conda-macos-arm64-sfcgal/core/target.json" \
            "$RUNNER_TEMP/postgis-conda-arm64-sfcgal-env" \
            "$RUNNER_TEMP/postgis-conda-macos-arm64-sfcgal/output"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgis-conda-macos-arm64-sfcgal-build-feasibility-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/postgis-conda-macos-arm64-sfcgal/core/target.json
            ${{ runner.temp }}/postgis-conda-macos-arm64-sfcgal/output/**
          if-no-files-found: warn
          retention-days: 3

  macos-postgis:
    if: ${{ inputs.postgis_macos_arm64_probe == true }}
    runs-on: macos-15
    timeout-minutes: 100
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Confirm target inputs
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          python3 - <<'PY'
          import json
          from pathlib import Path
          target=json.loads(Path('experiments/postgis-macos-arm64-2026-10-20/base-target.json').read_text())
          assert target['postgresql_version'] == '18.6'
          assert target['architecture'] == 'arm64'
          PY
      - name: Install upstream build dependencies
        run: brew install make cmake geos proj sfcgal json-c libxml2 protobuf-c pkgconf
      - name: Resolve selected PostgreSQL 18.6 macOS arm64 core
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p "$RUNNER_TEMP/postgis-macos/core"
          cp experiments/postgis-macos-arm64-2026-10-20/base-target.json "$RUNNER_TEMP/postgis-macos/base-target.json"
          bash scripts/macos/resolve-core.sh "$RUNNER_TEMP/postgis-macos/base-target.json" "$RUNNER_TEMP/postgis-macos/core"
      - name: Build minimal GDAL and unmodified PostGIS 3.6.4, run raster SQL probes, and measure dependency closure
        run: bash experiments/postgis-macos-arm64-2026-10-20/build.sh "$RUNNER_TEMP/postgis-macos/core" "$RUNNER_TEMP/postgis-macos/output" "$RUNNER_TEMP/postgis-macos/core/target.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgis-3.6.4-postgresql-18.6-macos-arm64-build-feasibility-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/postgis-macos/core/target.json
            ${{ runner.temp }}/postgis-macos/core/*.tar.gz
            ${{ runner.temp }}/postgis-macos/core/*.sha256
            ${{ runner.temp }}/postgis-macos/output/**
          if-no-files-found: warn
          retention-days: 3

  windows-postgis-abi:
    if: ${{ inputs.postgis_windows_abi_probe == true || inputs.postgis_windows_selected_core_probe == true }}
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download selected PostgreSQL core
        if: ${{ inputs.postgis_windows_selected_core_probe == true }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pin = python tools/windows_core_pin.py --postgresql-version 18.6 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Selected PostgreSQL core pin is invalid.' }
          $destination = Join-Path $env:RUNNER_TEMP 'postgis-windows/core-archive'
          New-Item -ItemType Directory -Force $destination | Out-Null
          gh run download $pin.run_id --repo $env:GITHUB_REPOSITORY --name $pin.artifact_name --dir $destination
          if ($LASTEXITCODE -ne 0) { throw 'Selected PostgreSQL core artifact is unavailable.' }
          $archive = Join-Path $destination $pin.archive_name
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -ne $pin.sha256) { throw 'Selected PostgreSQL core archive digest differs from its pin.' }
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            curl
            tar
            autoconf
            automake
            libtool
            bison
            flex
            diffutils
          pacboy: >-
            toolchain:p
            pkgconf:p
            gmp:p
            sfcgal:p
            geos:p
            proj:p
            gdal:p
            json-c:p
            libxml2:p
      - name: Build PostgreSQL 18.6 and upstream PostGIS in MINGW64, then create the extension
        if: ${{ inputs.postgis_windows_abi_probe == true }}
        env:
          OUTPUT_ROOT: ${{ runner.temp }}/postgis-windows/output
        run: |
          bash experiments/postgis-windows-abi-trial/build-and-probe.sh "$(cygpath -u "$OUTPUT_ROOT")"
      - name: Probe the MinGW-built PostGIS module in the selected PostgreSQL archive
        if: ${{ inputs.postgis_windows_selected_core_probe == true }}
        env:
          OUTPUT_ROOT: ${{ runner.temp }}/postgis-windows/output
        run: |
          core="$(cygpath -u "$RUNNER_TEMP")/postgis-windows/core-archive/postgresql-18.6-windows-x86_64.tar.gz"
          bash experiments/postgis-windows-abi-trial/cross-install-probe.sh "$core" "$(cygpath -u "$OUTPUT_ROOT")"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgis-windows-abi-trial-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/postgis-windows/output/build.log
            ${{ runner.temp }}/postgis-windows/output/cross-install.log
            ${{ runner.temp }}/postgis-windows/output/mingw/build.log
            ${{ runner.temp }}/postgis-windows/output/mingw/dll-diagnostic.log
            ${{ runner.temp }}/postgis-windows/output/mingw/cluster/server.log
            ${{ runner.temp }}/postgis-windows/output/selected-cluster/server.log
            ${{ runner.temp }}/postgis-windows/output/mingw/source/postgresql-18.6/config.log
            ${{ runner.temp }}/postgis-windows/output/mingw/source/postgis-3.6.4/config.log
            ${{ runner.temp }}/postgis-windows/output/source/postgresql-18.6/config.log
            ${{ runner.temp }}/postgis-windows/output/source/postgis-3.6.4/config.log
            ${{ runner.temp }}/postgis-windows/output/cluster/server.log
            ${{ runner.temp }}/postgis-windows/output/source/*.sha256
          if-no-files-found: warn
          retention-days: 3

  linux-postgis:
    needs: plan
    runs-on: ${{ needs.plan.outputs.runner }}
    env:
      PG_ARCHITECTURE: ${{ needs.plan.outputs.architecture }}
      BUILD_PG_VERSION: ${{ needs.plan.outputs.build_postgresql_version }}
      RANGE_FROM: ${{ needs.plan.outputs.range_from }}
      RANGE_TO: ${{ needs.plan.outputs.range_to }}
      POSTGIS_ARCHIVE_NAME: postgis-3.6.4-postgresql-${{ needs.plan.outputs.range_from }}-to-${{ needs.plan.outputs.build_postgresql_version }}-linux-${{ needs.plan.outputs.architecture }}.tar.gz
    timeout-minutes: 110
    permissions:
      actions: read
      contents: read
    steps:
      - name: Confirm selected work group and native architecture
        env:
          SELECTED_PROJECT: ${{ needs.plan.outputs.project }}
          SELECTED_VERSION: ${{ needs.plan.outputs.version }}
          SELECTED_GROUP: ${{ needs.plan.outputs.group_id }}
          SELECTED_PG_MAJOR: ${{ needs.plan.outputs.postgresql_major }}
        run: |
          test "$SELECTED_PROJECT" = PostGIS
          test "$SELECTED_VERSION" = 3.6.4
          test "$SELECTED_PG_MAJOR" = "${BUILD_PG_VERSION%%.*}"
          test -n "$SELECTED_GROUP"
          test -n "$RANGE_FROM"
          test -n "$RANGE_TO"
          case "$PG_ARCHITECTURE" in
            x86_64) test "$(uname -m)" = x86_64 ;;
            arm64) test "$(uname -m)" = aarch64 ;;
            *) echo "Unsupported selected architecture: $PG_ARCHITECTURE" >&2; exit 2 ;;
          esac
      - uses: actions/checkout@v4
      - name: Check pilot interfaces
        run: python3 -m unittest tests/test_reuse_linux_core_artifact.py tests/test_emit_postgis_pilot_record.py tests/test_create_linux_symbols.py tests/test_select_extension_work.py
      - name: Build or reuse exact PostgreSQL core archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/core"
          versions=("$BUILD_PG_VERSION")
          if [[ "$RANGE_FROM" != "$BUILD_PG_VERSION" ]]; then versions+=("$RANGE_FROM"); fi
          for version in "${versions[@]}"; do
            reused_output="$RUNNER_TEMP/reuse-$version.out"
            python3 tools/reuse_linux_core_artifact.py \
              --postgresql-version "$version" --architecture "$PG_ARCHITECTURE" \
              --output "$RUNNER_TEMP/core" --github-output "$reused_output"
            if ! grep -qx 'reused=true' "$reused_output"; then
              PG_VERSION="$version" bash scripts/linux/build.sh "$RUNNER_TEMP/core"
            fi
            archive="postgresql-$version-linux-$PG_ARCHITECTURE.tar.gz"
            test -s "$RUNNER_TEMP/core/$archive"
            test -s "$RUNNER_TEMP/core/$archive.sha256"
          done
      - name: Build PostGIS once against the selected high PostgreSQL version
        env:
          PG_VERSION: ${{ needs.plan.outputs.build_postgresql_version }}
          POSTGIS_PG_RANGE_FROM: ${{ needs.plan.outputs.range_from }}
        run: bash scripts/postgis/build.sh "$RUNNER_TEMP/core" "$RUNNER_TEMP/postgis"
      - name: Verify range archive on clean Ubuntu 24.04 with range low PostgreSQL
        id: low_current
        env:
          PG_VERSION: ${{ needs.plan.outputs.range_from }}
          POSTGIS_BUILD_PG_VERSION: ${{ needs.plan.outputs.build_postgresql_version }}
        run: bash scripts/postgis/verify.sh "$RUNNER_TEMP/core" "$RUNNER_TEMP/postgis"
      - name: Verify range archive on clean Ubuntu 24.04 with build PostgreSQL
        id: high_current
        env:
          PG_VERSION: ${{ needs.plan.outputs.build_postgresql_version }}
          POSTGIS_BUILD_PG_VERSION: ${{ needs.plan.outputs.build_postgresql_version }}
        if: ${{ needs.plan.outputs.range_from != needs.plan.outputs.build_postgresql_version }}
        run: bash scripts/postgis/verify.sh "$RUNNER_TEMP/core" "$RUNNER_TEMP/postgis"
      - name: Check older or absent host glibc with range low PostgreSQL
        id: low_portability
        env:
          PG_VERSION: ${{ needs.plan.outputs.range_from }}
          POSTGIS_BUILD_PG_VERSION: ${{ needs.plan.outputs.build_postgresql_version }}
        run: |
          for image in ubuntu:20.04 alpine:3.22; do
            docker run --rm --platform "$( [[ "$PG_ARCHITECTURE" = arm64 ]] && echo linux/arm64 || echo linux/amd64 )" \
              -e PG_ARCHITECTURE -e PG_VERSION -e POSTGIS_BUILD_PG_VERSION -e POSTGIS_ARCHIVE_NAME \
              -v "$RUNNER_TEMP/core:/core:ro" -v "$RUNNER_TEMP/postgis:/ext:ro" \
              -v "$GITHUB_WORKSPACE:/repo:ro" \
              --entrypoint sh "$image" /repo/scripts/postgis/verify-portability.sh /core /ext
          done
      - name: Check older or absent host glibc with build PostgreSQL
        id: high_portability
        env:
          PG_VERSION: ${{ needs.plan.outputs.build_postgresql_version }}
          POSTGIS_BUILD_PG_VERSION: ${{ needs.plan.outputs.build_postgresql_version }}
        if: ${{ needs.plan.outputs.range_from != needs.plan.outputs.build_postgresql_version }}
        run: |
          for image in ubuntu:20.04 alpine:3.22; do
            docker run --rm --platform "$( [[ "$PG_ARCHITECTURE" = arm64 ]] && echo linux/arm64 || echo linux/amd64 )" \
              -e PG_ARCHITECTURE -e PG_VERSION -e POSTGIS_BUILD_PG_VERSION -e POSTGIS_ARCHIVE_NAME \
              -v "$RUNNER_TEMP/core:/core:ro" -v "$RUNNER_TEMP/postgis:/ext:ro" \
              -v "$GITHUB_WORKSPACE:/repo:ro" \
              --entrypoint sh "$image" /repo/scripts/postgis/verify-portability.sh /core /ext
          done
      - name: Verify range archive on Linux 5.15 with range low PostgreSQL
        id: low_minimum
        env:
          PG_VERSION: ${{ needs.plan.outputs.range_from }}
          POSTGIS_BUILD_PG_VERSION: ${{ needs.plan.outputs.build_postgresql_version }}
        if: ${{ always() }}
        run: |
          core="$RUNNER_TEMP/core/postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz"
          if [[ ! -s "$core" || ! -s "$core.sha256" || ! -s "$RUNNER_TEMP/postgis/$POSTGIS_ARCHIVE_NAME" || ! -s "$RUNNER_TEMP/postgis/$POSTGIS_ARCHIVE_NAME.sha256" ]]; then
            echo 'Range-low minimum-kernel verification skipped: archive bytes or checksum sidecars are unavailable'
            exit 0
          fi
          dockerfile=scripts/linux/qemu-kernel-515.Dockerfile
          if [[ "$PG_ARCHITECTURE" = arm64 ]]; then dockerfile=scripts/qemu/arm64-515.Dockerfile; fi
          docker build -f "$dockerfile" -t pg-binaries-postgis-qemu .
          mkdir -p "$RUNNER_TEMP/postgis-qemu-low"
          docker run --rm -e PG_ARCHITECTURE -e PG_VERSION -e GITHUB_SHA -e POSTGIS_BUILD_PG_VERSION -e POSTGIS_ARCHIVE_NAME \
            -v "$GITHUB_WORKSPACE:/repo:ro" -v "$RUNNER_TEMP/core:/core:ro" \
            -v "$RUNNER_TEMP/postgis:/ext:ro" -v "$RUNNER_TEMP/postgis-qemu-low:/work" \
            pg-binaries-postgis-qemu bash /repo/scripts/postgis/qemu-kernel-515.sh /core "$PG_VERSION" /work /ext
      - name: Verify range archive on Linux 5.15 with build PostgreSQL
        id: high_minimum
        env:
          PG_VERSION: ${{ needs.plan.outputs.build_postgresql_version }}
          POSTGIS_BUILD_PG_VERSION: ${{ needs.plan.outputs.build_postgresql_version }}
        if: ${{ always() && needs.plan.outputs.range_from != needs.plan.outputs.build_postgresql_version }}
        run: |
          core="$RUNNER_TEMP/core/postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz"
          if [[ ! -s "$core" || ! -s "$core.sha256" || ! -s "$RUNNER_TEMP/postgis/$POSTGIS_ARCHIVE_NAME" || ! -s "$RUNNER_TEMP/postgis/$POSTGIS_ARCHIVE_NAME.sha256" ]]; then
            echo 'Build-version minimum-kernel verification skipped: archive bytes or checksum sidecars are unavailable'
            exit 0
          fi
          dockerfile=scripts/linux/qemu-kernel-515.Dockerfile
          if [[ "$PG_ARCHITECTURE" = arm64 ]]; then dockerfile=scripts/qemu/arm64-515.Dockerfile; fi
          docker build -f "$dockerfile" -t pg-binaries-postgis-qemu .
          mkdir -p "$RUNNER_TEMP/postgis-qemu-high"
          docker run --rm -e PG_ARCHITECTURE -e PG_VERSION -e GITHUB_SHA -e POSTGIS_BUILD_PG_VERSION -e POSTGIS_ARCHIVE_NAME \
            -v "$GITHUB_WORKSPACE:/repo:ro" -v "$RUNNER_TEMP/core:/core:ro" \
            -v "$RUNNER_TEMP/postgis:/ext:ro" -v "$RUNNER_TEMP/postgis-qemu-high:/work" \
            pg-binaries-postgis-qemu bash /repo/scripts/postgis/qemu-kernel-515.sh /core "$PG_VERSION" /work /ext
      - name: Finalize PostGIS verification records
        if: ${{ always() }}
        env:
          GITHUB_SHA: ${{ github.sha }}
          LOW_CURRENT_OUTCOME: ${{ steps.low_current.outcome }}
          HIGH_CURRENT_OUTCOME: ${{ steps.high_current.outcome }}
          LOW_PORTABILITY_OUTCOME: ${{ steps.low_portability.outcome }}
          HIGH_PORTABILITY_OUTCOME: ${{ steps.high_portability.outcome }}
          LOW_MINIMUM_OUTCOME: ${{ steps.low_minimum.outcome }}
          HIGH_MINIMUM_OUTCOME: ${{ steps.high_minimum.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/postgis-records"
          record_status=0
          current_image=$(docker image inspect --format '{{.Id}}' pg-binaries-postgis-verifier 2>/dev/null || true)
          qemu_image=$(docker image inspect --format '{{.Id}}' pg-binaries-postgis-qemu 2>/dev/null || true)
          for endpoint in low high; do
            if [[ "$endpoint" == low ]]; then
              version="$RANGE_FROM"; current="$LOW_CURRENT_OUTCOME"; portable="$LOW_PORTABILITY_OUTCOME"; minimum="$LOW_MINIMUM_OUTCOME"; evidence="$RUNNER_TEMP/postgis-qemu-low/evidence"
            else
              version="$BUILD_PG_VERSION"; current="$HIGH_CURRENT_OUTCOME"; portable="$HIGH_PORTABILITY_OUTCOME"; minimum="$HIGH_MINIMUM_OUTCOME"; evidence="$RUNNER_TEMP/postgis-qemu-high/evidence"
            fi
            if [[ "$endpoint" == high && "$RANGE_FROM" == "$RANGE_TO" ]]; then continue; fi
            core="$RUNNER_TEMP/core/postgresql-$version-linux-$PG_ARCHITECTURE.tar.gz"
            extension="$RUNNER_TEMP/postgis/$POSTGIS_ARCHIVE_NAME"
            if [[ ! -s "$core" || ! -s "$core.sha256" || ! -s "$extension" || ! -s "$extension.sha256" ]]; then
              echo "No $endpoint PostGIS records: archive bytes or checksum sidecars are unavailable"
              continue
            fi
            if [[ "$current_image" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              current_outcome=skipped
              if [[ "$current" == failure || "$portable" == failure ]]; then current_outcome=failed; fi
              if [[ "$current" == success && "$portable" == success ]]; then current_outcome=passed; fi
              python3 tools/emit_postgis_pilot_record.py --architecture "$PG_ARCHITECTURE" \
                --postgresql-version "$version" --build-postgresql-version "$BUILD_PG_VERSION" \
                --archive-name "$POSTGIS_ARCHIVE_NAME" --archives "$RUNNER_TEMP/postgis" \
                --core-archives "$RUNNER_TEMP/core" --output "$RUNNER_TEMP/postgis-records" \
                --image-id "$current_image" --kernel "$(uname -r)" --outcome "$current_outcome" || record_status=$?
            else
              echo "No $endpoint current-OS record: verifier image identity is unavailable or verification was skipped"
            fi
            log="$evidence/full-verifier.log"
            if [[ -f "$log" ]] && grep -q '^guest_os=Ubuntu 22.04' "$log" && grep -q '^guest_kernel=5\.15\.' "$log" && grep -q "^guest_architecture=$PG_ARCHITECTURE$" "$log" && [[ "$qemu_image" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              minimum_outcome=skipped
              if [[ "$minimum" == failure ]]; then minimum_outcome=failed; fi
              if [[ "$minimum" == success ]]; then minimum_outcome=passed; fi
              python3 tools/emit_postgis_pilot_record.py --architecture "$PG_ARCHITECTURE" \
                --postgresql-version "$version" --build-postgresql-version "$BUILD_PG_VERSION" \
                --archive-name "$POSTGIS_ARCHIVE_NAME" --archives "$RUNNER_TEMP/postgis" \
                --core-archives "$RUNNER_TEMP/core" --output "$RUNNER_TEMP/postgis-records" \
                --evidence "$evidence" --image-id "$qemu_image" --kernel "$(uname -r)" \
                --outcome "$minimum_outcome" || record_status=$?
            else
              echo "No $endpoint minimum-kernel record: clean guest identity or QEMU image identity is unavailable"
            fi
          done
          exit "$record_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgis-${{ needs.plan.outputs.architecture }}-minimum-kernel-evidence
          path: |
            ${{ runner.temp }}/postgis-qemu-low/evidence/**
            ${{ runner.temp }}/postgis-qemu-high/evidence/**
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgis-linux-${{ needs.plan.outputs.architecture }}-feasibility
          path: |
            ${{ runner.temp }}/postgis/*.tar.gz
            ${{ runner.temp }}/postgis/*.sha256
            ${{ runner.temp }}/postgis/debug-symbols/**
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgis-${{ needs.plan.outputs.architecture }}-pilot-verification
          path: ${{ runner.temp }}/postgis-records/*.json
          if-no-files-found: ignore
          retention-days: 3
