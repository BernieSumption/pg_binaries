name: Intel macOS PostgreSQL pilot

on:
  workflow_dispatch:
    inputs:
      postgresql_version:
        description: A missing supported PostgreSQL version; leave blank to select the next one
        required: false
        type: string
  push:
    branches: [spike]
    paths:
      - scripts/macos/build.sh
      - scripts/macos/build-source-dependencies.sh
      - scripts/macos/bundle.py
      - scripts/macos/licenses.py
      - scripts/macos/verify.sh
      - scripts/macos/static_analysis.py
      - scripts/macos/diagnostics.sh
      - support.json
      - support/postgresql-releases.json
      - inventory.json
      - support/verification-profiles.json
      - tools/plan_work.py
      - tools/source_archive.py
      - tools/check_source_identity.py
      - tools/coverage.py
      - tools/discover_builtins.py
      - tools/create_macos_symbols.py
      - tools/check_macos_license_inventory.py
      - tools/emit_macos_pilot_records.py
      - tests/schema.sql
      - tests/builtins/**
      - tests/extensions/**
      - tests/test_emit_macos_pilot_records.py
      - tests/test_macos_static_analysis.py
      - tests/test_create_macos_symbols.py
      - tests/test_macos_license_inventory.py
      - tests/test_profile_change_gate.py
      - tools/profile_change_gate.py
      - .github/workflows/macos-pilot.yml

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.profile_gate.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Test profile-change gate
        run: python3 -m unittest tests/test_profile_change_gate.py
      - name: Check whether the Intel macOS profile changed
        id: profile_gate
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before_root="$RUNNER_TEMP/profile-before"
          if [[ ! "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || ! git fetch --no-tags --depth=1 origin "$BEFORE_SHA" \
            || ! git worktree add --detach "$before_root" "$BEFORE_SHA"; then
            echo 'Base commit unavailable; running the platform workflow.' >&2
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 tools/profile_change_gate.py \
            --before-root "$before_root" \
            --current-root "$GITHUB_WORKSPACE" \
            --profile-id macos-publication-current-x86_64 >> "$GITHUB_OUTPUT"

  build:
    needs: scope
    if: ${{ needs.scope.outputs.should_run == 'true' }}
    outputs:
      postgresql_version: ${{ steps.select.outputs.postgresql_version }}
    runs-on: macos-15-intel
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Select supported macOS build version
        id: select
        env:
          PG_VERSION_INPUT: ${{ inputs.postgresql_version }}
        run: |
          if [[ -n "$PG_VERSION_INPUT" ]]; then
            selection=(--select-pilot "$PG_VERSION_INPUT")
          else
            selection=(--select-next-pilot)
          fi
          python3 tools/plan_work.py "${selection[@]}" --platform macos-x86_64 > "$RUNNER_TEMP/selection.json"
          version=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["postgresql_version"])' "$RUNNER_TEMP/selection.json")
          echo "postgresql_version=$version" >> "$GITHUB_OUTPUT"
      - name: Check macOS symbol-index helper
        run: python3 -m unittest tests/test_create_macos_symbols.py
      - name: Build and package PostgreSQL and pgvector
        run: bash scripts/macos/build.sh "$RUNNER_TEMP/archives" x86_64 "${{ steps.select.outputs.postgresql_version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-pilot-archives
          path: |
            ${{ runner.temp }}/archives/*.tar.gz
            ${{ runner.temp }}/archives/*.sha256
            ${{ runner.temp }}/archives/debug-symbols/**
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-pilot-archives
          path: ${{ runner.temp }}/archives
      - name: Check downloaded archives on a fresh runner
        id: archive_verify
        env:
          MACOS_STATIC_ANALYSIS_REPORT: ${{ runner.temp }}/verification-records/static-analysis.json
        run: bash scripts/macos/verify.sh "$RUNNER_TEMP/archives" x86_64 "${{ needs.build.outputs.postgresql_version }}"
      - name: Verify symbols against downloaded archive bytes
        id: symbols
        run: |
          python3 tools/create_macos_symbols.py \
            "$RUNNER_TEMP/archives/postgresql-${{ needs.build.outputs.postgresql_version }}-macos-x86_64.tar.gz" \
            "$RUNNER_TEMP/archives/pgvector-0.8.7-postgresql-${{ needs.build.outputs.postgresql_version }}-macos-x86_64.tar.gz" \
            --output-dir "$RUNNER_TEMP/archives/debug-symbols" --verify-only
      - name: Verify representative macOS failure diagnostics
        id: diagnostics
        run: bash scripts/macos/diagnostics.sh "$RUNNER_TEMP/archives" x86_64 "${{ needs.build.outputs.postgresql_version }}" 0.8.7 "$RUNNER_TEMP/verification-records/diagnostics.json"
      - name: Check macOS record emitters
        if: ${{ always() }}
        run: python3 -m unittest tests/test_emit_macos_pilot_records.py tests/test_emit_macos_publication_records.py
      - name: Finalize current-OS pilot verification records
        if: ${{ always() }}
        env:
          GITHUB_SHA: ${{ github.sha }}
          CHECK_OUTCOMES: ${{ steps.archive_verify.outcome }},${{ steps.symbols.outcome }},${{ steps.diagnostics.outcome }}
          DEPENDENCY_CHECKS_PASSED: ${{ steps.archive_verify.outcome == 'success' }}
        run: |
          image_id="${ImageOS:?runner image OS missing}/${ImageVersion:?runner image version missing}"
          archive_dir="$RUNNER_TEMP/archives"
          pg_archive="$archive_dir/postgresql-${{ needs.build.outputs.postgresql_version }}-macos-x86_64.tar.gz"
          vector_archive="$archive_dir/pgvector-0.8.7-postgresql-${{ needs.build.outputs.postgresql_version }}-macos-x86_64.tar.gz"
          if [[ ! -f "$pg_archive" || ! -f "$pg_archive.sha256" || ! -f "$vector_archive" || ! -f "$vector_archive.sha256" ]]; then
            echo "No current-OS verification record: archive bytes or checksum sidecars are unavailable"
            exit 0
          fi
          outcome=$(python3 -c 'import os; s=os.environ["CHECK_OUTCOMES"].split(","); print("failed" if "failure" in s else "passed" if all(x == "success" for x in s) else "skipped")')
          python3 tools/emit_macos_pilot_records.py \
            --archives "$archive_dir" \
            --output "$RUNNER_TEMP/verification-records" \
            --postgresql-version "${{ needs.build.outputs.postgresql_version }}" \
            --os-version "$(sw_vers -productVersion)" \
            --architecture "$(uname -m)" \
            --image-id "$image_id" \
            --outcome "$outcome" \
            --dependency-checks-passed "$DEPENDENCY_CHECKS_PASSED" \
            --static-report "$RUNNER_TEMP/verification-records/static-analysis.json"
      - name: Finalize archive-bound macOS publication case records
        if: ${{ always() }}
        env:
          ARCHIVE_SUITE_OUTCOME: ${{ steps.archive_verify.outcome }}
          SYMBOLS_OUTCOME: ${{ steps.symbols.outcome }}
          DIAGNOSTICS_OUTCOME: ${{ steps.diagnostics.outcome }}
        run: |
          record_dir="$RUNNER_TEMP/verification-records"
          mkdir -p "$record_dir"
          python3 - "$record_dir/publication-attempt.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(json.dumps({
              "run_id": os.environ["GITHUB_RUN_ID"],
              "source_revision": os.environ["GITHUB_SHA"],
              "steps": {name: os.environ[key] for name, key in (
                  ("archive-suite", "ARCHIVE_SUITE_OUTCOME"),
                  ("symbols", "SYMBOLS_OUTCOME"),
                  ("diagnostics", "DIAGNOSTICS_OUTCOME"))},
          }, indent=2, sort_keys=True) + "\n")
          PY
          archive_dir="$RUNNER_TEMP/archives"
          version="${{ needs.build.outputs.postgresql_version }}"
          if [[ ! -f "$archive_dir/postgresql-$version-macos-x86_64.tar.gz" || ! -f "$archive_dir/pgvector-0.8.7-postgresql-$version-macos-x86_64.tar.gz" ]]; then
            echo 'No archive-bound publication record: final archive bytes are unavailable'
            exit 0
          fi
          image_id="${ImageOS:?runner image OS missing}/${ImageVersion:?runner image version missing}"
          python3 tools/emit_macos_publication_records.py \
            --archives "$archive_dir" --output "$record_dir/publication" \
            --postgresql-version "$version" --os-version "$(sw_vers -productVersion)" \
            --architecture x86_64 --image-id "$image_id" \
            --archive-suite-result "$ARCHIVE_SUITE_OUTCOME" \
            --symbols-result "$SYMBOLS_OUTCOME" --diagnostics-result "$DIAGNOSTICS_OUTCOME" \
            --static-report "$record_dir/static-analysis.json" \
            --diagnostic-report "$record_dir/diagnostics.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: macos-pilot-verification-records
          path: |
            ${{ runner.temp }}/verification-records/*.json
            ${{ runner.temp }}/verification-records/publication/*.json
          if-no-files-found: warn
          retention-days: 7
