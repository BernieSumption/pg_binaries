name: Selected archive publication

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      extension_version:
        required: false
        type: string
      postgresql_version:
        required: true
        type: string
      platform:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      project:
        description: PostgreSQL or a declared extension project
        required: true
        type: string
      extension_version:
        description: Exact extension release; leave empty for PostgreSQL
        required: false
        type: string
      postgresql_version:
        description: Exact selected PostgreSQL release
        required: true
        type: string
      platform:
        description: Operating system and architecture
        required: true
        type: choice
        options:
          - linux-x86_64
          - linux-arm64
          - macos-arm64
          - macos-x86_64
          - windows-x86_64
  push:
    branches: [spike]
    paths:
      - experiments/selected-extension-target-trial/request.json

permissions:
  actions: read
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      should_dispatch: ${{ steps.select.outputs.should_dispatch }}
      route: ${{ steps.select.outputs.route }}
      extension_version: ${{ steps.select.outputs.extension_version }}
      postgresql_version: ${{ steps.select.outputs.postgresql_version }}
      architecture: ${{ steps.select.outputs.architecture }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the exact declared target
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PROJECT: ${{ inputs.project }}
          INPUT_VERSION: ${{ inputs.extension_version }}
          INPUT_POSTGRESQL_VERSION: ${{ inputs.postgresql_version }}
          INPUT_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/request.json" <<'PY'
          import json
          import os
          import sys

          if os.environ["INPUT_PROJECT"]:
              request = {
                  "project": os.environ["INPUT_PROJECT"],
                  "version": os.environ["INPUT_VERSION"],
                  "postgresql_version": os.environ["INPUT_POSTGRESQL_VERSION"],
                  "platform": os.environ["INPUT_PLATFORM"],
              }
          elif os.environ["EVENT_NAME"] == "push":
              with open("experiments/selected-extension-target-trial/request.json", encoding="utf-8") as source:
                  request = json.load(source)
          else:
              raise SystemExit("selected extension request is missing")
          with open(sys.argv[1], "w", encoding="utf-8") as output:
              json.dump(request, output)
          PY
          python3 - "$RUNNER_TEMP/request.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import subprocess
          import sys

          request = json.load(open(sys.argv[1], encoding="utf-8"))
          project, platform = request["project"], request["platform"]
          if project == "PostgreSQL":
              if request["version"]:
                  raise SystemExit("PostgreSQL core requests have no extension version")
              with open("support/postgresql-releases.json", encoding="utf-8") as source:
                  releases = {item["version"] for item in json.load(source)["releases"]}
              with open("support.json", encoding="utf-8") as source:
                  architectures = json.load(source)["platform_architectures"]
              os_name, architecture = platform.split("-", 1)
              if (request["postgresql_version"] not in releases
                      or architecture not in architectures.get(os_name, [])):
                  raise SystemExit("PostgreSQL target is not declared")
              with open(sys.argv[2], "a", encoding="utf-8") as output:
                  for key, value in (
                      ("should_dispatch", "true"),
                      ("route", f"postgresql-{os_name}"),
                      ("postgresql_version", request["postgresql_version"]),
                      ("architecture", architecture),
                  ):
                      output.write(f"{key}={value}\n")
              raise SystemExit(0)
          subprocess.run([
              sys.executable, "tools/extension_archive_plan.py",
              "--project", request["project"],
              "--extension-version", request["version"],
              "--postgresql-version", request["postgresql_version"],
              "--platform", request["platform"],
              "--github-output", sys.argv[2],
          ], check=True)
          routes = {
              ("HypoPG", "linux-x86_64"): "hypopg-linux",
              ("HypoPG", "linux-arm64"): "hypopg-linux",
              ("HypoPG", "macos-arm64"): "hypopg-macos-arm64",
              ("HypoPG", "macos-x86_64"): "hypopg-macos-x86_64",
              ("HypoPG", "windows-x86_64"): "hypopg-windows-x86_64",
              ("pg_jsonschema", "linux-x86_64"): "pg-jsonschema-linux",
              ("pg_jsonschema", "linux-arm64"): "pg-jsonschema-linux",
              ("pgtap", "linux-x86_64"): "pgtap-linux",
              ("pgtap", "linux-arm64"): "pgtap-linux",
              ("pgtap", "windows-x86_64"): "pgtap-windows",
              ("pg_ivm", "linux-x86_64"): "pgivm-linux",
              ("pg_ivm", "linux-arm64"): "pgivm-linux",
              ("pg_ivm", "windows-x86_64"): "pgivm-windows",
              ("pg_cron", "linux-x86_64"): "pgcron-linux",
              ("pg_cron", "linux-arm64"): "pgcron-linux",
              ("pg_cron", "windows-x86_64"): "pgcron-windows",
              ("pgaudit", "linux-x86_64"): "pgaudit-linux",
              ("pgaudit", "linux-arm64"): "pgaudit-linux",
              ("pgaudit", "macos-arm64"): "pgaudit-macos",
              ("pgaudit", "macos-x86_64"): "pgaudit-macos",
              ("PostGIS", "linux-x86_64"): "postgis-linux",
              ("PostGIS", "linux-arm64"): "postgis-linux",
              ("PostGIS", "macos-arm64"): "postgis-macos",
              ("PostGIS", "macos-x86_64"): "postgis-macos",
              ("PostGIS TIGER Geocoder", "linux-x86_64"): "tiger-linux",
              ("PostGIS TIGER Geocoder", "linux-arm64"): "tiger-linux",
              ("PostGIS TIGER Geocoder", "macos-arm64"): "tiger-macos",
              ("PostGIS TIGER Geocoder", "macos-x86_64"): "tiger-macos",
              ("PostGIS TIGER Geocoder", "windows-x86_64"): "tiger-windows",
              ("Address Standardizer", "linux-x86_64"): "address-standardizer-linux",
              ("Address Standardizer", "linux-arm64"): "address-standardizer-linux",
              ("Address Standardizer", "macos-arm64"): "address-standardizer-macos",
              ("Address Standardizer", "macos-x86_64"): "address-standardizer-macos",
              ("pgvector", "linux-x86_64"): "pgvector-linux",
              ("pgvector", "linux-arm64"): "pgvector-linux",
              ("pgvector", "macos-arm64"): "pgvector-macos",
              ("pgvector", "macos-x86_64"): "pgvector-macos",
              ("pgvector", "windows-x86_64"): "pgvector-windows",
              ("collection", "linux-x86_64"): "collection-linux",
              ("collection", "linux-arm64"): "collection-linux",
              ("pg_jsonschema", "macos-arm64"): "pg-jsonschema-macos",
              ("pg_jsonschema", "macos-x86_64"): "pg-jsonschema-macos",
              ("pg_jsonschema", "windows-x86_64"): "pg-jsonschema-windows",
              ("pgtap", "macos-arm64"): "pgtap-macos-arm64",
              ("pgtap", "macos-x86_64"): "pgtap-macos-x86_64",
              ("pg_cron", "macos-arm64"): "pgcron-macos",
              ("pg_cron", "macos-x86_64"): "pgcron-macos",
              ("collection", "macos-arm64"): "collection-macos",
              ("collection", "macos-x86_64"): "collection-macos",
              ("pg_ivm", "macos-arm64"): "pgivm-macos",
              ("pg_ivm", "macos-x86_64"): "pgivm-macos",
          }
          project, platform = request["project"], request["platform"]
          route = routes.get((project, platform))
          if project == "PostGIS" and platform == "windows-x86_64":
              route = "postgis-windows"
          if route is None:
              raise SystemExit(f"No selected publication workflow serves {project} on {platform}")
          with open(sys.argv[2], "a", encoding="utf-8") as output:
              for key, value in (
                  ("should_dispatch", "true"),
                  ("route", route),
                  ("extension_version", request["version"]),
                  ("architecture", platform.rsplit("-", 1)[1]),
              ):
                  output.write(f"{key}={value}\n")
          PY

  postgresql_linux:
    needs: plan
    if: needs.plan.outputs.should_dispatch == 'true' && needs.plan.outputs.route == 'postgresql-linux'
    uses: ./.github/workflows/postgresql-linux-selected-publication.yml
