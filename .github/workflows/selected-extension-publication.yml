name: Selected extension publication

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      extension_version:
        required: true
        type: string
      postgresql_version:
        required: true
        type: string
      platform:
        required: true
        type: string
      retry:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      project:
        description: Declared extension project
        required: true
        type: string
      extension_version:
        description: Exact selected extension release
        required: true
        type: string
      postgresql_version:
        description: Exact selected PostgreSQL release
        required: true
        type: string
      platform:
        description: Operating system and architecture
        required: true
        type: choice
        options:
          - linux-x86_64
          - linux-arm64
          - macos-arm64
          - macos-x86_64
          - windows-x86_64
      retry:
        description: Run this target even when the retained work is complete
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      should_dispatch: ${{ steps.select.outputs.should_dispatch }}
      route: ${{ steps.select.outputs.route }}
      extension_version: ${{ steps.select.outputs.extension_version }}
      postgresql_version: ${{ steps.select.outputs.postgresql_version }}
      architecture: ${{ steps.select.outputs.architecture }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the declared target and its work prerequisites
        id: select
        env:
          REQUEST_PROJECT: ${{ inputs.project }}
          REQUEST_VERSION: ${{ inputs.extension_version }}
          REQUEST_POSTGRESQL_VERSION: ${{ inputs.postgresql_version }}
          REQUEST_PLATFORM: ${{ inputs.platform }}
          REQUEST_RETRY: ${{ inputs.retry }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/request.json" <<'PY'
          import json
          import os
          import sys

          request = {
              "project": os.environ["REQUEST_PROJECT"],
              "version": os.environ["REQUEST_VERSION"],
              "postgresql_version": os.environ["REQUEST_POSTGRESQL_VERSION"],
              "platform": os.environ["REQUEST_PLATFORM"],
              "retry": os.environ["REQUEST_RETRY"].lower() == "true",
          }
          with open(sys.argv[1], "w", encoding="utf-8") as output:
              json.dump(request, output)
          PY
          python3 tools/dispatch_plan.py --request "$RUNNER_TEMP/request.json" > "$RUNNER_TEMP/dispatch-plan.json"
          python3 - "$RUNNER_TEMP/dispatch-plan.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          target = plan["target"]
          project, platform = target["project"], target["platform"]
          routes = {
              ("HypoPG", "linux-x86_64"): "hypopg-linux",
              ("HypoPG", "linux-arm64"): "hypopg-linux",
              ("HypoPG", "macos-arm64"): "hypopg-macos-arm64",
              ("HypoPG", "macos-x86_64"): "hypopg-macos-x86_64",
              ("HypoPG", "windows-x86_64"): "hypopg-windows-x86_64",
              ("pg_jsonschema", "linux-x86_64"): "pg-jsonschema-linux",
              ("pg_jsonschema", "linux-arm64"): "pg-jsonschema-linux",
              ("pgtap", "linux-x86_64"): "pgtap-linux",
              ("pgtap", "linux-arm64"): "pgtap-linux",
              ("pg_ivm", "linux-x86_64"): "pgivm-linux",
              ("pg_ivm", "linux-arm64"): "pgivm-linux",
              ("pg_cron", "linux-x86_64"): "pgcron-linux",
              ("pg_cron", "linux-arm64"): "pgcron-linux",
              ("pgaudit", "linux-x86_64"): "pgaudit-linux",
              ("pgaudit", "linux-arm64"): "pgaudit-linux",
              ("PostGIS", "linux-x86_64"): "postgis-linux",
              ("PostGIS", "linux-arm64"): "postgis-linux",
              ("PostGIS TIGER Geocoder", "linux-x86_64"): "tiger-linux",
              ("PostGIS TIGER Geocoder", "linux-arm64"): "tiger-linux",
              ("Address Standardizer", "linux-x86_64"): "address-standardizer-linux",
              ("Address Standardizer", "linux-arm64"): "address-standardizer-linux",
              ("pgvector", "linux-x86_64"): "pgvector-linux",
              ("pgvector", "linux-arm64"): "pgvector-linux",
              ("collection", "linux-x86_64"): "collection-linux",
              ("collection", "linux-arm64"): "collection-linux",
              ("pg_jsonschema", "macos-arm64"): "pg-jsonschema-macos",
              ("pg_jsonschema", "macos-x86_64"): "pg-jsonschema-macos",
              ("pg_jsonschema", "windows-x86_64"): "pg-jsonschema-windows",
              ("pgtap", "macos-x86_64"): "pgtap-macos-x86_64",
              ("pg_cron", "macos-arm64"): "pgcron-macos",
              ("pg_cron", "macos-x86_64"): "pgcron-macos",
              ("collection", "macos-arm64"): "collection-macos",
              ("collection", "macos-x86_64"): "collection-macos",
              ("pg_ivm", "macos-arm64"): "pgivm-macos",
              ("pg_ivm", "macos-x86_64"): "pgivm-macos",
          }
          route = routes.get((project, platform))
          if route is None:
              raise SystemExit(f"No selected publication workflow serves {project} on {platform}")
          with open(sys.argv[2], "a", encoding="utf-8") as output:
              for key, value in (
                  ("should_dispatch", str(plan["should_dispatch"]).lower()),
                  ("route", route),
                  ("extension_version", target["version"]),
                  ("postgresql_version", target["postgresql_version"]),
                  ("architecture", platform.rsplit("-", 1)[1]),
              ):
                  output.write(f"{key}={value}\n")
          PY

  hypopg_linux:
    needs: plan
    if: needs.plan.outputs.should_dispatch == 'true' && needs.plan.outputs.route == 'hypopg-linux'
    uses: ./.github/workflows/hypopg-linux-selected-publication.yml
