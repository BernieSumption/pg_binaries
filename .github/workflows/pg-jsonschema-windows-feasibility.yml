name: pg_jsonschema Windows feasibility

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load pinned PostgreSQL core identity
        id: core_pin
        run: python tools/windows_core_pin.py --github-output >> $env:GITHUB_OUTPUT
      - name: Download the pinned PostgreSQL 18.6 Windows core
        uses: actions/download-artifact@v4
        with:
          name: windows-postgresql-18.6-pilot
          run-id: ${{ steps.core_pin.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pg-jsonschema-core
      - name: Build and exercise pinned pg_jsonschema source
        id: probe
        continue-on-error: true
        run: ./scripts/pg_jsonschema/windows-feasibility.ps1 -CoreArchiveDirectory "$env:RUNNER_TEMP/pg-jsonschema-core" -OutputDirectory "$env:RUNNER_TEMP/pg-jsonschema-windows"
      - name: Upload build and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-jsonschema-windows-feasibility-${{ github.run_id }}
          path: ${{ runner.temp }}/pg-jsonschema-windows/**
          if-no-files-found: warn
          retention-days: 7
      - name: Require the feasibility probe to pass
        if: always()
        run: |
          if ('${{ steps.probe.outcome }}' -ne 'success') {
            throw 'The pg_jsonschema Windows source feasibility probe failed.'
          }
