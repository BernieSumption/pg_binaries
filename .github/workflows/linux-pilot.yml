name: Linux x86-64 pilot
on:
  workflow_dispatch:
    inputs:
      postgresql_version:
        description: One declared PostgreSQL minor version; leave blank for the highest missing Linux x86-64 target
        required: false
        default: ''
        type: string
  push:
    branches: [spike]
    paths:
      - 'scripts/linux/Dockerfile'
      - 'scripts/linux/build.sh'
      - 'scripts/linux/build-in-container.sh'
      - 'scripts/linux/bundle-glibc-in-container.sh'
      - 'scripts/linux/launcher.c'
      - 'scripts/linux/verify.sh'
      - 'scripts/linux/verify.Dockerfile'
      - 'scripts/linux/verify-in-container.sh'
      - 'scripts/linux/verify-glibc-portability.sh'
      - 'scripts/linux/verify-no-host-userspace.sh'
      - 'scripts/linux/diagnostics-in-container.sh'
      - 'scripts/linux/diagnostics.Dockerfile'
      - 'scripts/linux/qemu-kernel-515*'
      - 'tools/create_linux_symbols.py'
      - 'tools/check_elf_dependencies.py'
      - 'tools/discover_builtins.py'
      - 'tools/write_linux_license_inventory.py'
      - 'tools/plan_work.py'
      - 'tools/emit_linux_pilot_records.py'
      - 'tools/emit_linux_minimum_pilot_records.py'
      - 'tests/schema.sql'
      - 'tests/builtins/**'
      - 'tests/extensions/**'
      - 'tests/test_plan_work.py'
      - 'tests/test_emit_linux_minimum_pilot_records.py'
      - 'tests/test_create_linux_symbols.py'
      - '.github/workflows/linux-pilot.yml'
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Select one declared Linux build target
        env:
          REQUESTED_PG_VERSION: ${{ inputs.postgresql_version }}
        run: |
          if [ -n "$REQUESTED_PG_VERSION" ]; then
            python3 tools/plan_work.py --select-linux-pilot "$REQUESTED_PG_VERSION" > "$RUNNER_TEMP/selection.json"
          else
            python3 tools/plan_work.py --select-next-linux-pilot > "$RUNNER_TEMP/selection.json"
          fi
          python3 -c 'import json,sys; print("PG_VERSION=" + json.load(open(sys.argv[1], encoding="utf-8"))["postgresql_version"])' \
            "$RUNNER_TEMP/selection.json" >> "$GITHUB_ENV"
      - name: Build exact PostgreSQL and pgvector archives
        run: scripts/linux/build.sh "$RUNNER_TEMP/pilot"
      - name: Verify relocated archives on clean Ubuntu 24.04
        id: archive_verify
        run: scripts/linux/verify.sh "$RUNNER_TEMP/pilot"
      - name: Check launch without host shell or C library
        id: nohost
        run: bash scripts/linux/verify-no-host-userspace.sh "$RUNNER_TEMP/pilot" "$PG_VERSION" x86_64
      - name: Check older-glibc and no-glibc hosts
        id: portability
        run: |
          for image in ubuntu:20.04 alpine:3.22; do
            docker run --rm --platform linux/amd64 \
              -v "$RUNNER_TEMP/pilot:/archives:ro" -v "$GITHUB_WORKSPACE:/repo:ro" \
              --entrypoint sh "$image" /repo/scripts/linux/verify-glibc-portability.sh \
              /archives "$PG_VERSION" x86_64
          done
      - name: Record archive checksums and host version
        run: |
          cat /etc/os-release
          uname -m
          cat "$RUNNER_TEMP/pilot/"*.sha256
      - name: Capture controlled Linux diagnostic failures
        id: diagnostics
        run: |
          docker build --platform linux/amd64 -f scripts/linux/diagnostics.Dockerfile \
            -t pg-binaries-linux-diagnostics .
          docker run --rm --platform linux/amd64 \
            -v "$RUNNER_TEMP/pilot:/archives" \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -e GITHUB_RUN_ID -e GITHUB_REPOSITORY -e GITHUB_SERVER_URL -e GITHUB_SHA \
            --entrypoint bash pg-binaries-linux-diagnostics \
            /repo/scripts/linux/diagnostics-in-container.sh /archives "$PG_VERSION" x86_64
      - name: Finalize current-OS pilot verification records
        if: ${{ always() }}
        env:
          GITHUB_SHA: ${{ github.sha }}
          CHECK_OUTCOMES: ${{ steps.archive_verify.outcome }},${{ steps.nohost.outcome }},${{ steps.portability.outcome }},${{ steps.diagnostics.outcome }}
          DEPENDENCY_CHECKS_PASSED: ${{ steps.archive_verify.outcome == 'success' }}
        run: |
          if [[ -z "${PG_VERSION:-}" ]]; then
            echo "No current-OS verification record: PostgreSQL version was not selected"
            exit 0
          fi
          archive_dir="$RUNNER_TEMP/pilot"
          pg_archive="$archive_dir/postgresql-$PG_VERSION-linux-x86_64.tar.gz"
          vector_archive="$archive_dir/pgvector-0.8.7-postgresql-$PG_VERSION-linux-x86_64.tar.gz"
          if [[ ! -f "$pg_archive" || ! -f "$pg_archive.sha256" || ! -f "$vector_archive" || ! -f "$vector_archive.sha256" ]]; then
            echo "No current-OS verification record: archive bytes or checksum sidecars are unavailable"
            exit 0
          fi
          outcome=$(python3 -c 'import os; s=os.environ["CHECK_OUTCOMES"].split(","); print("failed" if "failure" in s else "passed" if all(x == "success" for x in s) else "skipped")')
          image_id=$(docker image inspect pg-binaries-linux-verifier --format '{{.Id}}' 2>/dev/null || true)
          if [[ -z "$image_id" ]]; then image_id="runner:${ImageOS:-ubuntu-24.04}/${ImageVersion:-unknown}"; fi
          python3 tools/emit_linux_pilot_records.py \
            --archives "$RUNNER_TEMP/pilot" \
            --output "$RUNNER_TEMP/pilot/verification" \
            --postgresql-version "$PG_VERSION" \
            --architecture x86_64 \
            --image-id "$image_id" \
            --kernel-version "$(uname -r)" \
            --outcome "$outcome" \
            --dependency-checks-passed "$DEPENDENCY_CHECKS_PASSED"
      - name: Build disposable Linux 5.15 QEMU environment
        run: docker build -f scripts/linux/qemu-kernel-515.Dockerfile -t pg-binaries-linux-qemu .
      - name: Verify the same archives in an Ubuntu 22.04 Linux 5.15 guest
        run: |
          mkdir -p "$RUNNER_TEMP/qemu-linux-515"
          chmod 0777 "$RUNNER_TEMP/qemu-linux-515"
          docker run --rm --network bridge --cap-drop=ALL --security-opt no-new-privileges \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$RUNNER_TEMP/pilot:/archives:ro" \
            -v "$RUNNER_TEMP/qemu-linux-515:/work" \
            -e PG_VERSION="$PG_VERSION" \
            -e GITHUB_SHA="$GITHUB_SHA" \
            pg-binaries-linux-qemu \
            bash /repo/scripts/linux/qemu-kernel-515-smoke.sh /archives "$PG_VERSION" /work
      - name: Record minimum-kernel verification for the same archive bytes
        run: |
          python3 -m unittest tests/test_emit_linux_minimum_pilot_records.py
          python3 tools/emit_linux_minimum_pilot_records.py \
            --archives "$RUNNER_TEMP/pilot" \
            --evidence "$RUNNER_TEMP/qemu-linux-515/evidence" \
            --output "$RUNNER_TEMP/pilot/verification" \
            --postgresql-version "$PG_VERSION" \
            --architecture x86_64
      - name: Retain verified core archive for same-revision PostGIS reuse
        if: env.PG_VERSION == '18.6'
        uses: actions/upload-artifact@v4
        with:
          name: linux-pilot-core-archives
          path: |
            ${{ runner.temp }}/pilot/postgresql-18.6-linux-x86_64.tar.gz
            ${{ runner.temp }}/pilot/postgresql-18.6-linux-x86_64.tar.gz.sha256
            ${{ runner.temp }}/pilot/verification/postgresql-18.6-linux-x86_64-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-pilot-archives
          path: |
            ${{ runner.temp }}/pilot/*.tar.gz
            ${{ runner.temp }}/pilot/*.sha256
            ${{ runner.temp }}/pilot/verification/*.json
            ${{ runner.temp }}/pilot/debug-symbols/**
            ${{ runner.temp }}/pilot/diagnostics/**
            ${{ runner.temp }}/qemu-linux-515/evidence/**
          include-hidden-files: true
          retention-days: 3
