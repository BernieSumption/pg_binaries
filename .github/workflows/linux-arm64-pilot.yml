name: Linux arm64 PostgreSQL 18.6 pilot
on:
  workflow_dispatch:
    inputs:
      postgresql_version:
        description: One declared PostgreSQL 15 through 18 minor version
        required: true
        default: '18.6'
        type: string
  push:
    branches: [spike]
    paths:
      - 'scripts/linux/Dockerfile'
      - 'scripts/linux/build.sh'
      - 'scripts/linux/build-in-container.sh'
      - 'scripts/linux/bundle-glibc-in-container.sh'
      - 'scripts/linux/launcher.c'
      - 'scripts/linux/verify.sh'
      - 'scripts/linux/verify.Dockerfile'
      - 'scripts/linux/verify-in-container.sh'
      - 'scripts/linux/verify-glibc-portability.sh'
      - 'scripts/linux/verify-no-host-userspace.sh'
      - 'scripts/linux/diagnostics-in-container.sh'
      - 'scripts/linux/diagnostics.Dockerfile'
      - 'scripts/linux/qemu-kernel-515-guest-full.sh'
      - 'scripts/qemu/arm64-515*'
      - 'tools/create_linux_symbols.py'
      - 'tools/check_elf_dependencies.py'
      - 'tools/discover_builtins.py'
      - 'tools/write_linux_license_inventory.py'
      - 'tools/plan_work.py'
      - 'tools/emit_linux_pilot_records.py'
      - 'tools/emit_linux_minimum_pilot_records.py'
      - 'tests/schema.sql'
      - 'tests/builtins/**'
      - 'tests/test_plan_work.py'
      - 'tests/test_emit_linux_minimum_pilot_records.py'
      - 'tests/test_create_linux_symbols.py'
      - '.github/workflows/linux-arm64-pilot.yml'
jobs:
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 110
    env:
      PG_VERSION: ${{ inputs.postgresql_version || '18.6' }}
      PG_ARCHITECTURE: arm64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Preview one declared Linux arm64 build target
        run: python3 tools/plan_work.py --select-linux-pilot "$PG_VERSION" --architecture arm64
      - name: Confirm native arm64 runner
        run: test "$(uname -m)" = aarch64
      - name: Build exact PostgreSQL and pgvector archives
        run: scripts/linux/build.sh "$RUNNER_TEMP/pilot"
      - name: Verify relocated archives on clean Ubuntu 24.04 arm64
        run: scripts/linux/verify.sh "$RUNNER_TEMP/pilot"
      - name: Check launch without host shell or C library
        run: bash scripts/linux/verify-no-host-userspace.sh "$RUNNER_TEMP/pilot" "$PG_VERSION" arm64
      - name: Check older-glibc and no-glibc hosts
        run: |
          for image in ubuntu:20.04 alpine:3.22; do
            docker run --rm --platform linux/arm64 \
              -v "$RUNNER_TEMP/pilot:/archives:ro" -v "$GITHUB_WORKSPACE:/repo:ro" \
              --entrypoint sh "$image" /repo/scripts/linux/verify-glibc-portability.sh \
              /archives "$PG_VERSION" arm64
          done
      - name: Record archive checksums and host architecture
        run: |
          cat /etc/os-release
          test "$(uname -m)" = aarch64
          cat "$RUNNER_TEMP/pilot/"*.sha256
      - name: Capture controlled Linux diagnostic failures
        run: |
          docker build --platform linux/arm64 -f scripts/linux/diagnostics.Dockerfile \
            -t pg-binaries-linux-diagnostics .
          docker run --rm --platform linux/arm64 \
            -v "$RUNNER_TEMP/pilot:/archives" \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -e GITHUB_RUN_ID -e GITHUB_REPOSITORY -e GITHUB_SERVER_URL -e GITHUB_SHA \
            --entrypoint bash pg-binaries-linux-diagnostics \
            /repo/scripts/linux/diagnostics-in-container.sh /archives "$PG_VERSION" arm64
      - name: Emit pilot verification records
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          image_id=$(docker image inspect pg-binaries-linux-verifier --format '{{.Id}}')
          python3 tools/emit_linux_pilot_records.py \
            --archives "$RUNNER_TEMP/pilot" \
            --output "$RUNNER_TEMP/pilot/verification" \
            --postgresql-version "$PG_VERSION" \
            --architecture arm64 \
            --image-id "$image_id" \
            --kernel-version "$(uname -r)"
      - name: Build disposable Linux 5.15 QEMU environment
        run: docker build -f scripts/qemu/arm64-515.Dockerfile -t pg-binaries-linux-qemu-arm64 .
      - name: Verify the same archives in an Ubuntu 22.04 arm64 Linux 5.15 guest
        run: |
          mkdir -p "$RUNNER_TEMP/qemu-linux-arm64-515"
          chmod 0777 "$RUNNER_TEMP/qemu-linux-arm64-515"
          docker run --rm --network bridge --cap-drop=ALL --security-opt no-new-privileges \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$RUNNER_TEMP/pilot:/archives:ro" \
            -v "$RUNNER_TEMP/qemu-linux-arm64-515:/work" \
            -e PG_VERSION="$PG_VERSION" \
            -e GITHUB_SHA="$GITHUB_SHA" \
            pg-binaries-linux-qemu-arm64 \
            bash /repo/scripts/qemu/arm64-515-smoke.sh /archives "$PG_VERSION" /work
      - name: Record minimum-kernel verification for the same archive bytes
        run: |
          python3 -m unittest tests/test_emit_linux_minimum_pilot_records.py
          python3 tools/emit_linux_minimum_pilot_records.py \
            --archives "$RUNNER_TEMP/pilot" \
            --evidence "$RUNNER_TEMP/qemu-linux-arm64-515/evidence" \
            --output "$RUNNER_TEMP/pilot/verification" \
            --postgresql-version "$PG_VERSION" \
            --architecture arm64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-arm64-pilot-archives
          path: |
            ${{ runner.temp }}/pilot/*.tar.gz
            ${{ runner.temp }}/pilot/*.sha256
            ${{ runner.temp }}/pilot/verification/*.json
            ${{ runner.temp }}/pilot/debug-symbols/**
            ${{ runner.temp }}/pilot/diagnostics/**
            ${{ runner.temp }}/qemu-linux-arm64-515/evidence/**
          include-hidden-files: true
          retention-days: 3
