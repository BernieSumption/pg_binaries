name: HypoPG selected PostgreSQL Windows x86-64 publication

on:
  workflow_call:
    inputs:
      postgresql_version:
        description: Exact selected PostgreSQL release
        required: true
        type: string
      extension_version:
        description: Exact selected HypoPG release
        required: false
        type: string
  workflow_dispatch:
    inputs:
      postgresql_version:
        description: Selected PostgreSQL release
        required: true
        type: string
        default: '18.6'
      extension_version:
        description: Optional HypoPG version selector
        required: false
        type: string
        default: ''
permissions:
  actions: read
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      postgresql_version: ${{ steps.plan.outputs.postgresql_version }}
      extension_version: ${{ steps.plan.outputs.selected_version }}
      work_group_id: ${{ steps.work.outputs.group_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate the requested selected target
        id: plan
        env:
          POSTGRESQL_VERSION: ${{ inputs.postgresql_version }}
          EXTENSION_VERSION: ${{ inputs.extension_version }}
        run: |
          if [[ -z "$POSTGRESQL_VERSION" ]]; then
            POSTGRESQL_VERSION=$(python3 -c 'import json; print(json.load(open("experiments/hypopg-windows-target-trial/target.json"))["postgresql_version"])')
          fi
          args=(--project HypoPG --platform windows-x86_64 \
            --postgresql-version "$POSTGRESQL_VERSION")
          if [[ -n "$EXTENSION_VERSION" ]]; then
            args+=(--extension-version "$EXTENSION_VERSION")
          fi
          python3 tools/extension_archive_plan.py "${args[@]}" --github-output "$GITHUB_OUTPUT" > "$RUNNER_TEMP/selection.json"
          selected_version=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["selected_version"])' "$RUNNER_TEMP/selection.json")
          if [[ "$selected_version" != '1.4.3' ]]; then
            echo "The selected HypoPG release is $selected_version; the current Windows recipe and publication tools support only 1.4.3." >&2
            exit 1
          fi
      - name: Resolve selected build work and prerequisites
        id: work
        env:
          POSTGRESQL_VERSION: ${{ steps.plan.outputs.postgresql_version }}
          EXTENSION_VERSION: ${{ steps.plan.outputs.selected_version }}
        run: |
          set -euo pipefail
          python3 tools/select_extension_work.py \
            --project HypoPG --version "$EXTENSION_VERSION" \
            --platform windows-x86_64 --postgresql-major "${POSTGRESQL_VERSION%%.*}" \
            --github-output "$GITHUB_OUTPUT" > "$RUNNER_TEMP/selected-work.json"

  build:
    needs: select
    if: needs.select.result == 'success'
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve a checked PostgreSQL core candidate
        id: core_candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PG_VERSION: ${{ needs.select.outputs.postgresql_version }}
        run: |
          $coreDir = Join-Path $env:RUNNER_TEMP 'core-archives'
          $baseTarget = Join-Path $coreDir 'base-target.json'
          python tools/windows_core_target.py --postgresql-version $env:PG_VERSION --output $baseTarget
          if ($LASTEXITCODE -ne 0) { throw 'Selected PostgreSQL core target generation failed.' }
          python tools/windows_core_candidate.py --selected-core --base-target $baseTarget --artifact-pin "support/windows-core-artifact-pins/$($env:PG_VERSION)-x86_64.json" --output-directory $coreDir
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL core candidate resolution failed.' }
          $result = Get-Content (Join-Path $coreDir 'result.json') -Raw | ConvertFrom-Json
          if ($result.status -notin @('checked', 'missing', 'stale')) { throw "Unexpected core candidate status: $($result.status)" }
          "status=$($result.status)" | Add-Content $env:GITHUB_OUTPUT
      - name: Check HypoPG publication evidence tooling
        run: python -B -m unittest tests/test_hypopg_windows_publication.py
      - name: Set up PostgreSQL core build dependencies when needed
        if: steps.core_candidate.outputs.status == 'missing' || steps.core_candidate.outputs.status == 'stale'
        env:
          PG_VERSION: ${{ needs.select.outputs.postgresql_version }}
        run: ./scripts/windows/setup-core-dependencies.ps1 -PostgreSQLVersion $env:PG_VERSION
      - name: Build selected PostgreSQL core when no current candidate is available
        if: steps.core_candidate.outputs.status == 'missing' || steps.core_candidate.outputs.status == 'stale'
        env:
          PG_VERSION: ${{ needs.select.outputs.postgresql_version }}
          BUILD_MODE: core-only
        run: |
          cmd.exe /d /c scripts\windows\build.cmd
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL core build failed.' }
          $archiveName = "postgresql-${env:PG_VERSION}-windows-x86_64.tar.gz"
          $archive = Join-Path $env:RUNNER_TEMP "core-archives/$archiveName"
          Copy-Item "dist/windows/$archiveName" $archive -Force
          Copy-Item "dist/windows/$archiveName.sha256" "$archive.sha256" -Force
          $artifactName = "hypopg-windows-$env:PG_VERSION-build-$env:GITHUB_RUN_ID"
          python tools/windows_core_target_config.py --base-target (Join-Path $env:RUNNER_TEMP 'core-archives/base-target.json') --core-archive $archive --source-run-id $env:GITHUB_RUN_ID --source-run-attempt $env:GITHUB_RUN_ATTEMPT --source-artifact-name $artifactName --output (Join-Path $env:RUNNER_TEMP 'core-archives/candidate-target.json')
          if ($LASTEXITCODE -ne 0) { throw 'Generated PostgreSQL core identity validation failed.' }
      - name: Select PostgreSQL core identity
        env:
          PG_VERSION: ${{ needs.select.outputs.postgresql_version }}
        run: |
          $coreDir = Join-Path $env:RUNNER_TEMP 'core-archives'
          $candidate = Join-Path $coreDir 'candidate-target.json'
          if (-not (Test-Path $candidate -PathType Leaf)) { throw 'Checked or rebuilt PostgreSQL core identity is missing.' }
          Copy-Item $candidate (Join-Path $coreDir 'identity.json') -Force
      - name: Build and package HypoPG from pinned upstream source
        id: archive
        continue-on-error: true
        run: ./scripts/hypopg/windows-feasibility.ps1 -CoreArchiveDirectory "$env:RUNNER_TEMP/core-archives" -OutputDirectory "$env:RUNNER_TEMP/hypopg-build" -PostgreSQLVersion '${{ needs.select.outputs.postgresql_version }}' -CoreIdentityPath "$env:RUNNER_TEMP/core-archives/identity.json" -BuildOnly
      - name: Upload final core and extension archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hypopg-windows-${{ needs.select.outputs.postgresql_version }}-build-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/core-archives/**
            ${{ runner.temp }}/hypopg-build/**
          if-no-files-found: warn
          retention-days: 7
      - name: Require package build to pass
        if: always()
        run: |
          if ('${{ steps.archive.outcome }}' -ne 'success') { throw 'HypoPG Windows archive build failed.' }

  verify:
    needs: [select, build]
    if: always() && needs.select.result == 'success'
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download final archives from the build runner
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: hypopg-windows-${{ needs.select.outputs.postgresql_version }}-build-${{ github.run_id }}
          path: ${{ runner.temp }}/hypopg-bundle
      - name: Prepare verification inputs
        if: always()
        run: |
          $coreDir = Join-Path $env:RUNNER_TEMP 'core-archives'
          $extensionDir = Join-Path $env:RUNNER_TEMP 'hypopg-extension'
          New-Item -ItemType Directory -Force $coreDir,$extensionDir | Out-Null
          $bundleCore = Join-Path $env:RUNNER_TEMP 'hypopg-bundle/core-archives'
          $bundleExtension = Join-Path $env:RUNNER_TEMP 'hypopg-bundle/hypopg-build'
          if (Test-Path $bundleCore) { Copy-Item (Join-Path $bundleCore '*') $coreDir -Force }
          if (Test-Path $bundleExtension) { Copy-Item (Join-Path $bundleExtension '*') $extensionDir -Force }
          $symbols = Join-Path $extensionDir 'hypopg.pdb'
          if (Test-Path $symbols -PathType Leaf) {
            $verificationDir = Join-Path $env:RUNNER_TEMP 'hypopg-verification'
            New-Item -ItemType Directory -Force $verificationDir | Out-Null
            Copy-Item $symbols $verificationDir -Force
          }
      - name: Inspect and exercise downloaded archives after relocation
        id: verification
        if: always() && needs.build.result == 'success' && steps.download.outcome == 'success'
        continue-on-error: true
        run: ./scripts/hypopg/verify-windows-publication.ps1 -CoreArchiveDirectory "$env:RUNNER_TEMP/core-archives" -ExtensionArchiveDirectory "$env:RUNNER_TEMP/hypopg-extension" -OutputDirectory "$env:RUNNER_TEMP/hypopg-verification" -PostgreSQLVersion '${{ needs.select.outputs.postgresql_version }}' -CoreIdentityPath "$env:RUNNER_TEMP/core-archives/identity.json"
      - name: Emit archive-bound attempt and verification record
        if: always()
        env:
          ARCHIVE_RESULT: ${{ needs.build.result == 'success' && steps.verification.outcome || needs.build.result }}
          STATIC_RESULT: ${{ steps.verification.outcome }}
          POSTGRESQL_VERSION: ${{ needs.select.outputs.postgresql_version }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'hypopg-verification'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $version = (Get-CimInstance Win32_OperatingSystem).Version
          $image = "$([Environment]::GetEnvironmentVariable('ImageOS'))/$([Environment]::GetEnvironmentVariable('ImageVersion'))"
          python tools/emit_hypopg_windows_publication.py --postgresql-version $env:POSTGRESQL_VERSION --core-identity-path (Join-Path $env:RUNNER_TEMP 'core-archives/identity.json') --core-archives (Join-Path $env:RUNNER_TEMP 'core-archives') --archives (Join-Path $env:RUNNER_TEMP 'hypopg-extension') --output $dir --os-version $version --image-id $image --archive-suite-result $env:ARCHIVE_RESULT --static-analysis-result $env:STATIC_RESULT
      - name: Validate and retain publication evidence
        if: always()
        env:
          POSTGRESQL_VERSION: ${{ needs.select.outputs.postgresql_version }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'hypopg-verification'
          $attemptPath = Join-Path $dir 'publication/attempt.json'
          if (Test-Path $attemptPath) {
            $attempt = Get-Content $attemptPath -Raw | ConvertFrom-Json
            if ($attempt.archives) {
              $extensionDir = Join-Path $env:RUNNER_TEMP 'hypopg-extension'
              Copy-Item (Join-Path $dir '*') $extensionDir -Recurse -Force
              python tools/import_hypopg_windows_publication.py --postgresql-version $env:POSTGRESQL_VERSION --core-identity-path (Join-Path $env:RUNNER_TEMP 'core-archives/identity.json') --core-artifact (Join-Path $env:RUNNER_TEMP 'core-archives') --extension-artifact $extensionDir --run-id $env:GITHUB_RUN_ID
            }
          }
      - name: Upload candidate archive and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hypopg-1.4.3-postgresql-${{ needs.select.outputs.postgresql_version }}-windows-x86_64-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/core-archives/*.tar.gz
            ${{ runner.temp }}/core-archives/*.sha256
            ${{ runner.temp }}/core-archives/identity.json
            ${{ runner.temp }}/hypopg-extension/*
            ${{ runner.temp }}/hypopg-verification/*
            support/evidence/hypopg-windows-publication-${{ github.run_id }}/**
            support/verification/hypopg-1.4.3-postgresql-${{ needs.select.outputs.postgresql_version }}-windows-x86_64-current-${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 7
      - name: Require fresh-runner verification to pass
        if: always()
        run: |
          if ('${{ needs.build.result }}' -ne 'success' -or '${{ steps.download.outcome }}' -ne 'success' -or '${{ steps.verification.outcome }}' -ne 'success') { throw 'HypoPG Windows fresh-runner verification failed.' }
