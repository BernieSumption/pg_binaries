name: pgvector selected Linux x86-64 trial

on:
  workflow_dispatch:
    inputs:
      postgresql_version:
        description: Exact selected PostgreSQL release for the trial
        required: false
        default: '17.11'
        type: string
  push:
    branches: [spike]
    paths:
      - 'experiments/pgvector-selected-target/target.json'
      - '.github/workflows/pgvector-linux-selected-trial.yml'
      - 'scripts/pgvector/**'
      - 'scripts/linux/**'
      - 'tools/selected_build_inputs.py'
      - 'tools/select_extension_work.py'
      - 'tools/extension_work_queue.py'
      - 'tools/linux_core_candidate.py'
      - 'tools/actions_candidate_discovery.py'
      - 'tools/source_archive.py'
      - 'tools/coverage.py'
      - 'tools/plan_work.py'
      - 'tools/discover_builtins.py'
      - 'tools/write_linux_license_inventory.py'
      - 'tools/create_linux_publication_receipt.py'
      - 'tools/emit_linux_publication_records.py'
      - 'tools/import_linux_publication_run.py'
      - 'tools/create_linux_symbols.py'
      - 'tests/test_linux_core_candidate.py'
      - 'support.json'
      - 'support/postgresql-releases.json'

permissions:
  actions: read
  contents: read

jobs:
  selected_trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      PG_ARCHITECTURE: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select the requested PostgreSQL pgvector work from the planner and queue
        id: target
        env:
          REQUESTED_POSTGRESQL_VERSION: ${{ inputs.postgresql_version }}
        run: |
          set -euo pipefail
          pg_version="$REQUESTED_POSTGRESQL_VERSION"
          if [[ -z "$pg_version" ]]; then
            pg_version=$(python3 - <<'PY'
          import json
          from pathlib import Path
          request = json.loads(Path('experiments/pgvector-selected-target/target.json').read_text())
          if (set(request) != {'postgresql_version', 'attempt'}
                  or not isinstance(request['attempt'], int) or isinstance(request['attempt'], bool)
                  or request['attempt'] < 1):
              raise SystemExit('invalid selected pgvector trial request')
          print(request['postgresql_version'])
          PY
            )
          fi
          python3 tools/extension_archive_plan.py \
            --project pgvector --platform linux-x86_64 --postgresql-version "$pg_version" \
            --github-output "$GITHUB_OUTPUT" > "$RUNNER_TEMP/extension-target.json"
          vector_version=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["selected_version"])' \
            "$RUNNER_TEMP/extension-target.json")
          python3 tools/select_extension_work.py \
            --project pgvector --version "$vector_version" --platform linux-x86_64 \
            --postgresql-version "$pg_version" --github-output "$GITHUB_OUTPUT" \
            > "$RUNNER_TEMP/selected-target.json"
          echo "Selected pgvector $vector_version on Linux x86-64 for PostgreSQL $pg_version."
      - name: Discover a checked PostgreSQL core archive or build it
        env:
          GH_TOKEN: ${{ github.token }}
          PG_VERSION: ${{ steps.target.outputs.postgresql_version }}
        run: |
          set -euo pipefail
          core_name="postgresql-$PG_VERSION-linux-x86_64.tar.gz"
          mkdir -p "$RUNNER_TEMP/core"
          candidate_fresh=false
          docker build --platform linux/amd64 -f scripts/linux/Dockerfile \
            -t pg-binaries-linux-pilot .
          builder_image_id=$(docker image inspect pg-binaries-linux-pilot --format '{{.Id}}')
          for candidate_source in selected publication; do
            if [[ "$candidate_source" == selected ]]; then
              source_workflow=pgvector-linux-selected-trial.yml
              artifact_template="pgvector-linux-selected-$PG_VERSION-{run_id}"
            else
              source_workflow=linux-publication.yml
              artifact_template=linux-publication-x86_64-evidence
            fi
            python3 tools/actions_candidate_discovery.py \
              --repository "$GITHUB_REPOSITORY" --workflow "$source_workflow" \
              --branch "$GITHUB_REF_NAME" --current-run-id "$GITHUB_RUN_ID" \
              --artifact-name-template "$artifact_template" \
              --archive-basename "$core_name" --project postgresql --version "$PG_VERSION" \
              --platform linux-x86_64 --postgresql-version "$PG_VERSION" \
              --output-directory "$RUNNER_TEMP/core" \
              --manifest-path "$RUNNER_TEMP/core-candidate-manifest.json"
            if [[ -s "$RUNNER_TEMP/core/$core_name" && -s "$RUNNER_TEMP/core/$core_name.sha256" ]] && \
               python3 tools/linux_core_candidate.py \
                 --manifest "$RUNNER_TEMP/core-candidate-manifest.json" \
                 --archive "$RUNNER_TEMP/core/$core_name" --postgresql-version "$PG_VERSION" \
                 --builder-image-id "$builder_image_id"; then
              candidate_fresh=true
              break
            fi
            rm -f "$RUNNER_TEMP/core/$core_name" "$RUNNER_TEMP/core/$core_name.sha256"
          done
          if [[ "$candidate_fresh" == true ]] && \
             [[ -s "$RUNNER_TEMP/core/$core_name" ]]; then
            echo 'Using a checksum-verified core candidate with matching source/run identity, recipe inputs, and builder image.'
          else
            rm -f "$RUNNER_TEMP/core/$core_name" "$RUNNER_TEMP/core/$core_name.sha256"
            echo 'No fresh checked core candidate exists; building the selected PostgreSQL core in Docker.'
            PG_VERSION="$PG_VERSION" PG_ARCHITECTURE=x86_64 \
              scripts/linux/build.sh "$RUNNER_TEMP/core"
          fi
          python3 scripts/pgvector/archive_input.py validate-core \
            "$RUNNER_TEMP/core/$core_name" "$RUNNER_TEMP/core/$core_name.sha256" \
            "$(sha256sum "$RUNNER_TEMP/core/$core_name" | awk '{print $1}')" \
            "$PG_VERSION" x86_64 \
            "$(python3 tools/source_archive.py postgresql "$PG_VERSION" tar.bz2 --field sha256)"
      - name: Fetch the pinned pgvector source archive
        env:
          PGVECTOR_VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          source_url=$(python3 tools/source_archive.py pgvector "$PGVECTOR_VERSION" tar.gz --field url)
          curl --fail --location --retry 3 "$source_url" --output "$RUNNER_TEMP/pgvector-v$PGVECTOR_VERSION.tar.gz"
      - name: Build pgvector against the selected core
        env:
          PG_VERSION: ${{ steps.target.outputs.postgresql_version }}
          PGVECTOR_VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/core/postgresql-$PG_VERSION-linux-x86_64.tar.gz"
          core_sha=$(sha256sum "$core" | awk '{print $1}')
          PG_VERSION="$PG_VERSION" PG_ARCHITECTURE=x86_64 \
            scripts/pgvector/linux-build.sh "$core" "$core_sha" \
            "$RUNNER_TEMP/pgvector-v$PGVECTOR_VERSION.tar.gz" "$RUNNER_TEMP/vector"
      - name: Verify the exact core and pgvector archive bytes in Alpine
        id: verify
        continue-on-error: true
        env:
          PG_VERSION: ${{ steps.target.outputs.postgresql_version }}
          PGVECTOR_VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          archive_dir="$RUNNER_TEMP/archives"
          mkdir -p "$archive_dir"
          cp "$RUNNER_TEMP/core/postgresql-$PG_VERSION-linux-x86_64.tar.gz"* "$archive_dir/"
          cp "$RUNNER_TEMP/vector/pgvector-$PGVECTOR_VERSION-postgresql-$PG_VERSION-linux-x86_64.tar.gz"* "$archive_dir/"
          (cd "$archive_dir" && sha256sum --check *.sha256)
          PG_VERSION="$PG_VERSION" PG_ARCHITECTURE=x86_64 scripts/linux/verify.sh "$archive_dir"
      - name: Check PostgreSQL launch without host user space
        id: nohost
        continue-on-error: true
        if: ${{ always() && steps.verify.outcome != 'skipped' }}
        env:
          PG_VERSION: ${{ steps.target.outputs.postgresql_version }}
          PGVECTOR_VERSION: ${{ steps.target.outputs.version }}
        run: bash scripts/linux/verify-no-host-userspace.sh "$RUNNER_TEMP/archives" "$PG_VERSION" x86_64
      - name: Index symbols from the exact final archives
        id: symbols
        continue-on-error: true
        if: ${{ always() && steps.verify.outcome != 'skipped' }}
        env:
          PG_VERSION: ${{ steps.target.outputs.postgresql_version }}
          PGVECTOR_VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          python3 tools/create_linux_symbols.py \
            "$RUNNER_TEMP/archives/postgresql-$PG_VERSION-linux-x86_64.tar.gz" \
            "$RUNNER_TEMP/archives/pgvector-$PGVECTOR_VERSION-postgresql-$PG_VERSION-linux-x86_64.tar.gz" \
            --output-dir "$RUNNER_TEMP/archives/debug-symbols"
      - name: Run final-byte loader and PostgreSQL diagnostic probes
        id: diagnostics
        continue-on-error: true
        if: ${{ always() && steps.verify.outcome != 'skipped' }}
        env:
          PG_VERSION: ${{ steps.target.outputs.postgresql_version }}
          PGVECTOR_VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          if [[ '${{ steps.symbols.outcome }}' != success ]]; then
            echo 'Final-archive symbol index is unavailable.' >&2
            exit 1
          fi
          docker build --platform linux/amd64 -f scripts/linux/diagnostics.Dockerfile \
            -t pg-binaries-linux-diagnostics .
          mkdir -p "$RUNNER_TEMP/diagnostics-evidence"
          docker run --rm --platform linux/amd64 \
            -e GITHUB_RUN_ID -e GITHUB_REPOSITORY -e GITHUB_SERVER_URL -e GITHUB_SHA \
            -e DIAGNOSTICS_EVIDENCE_DIR=/evidence \
            -v "$GITHUB_WORKSPACE:/repo:ro" -v "$RUNNER_TEMP/archives:/archives:ro" \
            -v "$RUNNER_TEMP/diagnostics-evidence:/evidence" \
            pg-binaries-linux-diagnostics \
            bash /repo/scripts/linux/diagnostics-in-container.sh /archives "$PG_VERSION" x86_64 "$PGVECTOR_VERSION"
      - name: Emit and import archive-bound current-profile results
        id: records
        if: ${{ always() }}
        env:
          PG_VERSION: ${{ steps.target.outputs.postgresql_version }}
          PGVECTOR_VERSION: ${{ steps.target.outputs.version }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          DIAGNOSTICS_OUTCOME: ${{ steps.diagnostics.outcome }}
          NOHOST_OUTCOME: ${{ steps.nohost.outcome }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/bundle"
          core_dir="$bundle/pilot"
          publication="$core_dir/publication"
          mkdir -p "$publication"
          if [[ -f "$RUNNER_TEMP/archives/postgresql-$PG_VERSION-linux-x86_64.tar.gz" ]]; then
            cp "$RUNNER_TEMP/archives/postgresql-$PG_VERSION-linux-x86_64.tar.gz"* "$core_dir/"
          fi
          if [[ -f "$RUNNER_TEMP/archives/pgvector-$PGVECTOR_VERSION-postgresql-$PG_VERSION-linux-x86_64.tar.gz" ]]; then
            cp "$RUNNER_TEMP/archives/pgvector-$PGVECTOR_VERSION-postgresql-$PG_VERSION-linux-x86_64.tar.gz"* "$core_dir/"
          fi
          if [[ -f "$RUNNER_TEMP/archives/publication/static-analysis/core-pgvector.json" ]]; then
            mkdir -p "$publication/static-analysis"
            cp "$RUNNER_TEMP/archives/publication/static-analysis/core-pgvector.json" "$publication/static-analysis/"
          fi
          if [[ -d "$RUNNER_TEMP/archives/debug-symbols" ]]; then
            cp -R "$RUNNER_TEMP/archives/debug-symbols" "$core_dir/"
          fi
          if [[ -d "$RUNNER_TEMP/diagnostics-evidence" ]]; then
            mkdir -p "$core_dir/diagnostics"
            cp -R "$RUNNER_TEMP/diagnostics-evidence/." "$core_dir/diagnostics/"
          fi
          python3 - "$publication/current-steps.json" <<'PY'
          import json, os, pathlib, sys
          pathlib.Path(sys.argv[1]).write_text(json.dumps({
              "archive-suite": os.environ["VERIFY_OUTCOME"],
              "diagnostics": os.environ["DIAGNOSTICS_OUTCOME"],
              "no-host-userspace": os.environ["NOHOST_OUTCOME"],
          }, sort_keys=True) + "\n")
          PY
          core="$core_dir/postgresql-$PG_VERSION-linux-x86_64.tar.gz"
          vector="$core_dir/pgvector-$PGVECTOR_VERSION-postgresql-$PG_VERSION-linux-x86_64.tar.gz"
          if [[ -s "$core" && -s "$core.sha256" && -s "$vector" && -s "$vector.sha256" ]]; then
            image=$(docker image inspect --format '{{.Id}}' pg-binaries-linux-verifier 2>/dev/null || true)
            if [[ "$image" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              clean=false
              dependencies=failure
              if [[ "$VERIFY_OUTCOME" == success && "$NOHOST_OUTCOME" == success ]]; then
                clean=true
                dependencies=success
              fi
              distribution=$(docker run --rm --entrypoint sh pg-binaries-linux-verifier -c '. /etc/os-release; printf "%s" "$NAME"')
              distribution_version=$(docker run --rm --entrypoint sh pg-binaries-linux-verifier -c '. /etc/os-release; printf "%s" "$VERSION_ID"')
              python3 tools/create_linux_publication_receipt.py \
                --archives "$core_dir" --receipt "$publication/current-receipt.json" \
                --profile-id linux-publication-current-x86_64 --postgresql-version "$PG_VERSION" \
                --architecture x86_64 --endpoint current --kernel-release "$(uname -r)" \
                --distribution "$distribution" --distribution-version "$distribution_version" \
                --image-id "$image" --dependency-check-profile linux-runtime-v1 \
                --dependency-check-result "$dependencies" --clean-system "$clean" \
                --step-results "$publication/current-steps.json"
              python3 tools/emit_linux_publication_records.py \
                --archives "$core_dir" --receipt "$publication/current-receipt.json" \
                --output "$publication/records"
              python3 tools/import_linux_publication_run.py \
                --core-artifact "$bundle" --run-id "$GITHUB_RUN_ID" \
                --architecture x86_64 --postgresql-version "$PG_VERSION"
              echo 'records_imported=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo 'Archive-bound records unavailable because verified archives or verifier image identity are missing.'
          echo 'records_imported=false' >> "$GITHUB_OUTPUT"
          if [[ -s "$core_dir/postgresql-$PG_VERSION-linux-x86_64.tar.gz" || -s "$vector" ]]; then
            python3 tools/import_linux_publication_run.py \
              --core-artifact "$bundle" --run-id "$GITHUB_RUN_ID" \
              --architecture x86_64 --postgresql-version "$PG_VERSION"
          fi
      - name: Retain exact archives and verifier output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgvector-linux-selected-${{ steps.target.outputs.postgresql_version }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/bundle/**
            support/evidence/linux-publication-${{ github.run_id }}/**
            support/verification/postgresql-${{ steps.target.outputs.postgresql_version }}-linux-x86_64-current-${{ github.run_id }}.json
            support/verification/pgvector-${{ steps.target.outputs.version }}-postgresql-${{ steps.target.outputs.postgresql_version }}-linux-x86_64-current-${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 7
      - name: Require archive suite, no-host check, and record import
        if: ${{ always() }}
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          DIAGNOSTICS_OUTCOME: ${{ steps.diagnostics.outcome }}
          NOHOST_OUTCOME: ${{ steps.nohost.outcome }}
          RECORDS: ${{ steps.records.outputs.records_imported }}
        run: |
          set -euo pipefail
          if [[ "$VERIFY_OUTCOME" != success || "$NOHOST_OUTCOME" != success || "$DIAGNOSTICS_OUTCOME" != success || "$RECORDS" != true ]]; then
            echo "Selected pgvector Linux trial incomplete: verify=$VERIFY_OUTCOME no-host=$NOHOST_OUTCOME diagnostics=$DIAGNOSTICS_OUTCOME records=$RECORDS." >&2
            exit 1
          fi
