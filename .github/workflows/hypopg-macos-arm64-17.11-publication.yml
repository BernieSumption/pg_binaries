name: HypoPG macOS arm64 PostgreSQL 17.11 publication

on:
  workflow_dispatch:
  push:
    branches: [spike]
    paths:
      - .github/workflows/profile-change-scope.yml
      - tools/profile_change_gate.py
      - tests/test_profile_change_gate.py
      - '.github/workflows/hypopg-macos-arm64-17.11-publication.yml'
      - 'scripts/hypopg/macos-feasibility.sh'
      - 'scripts/hypopg/verify-macos-publication.sh'
      - 'scripts/hypopg/macos-probe.sql'
      - 'scripts/macos/static_analysis.py'
      - 'policies/install-process.md'
      - 'tools/check_macos_extension_license_inventory.py'
      - 'tools/publication_preflight.py'
      - 'tools/emit_hypopg_macos_publication.py'
      - 'tools/import_hypopg_macos_publication.py'
      - 'tools/hypopg_macos_pins/17.11-arm64.json'
      - 'tools/hypopg_macos_target.py'
      - 'tests/test_hypopg_macos_17_11_arm64_publication.py'
      - 'support/verification-profiles.json'

permissions:
  actions: read
  contents: read

jobs:
  profile_scope:
    uses: ./.github/workflows/profile-change-scope.yml
    with:
      profile_id: hypopg-publication-macos-arm64-17.11

  build:
    needs: profile_scope
    if: needs.profile_scope.outputs.should_run == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check HypoPG macOS publication helpers
        run: python3 -m unittest tests/test_hypopg_macos_17_11_arm64_publication.py
      - name: Download the passed PostgreSQL 17.11 Apple Silicon artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-pilot-archives
          run-id: 39093804725
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/core-archives
      - name: Build the HypoPG archive against the pinned core
        id: package
        continue-on-error: true
        env:
          HYPOPG_BUILD_ONLY: 'true'
        run: bash scripts/hypopg/macos-feasibility.sh "$RUNNER_TEMP/core-archives" "$RUNNER_TEMP/hypopg-publication" tools/hypopg_macos_pins/17.11-arm64.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hypopg-macos-arm64-17.11-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/core-archives/*.tar.gz
            ${{ runner.temp }}/core-archives/*.sha256
            ${{ runner.temp }}/hypopg-publication/*.tar.gz
            ${{ runner.temp }}/hypopg-publication/*.sha256
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve package-step failure
        if: always()
        run: test '${{ steps.package.outcome }}' = success

  verify:
    needs: [profile_scope, build]
    if: always() && needs.profile_scope.outputs.should_run == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check HypoPG macOS publication helpers
        run: python3 -m unittest tests/test_hypopg_macos_17_11_arm64_publication.py
      - name: Download final core and extension archives from the build job
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: hypopg-macos-arm64-17.11-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/hypopg-bundle
      - name: Prepare verification input directories
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/core-archives" "$RUNNER_TEMP/hypopg-publication"
          if [[ -d "$RUNNER_TEMP/hypopg-bundle/core-archives" ]]; then
            cp -a "$RUNNER_TEMP/hypopg-bundle/core-archives/." "$RUNNER_TEMP/core-archives/"
          fi
          if [[ -d "$RUNNER_TEMP/hypopg-bundle/hypopg-publication" ]]; then
            cp -a "$RUNNER_TEMP/hypopg-bundle/hypopg-publication/." "$RUNNER_TEMP/hypopg-publication/"
          fi
      - name: Inspect final archives on the fresh runner
        id: static_analysis
        if: always() && steps.download.outcome == 'success'
        continue-on-error: true
        run: bash scripts/hypopg/verify-macos-publication.sh static-analysis "$RUNNER_TEMP/core-archives" "$RUNNER_TEMP/hypopg-publication" "$RUNNER_TEMP/hypopg-publication" tools/hypopg_macos_pins/17.11-arm64.json
      - name: Assemble and exercise the relocated final archives on the fresh runner
        id: archive_suite
        if: always() && steps.download.outcome == 'success'
        continue-on-error: true
        run: bash scripts/hypopg/verify-macos-publication.sh archive-suite "$RUNNER_TEMP/core-archives" "$RUNNER_TEMP/hypopg-publication" "$RUNNER_TEMP/hypopg-publication" tools/hypopg_macos_pins/17.11-arm64.json
      - name: Finalize HypoPG archive receipt and verification record
        if: always()
        env:
          ARCHIVE_SUITE_OUTCOME: ${{ steps.archive_suite.outcome }}
          STATIC_ANALYSIS_OUTCOME: ${{ steps.static_analysis.outcome }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/core-archives" "$RUNNER_TEMP/hypopg-publication"
          image_id="${ImageOS:?runner image OS missing}/${ImageVersion:?runner image version missing}"
          os_version="$(sw_vers -productVersion)"
          python3 tools/emit_hypopg_macos_publication.py \
            --target-config tools/hypopg_macos_pins/17.11-arm64.json \
            --core-archives "$RUNNER_TEMP/core-archives" \
            --archives "$RUNNER_TEMP/hypopg-publication" \
            --output "$RUNNER_TEMP/hypopg-publication" \
            --os-version "$os_version" --image-id "$image_id" \
            --archive-suite-result "$ARCHIVE_SUITE_OUTCOME" \
            --static-analysis-result "$STATIC_ANALYSIS_OUTCOME"
      - name: Validate and retain archive-bound publication evidence
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/hypopg-publication/publication/attempt.json" ]]; then
            python3 tools/import_hypopg_macos_publication.py \
              --target-config tools/hypopg_macos_pins/17.11-arm64.json \
              --core-artifact "$RUNNER_TEMP/core-archives" \
              --hypopg-artifact "$RUNNER_TEMP/hypopg-publication" \
              --run-id "$GITHUB_RUN_ID"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hypopg-macos-arm64-17.11-publication-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hypopg-publication/*.tar.gz
            ${{ runner.temp }}/hypopg-publication/*.sha256
            ${{ runner.temp }}/hypopg-publication/*.json
            ${{ runner.temp }}/hypopg-publication/*.txt
            ${{ runner.temp }}/hypopg-publication/publication/**
            support/evidence/hypopg-macos-publication-${{ github.run_id }}/arm64/**
            support/verification/hypopg-1.4.3-postgresql-17.11-macos-arm64-current-${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 7
      - name: Require both fresh-runner verification cases to pass
        if: always()
        run: |
          if [[ '${{ steps.archive_suite.outcome }}' != success || '${{ steps.static_analysis.outcome }}' != success ]]; then
            echo 'HypoPG macOS archive-suite and static-analysis cases must both pass.' >&2
            exit 1
          fi
