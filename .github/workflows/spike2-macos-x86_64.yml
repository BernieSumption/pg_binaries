name: Spike 2 macOS x86_64 PostgreSQL pilot

"on":
  push:
    branches: [spike-2]
    paths:
      - .github/workflows/spike2-macos-x86_64.yml
      - packages/postgresql/macos-x86_64/**
      - support.json

permissions:
  actions: read
  contents: read

jobs:
  postgresql:
    runs-on: macos-15-intel
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Build and package PostgreSQL
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/output"
          cat > "$RUNNER_TEMP/postgresql-build.sh" <<'SH'
          set -euo pipefail
          python3 build.py --target macos-x86_64 postgresql-dependencies /private/tmp/spike2/dependencies
          python3 build.py --target macos-x86_64 postgresql-build /private/tmp/spike2/dependencies "$RUNNER_TEMP/build" /private/tmp/spike2/postgresql
          python3 build.py --target macos-x86_64 postgresql-package /private/tmp/spike2/postgresql /private/tmp/spike2/dependencies "$RUNNER_TEMP/output"
          version=$(python3 -c 'import json; print(json.load(open("support.json"))["postgresql"]["version"])')
          archive="$RUNNER_TEMP/output/postgresql-$version-macos-x86_64.tar.gz"
          development="$RUNNER_TEMP/output/postgresql-development-$version-macos-x86_64.tar.gz"
          python3 build.py archive-check "$archive"
          python3 build.py --target macos-x86_64 build-record postgresql "$archive" "$RUNNER_TEMP/output/record.json" --revision "$GITHUB_SHA" --development-archive "$development"
          SH
          python3 -m verification.measure "$RUNNER_TEMP/output/metrics.json" -- bash "$RUNNER_TEMP/postgresql-build.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: spike2-macos-x86_64-postgresql
          path: ${{ runner.temp }}/output/
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike2-macos-x86_64-postgresql-metrics
          path: ${{ runner.temp }}/output/metrics.json
          if-no-files-found: warn

  verify-postgresql:
    needs: postgresql
    if: always() && needs.postgresql.result == 'success'
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Verify PostgreSQL archive in a fresh runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 build.py --target macos-x86_64 select-runs "$RUNNER_TEMP/selection" --run "$GITHUB_RUN_ID" --component postgresql
          archive=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["components"]["postgresql"]["archive"])' "$RUNNER_TEMP/selection/selection.json")
          python3 build.py --target macos-x86_64 runtime-check "$archive" "$RUNNER_TEMP/postgresql-check"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike2-macos-x86_64-postgresql-verification
          path: ${{ runner.temp }}/postgresql-check/
          if-no-files-found: warn
          compression-level: 0
