name: pg_jsonschema selected Linux publication

on:
  workflow_call:
    inputs:
      postgresql_version:
        description: Exact selected PostgreSQL release
        required: true
        type: string
      architecture:
        description: Exact selected Linux architecture
        required: true
        type: string
      extension_version:
        description: Exact selected pg_jsonschema release
        required: true
        type: string
  workflow_dispatch:
    inputs:
      postgresql_version:
        description: Selected PostgreSQL release
        required: true
        type: string
      architecture:
        description: Selected Linux architecture
        required: true
        type: string
      extension_version:
        description: Optional selected pg_jsonschema release
        required: false
        type: string
        default: ''

permissions:
  actions: read
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      postgresql_version: ${{ steps.plan.outputs.postgresql_version }}
      extension_version: ${{ steps.plan.outputs.selected_version }}
      architecture: ${{ steps.plan.outputs.architecture }}
    steps:
      - uses: actions/checkout@v4
      - name: Plan the exact selected target
        id: plan
        env:
          POSTGRESQL_VERSION: ${{ inputs.postgresql_version }}
          EXTENSION_VERSION: ${{ inputs.extension_version }}
          REQUESTED_ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          set -euo pipefail
          test -n "$POSTGRESQL_VERSION"
          test -n "$REQUESTED_ARCHITECTURE"
          case "$REQUESTED_ARCHITECTURE" in x86_64|arm64) ;; *) echo "Unsupported Linux architecture: $REQUESTED_ARCHITECTURE" >&2; exit 2 ;; esac
          args=(--project pg_jsonschema --platform "linux-$REQUESTED_ARCHITECTURE" --postgresql-version "$POSTGRESQL_VERSION")
          if [[ -n "$EXTENSION_VERSION" ]]; then args+=(--extension-version "$EXTENSION_VERSION"); fi
          python3 tools/extension_archive_plan.py "${args[@]}" --github-output "$GITHUB_OUTPUT" > "$RUNNER_TEMP/selection.json"
          echo "architecture=$REQUESTED_ARCHITECTURE" >> "$GITHUB_OUTPUT"

  build:
    needs: select
    runs-on: ${{ needs.select.outputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    outputs:
      extension_build: ${{ steps.build.outcome }}
    env:
      PG_VERSION: ${{ needs.select.outputs.postgresql_version }}
      PG_ARCHITECTURE: ${{ needs.select.outputs.architecture }}
      PG_JSONSCHEMA_VERSION: ${{ needs.select.outputs.extension_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate publication tooling
        run: python -B -m unittest tests/test_pg_jsonschema_linux_publication.py tests/test_pg_jsonschema_linux_selected_workflow.py tests/test_linux_core_resolution.py
      - name: Resolve checked PostgreSQL core prerequisite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/linux/resolve-core.sh "$PG_VERSION" "$PG_ARCHITECTURE" "$RUNNER_TEMP/core/pilot" \
            linux-changed-profiles.yml "pg-jsonschema-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}" \
            selected-extension-publication.yml "pg-jsonschema-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
      - name: Build selected pg_jsonschema final archive
        id: build
        continue-on-error: true
        run: scripts/pg_jsonschema/linux-build.sh "$RUNNER_TEMP/core/pilot" "$RUNNER_TEMP/pg_jsonschema"
      - name: Upload final extension archive and build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-jsonschema-linux-built-${{ needs.select.outputs.postgresql_version }}-${{ needs.select.outputs.architecture }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pg_jsonschema/*.tar.gz
            ${{ runner.temp }}/pg_jsonschema/*.sha256
            ${{ runner.temp }}/pg_jsonschema/*.txt
            ${{ runner.temp }}/pg_jsonschema/*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload exact resolved PostgreSQL core and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-jsonschema-linux-core-${{ needs.select.outputs.postgresql_version }}-${{ needs.select.outputs.architecture }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/core/pilot/*.tar.gz
            ${{ runner.temp }}/core/pilot/*.sha256
            ${{ runner.temp }}/core/pilot/core-resolution.json
          if-no-files-found: warn
          retention-days: 7
  verify:
    needs: [select, build]
    if: always() && needs.select.result == 'success' && needs.build.result == 'success'
    runs-on: ${{ needs.select.outputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      PG_VERSION: ${{ needs.select.outputs.postgresql_version }}
      PG_ARCHITECTURE: ${{ needs.select.outputs.architecture }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate publication evidence tooling
        run: python -B -m unittest tests/test_pg_jsonschema_linux_publication.py tests/test_pg_jsonschema_linux_selected_workflow.py tests/test_linux_core_resolution.py
      - name: Download final extension archive from the build job
        uses: actions/download-artifact@v4
        with:
          name: pg-jsonschema-linux-built-${{ needs.select.outputs.postgresql_version }}-${{ needs.select.outputs.architecture }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pg_jsonschema
      - name: Download exact resolved PostgreSQL core archive
        uses: actions/download-artifact@v4
        with:
          name: pg-jsonschema-linux-core-${{ needs.select.outputs.postgresql_version }}-${{ needs.select.outputs.architecture }}-${{ github.run_id }}
          path: ${{ runner.temp }}/core/pilot
      - name: Validate transferred core identity and provenance
        run: |
          python tools/linux_core_resolution.py \
            --validate-record "$RUNNER_TEMP/core/pilot/core-resolution.json" \
            --archive "$RUNNER_TEMP/core/pilot/postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz" \
            --postgresql-version "$PG_VERSION" --architecture "$PG_ARCHITECTURE"
      - name: Verify final archives on this fresh runner
        id: verify
        continue-on-error: true
        run: |
          set -o pipefail
          PG_VERSION="$PG_VERSION" PG_ARCHITECTURE="$PG_ARCHITECTURE" scripts/pg_jsonschema/linux-verify.sh "$RUNNER_TEMP/pg_jsonschema" "$RUNNER_TEMP/core/pilot" 2>&1 | tee "$RUNNER_TEMP/pg_jsonschema/probe-output.txt"
      - name: Emit target-bound attempt and verification record
        if: always()
        env:
          BUILD_RESULT: ${{ needs.build.outputs.extension_build }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/pg_jsonschema/publication"
          python tools/emit_pg_jsonschema_linux_publication.py \
            --archives "$RUNNER_TEMP/pg_jsonschema" --core-archives "$RUNNER_TEMP/core/pilot" \
            --core-resolution "$RUNNER_TEMP/core/pilot/core-resolution.json" \
            --output "$RUNNER_TEMP/pg_jsonschema/publication" --architecture "$PG_ARCHITECTURE" --postgresql-version "$PG_VERSION" \
            --build-result "${BUILD_RESULT:-skipped}" --verify-result "${VERIFY_RESULT:-skipped}" \
            --image-id "$(docker image inspect pg-binaries-pg-jsonschema-alpine-probe --format '{{.Id}}' 2>/dev/null || echo unavailable)" \
            --kernel-release "$(uname -r)"
      - name: Validate and retain exact publication evidence
        if: always()
        run: python tools/import_pg_jsonschema_linux_publication.py --core-archives "$RUNNER_TEMP/core/pilot" --archives "$RUNNER_TEMP/pg_jsonschema" --run-id "$GITHUB_RUN_ID"
      - name: Upload selected candidate and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-jsonschema-linux-selected-${{ needs.select.outputs.postgresql_version }}-${{ needs.select.outputs.architecture }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pg_jsonschema/*.tar.gz
            ${{ runner.temp }}/pg_jsonschema/*.sha256
            ${{ runner.temp }}/pg_jsonschema/*.txt
            ${{ runner.temp }}/pg_jsonschema/*.json
            ${{ runner.temp }}/pg_jsonschema/static-analysis/**
            ${{ runner.temp }}/pg_jsonschema/publication/**
            support/evidence/pg_jsonschema-linux-publication-${{ github.run_id }}/**
            support/verification/pg_jsonschema-0.3.4-postgresql-${{ needs.select.outputs.postgresql_version }}-linux-${{ needs.select.outputs.architecture }}-current-${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 7
      - name: Require selected target verification to pass
        if: always()
        run: test '${{ steps.verify.outcome }}' = success
