name: pg_cron selected PostgreSQL Linux publication

on:
  workflow_call:
    inputs:
      postgresql_version:
        description: Exact selected PostgreSQL release
        required: true
        type: string
      architecture:
        description: Exact selected Linux architecture
        required: true
        type: string
      extension_version:
        description: Exact selected pg_cron release
        required: true
        type: string
  workflow_dispatch:
    inputs:
      postgresql_version:
        description: Exact selected PostgreSQL release
        required: true
        type: string
      architecture:
        description: Exact selected Linux architecture
        required: true
        type: string
      extension_version:
        description: Exact selected pg_cron release
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      postgresql_version: ${{ steps.plan.outputs.postgresql_version }}
      extension_version: ${{ steps.plan.outputs.selected_version }}
      architecture: ${{ steps.plan.outputs.architecture }}
    steps:
      - uses: actions/checkout@v4
      - name: Plan the exact selected target
        id: plan
        env:
          POSTGRESQL_VERSION: ${{ inputs.postgresql_version }}
          EXTENSION_VERSION: ${{ inputs.extension_version }}
          REQUESTED_ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          set -euo pipefail
          test -n "$POSTGRESQL_VERSION"
          test -n "$REQUESTED_ARCHITECTURE"
          test -n "$EXTENSION_VERSION"
          case "$REQUESTED_ARCHITECTURE" in x86_64|arm64) ;; *) echo "Unsupported Linux architecture: $REQUESTED_ARCHITECTURE" >&2; exit 2 ;; esac
          python3 tools/extension_archive_plan.py \
            --project pg_cron --platform "linux-$REQUESTED_ARCHITECTURE" \
            --postgresql-version "$POSTGRESQL_VERSION" --extension-version "$EXTENSION_VERSION" \
            --github-output "$GITHUB_OUTPUT" > "$RUNNER_TEMP/selection.json"
          selected_version=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["selected_version"])' "$RUNNER_TEMP/selection.json")
          if [[ "$selected_version" != '1.6.8' ]]; then
            echo "The selected pg_cron release is $selected_version; the Linux recipe supports only 1.6.8." >&2
            exit 1
          fi
          echo "architecture=$REQUESTED_ARCHITECTURE" >> "$GITHUB_OUTPUT"

  build:
    needs: select
    runs-on: ${{ needs.select.outputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    outputs:
      core_resolution: ${{ steps.core_resolution.outcome }}
      extension_build: ${{ steps.extension_build.outcome }}
    env:
      PG_VERSION: ${{ needs.select.outputs.postgresql_version }}
      PG_ARCHITECTURE: ${{ needs.select.outputs.architecture }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve a checked PostgreSQL core or build the selected release
        id: core_resolution
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          sources=()
          if [[ "$CALLER_WORKFLOW_REF" == */.github/workflows/selected-extension-publication.yml@* ]]; then
            sources+=(
              selected-extension-publication.yml "pgcron-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
              selected-extension-publication.yml "pgtap-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
              selected-extension-publication.yml "pgivm-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
              selected-extension-publication.yml "pg-jsonschema-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
            )
          fi
          sources+=(
            linux-changed-profiles.yml "pgcron-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
            linux-changed-profiles.yml "pgtap-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
            linux-changed-profiles.yml "pgivm-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
            linux-changed-profiles.yml "pg-jsonschema-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
            pgcron-linux-selected-publication.yml "pgcron-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
            pgtap-linux-selected-publication.yml "pgtap-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
            pgivm-linux-selected-publication.yml "pgivm-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
            pg-jsonschema-linux-selected-publication.yml "pg-jsonschema-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
            linux-publication.yml "linux-publication-$PG_ARCHITECTURE-evidence"
          )
          scripts/linux/resolve-core.sh "$PG_VERSION" "$PG_ARCHITECTURE" "$RUNNER_TEMP/core/pilot" "${sources[@]}"
      - name: Build selected pg_cron archive against that core
        id: extension_build
        if: always() && steps.core_resolution.outcome == 'success'
        continue-on-error: true
        run: PG_VERSION="$PG_VERSION" PG_ARCHITECTURE="$PG_ARCHITECTURE" scripts/pg_cron/build.sh "$RUNNER_TEMP/core/pilot" "$RUNNER_TEMP/pg_cron"
      - name: Upload selected extension archive and build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgcron-linux-built-${{ needs.select.outputs.postgresql_version }}-${{ needs.select.outputs.architecture }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pg_cron/*.tar.gz
            ${{ runner.temp }}/pg_cron/*.sha256
            ${{ runner.temp }}/pg_cron/*.txt
            ${{ runner.temp }}/pg_cron/*.json
            ${{ runner.temp }}/pg_cron/static-analysis/**
          if-no-files-found: warn
          retention-days: 7
      - name: Upload exact resolved PostgreSQL core and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgcron-linux-core-${{ needs.select.outputs.postgresql_version }}-${{ needs.select.outputs.architecture }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/core/pilot/*.tar.gz
            ${{ runner.temp }}/core/pilot/*.sha256
            ${{ runner.temp }}/core/pilot/core-resolution.json
          if-no-files-found: warn
          retention-days: 7

  verify:
    needs: [select, build]
    if: always() && needs.select.result == 'success' && needs.build.result == 'success'
    runs-on: ${{ needs.select.outputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      PG_VERSION: ${{ needs.select.outputs.postgresql_version }}
      PG_ARCHITECTURE: ${{ needs.select.outputs.architecture }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download selected pg_cron archive
        id: download_extension
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pgcron-linux-built-${{ needs.select.outputs.postgresql_version }}-${{ needs.select.outputs.architecture }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pg_cron
      - name: Download exact resolved PostgreSQL core archive
        id: download_core
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pgcron-linux-core-${{ needs.select.outputs.postgresql_version }}-${{ needs.select.outputs.architecture }}-${{ github.run_id }}
          path: ${{ runner.temp }}/core/pilot
      - name: Validate transferred core identity and provenance
        id: core_validation
        if: always() && steps.download_core.outcome == 'success'
        continue-on-error: true
        run: |
          python3 tools/linux_core_resolution.py \
            --validate-record "$RUNNER_TEMP/core/pilot/core-resolution.json" \
            --archive "$RUNNER_TEMP/core/pilot/postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz" \
            --postgresql-version "$PG_VERSION" --architecture "$PG_ARCHITECTURE"
      - name: Verify final archives on this fresh runner
        id: verification
        if: always() && steps.download_extension.outcome == 'success' && steps.download_core.outcome == 'success' && steps.core_validation.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          PG_VERSION="$PG_VERSION" PG_ARCHITECTURE="$PG_ARCHITECTURE" \
            scripts/pg_cron/verify.sh "$RUNNER_TEMP/core/pilot" "$RUNNER_TEMP/pg_cron" \
            2>&1 | tee "$RUNNER_TEMP/pg_cron/probe-output.txt"
      - name: Record build and verification outcomes
        if: always()
        env:
          CORE_BUILD_OUTCOME: ${{ needs.build.outputs.core_resolution }}
          PGCRON_BUILD_OUTCOME: ${{ needs.build.outputs.extension_build }}
          PGCRON_VERIFY_OUTCOME: ${{ steps.verification.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/pgcron-publication"
          image=$(docker image inspect --format '{{.Id}}' pg-binaries-pgcron-verifier 2>/dev/null || true)
          if [[ ! "$image" =~ ^sha256:[0-9a-f]{64}$ ]]; then image=unknown; fi
          IMAGE_ID="$image" python3 - "$RUNNER_TEMP/pgcron-publication/attempt.json" "$RUNNER_TEMP/pgcron-publication/current-steps.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          core = os.environ["CORE_BUILD_OUTCOME"]
          build = os.environ["PGCRON_BUILD_OUTCOME"]
          verify = os.environ["PGCRON_VERIFY_OUTCOME"]
          image = os.environ["IMAGE_ID"]
          suite = "failure" if "failure" in (build, verify) or (
              build == verify == "success" and image == "unknown") else (
              "success" if build == verify == "success" else "skipped")
          attempt = {
              "schema_version": 1,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "source_revision": os.environ["GITHUB_SHA"],
              "postgresql_version": os.environ["PG_VERSION"],
              "pg_cron_version": "1.6.8",
              "architecture": os.environ["PG_ARCHITECTURE"],
              "verifier_image_id": image,
              "steps": {"core_build": core, "pgcron_build": build, "pgcron_verify": verify},
          }
          Path(sys.argv[1]).write_text(json.dumps(attempt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          Path(sys.argv[2]).write_text(json.dumps({"pgcron-archive-suite": suite}, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Create target-bound receipt and verification record
        id: receipt
        if: always()
        continue-on-error: true
        env:
          VERIFY_OUTCOME: ${{ steps.verification.outcome }}
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/core/pilot/postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz"
          extension="$RUNNER_TEMP/pg_cron/pg_cron-1.6.8-postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz"
          if [[ ! -f "$core" || ! -f "$core.sha256" || ! -f "$extension" || ! -f "$extension.sha256" ]]; then
            echo 'Archives are unavailable; retaining step outcomes without a receipt.'
            echo 'has_receipt=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          image=$(docker image inspect --format '{{.Id}}' pg-binaries-pgcron-verifier 2>/dev/null || true)
          if [[ ! "$image" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'Verifier image identity is unavailable; retaining step outcomes without a receipt.' >&2
            echo 'has_receipt=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          clean=false
          dependencies=failure
          if [[ "$VERIFY_OUTCOME" == success ]]; then clean=true; dependencies=success; fi
          case "$PG_ARCHITECTURE" in x86_64) docker_platform=linux/amd64 ;; arm64) docker_platform=linux/arm64 ;; esac
          distribution=$(docker run --rm --platform "$docker_platform" --entrypoint sh pg-binaries-pgcron-verifier -c '. /etc/os-release; printf "%s" "$NAME"')
          distribution_version=$(docker run --rm --platform "$docker_platform" --entrypoint sh pg-binaries-pgcron-verifier -c '. /etc/os-release; printf "%s" "$VERSION_ID"')
          python3 tools/create_extension_publication_receipt.py \
            --archives "$RUNNER_TEMP/pg_cron" --core-archives "$RUNNER_TEMP/core/pilot" \
            --receipt "$RUNNER_TEMP/pgcron-publication/current-receipt.json" \
            --profile-id "pgcron-publication-linux-$PG_ARCHITECTURE-$PG_VERSION" \
            --project pg_cron --version 1.6.8 --postgresql-version "$PG_VERSION" \
            --architecture "$PG_ARCHITECTURE" --endpoint current \
            --kernel-release "$(uname -r)" --distribution "$distribution" \
            --distribution-version "$distribution_version" --image-id "$image" \
            --dependency-check-result "$dependencies" --clean-system "$clean" \
            --step-results "$RUNNER_TEMP/pgcron-publication/current-steps.json"
          python3 tools/emit_extension_publication_records.py \
            --archives "$RUNNER_TEMP/pg_cron" --core-archives "$RUNNER_TEMP/core/pilot" \
            --receipt "$RUNNER_TEMP/pgcron-publication/current-receipt.json" \
            --output "$RUNNER_TEMP/pgcron-publication/records"
          echo 'has_receipt=true' >> "$GITHUB_OUTPUT"
      - name: Import and validate exact publication evidence
        id: import
        if: always() && steps.receipt.outcome == 'success' && steps.receipt.outputs.has_receipt == 'true'
        continue-on-error: true
        run: |
          python3 tools/import_linux_pgcron_publication.py \
            --core-artifact "$RUNNER_TEMP/core" --pgcron-artifact "$RUNNER_TEMP" \
            --run-id "$GITHUB_RUN_ID" --architecture "$PG_ARCHITECTURE" --postgresql-version "$PG_VERSION"
      - name: Upload exact archives, provenance and outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgcron-linux-selected-${{ needs.select.outputs.postgresql_version }}-${{ needs.select.outputs.architecture }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/core/pilot/*.tar.gz
            ${{ runner.temp }}/core/pilot/*.sha256
            ${{ runner.temp }}/core/pilot/core-resolution.json
            ${{ runner.temp }}/pg_cron/*.tar.gz
            ${{ runner.temp }}/pg_cron/*.sha256
            ${{ runner.temp }}/pg_cron/*.txt
            ${{ runner.temp }}/pg_cron/*.json
            ${{ runner.temp }}/pg_cron/static-analysis/**
            ${{ runner.temp }}/pgcron-publication/**
            support/evidence/pgcron-publication-${{ github.run_id }}/${{ needs.select.outputs.architecture }}/${{ needs.select.outputs.postgresql_version }}/**
            support/verification/pg_cron-1.6.8-postgresql-${{ needs.select.outputs.postgresql_version }}-linux-${{ needs.select.outputs.architecture }}-current-${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 7
      - name: Require build, provenance, verification and import to pass
        if: always()
        env:
          CORE_RESOLUTION: ${{ needs.build.outputs.core_resolution }}
          EXTENSION_BUILD: ${{ needs.build.outputs.extension_build }}
          CORE_DOWNLOAD: ${{ steps.download_core.outcome }}
          EXTENSION_DOWNLOAD: ${{ steps.download_extension.outcome }}
          CORE_VALIDATION: ${{ steps.core_validation.outcome }}
          VERIFICATION: ${{ steps.verification.outcome }}
          RECEIPT: ${{ steps.receipt.outcome }}
          IMPORT: ${{ steps.import.outcome }}
        run: |
          set -euo pipefail
          for result in "$CORE_RESOLUTION" "$EXTENSION_BUILD" "$CORE_DOWNLOAD" "$EXTENSION_DOWNLOAD" "$CORE_VALIDATION" "$VERIFICATION" "$RECEIPT" "$IMPORT"; do
            if [[ "$result" != success ]]; then
              echo "Selected pg_cron Linux publication did not pass: $CORE_RESOLUTION/$EXTENSION_BUILD/$CORE_DOWNLOAD/$EXTENSION_DOWNLOAD/$CORE_VALIDATION/$VERIFICATION/$RECEIPT/$IMPORT" >&2
              exit 1
            fi
          done
