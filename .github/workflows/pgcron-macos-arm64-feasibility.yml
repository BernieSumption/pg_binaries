name: pg_cron macOS arm64 feasibility

on:
  workflow_dispatch:
  push:
    branches: [spike]
    paths:
      - '.github/workflows/pgcron-macos-arm64-feasibility.yml'
      - 'scripts/pg_cron/macos-feasibility.sh'
      - 'scripts/macos/static_analysis.py'
      - 'tests/test_pgcron_macos_feasibility.py'

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check pg_cron macOS feasibility workflow invariants
        run: python3 -m unittest tests/test_pgcron_macos_feasibility.py
      - name: Download PostgreSQL 18.6 Apple Silicon artifact from run 39079982683
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-pilot-archives
          run-id: 39079982683
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/core-archives
      - name: Build and test pg_cron from unmodified upstream source
        run: bash scripts/pg_cron/macos-feasibility.sh "$RUNNER_TEMP/core-archives" "$RUNNER_TEMP/pgcron-macos-feasibility"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pgcron-macos-arm64-feasibility-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pgcron-macos-feasibility/*.tar.gz
            ${{ runner.temp }}/pgcron-macos-feasibility/*.sha256
            ${{ runner.temp }}/pgcron-macos-feasibility/*.json
            ${{ runner.temp }}/pgcron-macos-feasibility/*.txt
          if-no-files-found: warn
          retention-days: 7
