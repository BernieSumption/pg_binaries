name: Collection selected PostgreSQL Linux publication

on:
  workflow_call:
    inputs:
      postgresql_version:
        description: Exact selected PostgreSQL release
        required: true
        type: string
      architecture:
        description: Exact selected Linux architecture
        required: true
        type: string
      extension_version:
        description: Exact selected Collection release
        required: true
        type: string
  workflow_dispatch:
    inputs:
      postgresql_version:
        description: Exact selected PostgreSQL release
        required: true
        type: string
      architecture:
        description: Exact selected Linux architecture
        required: true
        type: string
      extension_version:
        description: Exact selected Collection release
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      postgresql_version: ${{ steps.plan.outputs.postgresql_version }}
      extension_version: ${{ steps.plan.outputs.selected_version }}
      architecture: ${{ steps.plan.outputs.architecture }}
    steps:
      - uses: actions/checkout@v4
      - name: Plan the exact selected Collection target
        id: plan
        env:
          POSTGRESQL_VERSION: ${{ inputs.postgresql_version }}
          EXTENSION_VERSION: ${{ inputs.extension_version }}
          REQUESTED_ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          set -euo pipefail
          test -n "$POSTGRESQL_VERSION"
          test -n "$REQUESTED_ARCHITECTURE"
          test -n "$EXTENSION_VERSION"
          case "$REQUESTED_ARCHITECTURE" in x86_64|arm64) ;; *) echo "Unsupported Linux architecture: $REQUESTED_ARCHITECTURE" >&2; exit 2 ;; esac
          python3 tools/extension_archive_plan.py \
            --project collection --platform "linux-$REQUESTED_ARCHITECTURE" \
            --postgresql-version "$POSTGRESQL_VERSION" --extension-version "$EXTENSION_VERSION" \
            --github-output "$GITHUB_OUTPUT" > "$RUNNER_TEMP/selection.json"
          selected_version=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["selected_version"])' "$RUNNER_TEMP/selection.json")
          case "$selected_version" in
            1.1.1|2.1.3) ;;
            *) echo "The selected Collection release is $selected_version; the Linux recipe supports only 1.1.1 and 2.1.3." >&2; exit 1 ;;
          esac
          echo "architecture=$REQUESTED_ARCHITECTURE" >> "$GITHUB_OUTPUT"

  build:
    needs: select
    runs-on: ${{ needs.select.outputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    outputs:
      core_resolution: ${{ steps.core_resolution.outcome }}
      extension_build: ${{ steps.extension_build.outcome }}
    env:
      PG_VERSION: ${{ needs.select.outputs.postgresql_version }}
      PG_ARCHITECTURE: ${{ needs.select.outputs.architecture }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve a checked PostgreSQL core or build the selected release
        id: core_resolution
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          sources=()
          if [[ "$CALLER_WORKFLOW_REF" == */.github/workflows/selected-extension-publication.yml@* ]]; then
            sources+=(
              selected-extension-publication.yml "pgcron-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
              selected-extension-publication.yml "pgivm-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
              selected-extension-publication.yml "pgaudit-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
              selected-extension-publication.yml "pgtap-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
              selected-extension-publication.yml "pg-jsonschema-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
              selected-extension-publication.yml "postgis-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
            )
          fi
          sources+=(
            linux-changed-profiles.yml "pgcron-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
            linux-changed-profiles.yml "pgivm-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
            linux-changed-profiles.yml "pgaudit-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
            linux-changed-profiles.yml "pgtap-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
            linux-changed-profiles.yml "pg-jsonschema-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
            linux-changed-profiles.yml "postgis-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
            pgcron-linux-selected-publication.yml "pgcron-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
            pgivm-linux-selected-publication.yml "pgivm-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
            pgaudit-linux-selected-publication.yml "pgaudit-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
            pgtap-linux-selected-publication.yml "pgtap-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
            pg-jsonschema-linux-selected-publication.yml "pg-jsonschema-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
            postgis-linux-selected-publication.yml "postgis-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
            collection-linux-selected-publication.yml "collection-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
            linux-publication.yml "linux-publication-$PG_ARCHITECTURE-evidence"
          )
          scripts/linux/resolve-core.sh "$PG_VERSION" "$PG_ARCHITECTURE" "$RUNNER_TEMP/core/pilot" "${sources[@]}"
      - name: Build the selected checksum-pinned Collection archive against that core
        id: extension_build
        if: always() && steps.core_resolution.outcome == 'success'
        continue-on-error: true
        env:
          COLLECTION_VERSION: ${{ needs.select.outputs.extension_version }}
        run: bash scripts/collection/build.sh "$RUNNER_TEMP/core/pilot" "$RUNNER_TEMP/collection"
      - name: Upload selected Collection archive and build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-linux-built-${{ needs.select.outputs.extension_version }}-${{ needs.select.outputs.postgresql_version }}-${{ needs.select.outputs.architecture }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/collection/*.tar.gz
            ${{ runner.temp }}/collection/*.sha256
            ${{ runner.temp }}/collection/*.txt
            ${{ runner.temp }}/collection/*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload exact resolved PostgreSQL core and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-linux-core-${{ needs.select.outputs.postgresql_version }}-${{ needs.select.outputs.architecture }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/core/pilot/*.tar.gz
            ${{ runner.temp }}/core/pilot/*.sha256
            ${{ runner.temp }}/core/pilot/core-resolution.json
          if-no-files-found: warn
          retention-days: 7

  verify:
    needs: [select, build]
    if: always() && needs.select.result == 'success' && needs.build.result == 'success'
    runs-on: ${{ needs.select.outputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 75
    env:
      PG_VERSION: ${{ needs.select.outputs.postgresql_version }}
      PG_ARCHITECTURE: ${{ needs.select.outputs.architecture }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download selected Collection archive
        id: download_extension
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: collection-linux-built-${{ needs.select.outputs.extension_version }}-${{ needs.select.outputs.postgresql_version }}-${{ needs.select.outputs.architecture }}-${{ github.run_id }}
          path: ${{ runner.temp }}/collection
      - name: Download exact resolved PostgreSQL core archive
        id: download_core
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: collection-linux-core-${{ needs.select.outputs.postgresql_version }}-${{ needs.select.outputs.architecture }}-${{ github.run_id }}
          path: ${{ runner.temp }}/core/pilot
      - name: Validate transferred core identity and provenance
        id: core_validation
        if: always() && steps.download_core.outcome == 'success'
        continue-on-error: true
        run: |
          python3 tools/linux_core_resolution.py \
            --validate-record "$RUNNER_TEMP/core/pilot/core-resolution.json" \
            --archive "$RUNNER_TEMP/core/pilot/postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz" \
            --postgresql-version "$PG_VERSION" --architecture "$PG_ARCHITECTURE"
      - name: Verify the selected relocated Collection archive on a fresh runner
        id: verification
        if: always() && steps.download_extension.outcome == 'success' && steps.download_core.outcome == 'success' && steps.core_validation.outcome == 'success'
        continue-on-error: true
        env:
          COLLECTION_VERSION: ${{ needs.select.outputs.extension_version }}
        run: bash scripts/collection/verify.sh "$RUNNER_TEMP/core/pilot" "$RUNNER_TEMP/collection"
      - name: Record Collection publication outcomes and create receipts
        id: evidence
        if: always()
        continue-on-error: true
        env:
          CORE_BUILD_OUTCOME: ${{ needs.build.outputs.core_resolution }}
          COLLECTION_BUILD_OUTCOME: ${{ needs.build.outputs.extension_build }}
          COLLECTION_VERIFY_OUTCOME: ${{ steps.verification.outcome }}
          COLLECTION_VERSION: ${{ needs.select.outputs.extension_version }}
        run: |
          set -euo pipefail
          publication="$RUNNER_TEMP/collection-publication"
          mkdir -p "$publication"
          image=$(docker image inspect --format '{{.Id}}' pg-binaries-collection-verifier 2>/dev/null || true)
          if [[ ! "$image" =~ ^sha256:[0-9a-f]{64}$ ]]; then image=unknown; fi
          IMAGE_ID="$image" python3 - "$publication/attempt.json" "$publication/current-steps.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          core, build, verify = (os.environ[key] for key in (
              "CORE_BUILD_OUTCOME", "COLLECTION_BUILD_OUTCOME", "COLLECTION_VERIFY_OUTCOME"))
          image = os.environ["IMAGE_ID"]
          suite = "failure" if "failure" in (build, verify) or (
              build == verify == "success" and image == "unknown") else (
              "success" if build == verify == "success" else "skipped")
          attempt = {
              "schema_version": 1, "run_id": os.environ["GITHUB_RUN_ID"],
              "source_revision": os.environ["GITHUB_SHA"], "postgresql_version": os.environ["PG_VERSION"],
              "collection_versions": [os.environ["COLLECTION_VERSION"]],
              "source_sha256": {
                  os.environ["COLLECTION_VERSION"]: {
                      "1.1.1": "ab99a969334442e4a3c77405bc9ffed0083595d18f3898d64a731353a32bec5e",
                      "2.1.3": "a6b07864e5893d3b682bb3223fd6d33015709765c9d40d415c85112358f0e3e4",
                  }[os.environ["COLLECTION_VERSION"]]},
              "architecture": os.environ["PG_ARCHITECTURE"], "verifier_image_id": image,
              "steps": {"core_build": core, "collection_build": build, "collection_verify": verify},
          }
          Path(sys.argv[1]).write_text(json.dumps(attempt, indent=2, sort_keys=True) + "\n")
          Path(sys.argv[2]).write_text(json.dumps({"collection-archive-suite": suite}, sort_keys=True) + "\n")
          PY
          core="$RUNNER_TEMP/core/pilot/postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz"
          suite=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["collection-archive-suite"])' "$publication/current-steps.json")
          receipts=0
          for version in "$COLLECTION_VERSION"; do
            extension="$RUNNER_TEMP/collection/collection-${version}-postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz"
            if [[ ! -f "$core" || ! -f "$core.sha256" || ! -f "$extension" || ! -f "$extension.sha256" ]]; then
              echo "Collection $version receipt skipped: archive bytes or sidecars are unavailable"
              continue
            fi
            if [[ "$image" == unknown ]]; then
              echo "Collection $version receipt skipped: verifier image identity is unavailable"
              continue
            fi
            clean=false
            dependencies=failure
            if [[ "$suite" == success ]]; then clean=true; dependencies=success; fi
            case "$PG_ARCHITECTURE" in x86_64) docker_platform=linux/amd64 ;; arm64) docker_platform=linux/arm64 ;; esac
            distribution=$(docker run --rm --platform "$docker_platform" --entrypoint sh pg-binaries-collection-verifier -c '. /etc/os-release; printf "%s" "$NAME"')
            distribution_version=$(docker run --rm --platform "$docker_platform" --entrypoint sh pg-binaries-collection-verifier -c '. /etc/os-release; printf "%s" "$VERSION_ID"')
            python3 tools/create_extension_publication_receipt.py \
              --archives "$RUNNER_TEMP/collection" --core-archives "$RUNNER_TEMP/core/pilot" \
              --receipt "$publication/current-receipt-$version.json" \
              --profile-id "collection-publication-linux-$PG_ARCHITECTURE-$PG_VERSION-$version" \
              --project collection --version "$version" --postgresql-version "$PG_VERSION" \
              --architecture "$PG_ARCHITECTURE" --endpoint current \
              --kernel-release "$(uname -r)" --distribution "$distribution" \
              --distribution-version "$distribution_version" --image-id "$image" \
              --dependency-check-result "$dependencies" --clean-system "$clean" \
              --step-results "$publication/current-steps.json"
            python3 tools/emit_extension_publication_records.py \
              --archives "$RUNNER_TEMP/collection" --core-archives "$RUNNER_TEMP/core/pilot" \
              --receipt "$publication/current-receipt-$version.json" --output "$publication/records"
            receipts=$((receipts + 1))
          done
          echo "receipt_count=$receipts" >> "$GITHUB_OUTPUT"
      - name: Validate the selected Collection publication record
        id: record_validation
        if: always() && steps.evidence.outcome == 'success' && steps.evidence.outputs.receipt_count == '1'
        continue-on-error: true
        env:
          COLLECTION_VERSION: ${{ needs.select.outputs.extension_version }}
        run: |
          python3 - "$RUNNER_TEMP/collection-publication/records" "$PG_VERSION" "$PG_ARCHITECTURE" "$GITHUB_RUN_ID" "$COLLECTION_VERSION" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          import coverage
          records, pg, arch, run_id, version = sys.argv[1:]
          support = coverage.load_json(Path("support.json"))
          profile = coverage.verification_profile(Path("."), f"collection-publication-linux-{arch}-{pg}-{version}")
          expected = f"collection-{version}-postgresql-{pg}-linux-{arch}-current-{run_id}.json"
          paths = list(Path(records).glob("*.json"))
          if [path.name for path in paths] != [expected]:
              raise SystemExit("receipt must emit exactly the selected Collection record")
          record = coverage.load_json(paths[0])
          coverage.validate_verification_record(record, support, Path("."))
          if record.get("version") != version or record.get("profile_id") != profile["profile_id"]:
              raise SystemExit("Collection record does not match the selected version and profile")
          PY
      - name: Import checked selected Collection evidence
        id: import_evidence
        if: always() && steps.evidence.outcome == 'success' && steps.evidence.outputs.receipt_count == '1' && steps.record_validation.outcome == 'success'
        continue-on-error: true
        env:
          COLLECTION_VERSION: ${{ needs.select.outputs.extension_version }}
        run: |
          python3 tools/import_linux_collection_publication.py \
            --core-artifact "$RUNNER_TEMP/core" \
            --collection-artifact "$RUNNER_TEMP" \
            --run-id "$GITHUB_RUN_ID" --architecture "$PG_ARCHITECTURE" \
            --postgresql-version "$PG_VERSION" --selected-version "$COLLECTION_VERSION"
      - name: Upload exact archives, provenance and outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-linux-selected-${{ needs.select.outputs.extension_version }}-${{ needs.select.outputs.postgresql_version }}-${{ needs.select.outputs.architecture }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/core/pilot/*.tar.gz
            ${{ runner.temp }}/core/pilot/*.sha256
            ${{ runner.temp }}/core/pilot/core-resolution.json
            ${{ runner.temp }}/collection/*.tar.gz
            ${{ runner.temp }}/collection/*.sha256
            ${{ runner.temp }}/collection/*.txt
            ${{ runner.temp }}/collection/*.json
            ${{ runner.temp }}/collection/static-analysis/**
            ${{ runner.temp }}/collection-publication/**
            support/evidence/collection-publication-${{ github.run_id }}/${{ needs.select.outputs.architecture }}/${{ needs.select.outputs.postgresql_version }}/${{ needs.select.outputs.extension_version }}/**
            support/verification/collection-${{ needs.select.outputs.extension_version }}-postgresql-${{ needs.select.outputs.postgresql_version }}-linux-${{ needs.select.outputs.architecture }}-current-${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 7
      - name: Require build, provenance, verification, receipt and record validation to pass
        if: always()
        env:
          CORE_RESOLUTION: ${{ needs.build.outputs.core_resolution }}
          EXTENSION_BUILD: ${{ needs.build.outputs.extension_build }}
          CORE_DOWNLOAD: ${{ steps.download_core.outcome }}
          EXTENSION_DOWNLOAD: ${{ steps.download_extension.outcome }}
          CORE_VALIDATION: ${{ steps.core_validation.outcome }}
          VERIFICATION: ${{ steps.verification.outcome }}
          EVIDENCE: ${{ steps.evidence.outcome }}
          RECORD_VALIDATION: ${{ steps.record_validation.outcome }}
          IMPORT_EVIDENCE: ${{ steps.import_evidence.outcome }}
          RECEIPT_COUNT: ${{ steps.evidence.outputs.receipt_count }}
        run: |
          set -euo pipefail
          for result in "$CORE_RESOLUTION" "$EXTENSION_BUILD" "$CORE_DOWNLOAD" "$EXTENSION_DOWNLOAD" "$CORE_VALIDATION" "$VERIFICATION" "$EVIDENCE" "$RECORD_VALIDATION" "$IMPORT_EVIDENCE"; do
            if [[ "$result" != success ]]; then
              echo "Selected Collection Linux publication did not pass: $CORE_RESOLUTION/$EXTENSION_BUILD/$CORE_DOWNLOAD/$EXTENSION_DOWNLOAD/$CORE_VALIDATION/$VERIFICATION/$EVIDENCE/$RECORD_VALIDATION/$IMPORT_EVIDENCE" >&2
              exit 1
            fi
          done
          test "$RECEIPT_COUNT" = 1
