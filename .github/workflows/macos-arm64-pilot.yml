name: Apple Silicon macOS PostgreSQL pilot

on:
  workflow_dispatch:
    inputs:
      postgresql_version:
        description: A missing supported PostgreSQL version; leave blank to select the next one
        required: false
        type: string
      dependency_floor_probe:
        description: Build dependencies for the macOS 11 floor without packaging PostgreSQL
        required: false
        type: boolean
  push:
    branches: [spike]
    paths:
      - scripts/macos/**
      - support.json
      - support/postgresql-releases.json
      - inventory.json
      - support/verification-profiles.json
      - tools/plan_work.py
      - tools/source_archive.py
      - tools/check_source_identity.py
      - tools/coverage.py
      - tools/discover_builtins.py
      - tools/create_macos_symbols.py
      - tools/check_macos_license_inventory.py
      - tools/emit_macos_pilot_records.py
      - tests/schema.sql
      - tests/builtins/**
      - tests/extensions/**
      - tests/test_emit_macos_pilot_records.py
      - tests/test_macos_static_analysis.py
      - tests/test_create_macos_symbols.py
      - tests/test_macos_license_inventory.py
      - .github/workflows/macos-arm64-pilot.yml

permissions:
  contents: read

concurrency:
  group: macos-arm64-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ inputs.dependency_floor_probe != true }}
    outputs:
      postgresql_version: ${{ steps.select.outputs.postgresql_version }}
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Select supported macOS build version
        id: select
        env:
          PG_VERSION_INPUT: ${{ inputs.postgresql_version }}
        run: |
          if [[ -n "$PG_VERSION_INPUT" ]]; then
            selection=(--select-pilot "$PG_VERSION_INPUT")
          else
            selection=(--select-next-pilot)
          fi
          python3 tools/plan_work.py "${selection[@]}" --platform macos-arm64 > "$RUNNER_TEMP/selection.json"
          version=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["postgresql_version"])' "$RUNNER_TEMP/selection.json")
          echo "postgresql_version=$version" >> "$GITHUB_OUTPUT"
      - name: Check macOS symbol-index helper
        run: python3 -m unittest tests/test_create_macos_symbols.py
      - name: Build and package PostgreSQL and pgvector
        run: bash scripts/macos/build.sh "$RUNNER_TEMP/archives" arm64 "${{ steps.select.outputs.postgresql_version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-pilot-archives
          path: |
            ${{ runner.temp }}/archives/*.tar.gz
            ${{ runner.temp }}/archives/*.sha256
            ${{ runner.temp }}/archives/debug-symbols/**
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: build
    if: ${{ inputs.dependency_floor_probe != true }}
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64-pilot-archives
          path: ${{ runner.temp }}/archives
      - name: Check downloaded archives on a fresh Apple Silicon runner
        id: archive_verify
        env:
          MACOS_STATIC_ANALYSIS_REPORT: ${{ runner.temp }}/verification-records/static-analysis.json
        run: bash scripts/macos/verify.sh "$RUNNER_TEMP/archives" arm64 "${{ needs.build.outputs.postgresql_version }}"
      - name: Verify symbols against downloaded archive bytes
        id: symbols
        run: |
          python3 tools/create_macos_symbols.py \
            "$RUNNER_TEMP/archives/postgresql-${{ needs.build.outputs.postgresql_version }}-macos-arm64.tar.gz" \
            "$RUNNER_TEMP/archives/pgvector-0.8.7-postgresql-${{ needs.build.outputs.postgresql_version }}-macos-arm64.tar.gz" \
            --output-dir "$RUNNER_TEMP/archives/debug-symbols" --verify-only
      - name: Verify representative macOS failure diagnostics
        id: diagnostics
        run: bash scripts/macos/diagnostics.sh "$RUNNER_TEMP/archives" arm64 "${{ needs.build.outputs.postgresql_version }}" 0.8.7 "$RUNNER_TEMP/verification-records/diagnostics.json"
      - name: Check macOS record emitters
        if: ${{ always() }}
        run: python3 -m unittest tests/test_emit_macos_pilot_records.py tests/test_emit_macos_publication_records.py
      - name: Finalize current-OS pilot verification records
        if: ${{ always() }}
        env:
          GITHUB_SHA: ${{ github.sha }}
          CHECK_OUTCOMES: ${{ steps.archive_verify.outcome }},${{ steps.symbols.outcome }},${{ steps.diagnostics.outcome }}
          DEPENDENCY_CHECKS_PASSED: ${{ steps.archive_verify.outcome == 'success' }}
        run: |
          image_id="${ImageOS:?runner image OS missing}/${ImageVersion:?runner image version missing}"
          archive_dir="$RUNNER_TEMP/archives"
          pg_archive="$archive_dir/postgresql-${{ needs.build.outputs.postgresql_version }}-macos-arm64.tar.gz"
          vector_archive="$archive_dir/pgvector-0.8.7-postgresql-${{ needs.build.outputs.postgresql_version }}-macos-arm64.tar.gz"
          if [[ ! -f "$pg_archive" || ! -f "$pg_archive.sha256" || ! -f "$vector_archive" || ! -f "$vector_archive.sha256" ]]; then
            echo "No current-OS verification record: archive bytes or checksum sidecars are unavailable"
            exit 0
          fi
          outcome=$(python3 -c 'import os; s=os.environ["CHECK_OUTCOMES"].split(","); print("failed" if "failure" in s else "passed" if all(x == "success" for x in s) else "skipped")')
          python3 tools/emit_macos_pilot_records.py \
            --archives "$archive_dir" \
            --output "$RUNNER_TEMP/verification-records" \
            --postgresql-version "${{ needs.build.outputs.postgresql_version }}" \
            --os-version "$(sw_vers -productVersion)" \
            --architecture "$(uname -m)" \
            --image-id "$image_id" \
            --outcome "$outcome" \
            --dependency-checks-passed "$DEPENDENCY_CHECKS_PASSED" \
            --static-report "$RUNNER_TEMP/verification-records/static-analysis.json"
      - name: Finalize archive-bound macOS publication case records
        if: ${{ always() }}
        env:
          ARCHIVE_SUITE_OUTCOME: ${{ steps.archive_verify.outcome }}
          SYMBOLS_OUTCOME: ${{ steps.symbols.outcome }}
          DIAGNOSTICS_OUTCOME: ${{ steps.diagnostics.outcome }}
        run: |
          record_dir="$RUNNER_TEMP/verification-records"
          mkdir -p "$record_dir"
          python3 - "$record_dir/publication-attempt.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(json.dumps({
              "run_id": os.environ["GITHUB_RUN_ID"],
              "source_revision": os.environ["GITHUB_SHA"],
              "steps": {name: os.environ[key] for name, key in (
                  ("archive-suite", "ARCHIVE_SUITE_OUTCOME"),
                  ("symbols", "SYMBOLS_OUTCOME"),
                  ("diagnostics", "DIAGNOSTICS_OUTCOME"))},
          }, indent=2, sort_keys=True) + "\n")
          PY
          archive_dir="$RUNNER_TEMP/archives"
          version="${{ needs.build.outputs.postgresql_version }}"
          if [[ ! -f "$archive_dir/postgresql-$version-macos-arm64.tar.gz" || ! -f "$archive_dir/pgvector-0.8.7-postgresql-$version-macos-arm64.tar.gz" ]]; then
            echo 'No archive-bound publication record: final archive bytes are unavailable'
            exit 0
          fi
          image_id="${ImageOS:?runner image OS missing}/${ImageVersion:?runner image version missing}"
          python3 tools/emit_macos_publication_records.py \
            --archives "$archive_dir" --output "$record_dir/publication" \
            --postgresql-version "$version" --os-version "$(sw_vers -productVersion)" \
            --architecture arm64 --image-id "$image_id" \
            --archive-suite-result "$ARCHIVE_SUITE_OUTCOME" \
            --symbols-result "$SYMBOLS_OUTCOME" --diagnostics-result "$DIAGNOSTICS_OUTCOME" \
            --static-report "$record_dir/static-analysis.json" \
            --diagnostic-report "$record_dir/diagnostics.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: macos-arm64-pilot-verification-records
          path: |
            ${{ runner.temp }}/verification-records/*.json
            ${{ runner.temp }}/verification-records/publication/*.json
          if-no-files-found: warn
          retention-days: 7

  dependency_floor_probe:
    if: ${{ inputs.dependency_floor_probe == true }}
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: bf19794383e8fb95eba5aa553235bc8ec2271688
          path: vcpkg
      - name: Build dependencies for macOS 11
        run: |
          mkdir -p "$RUNNER_TEMP/triplets" "$RUNNER_TEMP/results"
          cat > "$RUNNER_TEMP/triplets/arm64-macos11.cmake" <<'EOF'
          set(VCPKG_TARGET_ARCHITECTURE arm64)
          set(VCPKG_CRT_LINKAGE dynamic)
          set(VCPKG_LIBRARY_LINKAGE dynamic)
          set(VCPKG_CMAKE_SYSTEM_NAME Darwin)
          set(VCPKG_OSX_DEPLOYMENT_TARGET "11.0")
          EOF
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          VCPKG_BINARY_SOURCES=clear ./vcpkg/vcpkg install \
            icu openssl lz4 zstd 'libxml2[icu]' libxslt \
            --triplet=arm64-macos11 --overlay-triplets="$RUNNER_TEMP/triplets" \
            --x-install-root="$RUNNER_TEMP/installed"
      - name: Inspect compiled library targets
        if: ${{ always() }}
        run: |
          python3 - "$RUNNER_TEMP/installed/arm64-macos11" "$RUNNER_TEMP/results/floors.json" <<'PY'
          import json, pathlib, re, subprocess, sys
          root, output = map(pathlib.Path, sys.argv[1:])
          entries = []
          for path in sorted(root.rglob('*.dylib')):
              result = subprocess.run(['otool', '-l', str(path)], capture_output=True, text=True)
              if result.returncode:
                  continue
              versions = re.findall(r'^\s*minos (\d+(?:\.\d+)+)', result.stdout, re.MULTILINE)
              if not versions:
                  versions = re.findall(r'^\s*version (\d+(?:\.\d+)+)', result.stdout, re.MULTILINE)
              entries.append({'file': str(path.relative_to(root)), 'minimum_os': versions})
          output.write_text(json.dumps(entries, indent=2) + '\n')
          print(f'Inspected {len(entries)} dylibs')
          for entry in entries:
              if not entry['minimum_os'] or any(tuple(map(int, v.split('.'))) > (11, 0) for v in entry['minimum_os']):
                  print(entry)
          if not entries or any(not entry['minimum_os'] or any(tuple(map(int, v.split('.'))) > (11, 0) for v in entry['minimum_os']) for entry in entries):
              raise SystemExit('One or more dependency libraries do not target macOS 11.0')
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: macos-dependency-floor-results
          path: ${{ runner.temp }}/results/*.json
          if-no-files-found: warn
          retention-days: 3
