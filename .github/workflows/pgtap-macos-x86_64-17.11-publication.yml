name: pgTAP macOS x86-64 publication

on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read

jobs:
  profile_scope:
    uses: ./.github/workflows/profile-change-scope.yml
    with:
      profile_id: pgtap-publication-macos-x86_64-17.11

  verify:
    needs: profile_scope
    if: needs.profile_scope.outputs.should_run == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check Intel pgTAP publication evidence helpers
        run: python3 -m unittest tests/test_pgtap_macos_publication.py
      - name: Download the successful PostgreSQL 17.11 Intel artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-pilot-archives
          run-id: 39093802542
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/core-archives
      - name: Prepare the exact core archive for publication
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pgTAP-publication"
          cp "$RUNNER_TEMP/core-archives/postgresql-17.11-macos-x86_64.tar.gz"* "$RUNNER_TEMP/pgTAP-publication/"
      - name: Build, relocate, and exercise pgTAP
        id: archive_suite
        run: |
          set -o pipefail
          bash scripts/pgtap/macos-feasibility.sh "$RUNNER_TEMP/core-archives" "$RUNNER_TEMP/pgTAP-publication" "tools/pgtap_macos_pins/17.11-x86_64.json" 2>&1 | tee "$RUNNER_TEMP/pgTAP-publication/build-log.txt"
      - name: Validate static analysis against the final archive bytes
        id: static_analysis
        run: |
          python3 - "$RUNNER_TEMP/pgTAP-publication/static-analysis.json" "$RUNNER_TEMP/pgTAP-publication/postgresql-17.11-macos-x86_64.tar.gz" "$RUNNER_TEMP/pgTAP-publication/pgtap-1.3.4-postgresql-17.11-macos-x86_64.tar.gz" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          report_path, *archives = map(pathlib.Path, sys.argv[1:])
          report = json.loads(report_path.read_text())
          expected = {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in archives}
          actual = report.get("archives", [])
          if isinstance(actual, list):
              actual = {item["basename"]: item["sha256"] for item in actual}
          if report.get("passed") is not True or not report.get("inspected_files") or actual != expected:
              raise SystemExit("static analysis did not pass against the final archive bytes")
          PY
      - name: Finalize pgTAP Intel archive receipt and verification record
        if: always()
        env:
          ARCHIVE_SUITE_OUTCOME: ${{ steps.archive_suite.outcome }}
          STATIC_ANALYSIS_OUTCOME: ${{ steps.static_analysis.outcome }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          image_id="${ImageOS:?runner image OS missing}/${ImageVersion:?runner image version missing}"
          os_version="$(sw_vers -productVersion)"
          python3 tools/emit_pgtap_macos_publication.py \
            --target-config "tools/pgtap_macos_pins/17.11-x86_64.json" \
            --core-archives "$RUNNER_TEMP/core-archives" \
            --archives "$RUNNER_TEMP/pgTAP-publication" \
            --output "$RUNNER_TEMP/pgTAP-publication" \
            --os-version "$os_version" --image-id "$image_id" \
            --archive-suite-result "$ARCHIVE_SUITE_OUTCOME" \
            --static-analysis-result "$STATIC_ANALYSIS_OUTCOME"
      - name: Validate and retain archive-bound publication evidence
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/pgTAP-publication/publication/attempt.json" ]]; then
            python3 tools/import_pgtap_macos_publication.py \
              --target-config "tools/pgtap_macos_pins/17.11-x86_64.json" \
              --core-artifact "$RUNNER_TEMP/core-archives" \
              --pgtap-artifact "$RUNNER_TEMP/pgTAP-publication" \
              --run-id "$GITHUB_RUN_ID"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pgtap-macos-x86_64-17.11-publication-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pgTAP-publication/*.tar.gz
            ${{ runner.temp }}/pgTAP-publication/*.sha256
            ${{ runner.temp }}/pgTAP-publication/*.json
            ${{ runner.temp }}/pgTAP-publication/*.txt
            ${{ runner.temp }}/pgTAP-publication/publication/**
            support/evidence/pgtap-macos-publication-${{ github.run_id }}/x86_64/**
            support/verification/pgtap-1.3.4-postgresql-17.11-macos-x86_64-current-${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 7
