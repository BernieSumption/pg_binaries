name: pg_cron Windows selected feasibility

on:
  push:
    branches: [spike]
    paths:
      - .github/workflows/pgcron-windows-feasibility.yml
      - scripts/pg_cron/windows-build.ps1
      - scripts/pg_cron/verify-windows.ps1
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      BUILD_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve checked PostgreSQL 18.6 core
        id: core
        run: |
          $identity = python tools/windows_core_pin.py --postgresql-version 18.6 --github-output
          if ($LASTEXITCODE -ne 0) { throw 'Checked PostgreSQL core pin is invalid.' }
          $identity | Add-Content $env:GITHUB_OUTPUT
      - name: Download core archive and matching symbols
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $producer = Join-Path $env:RUNNER_TEMP 'core-producer'
          New-Item -ItemType Directory -Force $producer,dist/windows | Out-Null
          gh run download '${{ steps.core.outputs.run_id }}' --repo $env:GITHUB_REPOSITORY --name '${{ steps.core.outputs.artifact_name }}' --dir $producer
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the checked core artifact.' }
          $name = '${{ steps.core.outputs.archive_name }}'
          Copy-Item (Join-Path $producer $name) (Join-Path 'dist/windows' $name)
          Copy-Item (Join-Path $producer "$name.sha256") (Join-Path 'dist/windows' "$name.sha256")
          python tools/stage_windows_core_symbols.py $producer (Join-Path $env:RUNNER_TEMP 'core-symbols') $name
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage matching core symbols.' }
      - name: Build unmodified pg_cron 1.6.8 against checked core
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'pg_cron-1.6.8.tar.gz'
          Invoke-WebRequest -Uri 'https://github.com/citusdata/pg_cron/archive/refs/tags/v1.6.8.tar.gz' -OutFile $source
          ./scripts/pg_cron/windows-build.ps1 `
            -CoreArchive 'dist/windows/postgresql-18.6-windows-x86_64.tar.gz' `
            -CoreSha256 '${{ steps.core.outputs.sha256 }}' `
            -CoreSymbolsDirectory (Join-Path $env:RUNNER_TEMP 'core-symbols') `
            -SourceArchive $source -OutputDirectory dist/windows
          if ($LASTEXITCODE -ne 0) { throw 'Windows pg_cron source build failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: pgcron-windows-feasibility-${{ github.run_id }}
          path: |
            dist/windows/postgresql-18.6-windows-x86_64.tar.gz
            dist/windows/postgresql-18.6-windows-x86_64.tar.gz.sha256
            dist/windows/pg_cron-1.6.8-postgresql-18.6-windows-x86_64.tar.gz
            dist/windows/pg_cron-1.6.8-postgresql-18.6-windows-x86_64.tar.gz.sha256
            dist/windows/debug-symbols/**
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: pgcron-windows-feasibility-${{ github.run_id }}
          path: dist/windows
      - name: Match PDBs to the final archive bytes
        run: |
          python tools/create_windows_symbols.py 'dist/windows/postgresql-18.6-windows-x86_64.tar.gz' 'dist/windows/pg_cron-1.6.8-postgresql-18.6-windows-x86_64.tar.gz' --output-dir dist/windows/debug-symbols --verify-only
          if ($LASTEXITCODE -ne 0) { throw 'Final archive PDB validation failed.' }
      - name: Relocate archives and run pg_cron background-worker probe
        run: |
          ./scripts/pg_cron/verify-windows.ps1 `
            -CoreArchive 'dist/windows/postgresql-18.6-windows-x86_64.tar.gz' `
            -ExtensionArchive 'dist/windows/pg_cron-1.6.8-postgresql-18.6-windows-x86_64.tar.gz' `
            -ReportPath (Join-Path $env:RUNNER_TEMP 'pgcron-windows-static-analysis.json')
          if ($LASTEXITCODE -ne 0) { throw 'Relocated pg_cron verification failed.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pgcron-windows-feasibility-report-${{ github.run_id }}
          path: ${{ runner.temp }}/pgcron-windows-static-analysis.json
          if-no-files-found: warn
          retention-days: 7
