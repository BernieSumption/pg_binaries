name: pg_jsonschema 0.3.4 PostgreSQL 17.11 Linux candidate publication

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Linux architecture
        type: choice
        options: [x86_64, arm64]
        default: x86_64
        required: true
  push:
    branches: [spike]
    paths:
      - '.github/workflows/pg-jsonschema-linux-17.11-publication.yml'
      - 'scripts/pg_jsonschema/linux-*'
      - 'scripts/pg_jsonschema/linux-probe.sql'
      - 'tools/check_elf_dependencies.py'
      - 'tools/emit_pg_jsonschema_linux_publication.py'
      - 'tools/import_pg_jsonschema_linux_publication.py'
      - 'tools/inventory_cargo_licenses.py'
      - 'tests/test_pg_jsonschema_linux_publication.py'
      - 'support/verification-profiles.json'
      - 'support.json'
      - 'support/postgresql-releases.json'

permissions:
  actions: read
  contents: read

jobs:
  scope_x86_64:
    if: github.event_name != 'workflow_dispatch' || inputs.architecture == 'x86_64'
    uses: ./.github/workflows/profile-change-scope.yml
    with:
      profile_id: pg-jsonschema-publication-linux-x86_64-17.11

  scope_arm64:
    if: github.event_name != 'workflow_dispatch' || inputs.architecture == 'arm64'
    uses: ./.github/workflows/profile-change-scope.yml
    with:
      profile_id: pg-jsonschema-publication-linux-arm64-17.11

  publish_x86_64:
    needs: scope_x86_64
    if: needs.scope_x86_64.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PG_ARCHITECTURE: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate publication evidence tooling
        run: python -B -m unittest tests/test_pg_jsonschema_linux_publication.py
      - name: Download pinned PostgreSQL 17.11 core archive
        uses: actions/download-artifact@v4
        with:
          name: linux-publication-x86_64-evidence
          run-id: 39082111630
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/core
      - name: Build final archive from pinned upstream source
        id: build
        continue-on-error: true
        run: PG_VERSION=17.11 bash scripts/pg_jsonschema/linux-build.sh "$RUNNER_TEMP/core/pilot" "$RUNNER_TEMP/pg_jsonschema"
      - name: Run relocated Alpine SQL probe and inspect ELF closure
        id: verify
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: PG_VERSION=17.11 bash scripts/pg_jsonschema/linux-verify.sh "$RUNNER_TEMP/pg_jsonschema" 2>&1 | tee "$RUNNER_TEMP/pg_jsonschema/probe-output.txt"
      - name: Emit attempt and archive-bound verification record
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/pg_jsonschema/publication"
          python tools/emit_pg_jsonschema_linux_publication.py \
            --archives "$RUNNER_TEMP/pg_jsonschema" --core-archives "$RUNNER_TEMP/core/pilot" \
            --output "$RUNNER_TEMP/pg_jsonschema/publication" --architecture x86_64 --postgresql-version 17.11 \
            --build-result "${BUILD_RESULT:-skipped}" --verify-result "${VERIFY_RESULT:-skipped}" \
            --image-id "$(docker image inspect pg-binaries-pg-jsonschema-alpine-probe --format '{{.Id}}' 2>/dev/null || echo unavailable)" \
            --kernel-release "$(uname -r)"
      - name: Validate and retain Linux publication evidence
        if: always()
        run: python tools/import_pg_jsonschema_linux_publication.py --core-archives "$RUNNER_TEMP/core/pilot" --archives "$RUNNER_TEMP/pg_jsonschema" --run-id "$GITHUB_RUN_ID"
      - name: Upload candidate archive and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-jsonschema-0.3.4-postgresql-17.11-linux-x86_64-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pg_jsonschema/*.tar.gz
            ${{ runner.temp }}/pg_jsonschema/*.sha256
            ${{ runner.temp }}/pg_jsonschema/*.txt
            ${{ runner.temp }}/pg_jsonschema/*.json
            ${{ runner.temp }}/pg_jsonschema/static-analysis/**
            ${{ runner.temp }}/pg_jsonschema/publication/**
            support/evidence/pg_jsonschema-linux-publication-${{ github.run_id }}/**
          if-no-files-found: warn
          retention-days: 7
      - name: Require archive suite and ELF closure to pass
        if: always()
        run: test '${{ steps.verify.outcome }}' = success

  publish_arm64:
    needs: scope_arm64
    if: needs.scope_arm64.outputs.should_run == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      PG_ARCHITECTURE: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate publication evidence tooling
        run: python -B -m unittest tests/test_pg_jsonschema_linux_publication.py
      - name: Download pinned PostgreSQL 17.11 core archive
        uses: actions/download-artifact@v4
        with:
          name: linux-publication-arm64-evidence
          run-id: 39082111630
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/core
      - name: Build final archive from pinned upstream source
        id: build
        continue-on-error: true
        run: PG_VERSION=17.11 bash scripts/pg_jsonschema/linux-build.sh "$RUNNER_TEMP/core/pilot" "$RUNNER_TEMP/pg_jsonschema"
      - name: Run relocated Alpine SQL probe and inspect ELF closure
        id: verify
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: PG_VERSION=17.11 bash scripts/pg_jsonschema/linux-verify.sh "$RUNNER_TEMP/pg_jsonschema" 2>&1 | tee "$RUNNER_TEMP/pg_jsonschema/probe-output.txt"
      - name: Emit attempt and archive-bound verification record
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/pg_jsonschema/publication"
          python tools/emit_pg_jsonschema_linux_publication.py \
            --archives "$RUNNER_TEMP/pg_jsonschema" --core-archives "$RUNNER_TEMP/core/pilot" \
            --output "$RUNNER_TEMP/pg_jsonschema/publication" --architecture arm64 --postgresql-version 17.11 \
            --build-result "${BUILD_RESULT:-skipped}" --verify-result "${VERIFY_RESULT:-skipped}" \
            --image-id "$(docker image inspect pg-binaries-pg-jsonschema-alpine-probe --format '{{.Id}}' 2>/dev/null || echo unavailable)" \
            --kernel-release "$(uname -r)"
      - name: Validate and retain Linux publication evidence
        if: always()
        run: python tools/import_pg_jsonschema_linux_publication.py --core-archives "$RUNNER_TEMP/core/pilot" --archives "$RUNNER_TEMP/pg_jsonschema" --run-id "$GITHUB_RUN_ID"
      - name: Upload candidate archive and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-jsonschema-0.3.4-postgresql-17.11-linux-arm64-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pg_jsonschema/*.tar.gz
            ${{ runner.temp }}/pg_jsonschema/*.sha256
            ${{ runner.temp }}/pg_jsonschema/*.txt
            ${{ runner.temp }}/pg_jsonschema/*.json
            ${{ runner.temp }}/pg_jsonschema/static-analysis/**
            ${{ runner.temp }}/pg_jsonschema/publication/**
            support/evidence/pg_jsonschema-linux-publication-${{ github.run_id }}/**
          if-no-files-found: warn
          retention-days: 7
      - name: Require archive suite and ELF closure to pass
        if: always()
        run: test '${{ steps.verify.outcome }}' = success
