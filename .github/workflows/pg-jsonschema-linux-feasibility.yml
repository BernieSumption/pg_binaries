name: pg_jsonschema Linux feasibility
on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Linux architecture
        type: choice
        options: [x86_64, arm64]
        default: x86_64
        required: true
  push:
    branches: [spike]
    paths:
      - '.github/workflows/pg-jsonschema-linux-feasibility.yml'
      - 'scripts/pg_jsonschema/linux-*'
      - 'scripts/pg_jsonschema/probe.sql'
      - 'scripts/linux/**'
      - 'tools/check_elf_dependencies.py'
      - 'support.json'
      - 'support/postgresql-releases.json'
jobs:
  probe:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      PG_ARCHITECTURE: ${{ github.event_name == 'workflow_dispatch' && inputs.architecture || 'x86_64' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build PostgreSQL 18.6 Linux
        run: scripts/linux/build.sh "$RUNNER_TEMP/core"
      - name: Build pg_jsonschema 0.3.4 from pinned upstream source
        run: bash scripts/pg_jsonschema/linux-build.sh "$RUNNER_TEMP/core" "$RUNNER_TEMP/pg_jsonschema"
      - name: Verify ELF closure and runtime in relocated Alpine 3.22
        run: bash scripts/pg_jsonschema/linux-verify.sh "$RUNNER_TEMP/pg_jsonschema"
      - name: Upload feasibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-jsonschema-linux-${{ env.PG_ARCHITECTURE }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pg_jsonschema/*.tar.gz
            ${{ runner.temp }}/pg_jsonschema/*.sha256
            ${{ runner.temp }}/pg_jsonschema/build-evidence.txt
            ${{ runner.temp }}/pg_jsonschema/static-analysis/*.json
            ${{ runner.temp }}/pg_jsonschema/static-analysis/*.txt
          if-no-files-found: warn
          retention-days: 3
