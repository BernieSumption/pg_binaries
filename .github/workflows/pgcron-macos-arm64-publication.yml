name: pg_cron macOS arm64 publication

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  profile_scope:
    uses: ./.github/workflows/profile-change-scope.yml
    with:
      profile_id: pgcron-publication-macos-arm64-18.6

  verify:
    needs: profile_scope
    if: needs.profile_scope.outputs.should_run == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check pg_cron publication evidence helpers
        run: python3 -m unittest tests/test_emit_pgcron_macos_publication.py tests/test_import_pgcron_macos_publication.py
      - name: Download PostgreSQL 18.6 Apple Silicon artifact from run 39079982683
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-pilot-archives
          run-id: 39079982683
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/core-archives
      - name: Build final pg_cron archive and run relocated scheduled-job smoke
        id: archive_suite
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/pgcron-publication"
          bash scripts/pg_cron/macos-feasibility.sh "$RUNNER_TEMP/core-archives" "$RUNNER_TEMP/pgcron-publication" 2>&1 | tee "$RUNNER_TEMP/pgcron-publication/build-log.txt"
      - name: Validate Mach-O reports against final archive bytes
        id: static_analysis
        run: |
          python3 - "$RUNNER_TEMP/pgcron-publication/static-analysis.json" \
            "$RUNNER_TEMP/pgcron-publication/pg-cron-macho-inspection.json" \
            "$RUNNER_TEMP/core-archives/postgresql-18.6-macos-arm64.tar.gz" \
            "$RUNNER_TEMP/pgcron-publication/pg_cron-1.6.8-postgresql-18.6-macos-arm64.tar.gz" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          static_path, macho_path, *archives = map(pathlib.Path, sys.argv[1:])
          expected = {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in archives}
          static = json.loads(static_path.read_text())
          actual = static.get("archives", [])
          if isinstance(actual, list):
              actual = {item["basename"]: item["sha256"] for item in actual}
          if static.get("passed") is not True or not static.get("inspected_files") or actual != expected:
              raise SystemExit("PostgreSQL static analysis does not bind the final archive bytes")
          macho = json.loads(macho_path.read_text())
          if (macho.get("passed") is not True or macho.get("archives") != expected
                  or macho.get("dependencies", {}).get("@rpath/libpq.5.dylib") != "lib/libpq.5.dylib"
                  or "@loader_path" not in macho.get("module_rpaths", [])):
              raise SystemExit("pg_cron Mach-O closure does not pass against the final archive bytes")
          PY
      - name: Finalize pg_cron archive receipt and verification record
        if: always()
        env:
          ARCHIVE_SUITE_OUTCOME: ${{ steps.archive_suite.outcome }}
          STATIC_ANALYSIS_OUTCOME: ${{ steps.static_analysis.outcome }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          image_id="${ImageOS:?runner image OS missing}/${ImageVersion:?runner image version missing}"
          os_version="$(sw_vers -productVersion)"
          python3 tools/emit_pgcron_macos_publication.py \
            --core-archives "$RUNNER_TEMP/core-archives" \
            --archives "$RUNNER_TEMP/pgcron-publication" \
            --output "$RUNNER_TEMP/pgcron-publication" \
            --os-version "$os_version" --image-id "$image_id" \
            --archive-suite-result "$ARCHIVE_SUITE_OUTCOME" \
            --static-analysis-result "$STATIC_ANALYSIS_OUTCOME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pgcron-macos-arm64-publication-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pgcron-publication/*.tar.gz
            ${{ runner.temp }}/pgcron-publication/*.sha256
            ${{ runner.temp }}/pgcron-publication/*.json
            ${{ runner.temp }}/pgcron-publication/*.txt
            ${{ runner.temp }}/pgcron-publication/publication/**
          if-no-files-found: warn
          retention-days: 7
