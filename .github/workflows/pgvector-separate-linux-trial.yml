name: pgvector separate Linux build trial

on:
  push:
    branches: [spike]
    paths:
      - '.github/workflows/pgvector-separate-linux-trial.yml'
      - 'scripts/pgvector/linux-build.sh'
      - 'scripts/pgvector/linux-build.Dockerfile'
      - 'scripts/pgvector/linux-build-in-container.sh'
      - 'scripts/pgvector/archive_input.py'
      - 'tools/build_input_identity.py'
      - 'tools/selected_build_inputs.py'
      - 'scripts/linux/verify.sh'
      - 'scripts/linux/verify-in-container.sh'
      - 'tests/extensions/pgvector.sql'
      - 'tools/source_archive.py'
      - 'support.json'

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check builder shell syntax
        run: bash -n scripts/pgvector/linux-build.sh scripts/pgvector/linux-build-in-container.sh
      - name: Download pinned PostgreSQL 18.6 x86-64 core artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-publication-x86_64-evidence
          run-id: 39075939610
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/core
      - name: Download pgvector source selected by the repository pin
        run: |
          set -euo pipefail
          source_url=$(python3 tools/source_archive.py pgvector 0.8.7 tar.gz --field url)
          curl --fail --location --retry 3 "$source_url" --output "$RUNNER_TEMP/pgvector-v0.8.7.tar.gz"
      - name: Validate inputs and build extension archive in Docker
        env:
          CORE_SHA256: e532b07c29904db82d1681f1a4ab815364b769a4e1f277c9de9bcd45d0cdc7c6
        run: |
          set -euo pipefail
          core_name=postgresql-18.6-linux-x86_64.tar.gz
          mapfile -t core_files < <(find "$RUNNER_TEMP/core" -type f -name "$core_name" -print)
          if [[ ${#core_files[@]} -ne 1 ]]; then
            echo "Expected exactly one $core_name in downloaded artifact; found ${#core_files[@]}. Artifact layout:" >&2
            find "$RUNNER_TEMP/core" -maxdepth 5 -type f -print | sort >&2
            exit 1
          fi
          core=${core_files[0]}
          if [[ ! -f "$core.sha256" ]]; then
            echo "Missing sidecar for pinned core archive $core. Artifact layout:" >&2
            find "$RUNNER_TEMP/core" -maxdepth 5 -type f -print | sort >&2
            exit 1
          fi
          scripts/pgvector/linux-build.sh "$core" "$CORE_SHA256" \
            "$RUNNER_TEMP/pgvector-v0.8.7.tar.gz" "$RUNNER_TEMP/pgvector-output"
      - name: Inspect final extension archive and checksum sidecar
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/pgvector-output/pgvector-0.8.7-postgresql-18.6-linux-x86_64.tar.gz"
          test -s "$archive"
          test -s "$archive.sha256"
          (cd "$(dirname "$archive")" && sha256sum --check "$(basename "$archive").sha256")
          python3 - "$archive" <<'PY'
          import json, sys, tarfile
          sys.path.insert(0, 'tools')
          from build_input_identity import assess_reuse
          from selected_build_inputs import selected_identity
          with tarfile.open(sys.argv[1], "r:gz") as archive:
              names = set(archive.getnames())
              required = {
                  "pgvector/lib/vector.so",
                  "pgvector/share/extension/vector.control",
                  "pgvector/LICENSES/pgvector.txt",
                  "pgvector/LICENSES/pgvector-inventory.json",
                  "metadata.json",
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f"archive is missing required paths: {missing}")
              metadata = json.load(archive.extractfile("metadata.json"))
              if metadata.get("core_archive") != {
                  "basename": "postgresql-18.6-linux-x86_64.tar.gz",
                  "sha256": "e532b07c29904db82d1681f1a4ab815364b769a4e1f277c9de9bcd45d0cdc7c6",
              }:
                  raise SystemExit("archive metadata does not identify the pinned core input")
              assessment = assess_reuse(
                  selected_identity(metadata["builder_image_id"]), metadata.get("build_inputs"))
              if not assessment["reusable"]:
                  raise SystemExit(f"archive build inputs are not current: {assessment['reason']}")
          PY
      - name: Retain build output for seven days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgvector-separate-linux-build-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pgvector-output/*.tar.gz
            ${{ runner.temp }}/pgvector-output/*.sha256
          if-no-files-found: warn
          retention-days: 7

  verify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      PG_VERSION: 18.6
      PG_ARCHITECTURE: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Download this run's separate-build output
        uses: actions/download-artifact@v4
        with:
          name: pgvector-separate-linux-build-${{ github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/extension
      - name: Download the pinned historical core archive
        uses: actions/download-artifact@v4
        with:
          name: linux-publication-x86_64-evidence
          run-id: 39075939610
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/core
      - name: Assemble exact core and extension archives for verification
        run: |
          set -euo pipefail
          archive_dir="$RUNNER_TEMP/archives"
          mkdir -p "$archive_dir"
          core_name=postgresql-18.6-linux-x86_64.tar.gz
          vector_name=pgvector-0.8.7-postgresql-18.6-linux-x86_64.tar.gz
          core="$RUNNER_TEMP/core/pilot/$core_name"
          vector="$RUNNER_TEMP/extension/$vector_name"
          for input in "$core" "$core.sha256" "$vector" "$vector.sha256"; do
            if [[ ! -s "$input" ]]; then
              echo "Missing required verification input: $input. Downloaded layout:" >&2
              find "$RUNNER_TEMP/core" "$RUNNER_TEMP/extension" -maxdepth 5 -type f -print | sort >&2
              exit 1
            fi
          done
          cp "$core" "$core.sha256" "$vector" "$vector.sha256" "$archive_dir/"
          (cd "$archive_dir" && sha256sum --check "$core_name.sha256" "$vector_name.sha256")
      - name: Run full Alpine relocation, dependency, and SQL verification suite
        id: verify_archives
        run: scripts/linux/verify.sh "$RUNNER_TEMP/archives"
      - name: Retain verifier static analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgvector-separate-linux-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/archives/publication/static-analysis/core-pgvector.json
          if-no-files-found: warn
          retention-days: 7
      - name: Require full verification to pass
        if: always()
        run: test '${{ steps.verify_archives.outcome }}' = success
