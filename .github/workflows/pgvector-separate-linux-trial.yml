name: pgvector separate Linux build trial

on:
  push:
    branches: [spike]
    paths:
      - '.github/workflows/pgvector-separate-linux-trial.yml'
      - 'scripts/pgvector/linux-build.sh'
      - 'scripts/pgvector/linux-build.Dockerfile'
      - 'scripts/pgvector/linux-build-in-container.sh'
      - 'scripts/pgvector/archive_input.py'
      - 'tools/source_archive.py'
      - 'support.json'

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check builder shell syntax
        run: bash -n scripts/pgvector/linux-build.sh scripts/pgvector/linux-build-in-container.sh
      - name: Download pinned PostgreSQL 18.6 x86-64 core artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-publication-x86_64-evidence
          run-id: 39061346204
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/core
      - name: Download pgvector source selected by the repository pin
        run: |
          set -euo pipefail
          source_url=$(python3 tools/source_archive.py pgvector 0.8.7 tar.gz --field url)
          curl --fail --location --retry 3 "$source_url" --output "$RUNNER_TEMP/pgvector-v0.8.7.tar.gz"
      - name: Validate inputs and build extension archive in Docker
        env:
          CORE_SHA256: ca1773eeca3e083cf1c170e76d3e2191391ac3cac405b7db737a548a2a00c2df
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/core/postgresql-18.6-linux-x86_64.tar.gz"
          test -f "$core"
          test -f "$core.sha256"
          scripts/pgvector/linux-build.sh "$core" "$CORE_SHA256" \
            "$RUNNER_TEMP/pgvector-v0.8.7.tar.gz" "$RUNNER_TEMP/pgvector-output"
      - name: Inspect final extension archive and checksum sidecar
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/pgvector-output/pgvector-0.8.7-postgresql-18.6-linux-x86_64.tar.gz"
          test -s "$archive"
          test -s "$archive.sha256"
          (cd "$(dirname "$archive")" && sha256sum --check "$(basename "$archive").sha256")
          python3 - "$archive" <<'PY'
          import json, sys, tarfile
          with tarfile.open(sys.argv[1], "r:gz") as archive:
              names = set(archive.getnames())
              required = {
                  "pgvector/lib/vector.so",
                  "pgvector/share/extension/vector.control",
                  "pgvector/LICENSES/pgvector.txt",
                  "pgvector/LICENSES/pgvector-inventory.json",
                  "metadata.json",
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f"archive is missing required paths: {missing}")
              metadata = json.load(archive.extractfile("metadata.json"))
              if metadata.get("core_archive") != {
                  "basename": "postgresql-18.6-linux-x86_64.tar.gz",
                  "sha256": "ca1773eeca3e083cf1c170e76d3e2191391ac3cac405b7db737a548a2a00c2df",
              }:
                  raise SystemExit("archive metadata does not identify the pinned core input")
          PY
      - name: Retain build output for seven days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgvector-separate-linux-build-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pgvector-output/*.tar.gz
            ${{ runner.temp }}/pgvector-output/*.sha256
          if-no-files-found: warn
          retention-days: 7
