name: pgvector separate Linux build trial

on:
  push:
    branches: [spike]
    paths:
      - '.github/workflows/pgvector-separate-linux-trial.yml'
      - 'scripts/pgvector/linux-build.sh'
      - 'scripts/pgvector/builder-packages.sh'
      - 'scripts/pgvector/linux-build.Dockerfile'
      - 'scripts/pgvector/linux-build-in-container.sh'
      - 'scripts/pgvector/archive_input.py'
      - 'tools/build_input_identity.py'
      - 'tools/selected_build_inputs.py'
      - 'tools/extension_work_queue.py'
      - 'tools/candidate_archive_cache.py'
      - 'tools/coverage.py'
      - 'tools/extension_archive_plan.py'
      - 'tools/actions_candidate_discovery.py'
      - 'scripts/linux/verify.sh'
      - 'scripts/linux/verify-in-container.sh'
      - 'tests/extensions/pgvector.sql'
      - 'tools/source_archive.py'
      - 'support.json'

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check builder shell syntax
        run: bash -n scripts/pgvector/linux-build.sh scripts/pgvector/linux-build-in-container.sh
      - name: Download pinned PostgreSQL 18.6 x86-64 core artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-publication-x86_64-evidence
          run-id: 39075939610
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/core
      - name: Download pgvector source selected by the repository pin
        run: |
          set -euo pipefail
          source_url=$(python3 tools/source_archive.py pgvector 0.8.7 tar.gz --field url)
          curl --fail --location --retry 3 "$source_url" --output "$RUNNER_TEMP/pgvector-v0.8.7.tar.gz"
      - name: Discover a checked prior pgvector candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/actions_candidate_discovery.py \
            --repository "$GITHUB_REPOSITORY" \
            --workflow pgvector-separate-linux-trial.yml \
            --branch "$GITHUB_REF_NAME" \
            --current-run-id "$GITHUB_RUN_ID" \
            --artifact-name-template 'pgvector-separate-linux-build-{run_id}' \
            --archive-basename pgvector-0.8.7-postgresql-18.6-linux-x86_64.tar.gz \
            --project pgvector --version 0.8.7 --platform linux-x86_64 \
            --postgresql-version 18.6 \
            --output-directory "$RUNNER_TEMP/candidate" \
            --manifest-path "$RUNNER_TEMP/candidate-manifest.json"
      - name: Check inputs and decide whether the prior archive is reusable
        env:
          CORE_SHA256: e532b07c29904db82d1681f1a4ab815364b769a4e1f277c9de9bcd45d0cdc7c6
        run: |
          set -euo pipefail
          core_name=postgresql-18.6-linux-x86_64.tar.gz
          mapfile -t core_files < <(find "$RUNNER_TEMP/core" -type f -name "$core_name" -print)
          if [[ ${#core_files[@]} -ne 1 ]]; then
            echo "Expected exactly one $core_name in downloaded artifact; found ${#core_files[@]}. Artifact layout:" >&2
            find "$RUNNER_TEMP/core" -maxdepth 5 -type f -print | sort >&2
            exit 1
          fi
          core=${core_files[0]}
          if [[ ! -f "$core.sha256" ]]; then
            echo "Missing sidecar for pinned core archive $core. Artifact layout:" >&2
            find "$RUNNER_TEMP/core" -maxdepth 5 -type f -print | sort >&2
            exit 1
          fi
          candidate_name=pgvector-0.8.7-postgresql-18.6-linux-x86_64.tar.gz
          candidate="$RUNNER_TEMP/candidate/$candidate_name"
          if [[ ! -s "$candidate" ]]; then
            echo "No retrievable prior Actions candidate; building a fresh archive in Docker."
            scripts/pgvector/linux-build.sh "$core" "$CORE_SHA256" \
              "$RUNNER_TEMP/pgvector-v0.8.7.tar.gz" "$RUNNER_TEMP/pgvector-output"
            exit 0
          fi
          test -s "$candidate.sha256"
          (cd "$RUNNER_TEMP/candidate" && sha256sum --check "$candidate_name.sha256")

          # Rebuild the exact builder image before computing the expected identity.
          docker build --platform linux/amd64 -f scripts/pgvector/linux-build.Dockerfile \
            -t pg-binaries-pgvector-separate-linux .
          scripts/pgvector/builder-packages.sh "$RUNNER_TEMP/current-builder-packages.tsv"
          builder_packages_sha=$(sha256sum "$RUNNER_TEMP/current-builder-packages.tsv" | awk '{print $1}')
          python3 scripts/pgvector/archive_input.py validate-source \
            "$RUNNER_TEMP/pgvector-v0.8.7.tar.gz" \
            "$(python3 tools/source_archive.py pgvector 0.8.7 tar.gz --field sha256)"
          python3 scripts/pgvector/archive_input.py validate-core \
            "$core" "$core.sha256" "$CORE_SHA256" 18.6 x86_64
          python3 tools/selected_build_inputs.py --builder-packages-sha256 "$builder_packages_sha" \
            > "$RUNNER_TEMP/expected-build-inputs-raw.json"
          python3 - "$RUNNER_TEMP/expected-build-inputs-raw.json" "$RUNNER_TEMP/expected-build-inputs.json" <<'PY'
          import json, pathlib, sys
          identity = json.loads(pathlib.Path(sys.argv[1]).read_text())
          entry = {"project": "pgvector", "version": "0.8.7", "platform": "linux-x86_64",
                   "postgresql_major": 18, "identity": identity}
          pathlib.Path(sys.argv[2]).write_text(json.dumps({"schema_version": 1, "entries": [entry]}))
          PY
          python3 tools/extension_work_queue.py --all \
            --candidate-manifest "$RUNNER_TEMP/candidate-manifest.json" \
            --expected-build-inputs "$RUNNER_TEMP/expected-build-inputs.json" \
            > "$RUNNER_TEMP/reuse-queue.json"
          if python3 - "$RUNNER_TEMP/reuse-queue.json" <<'PY'
          import json, sys
          queue = json.load(open(sys.argv[1]))
          item = next((row for row in queue["work_items"] if row.get("kind") == "build-extension"
                       and row.get("project") == "pgvector" and row.get("version") == "0.8.7"
                       and row.get("platform") == "linux-x86_64" and row.get("postgresql_major") == 18), None)
          candidate = item.get("candidate_archive") if item else None
          if candidate and item.get("evidence") == "retrieved-unpublished-candidate-archive":
              print(f"Candidate reuse: accepted ({candidate['sha256']}; build inputs match)")
              raise SystemExit(0)
          print("Candidate reuse: rejected; queue decision requires a fresh build")
          for rejection in queue.get("unavailable_candidate_archives", []):
              print(f"Candidate rejection: {rejection.get('reason', 'unknown reason')}")
          raise SystemExit(1)
          PY
          then
            mkdir -p "$RUNNER_TEMP/pgvector-output"
            cp "$candidate" "$candidate.sha256" "$RUNNER_TEMP/pgvector-output/"
            echo "Archive action: reused checked prior candidate."
          else
            mkdir -p "$RUNNER_TEMP/pgvector-output"
            echo "Archive action: building a fresh archive in Docker."
            scripts/pgvector/linux-build.sh "$core" "$CORE_SHA256" \
              "$RUNNER_TEMP/pgvector-v0.8.7.tar.gz" "$RUNNER_TEMP/pgvector-output"
          fi
      - name: Inspect final extension archive and checksum sidecar
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/pgvector-output/pgvector-0.8.7-postgresql-18.6-linux-x86_64.tar.gz"
          test -s "$archive"
          test -s "$archive.sha256"
          (cd "$(dirname "$archive")" && sha256sum --check "$(basename "$archive").sha256")
          scripts/pgvector/builder-packages.sh "$RUNNER_TEMP/final-builder-packages.tsv"
          builder_packages_sha=$(sha256sum "$RUNNER_TEMP/final-builder-packages.tsv" | awk '{print $1}')
          python3 - "$archive" "$builder_packages_sha" <<'PY'
          import json, sys, tarfile
          sys.path.insert(0, 'tools')
          from build_input_identity import assess_reuse
          from selected_build_inputs import selected_identity
          with tarfile.open(sys.argv[1], "r:gz") as archive:
              names = set(archive.getnames())
              required = {
                  "pgvector/lib/vector.so",
                  "pgvector/share/extension/vector.control",
                  "pgvector/LICENSES/pgvector.txt",
                  "pgvector/LICENSES/pgvector-inventory.json",
                  "metadata.json",
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f"archive is missing required paths: {missing}")
              metadata = json.load(archive.extractfile("metadata.json"))
              if metadata.get("core_archive") != {
                  "basename": "postgresql-18.6-linux-x86_64.tar.gz",
                  "sha256": "e532b07c29904db82d1681f1a4ab815364b769a4e1f277c9de9bcd45d0cdc7c6",
              }:
                  raise SystemExit("archive metadata does not identify the pinned core input")
              assessment = assess_reuse(
                  selected_identity(sys.argv[2]), metadata.get("build_inputs"))
              if not assessment["reusable"]:
                  raise SystemExit(f"archive build inputs are not current: {assessment['reason']}")
          PY
      - name: Retain build output for seven days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgvector-separate-linux-build-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pgvector-output/*.tar.gz
            ${{ runner.temp }}/pgvector-output/*.sha256
          if-no-files-found: warn
          retention-days: 7

  verify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      PG_VERSION: 18.6
      PG_ARCHITECTURE: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Download this run's separate-build output
        uses: actions/download-artifact@v4
        with:
          name: pgvector-separate-linux-build-${{ github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/extension
      - name: Download the pinned historical core archive
        uses: actions/download-artifact@v4
        with:
          name: linux-publication-x86_64-evidence
          run-id: 39075939610
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/core
      - name: Assemble exact core and extension archives for verification
        run: |
          set -euo pipefail
          archive_dir="$RUNNER_TEMP/archives"
          mkdir -p "$archive_dir"
          core_name=postgresql-18.6-linux-x86_64.tar.gz
          vector_name=pgvector-0.8.7-postgresql-18.6-linux-x86_64.tar.gz
          core="$RUNNER_TEMP/core/pilot/$core_name"
          vector="$RUNNER_TEMP/extension/$vector_name"
          for input in "$core" "$core.sha256" "$vector" "$vector.sha256"; do
            if [[ ! -s "$input" ]]; then
              echo "Missing required verification input: $input. Downloaded layout:" >&2
              find "$RUNNER_TEMP/core" "$RUNNER_TEMP/extension" -maxdepth 5 -type f -print | sort >&2
              exit 1
            fi
          done
          cp "$core" "$core.sha256" "$vector" "$vector.sha256" "$archive_dir/"
          (cd "$archive_dir" && sha256sum --check "$core_name.sha256" "$vector_name.sha256")
      - name: Run full Alpine relocation, dependency, and SQL verification suite
        id: verify_archives
        run: scripts/linux/verify.sh "$RUNNER_TEMP/archives"
      - name: Retain verifier static analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgvector-separate-linux-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/archives/publication/static-analysis/core-pgvector.json
          if-no-files-found: warn
          retention-days: 7
      - name: Require full verification to pass
        if: always()
        run: test '${{ steps.verify_archives.outcome }}' = success
