name: Address Standardizer selected PostgreSQL Linux publication trial

on:
  workflow_dispatch:
  push:
    branches: [spike]
    paths:
      - '.github/workflows/address-standardizer-linux-selected-publication.yml'

permissions:
  actions: read
  contents: read

jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      PG_VERSION: '18.6'
      PG_ARCHITECTURE: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Plan the exact selected Address Standardizer target
        run: |
          set -euo pipefail
          python3 tools/extension_archive_plan.py \
            --project 'Address Standardizer' --platform "linux-$PG_ARCHITECTURE" \
            --postgresql-version "$PG_VERSION" --extension-version 3.7.0 \
            --github-output "$GITHUB_OUTPUT" > "$RUNNER_TEMP/selection.json"
          python3 - "$RUNNER_TEMP/selection.json" <<'PY'
          import json, sys
          selection = json.load(open(sys.argv[1], encoding="utf-8"))
          assert selection["selected_version"] == "3.7.0"
          assert selection["postgresql_version"] == "18.6"
          assert selection["platform"] == "linux-x86_64"
          PY
      - name: Resolve a checked PostgreSQL core or build the selected release
        id: core_resolution
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          sources=()
          if [[ "$CALLER_WORKFLOW_REF" == */.github/workflows/selected-extension-publication.yml@* ]]; then
            sources+=(
              selected-extension-publication.yml "postgis-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
              selected-extension-publication.yml "pgtap-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
            )
          fi
          sources+=(
            linux-changed-profiles.yml "postgis-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
            linux-changed-profiles.yml "pgtap-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
            postgis-linux-selected-publication.yml "postgis-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
            pgtap-linux-selected-publication.yml "pgtap-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}"
          )
          scripts/linux/resolve-core.sh "$PG_VERSION" "$PG_ARCHITECTURE" \
            "$RUNNER_TEMP/core/pilot" "${sources[@]}"
      - name: Validate selected Address Standardizer evidence tooling
        run: python -B -m unittest tests/test_address_standardizer_linux_publication.py
      - name: Build selected archive against the resolved core
        id: build
        if: always() && steps.core_resolution.outcome == 'success'
        continue-on-error: true
        run: bash scripts/address_standardizer/linux-build.sh "$RUNNER_TEMP/core/pilot" "$RUNNER_TEMP/address-standardizer"
      - name: Verify final archives with the relocated Alpine probe and ELF checks
        id: verify
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          bash scripts/address_standardizer/linux-verify.sh \
            "$RUNNER_TEMP/address-standardizer" "$RUNNER_TEMP/core/pilot" \
            2>&1 | tee "$RUNNER_TEMP/address-standardizer/probe-output.txt"
      - name: Emit attempt and archive-bound verification record
        if: always()
        env:
          CORE_RESOLUTION_RESULT: ${{ steps.core_resolution.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/address-standardizer/publication"
          python tools/emit_address_standardizer_linux_publication.py \
            --archives "$RUNNER_TEMP/address-standardizer" --core-archives "$RUNNER_TEMP/core/pilot" \
            --output "$RUNNER_TEMP/address-standardizer/publication" --architecture "$PG_ARCHITECTURE" \
            --postgresql-version "$PG_VERSION" --build-result "${BUILD_RESULT:-skipped}" \
            --verify-result "${VERIFY_RESULT:-skipped}" --core-resolution-result "${CORE_RESOLUTION_RESULT:-skipped}" \
            --core-resolution "$RUNNER_TEMP/core/pilot/core-resolution.json" \
            --image-id "$(docker image inspect pg-binaries-address-standardizer-alpine-probe --format '{{.Id}}' 2>/dev/null || echo unavailable)" \
            --kernel-release "$(uname -r)"
      - name: Validate and retain target-specific evidence
        id: import
        if: always()
        run: python tools/import_address_standardizer_linux_publication.py --core-archives "$RUNNER_TEMP/core/pilot" --archives "$RUNNER_TEMP/address-standardizer" --run-id "$GITHUB_RUN_ID"
      - name: Upload selected archives, provenance, reports and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: address-standardizer-selected-18.6-x86_64-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/core/pilot/*.tar.gz
            ${{ runner.temp }}/core/pilot/*.sha256
            ${{ runner.temp }}/core/pilot/core-resolution.json
            ${{ runner.temp }}/address-standardizer/*.tar.gz
            ${{ runner.temp }}/address-standardizer/*.sha256
            ${{ runner.temp }}/address-standardizer/*.txt
            ${{ runner.temp }}/address-standardizer/*.json
            ${{ runner.temp }}/address-standardizer/static-analysis/**
            ${{ runner.temp }}/address-standardizer/publication/**
            support/evidence/address-standardizer-linux-publication-${{ github.run_id }}/**
            support/verification/address-standardizer-3.7.0-postgresql-18.6-linux-x86_64-current-${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 7
      - name: Require core resolution, build, verification and evidence import
        if: always()
        env:
          CORE_RESOLUTION: ${{ steps.core_resolution.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
          EVIDENCE_IMPORT: ${{ steps.import.outcome }}
        run: |
          test "$CORE_RESOLUTION" = success
          test "$BUILD_RESULT" = success
          test "$VERIFY_RESULT" = success
          test "$EVIDENCE_IMPORT" = success
