name: Planner to HypoPG Linux dispatch trial

on:
  push:
    branches: [spike]
    paths:
      - 'experiments/planner-dispatch-trial/target.json'
      - 'tools/dispatch_plan.py'
      - 'tools/extension_work_queue.py'
      - '.github/workflows/hypopg-linux-selected-publication.yml'
      - '.github/workflows/planner-dispatch-trial.yml'

permissions:
  actions: read
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.plan.outputs.project }}
      extension_version: ${{ steps.plan.outputs.extension_version }}
      postgresql_version: ${{ steps.plan.outputs.postgresql_version }}
      platform: ${{ steps.plan.outputs.platform }}
      should_dispatch: ${{ steps.plan.outputs.should_dispatch }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the declared dispatch request
        id: plan
        run: |
          set -euo pipefail
          python3 tools/dispatch_plan.py --request experiments/planner-dispatch-trial/target.json > "$RUNNER_TEMP/dispatch-plan.json"
          python3 - "$RUNNER_TEMP/dispatch-plan.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          target = plan["target"]
          if target["project"] != "HypoPG" or target["platform"] not in {
              "linux-x86_64", "linux-arm64"
          }:
              raise SystemExit(
                  "planner-dispatch-trial supports only HypoPG on linux-x86_64 or linux-arm64"
              )
          with open(sys.argv[2], "a", encoding="utf-8") as output:
              for key, value in (
                  ("project", target["project"]),
                  ("extension_version", target["version"]),
                  ("postgresql_version", target["postgresql_version"]),
                  ("platform", target["platform"]),
                  ("should_dispatch", str(plan["should_dispatch"]).lower()),
              ):
                  output.write(f"{key}={value}\n")
          PY

  hypopg_linux:
    needs: plan
    if: needs.plan.outputs.should_dispatch == 'true' && needs.plan.outputs.project == 'HypoPG' && (needs.plan.outputs.platform == 'linux-x86_64' || needs.plan.outputs.platform == 'linux-arm64')
    uses: ./.github/workflows/hypopg-linux-selected-publication.yml
    with:
      postgresql_version: ${{ needs.plan.outputs.postgresql_version }}
      architecture: ${{ needs.plan.outputs.platform == 'linux-arm64' && 'arm64' || 'x86_64' }}
      extension_version: ${{ needs.plan.outputs.extension_version }}
