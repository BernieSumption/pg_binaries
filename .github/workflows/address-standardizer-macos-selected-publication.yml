name: Address Standardizer selected PostgreSQL macOS publication
on:
  workflow_call:
    inputs:
      postgresql_version: {required: true, type: string}
      architecture: {required: true, type: string}
      extension_version: {required: true, type: string}
  workflow_dispatch:
    inputs:
      postgresql_version:
        description: Selected PostgreSQL release
        required: true
        type: string
      architecture:
        description: Native macOS architecture
        required: true
        type: choice
        options: [arm64, x86_64]
      extension_version:
        description: Selected Address Standardizer release
        required: true
        type: choice
        options: ['3.7.0']
        default: '3.7.0'
permissions:
  actions: read
  contents: read
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      postgresql_version: ${{ steps.target.outputs.postgresql_version }}
      architecture: ${{ steps.target.outputs.architecture }}
      runner: ${{ steps.target.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - id: target
        env:
          PG: ${{ inputs.postgresql_version }}
          ARCH: ${{ inputs.architecture }}
          EXT: ${{ inputs.extension_version }}
        run: |
          set -euo pipefail
          test "$EXT" = 3.7.0
          python3 tools/address_standardizer_macos_target.py "$PG" --architecture "$ARCH" --output "$RUNNER_TEMP/target.json"
          echo "postgresql_version=$PG" >> "$GITHUB_OUTPUT"
          echo "architecture=$ARCH" >> "$GITHUB_OUTPUT"
          if [[ "$ARCH" == arm64 ]]; then echo 'runner=macos-15' >> "$GITHUB_OUTPUT"; else echo 'runner=macos-15-intel' >> "$GITHUB_OUTPUT"; fi
  build:
    needs: select
    runs-on: ${{ needs.select.outputs.runner }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Resolve selected core
        id: core
        continue-on-error: true
        env:
          PG: ${{ needs.select.outputs.postgresql_version }}
          ARCH: ${{ needs.select.outputs.architecture }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/core" "$RUNNER_TEMP/extension"
          python3 tools/address_standardizer_macos_target.py "$PG" --architecture "$ARCH" --output "$RUNNER_TEMP/base-target.json"
          bash scripts/macos/resolve-core.sh "$RUNNER_TEMP/base-target.json" "$RUNNER_TEMP/core"
      - name: Build selected archive
        id: package
        if: always() && steps.core.outcome == 'success'
        continue-on-error: true
        run: bash scripts/address_standardizer/macos-build-publication.sh "$RUNNER_TEMP/core" "$RUNNER_TEMP/extension" "$RUNNER_TEMP/core/target.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: address-standardizer-macos-${{ needs.select.outputs.postgresql_version }}-${{ needs.select.outputs.architecture }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/core/**
            ${{ runner.temp }}/extension/**
          if-no-files-found: warn
          retention-days: 7
      - name: Require core resolution and build
        if: always()
        run: test '${{ steps.core.outcome }}' = success && test '${{ steps.package.outcome }}' = success
  verify:
    needs: [select, build]
    if: always() && needs.select.result == 'success'
    runs-on: ${{ needs.select.outputs.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        id: download
        continue-on-error: true
        with:
          name: address-standardizer-macos-${{ needs.select.outputs.postgresql_version }}-${{ needs.select.outputs.architecture }}-${{ github.run_id }}
          path: ${{ runner.temp }}/bundle
      - name: Prepare fresh-runner inputs
        if: always()
        env:
          PG: ${{ needs.select.outputs.postgresql_version }}
          ARCH: ${{ needs.select.outputs.architecture }}
        run: |
          mkdir -p "$RUNNER_TEMP/core" "$RUNNER_TEMP/extension"
          python3 tools/address_standardizer_macos_target.py "$PG" --architecture "$ARCH" --output "$RUNNER_TEMP/selected-target.json"
          if [[ -d "$RUNNER_TEMP/bundle/core" ]]; then cp -a "$RUNNER_TEMP/bundle/core/." "$RUNNER_TEMP/core/"; fi
          if [[ -d "$RUNNER_TEMP/bundle/extension" ]]; then cp -a "$RUNNER_TEMP/bundle/extension/." "$RUNNER_TEMP/extension/"; fi
      - name: Run archive suite and Mach-O closure checks
        id: suite
        if: always() && steps.download.outcome == 'success'
        continue-on-error: true
        env:
          PG: ${{ needs.select.outputs.postgresql_version }}
          ARCH: ${{ needs.select.outputs.architecture }}
        run: bash scripts/address_standardizer/macos-verify-publication.sh "$RUNNER_TEMP/core/postgresql-$PG-macos-$ARCH.tar.gz" "$RUNNER_TEMP/extension/address-standardizer-3.7.0-postgresql-$PG-macos-$ARCH.tar.gz" "$PG" "$ARCH" "$RUNNER_TEMP/extension"
      - name: Emit archive-bound attempt and compact record
        if: always()
        env:
          SUITE: ${{ steps.suite.outcome }}
          PG: ${{ needs.select.outputs.postgresql_version }}
          ARCH: ${{ needs.select.outputs.architecture }}
        run: |
          set -euo pipefail
          python3 tools/emit_address_standardizer_macos_publication.py --target "$RUNNER_TEMP/selected-target.json" --core-archives "$RUNNER_TEMP/core" --archives "$RUNNER_TEMP/extension" --output "$RUNNER_TEMP/extension" --archive-suite-result "${SUITE:-skipped}" --macho-closure-result "${SUITE:-skipped}" --os-version "$(sw_vers -productVersion)" --image-id "${ImageOS:-unknown}/${ImageVersion:-unknown}"
      - name: Validate and retain evidence
        id: import
        if: always()
        run: python3 tools/import_address_standardizer_macos_publication.py --core-archives "$RUNNER_TEMP/core" --archives "$RUNNER_TEMP/extension" --run-id "$GITHUB_RUN_ID" --target "$RUNNER_TEMP/selected-target.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: address-standardizer-macos-verification-${{ needs.select.outputs.postgresql_version }}-${{ needs.select.outputs.architecture }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/core/**
            ${{ runner.temp }}/extension/**
            support/evidence/address-standardizer-macos-publication-${{ github.run_id }}/**
            support/verification/address-standardizer-3.7.0-postgresql-${{ needs.select.outputs.postgresql_version }}-macos-${{ needs.select.outputs.architecture }}-current-${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 7
      - name: Require build and verification evidence to pass
        if: always()
        run: test '${{ needs.build.result }}' = success && test '${{ steps.download.outcome }}' = success && test '${{ steps.suite.outcome }}' = success && test '${{ steps.import.outcome }}' = success
