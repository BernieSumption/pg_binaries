name: collection Linux feasibility
on:
  push:
    branches: [spike]
    paths:
      - '.github/workflows/collection-linux-feasibility.yml'
      - 'scripts/collection/**'
      - 'scripts/linux/**'
      - 'tools/check_elf_dependencies.py'
      - 'tools/reuse_linux_core_artifact.py'
      - 'support.json'
      - 'support/postgresql-releases.json'
  workflow_dispatch:
    inputs:
      architecture:
        description: Native runner architecture
        required: true
        default: x86_64
        type: choice
        options: [x86_64, arm64]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(github.event_name == 'push' && '["x86_64"]' || format('["{0}"]', inputs.architecture)) }}
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    env:
      PG_ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v4
      - name: Reuse a verified PostgreSQL 18.6 core archive when available
        id: core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/reuse_linux_core_artifact.py \
            --postgresql-version 18.6 --architecture "$PG_ARCHITECTURE" \
            --output "$RUNNER_TEMP/core" --github-output "$GITHUB_OUTPUT"
      - name: Build PostgreSQL 18.6 core archive when reuse is unavailable
        if: steps.core.outputs.reused != 'true'
        id: core_build
        run: scripts/linux/build.sh "$RUNNER_TEMP/core"
      - name: Build collection 1.1.1 and 2.1.3 from checksum-pinned source
        id: extension_build
        run: bash scripts/collection/build.sh "$RUNNER_TEMP/core" "$RUNNER_TEMP/collection"
      - name: Verify relocated archives and ELF closure in Alpine 3.22
        id: extension_verify
        run: bash scripts/collection/verify.sh "$RUNNER_TEMP/core" "$RUNNER_TEMP/collection"
      - name: Record PostgreSQL core archive identity
        id: archive_identity
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/core/postgresql-18.6-linux-$PG_ARCHITECTURE.tar.gz.sha256" ]; then
            mkdir -p "$RUNNER_TEMP/collection"
            cp "$RUNNER_TEMP/core/postgresql-18.6-linux-$PG_ARCHITECTURE.tar.gz.sha256" "$RUNNER_TEMP/collection/"
          fi
      - name: Record pilot outcomes
        if: always()
        env:
          CORE_REUSE_OUTCOME: ${{ steps.core.outcome }}
          CORE_BUILD_OUTCOME: ${{ steps.core_build.outcome }}
          EXTENSION_BUILD_OUTCOME: ${{ steps.extension_build.outcome }}
          EXTENSION_VERIFY_OUTCOME: ${{ steps.extension_verify.outcome }}
          ARCHIVE_IDENTITY_OUTCOME: ${{ steps.archive_identity.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/collection-attempt"
          python3 - "$RUNNER_TEMP/collection-attempt/attempt.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          def checksum_file(path):
              if not path.is_file():
                  return None
              fields = path.read_text(encoding="ascii").split()
              return fields[0] if fields else None
          collection = root / "collection"
          checksums = {}
          core_sidecar = root / "core" / f"postgresql-18.6-linux-{os.environ['PG_ARCHITECTURE']}.tar.gz.sha256"
          checksums["postgresql_core"] = checksum_file(core_sidecar)
          for version in ("1.1.1", "2.1.3"):
              checksums[f"collection_{version}"] = checksum_file(
                  collection / f"collection-{version}-postgresql-18.6-linux-{os.environ['PG_ARCHITECTURE']}.tar.gz.sha256"
              )
              checksums[f"source_{version}"] = checksum_file(
                  collection / f"pgcollection-{version}-source.tar.gz.sha256"
              )
          result = {
              "schema_version": 1,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source_revision": os.environ["GITHUB_SHA"],
              "postgresql_version": "18.6",
              "extension_versions": ["1.1.1", "2.1.3"],
              "source_archives": {
                  "1.1.1": "ab99a969334442e4a3c77405bc9ffed0083595d18f3898d64a731353a32bec5e",
                  "2.1.3": "a6b07864e5893d3b682bb3223fd6d33015709765c9d40d415c85112358f0e3e4",
              },
              "archive_sha256": checksums,
              "architecture": os.environ["PG_ARCHITECTURE"],
              "steps": {
                  "core_reuse": os.environ.get("CORE_REUSE_OUTCOME", "not-run"),
                  "core_build": os.environ.get("CORE_BUILD_OUTCOME", "not-run"),
                  "extension_build": os.environ.get("EXTENSION_BUILD_OUTCOME", "not-run"),
                  "extension_verify": os.environ.get("EXTENSION_VERIFY_OUTCOME", "not-run"),
                  "archive_identity": os.environ.get("ARCHIVE_IDENTITY_OUTCOME", "not-run"),
              },
          }
          Path(sys.argv[1]).write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collection-linux-18.6-${{ matrix.architecture }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/collection-attempt/attempt.json
            ${{ runner.temp }}/collection/*.tar.gz
            ${{ runner.temp }}/collection/*.sha256
            ${{ runner.temp }}/collection/*.txt
            ${{ runner.temp }}/collection/static-analysis/*.json
          if-no-files-found: warn
          retention-days: 7
