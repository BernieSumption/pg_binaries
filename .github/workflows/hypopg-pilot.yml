name: HypoPG Linux feasibility pilot
on:
  workflow_dispatch:
  push:
    branches: [spike]
    paths:
      - 'scripts/hypopg/build*'
      - 'scripts/hypopg/verify*'
      - 'scripts/hypopg/Dockerfile'
      - 'scripts/hypopg/probe.sql'
      - 'tools/reuse_linux_core_artifact.py'
      - 'tools/source_archive.py'
      - 'support.json'
      - 'support/postgresql-releases.json'
      - '.github/workflows/hypopg-pilot.yml'
jobs:
  linux-hypopg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    env:
      PG_ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v4
      - name: Reuse a verified PostgreSQL 18.6 core archive when available
        id: core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/reuse_linux_core_artifact.py \
            --postgresql-version 18.6 --architecture "$PG_ARCHITECTURE" \
            --output "$RUNNER_TEMP/core" --github-output "$GITHUB_OUTPUT"
      - name: Build PostgreSQL 18.6 core archive when reuse is unavailable
        if: steps.core.outputs.reused != 'true'
        id: core_build
        run: scripts/linux/build.sh "$RUNNER_TEMP/core"
      - name: Build and probe HypoPG 1.4.3 in Docker
        id: hypopg_build
        run: scripts/hypopg/build.sh "$RUNNER_TEMP/core" "$RUNNER_TEMP/hypopg"
      - name: Verify relocated HypoPG archive on clean Ubuntu
        id: hypopg_verify
        run: scripts/hypopg/verify.sh "$RUNNER_TEMP/core" "$RUNNER_TEMP/hypopg"
      - name: Record raw attempt outcomes
        if: always()
        env:
          CORE_REUSE_OUTCOME: ${{ steps.core.outcome }}
          CORE_BUILD_OUTCOME: ${{ steps.core_build.outcome }}
          HYPOPG_BUILD_OUTCOME: ${{ steps.hypopg_build.outcome }}
          HYPOPG_VERIFY_OUTCOME: ${{ steps.hypopg_verify.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hypopg-attempt"
          python3 - "$RUNNER_TEMP/hypopg-attempt/step-outcomes.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          outcome = {
              "schema_version": 1,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "source_revision": os.environ["GITHUB_SHA"],
              "postgresql_version": "18.6",
              "architecture": os.environ["PG_ARCHITECTURE"],
              "steps": {
                  "core_reuse": os.environ["CORE_REUSE_OUTCOME"],
                  "core_build": os.environ["CORE_BUILD_OUTCOME"],
                  "hypopg_build": os.environ["HYPOPG_BUILD_OUTCOME"],
                  "hypopg_verify": os.environ["HYPOPG_VERIFY_OUTCOME"],
              },
          }
          Path(sys.argv[1]).write_text(json.dumps(outcome, indent=2, sort_keys=True) + "\n",
                                       encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hypopg-linux-${{ matrix.architecture }}-feasibility
          path: |
            ${{ runner.temp }}/hypopg-attempt/step-outcomes.json
            ${{ runner.temp }}/hypopg/*.tar.gz
            ${{ runner.temp }}/hypopg/*.sha256
            ${{ runner.temp }}/hypopg/static-analysis/*.json
          if-no-files-found: warn
          retention-days: 1
