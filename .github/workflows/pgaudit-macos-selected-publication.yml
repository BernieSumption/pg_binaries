name: pgAudit selected PostgreSQL macOS publication

on:
  workflow_call:
    inputs:
      postgresql_version:
        required: true
        type: string
      extension_version:
        required: true
        type: string
      architecture:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      postgresql_version:
        description: Selected PostgreSQL release
        required: true
        type: choice
        options: ['15.19', '16.15', '17.11', '18.6']
        default: '18.6'
      extension_version:
        description: Selected pgAudit release
        required: true
        type: string
      architecture:
        description: macOS architecture
        required: true
        type: choice
        options: [arm64, x86_64]
        default: arm64

permissions:
  actions: read
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      postgresql_version: ${{ steps.plan.outputs.postgresql_version }}
      extension_version: ${{ steps.plan.outputs.selected_version }}
      architecture: ${{ steps.plan.outputs.architecture }}
      profile_id: ${{ steps.plan.outputs.profile_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate the selected target
        id: plan
        env:
          POSTGRESQL_VERSION: ${{ inputs.postgresql_version }}
          EXTENSION_VERSION: ${{ inputs.extension_version }}
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          set -euo pipefail
          platform="macos-$ARCHITECTURE"
          python3 tools/extension_archive_plan.py \
            --project pgaudit --platform "$platform" \
            --postgresql-version "$POSTGRESQL_VERSION" \
            --extension-version "$EXTENSION_VERSION" --github-output "$GITHUB_OUTPUT" \
            > "$RUNNER_TEMP/selection.json"
          python3 - "$RUNNER_TEMP/selection.json" "$GITHUB_OUTPUT" "$ARCHITECTURE" <<'PY'
          import json, sys
          selected=json.load(open(sys.argv[1],encoding='utf-8'))
          architecture=sys.argv[3]
          expected={'15.19':'1.7.1','16.15':'16.1','17.11':'17.1','18.6':'18.0'}
          if selected.get('selected_version') != expected.get(selected.get('postgresql_version')):
              raise SystemExit('selected pgAudit release does not match the PostgreSQL release')
          with open(sys.argv[2], 'a', encoding='utf-8') as output:
              output.write(f"architecture={architecture}\n")
              output.write(f"profile_id=pgaudit-publication-macos-{architecture}-{selected['postgresql_version']}\n")
          PY

  build:
    needs: select
    runs-on: ${{ needs.select.outputs.architecture == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Check pgAudit publication tooling
        run: python3 -m unittest tests/test_create_macos_symbols.py tests/test_emit_pgaudit_macos_publication.py tests/test_import_pgaudit_macos_publication.py tests/test_pgaudit_macos_targets.py
      - name: Create the selected PostgreSQL core base target
        env:
          POSTGRESQL_VERSION: ${{ needs.select.outputs.postgresql_version }}
          ARCHITECTURE: ${{ needs.select.outputs.architecture }}
        run: python3 tools/pgaudit_macos_targets.py "$POSTGRESQL_VERSION" --architecture "$ARCHITECTURE" --write-base "$RUNNER_TEMP/pgaudit-base-target.json"
      - name: Retrieve the selected pinned core archive or build that core
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/macos/resolve-core.sh "$RUNNER_TEMP/pgaudit-base-target.json" "$RUNNER_TEMP/core-archives"
      - name: Build, package and exercise pgAudit against the selected core
        env:
          POSTGRESQL_VERSION: ${{ needs.select.outputs.postgresql_version }}
          ARCHITECTURE: ${{ needs.select.outputs.architecture }}
        run: bash scripts/pgaudit/macos-feasibility.sh "$RUNNER_TEMP/core-archives" "$RUNNER_TEMP/pgaudit-build" "$POSTGRESQL_VERSION" "$ARCHITECTURE" "$RUNNER_TEMP/core-archives/target.json"
      - name: Create the dSYM index for the final archives
        env:
          POSTGRESQL_VERSION: ${{ needs.select.outputs.postgresql_version }}
          ARCHITECTURE: ${{ needs.select.outputs.architecture }}
        run: |
          core="$RUNNER_TEMP/core-archives/postgresql-${POSTGRESQL_VERSION}-macos-${ARCHITECTURE}.tar.gz"
          extension=$(find "$RUNNER_TEMP/pgaudit-build" -maxdepth 1 -name "pgaudit-*-postgresql-${POSTGRESQL_VERSION}-macos-${ARCHITECTURE}.tar.gz" -print -quit)
          test -n "$extension"
          python3 tools/create_macos_symbols.py "$core" "$extension" \
            --staged-dsyms "$RUNNER_TEMP/pgaudit-build/staged-dsyms" \
            --output-dir "$RUNNER_TEMP/pgaudit-build/debug-symbols"
      - uses: actions/upload-artifact@v4
        with:
          name: pgaudit-macos-${{ needs.select.outputs.architecture }}-${{ needs.select.outputs.postgresql_version }}-build-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/core-archives/**
            ${{ runner.temp }}/pgaudit-build/**
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: [select, build]
    if: always() && needs.select.result == 'success'
    runs-on: ${{ needs.select.outputs.architecture == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download the core and pgAudit archives from the build runner
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pgaudit-macos-${{ needs.select.outputs.architecture }}-${{ needs.select.outputs.postgresql_version }}-build-${{ github.run_id }}
          path: ${{ runner.temp }}/pgaudit-bundle
      - name: Prepare verification inputs
        if: always()
        env:
          ARCHITECTURE: ${{ needs.select.outputs.architecture }}
          POSTGRESQL_VERSION: ${{ needs.select.outputs.postgresql_version }}
        run: |
          mkdir -p "$RUNNER_TEMP/core-archives" "$RUNNER_TEMP/pgaudit-publication"
          if [[ -d "$RUNNER_TEMP/pgaudit-bundle/core-archives" ]]; then cp -a "$RUNNER_TEMP/pgaudit-bundle/core-archives/." "$RUNNER_TEMP/core-archives/"; fi
          if [[ -d "$RUNNER_TEMP/pgaudit-bundle/pgaudit-build" ]]; then cp -a "$RUNNER_TEMP/pgaudit-bundle/pgaudit-build/." "$RUNNER_TEMP/pgaudit-publication/"; fi
          test -s "$RUNNER_TEMP/core-archives/target.json"
          test -s "$RUNNER_TEMP/core-archives/postgresql-${POSTGRESQL_VERSION}-macos-${ARCHITECTURE}.tar.gz"
          extension=$(find "$RUNNER_TEMP/pgaudit-publication" -maxdepth 1 -name "pgaudit-*-postgresql-${POSTGRESQL_VERSION}-macos-${ARCHITECTURE}.tar.gz" -print -quit)
          test -n "$extension" && test -s "$extension"
      - name: Verify dSYM index for the downloaded archives
        id: symbols
        if: always() && steps.download.outcome == 'success'
        continue-on-error: true
        env:
          ARCHITECTURE: ${{ needs.select.outputs.architecture }}
          POSTGRESQL_VERSION: ${{ needs.select.outputs.postgresql_version }}
        run: |
          core="$RUNNER_TEMP/core-archives/postgresql-${POSTGRESQL_VERSION}-macos-${ARCHITECTURE}.tar.gz"
          extension=$(find "$RUNNER_TEMP/pgaudit-publication" -maxdepth 1 -name "pgaudit-*-postgresql-${POSTGRESQL_VERSION}-macos-${ARCHITECTURE}.tar.gz" -print -quit)
          python3 tools/create_macos_symbols.py "$core" "$extension" --output-dir "$RUNNER_TEMP/pgaudit-publication/debug-symbols" --verify-only
      - name: Run the archive suite against the downloaded archives
        id: archive_suite
        if: always() && steps.download.outcome == 'success'
        continue-on-error: true
        env:
          ARCHITECTURE: ${{ needs.select.outputs.architecture }}
          POSTGRESQL_VERSION: ${{ needs.select.outputs.postgresql_version }}
        run: |
          core="$RUNNER_TEMP/core-archives/postgresql-${POSTGRESQL_VERSION}-macos-${ARCHITECTURE}.tar.gz"
          extension=$(find "$RUNNER_TEMP/pgaudit-publication" -maxdepth 1 -name "pgaudit-*-postgresql-${POSTGRESQL_VERSION}-macos-${ARCHITECTURE}.tar.gz" -print -quit)
          bash scripts/pgaudit/macos-archive-suite.sh "$core" "$extension" "$POSTGRESQL_VERSION" "$ARCHITECTURE"
      - name: Run pgAudit diagnostics against the downloaded archives
        id: diagnostics
        if: always() && steps.download.outcome == 'success'
        continue-on-error: true
        env:
          ARCHITECTURE: ${{ needs.select.outputs.architecture }}
          POSTGRESQL_VERSION: ${{ needs.select.outputs.postgresql_version }}
        run: |
          core="$RUNNER_TEMP/core-archives/postgresql-${POSTGRESQL_VERSION}-macos-${ARCHITECTURE}.tar.gz"
          extension=$(find "$RUNNER_TEMP/pgaudit-publication" -maxdepth 1 -name "pgaudit-*-postgresql-${POSTGRESQL_VERSION}-macos-${ARCHITECTURE}.tar.gz" -print -quit)
          bash scripts/pgaudit/macos-diagnostics.sh "$core" "$extension" "$RUNNER_TEMP/pgaudit-publication/diagnostics.json" "$POSTGRESQL_VERSION" "$ARCHITECTURE" "$RUNNER_TEMP/core-archives/target.json"
      - name: Finalize archive receipt and verification record
        if: always()
        env:
          ARCHIVE_SUITE_OUTCOME: ${{ steps.archive_suite.outcome }}
          SYMBOLS_OUTCOME: ${{ steps.symbols.outcome }}
          DIAGNOSTICS_OUTCOME: ${{ steps.diagnostics.outcome }}
          GITHUB_SHA: ${{ github.sha }}
          ARCHITECTURE: ${{ needs.select.outputs.architecture }}
          POSTGRESQL_VERSION: ${{ needs.select.outputs.postgresql_version }}
        run: |
          image_id="${ImageOS:?runner image OS missing}/${ImageVersion:?runner image version missing}"
          python3 tools/emit_pgaudit_macos_publication.py \
            --target-config "$RUNNER_TEMP/core-archives/target.json" \
            --architecture "$ARCHITECTURE" --postgresql-version "$POSTGRESQL_VERSION" \
            --core-archives "$RUNNER_TEMP/core-archives" --archives "$RUNNER_TEMP/pgaudit-publication" \
            --output "$RUNNER_TEMP/pgaudit-publication" \
            --os-version "$(sw_vers -productVersion)" --image-id "$image_id" \
            --archive-suite-result "$ARCHIVE_SUITE_OUTCOME" \
            --symbols-result "$SYMBOLS_OUTCOME" --diagnostics-result "$DIAGNOSTICS_OUTCOME"
      - name: Validate and retain publication evidence
        if: always()
        env:
          ARCHITECTURE: ${{ needs.select.outputs.architecture }}
          POSTGRESQL_VERSION: ${{ needs.select.outputs.postgresql_version }}
        run: |
          if [[ -f "$RUNNER_TEMP/pgaudit-publication/publication/attempt.json" ]]; then
            python3 tools/import_pgaudit_macos_publication.py \
              --target-config "$RUNNER_TEMP/core-archives/target.json" \
              --architecture "$ARCHITECTURE" --postgresql-version "$POSTGRESQL_VERSION" \
              --core-artifact "$RUNNER_TEMP/core-archives" \
              --pgaudit-artifact "$RUNNER_TEMP/pgaudit-publication" --run-id "$GITHUB_RUN_ID"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pgaudit-macos-${{ needs.select.outputs.architecture }}-${{ needs.select.outputs.postgresql_version }}-publication-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pgaudit-publication/**
            support/evidence/pgaudit-macos-publication-${{ github.run_id }}/${{ needs.select.outputs.architecture }}/**
            support/verification/pgaudit-*-postgresql-${{ needs.select.outputs.postgresql_version }}-macos-${{ needs.select.outputs.architecture }}-current-${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 7
      - name: Require build and fresh-runner verification to pass
        if: always()
        run: |
          if [[ '${{ needs.build.result }}' != success || '${{ steps.download.outcome }}' != success || '${{ steps.archive_suite.outcome }}' != success || '${{ steps.symbols.outcome }}' != success || '${{ steps.diagnostics.outcome }}' != success ]]; then
            echo 'pgAudit build, fresh-runner symbol verification and diagnostics must pass.' >&2
            exit 1
          fi
