name: Bounded extension autonomy trials

on:
  workflow_dispatch:
  push:
    branches: [spike]
    paths:
      - .github/workflows/extension-autonomy-trials.yml
      - scripts/pg_repack/**
      - scripts/pg_partman/**
      - scripts/pg_squeeze/**

permissions:
  actions: read
  contents: read

jobs:
  trial:
    strategy:
      fail-fast: false
      matrix:
        project: [pg_repack, pg_partman, pg_squeeze]
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check trial scripts
        run: bash -n scripts/${{ matrix.project }}/*.sh
      - name: Download the PostgreSQL 18.6 x86-64 candidate archive
        uses: actions/download-artifact@v4
        with:
          name: linux-publication-x86_64-evidence
          run-id: 39081368117
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/core
      - name: Build unmodified upstream source in Docker
        run: bash scripts/${{ matrix.project }}/linux-build.sh "$RUNNER_TEMP/core/pilot" "$RUNNER_TEMP/extension"
      - name: Verify final archives in Alpine
        run: bash scripts/${{ matrix.project }}/linux-verify.sh "$RUNNER_TEMP/extension" "$RUNNER_TEMP/core/pilot"
      - name: Retain compact trial results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomy-${{ matrix.project }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/extension/*.tar.gz
            ${{ runner.temp }}/extension/*.sha256
            ${{ runner.temp }}/extension/static-analysis/*.json
          if-no-files-found: warn
          retention-days: 7
