name: Intended support coverage

on:
  push:
    branches: [spike]
    paths:
      - support.json
      - support/**
      - tools/coverage.py
      - tools/emit_linux_pilot_records.py
      - tools/emit_linux_minimum_pilot_records.py
      - tools/plan_work.py
      - tools/extension_work_queue.py
      - tools/select_extension_work.py
      - tools/candidate_inventory.py
      - tools/publication_preflight.py
      - tools/discover_postgresql.py
      - tools/discover_builtins.py
      - tests/test_coverage.py
      - tests/test_emit_linux_pilot_records.py
      - tests/test_emit_linux_minimum_pilot_records.py
      - tests/test_plan_work.py
      - tests/test_extension_work_queue.py
      - tests/test_select_extension_work.py
      - tests/test_emit_extension_publication_records.py
      - tests/test_candidate_inventory.py
      - tests/test_publication_preflight.py
      - tests/test_discover_postgresql.py
      - tests/test_discover_builtins.py
      - .github/workflows/support-coverage.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate support tooling
        run: python3 -m unittest tests/test_coverage.py tests/test_emit_linux_pilot_records.py tests/test_emit_linux_minimum_pilot_records.py tests/test_discover_postgresql.py tests/test_discover_builtins.py tests/test_plan_work.py tests/test_extension_work_queue.py tests/test_select_extension_work.py tests/test_emit_extension_publication_records.py tests/test_candidate_inventory.py tests/test_publication_preflight.py
      - name: Show bounded extension work plan
        run: python3 tools/extension_work_queue.py --limit 8
      - name: Resolve one selected extension build group
        run: python3 tools/select_extension_work.py --selection support/selected-extension-work.json
      - name: Check the PostgreSQL release snapshot against upstream
        run: python3 tools/discover_postgresql.py --check
      - name: Report unmet support
        run: python3 tools/coverage.py
