name: pgAudit macOS arm64 feasibility

on:
  workflow_dispatch:
  push:
    branches: [spike]
    paths:
      - .github/workflows/pgaudit-macos-arm64-feasibility.yml
      - scripts/pgaudit/macos-feasibility.sh
      - scripts/pgaudit/probe.sql
      - scripts/macos/build-source-dependencies.sh
      - scripts/macos/static_analysis.py
permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download the successful PostgreSQL 18.6 Apple Silicon artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-pilot-archives
          run-id: 39075939632
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/core-archives
      - name: Build and verify pgAudit against the archived core
        run: bash scripts/pgaudit/macos-feasibility.sh "$RUNNER_TEMP/core-archives" "$RUNNER_TEMP/pgAudit-feasibility"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pgaudit-macos-arm64-feasibility-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pgAudit-feasibility/*.tar.gz
            ${{ runner.temp }}/pgAudit-feasibility/*.sha256
            ${{ runner.temp }}/pgAudit-feasibility/*.json
            ${{ runner.temp }}/pgAudit-feasibility/*.txt
          if-no-files-found: warn
          retention-days: 7
