name: pgAudit macOS arm64 feasibility

on:
  workflow_dispatch:
    inputs:
      postgresql_version:
        description: PostgreSQL minor release
        type: choice
        options: ['15.19', '16.15', '17.11', '18.6']
        default: '18.6'
permissions:
  actions: read
  contents: read

jobs:
  profile_scope:
    uses: ./.github/workflows/profile-change-scope.yml
    with:
      profile_id: pgaudit-publication-macos-arm64-${{ inputs.postgresql_version || '18.6' }}

  probe:
    needs: profile_scope
    if: needs.profile_scope.outputs.should_run == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check pgAudit publication evidence helpers
        run: python3 -m unittest tests/test_create_macos_symbols.py tests/test_emit_pgaudit_macos_publication.py tests/test_import_pgaudit_macos_publication.py tests/test_pgaudit_macos_targets.py
      - name: Download the pinned PostgreSQL Apple Silicon artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ (inputs.postgresql_version || '18.6') == '15.19' && 'postgresql-macos-selected-15.19-arm64-build-39424367764' || (inputs.postgresql_version || '18.6') == '16.15' && 'postgresql-macos-selected-16.15-arm64-build-39424382435' || (inputs.postgresql_version || '18.6') == '17.11' && 'postgresql-macos-selected-17.11-arm64-build-39425313739' || 'macos-arm64-pilot-archives' }}
          run-id: ${{ (inputs.postgresql_version || '18.6') == '15.19' && '39424367764' || (inputs.postgresql_version || '18.6') == '16.15' && '39424382435' || (inputs.postgresql_version || '18.6') == '17.11' && '39425313739' || '39075939632' }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/core-archives
      - name: Build and verify pgAudit against the archived core
        id: archive_suite
        run: bash scripts/pgaudit/macos-feasibility.sh "$RUNNER_TEMP/core-archives" "$RUNNER_TEMP/pgAudit-feasibility" "${{ inputs.postgresql_version || '18.6' }}"
      - name: Create and verify dSYM index for the final archives
        id: symbols
        run: |
          version="${{ inputs.postgresql_version || '18.6' }}"
          core="$RUNNER_TEMP/core-archives/postgresql-${version}-macos-arm64.tar.gz"
          extension=$(find "$RUNNER_TEMP/pgAudit-feasibility" -maxdepth 1 -name "pgaudit-*-postgresql-${version}-macos-arm64.tar.gz" -print -quit)
          test -n "$extension"
          python3 tools/create_macos_symbols.py "$core" "$extension" \
            --staged-dsyms "$RUNNER_TEMP/pgAudit-feasibility/staged-dsyms" \
            --output-dir "$RUNNER_TEMP/pgAudit-feasibility/debug-symbols"
          python3 tools/create_macos_symbols.py "$core" "$extension" \
            --output-dir "$RUNNER_TEMP/pgAudit-feasibility/debug-symbols" --verify-only
      - name: Verify representative pgAudit startup and server diagnostics
        id: diagnostics
        run: |
          version="${{ inputs.postgresql_version || '18.6' }}"
          extension=$(find "$RUNNER_TEMP/pgAudit-feasibility" -maxdepth 1 -name "pgaudit-*-postgresql-${version}-macos-arm64.tar.gz" -print -quit)
          test -n "$extension"
          bash scripts/pgaudit/macos-diagnostics.sh \
            "$RUNNER_TEMP/core-archives/postgresql-${version}-macos-arm64.tar.gz" \
            "$extension" "$RUNNER_TEMP/pgAudit-feasibility/diagnostics.json" "$version"
      - name: Finalize pgAudit archive receipt and verification record
        if: always()
        env:
          ARCHIVE_SUITE_OUTCOME: ${{ steps.archive_suite.outcome }}
          SYMBOLS_OUTCOME: ${{ steps.symbols.outcome }}
          DIAGNOSTICS_OUTCOME: ${{ steps.diagnostics.outcome }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          image_id="${ImageOS:?runner image OS missing}/${ImageVersion:?runner image version missing}"
          os_version="$(sw_vers -productVersion)"
          python3 tools/emit_pgaudit_macos_publication.py \
            --core-archives "$RUNNER_TEMP/core-archives" \
            --archives "$RUNNER_TEMP/pgAudit-feasibility" \
            --output "$RUNNER_TEMP/pgAudit-feasibility" \
            --os-version "$os_version" --image-id "$image_id" \
            --archive-suite-result "$ARCHIVE_SUITE_OUTCOME" \
            --symbols-result "$SYMBOLS_OUTCOME" \
            --diagnostics-result "$DIAGNOSTICS_OUTCOME" \
            --postgresql-version "${{ inputs.postgresql_version || '18.6' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pgaudit-macos-arm64-feasibility-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pgAudit-feasibility/*.tar.gz
            ${{ runner.temp }}/pgAudit-feasibility/*.sha256
            ${{ runner.temp }}/pgAudit-feasibility/*.json
            ${{ runner.temp }}/pgAudit-feasibility/*.txt
            ${{ runner.temp }}/pgAudit-feasibility/debug-symbols/**
            ${{ runner.temp }}/pgAudit-feasibility/staged-dsyms/**
            ${{ runner.temp }}/pgAudit-feasibility/publication/**
          if-no-files-found: warn
          retention-days: 7
