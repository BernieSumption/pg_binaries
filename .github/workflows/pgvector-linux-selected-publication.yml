name: pgvector selected Linux publication

on:
  workflow_call:
    inputs:
      postgresql_version:
        description: Exact selected PostgreSQL release
        required: true
        type: string
      architecture:
        description: Exact selected Linux architecture
        required: true
        type: string
      extension_version:
        description: Exact selected pgvector release
        required: true
        type: string
  workflow_dispatch:
    inputs:
      postgresql_version:
        description: Exact selected PostgreSQL release
        required: true
        type: string
      architecture:
        description: Exact selected Linux architecture
        required: true
        type: string
      extension_version:
        description: Exact selected pgvector release
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      postgresql_version: ${{ steps.plan.outputs.postgresql_version }}
      extension_version: ${{ steps.plan.outputs.selected_version }}
      architecture: ${{ steps.plan.outputs.architecture }}
    steps:
      - uses: actions/checkout@v4
      - name: Plan the exact selected target
        id: plan
        env:
          POSTGRESQL_VERSION: ${{ inputs.postgresql_version }}
          EXTENSION_VERSION: ${{ inputs.extension_version }}
          REQUESTED_ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          set -euo pipefail
          test -n "$POSTGRESQL_VERSION"
          test -n "$EXTENSION_VERSION"
          case "$REQUESTED_ARCHITECTURE" in x86_64|arm64) ;; *) echo "Unsupported Linux architecture: $REQUESTED_ARCHITECTURE" >&2; exit 2 ;; esac
          python3 tools/extension_archive_plan.py \
            --project pgvector --platform "linux-$REQUESTED_ARCHITECTURE" \
            --postgresql-version "$POSTGRESQL_VERSION" --extension-version "$EXTENSION_VERSION" \
            --github-output "$GITHUB_OUTPUT" > "$RUNNER_TEMP/selection.json"
          selected=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["selected_version"])' "$RUNNER_TEMP/selection.json")
          if [[ "$selected" != "$EXTENSION_VERSION" ]]; then
            echo "Planner selected pgvector $selected, requested $EXTENSION_VERSION." >&2
            exit 1
          fi
          echo "architecture=$REQUESTED_ARCHITECTURE" >> "$GITHUB_OUTPUT"

  build:
    needs: select
    runs-on: ${{ needs.select.outputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    outputs:
      core_resolution: ${{ steps.core_resolution.outcome }}
      extension_build: ${{ steps.extension_build.outcome }}
    env:
      PG_VERSION: ${{ needs.select.outputs.postgresql_version }}
      PG_ARCHITECTURE: ${{ needs.select.outputs.architecture }}
      PGVECTOR_VERSION: ${{ needs.select.outputs.extension_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve a checked core with build fallback
        id: core_resolution
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scripts/linux/resolve-core.sh "$PG_VERSION" "$PG_ARCHITECTURE" "$RUNNER_TEMP/core"
      - name: Fetch and build selected pgvector against the resolved core
        id: extension_build
        if: always() && steps.core_resolution.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          source_url=$(python3 tools/source_archive.py pgvector "$PGVECTOR_VERSION" tar.gz --field url)
          curl --fail --location --retry 3 "$source_url" --output "$RUNNER_TEMP/pgvector-v$PGVECTOR_VERSION.tar.gz"
          core="$RUNNER_TEMP/core/postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz"
          core_sha=$(sha256sum "$core" | awk '{print $1}')
          PG_VERSION="$PG_VERSION" PG_ARCHITECTURE="$PG_ARCHITECTURE" PGVECTOR_VERSION="$PGVECTOR_VERSION" \
            scripts/pgvector/linux-build.sh "$core" "$core_sha" \
            "$RUNNER_TEMP/pgvector-v$PGVECTOR_VERSION.tar.gz" "$RUNNER_TEMP/vector"
      - name: Upload built archive and input identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgvector-linux-built-${{ needs.select.outputs.postgresql_version }}-${{ needs.select.outputs.architecture }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/vector/*.tar.gz
            ${{ runner.temp }}/vector/*.sha256
            ${{ runner.temp }}/vector/*.json
            ${{ runner.temp }}/vector/*.tsv
          if-no-files-found: warn
          retention-days: 7
      - name: Upload exact resolved core and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgvector-linux-core-${{ needs.select.outputs.postgresql_version }}-${{ needs.select.outputs.architecture }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/core/*.tar.gz
            ${{ runner.temp }}/core/*.sha256
            ${{ runner.temp }}/core/core-resolution.json
          if-no-files-found: warn
          retention-days: 7

  verify:
    needs: [select, build]
    if: always() && needs.select.result == 'success'
    runs-on: ${{ needs.select.outputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 70
    env:
      PG_VERSION: ${{ needs.select.outputs.postgresql_version }}
      PG_ARCHITECTURE: ${{ needs.select.outputs.architecture }}
      PGVECTOR_VERSION: ${{ needs.select.outputs.extension_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download built pgvector archive
        id: download_extension
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pgvector-linux-built-${{ needs.select.outputs.postgresql_version }}-${{ needs.select.outputs.architecture }}-${{ github.run_id }}
          path: ${{ runner.temp }}/vector
      - name: Download resolved PostgreSQL core
        id: download_core
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pgvector-linux-core-${{ needs.select.outputs.postgresql_version }}-${{ needs.select.outputs.architecture }}-${{ github.run_id }}
          path: ${{ runner.temp }}/core
      - name: Validate transferred core provenance
        id: core_validation
        if: always() && steps.download_core.outcome == 'success'
        continue-on-error: true
        run: |
          python3 tools/linux_core_resolution.py \
            --validate-record "$RUNNER_TEMP/core/core-resolution.json" \
            --archive "$RUNNER_TEMP/core/postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz" \
            --postgresql-version "$PG_VERSION" --architecture "$PG_ARCHITECTURE"
          python3 scripts/pgvector/archive_input.py validate-core \
            "$RUNNER_TEMP/core/postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz" \
            "$RUNNER_TEMP/core/postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz.sha256" \
            "$(sha256sum "$RUNNER_TEMP/core/postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz" | awk '{print $1}')" \
            "$PG_VERSION" "$PG_ARCHITECTURE" \
            "$(python3 tools/source_archive.py postgresql "$PG_VERSION" tar.bz2 --field sha256)"
      - name: Verify exact final archives in the Linux verifier
        id: verification
        if: always() && steps.download_extension.outcome == 'success' && steps.download_core.outcome == 'success' && steps.core_validation.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/archives"
          cp "$RUNNER_TEMP/core/postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz"* "$RUNNER_TEMP/archives/"
          cp "$RUNNER_TEMP/vector/pgvector-$PGVECTOR_VERSION-postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz"* "$RUNNER_TEMP/archives/"
          cp "$RUNNER_TEMP/vector/build-input-identity.json" "$RUNNER_TEMP/archives/" 2>/dev/null || true
          (cd "$RUNNER_TEMP/archives" && sha256sum --check *.sha256)
          PG_VERSION="$PG_VERSION" PG_ARCHITECTURE="$PG_ARCHITECTURE" PGVECTOR_VERSION="$PGVECTOR_VERSION" \
            scripts/linux/verify.sh "$RUNNER_TEMP/archives" 2>&1 | tee "$RUNNER_TEMP/archives/probe-output.txt"
      - name: Verify PostgreSQL starts without host user space
        id: nohost
        if: always() && steps.download_extension.outcome == 'success' && steps.download_core.outcome == 'success' && steps.core_validation.outcome == 'success'
        continue-on-error: true
        run: bash scripts/linux/verify-no-host-userspace.sh "$RUNNER_TEMP/archives" "$PG_VERSION" "$PG_ARCHITECTURE"
      - name: Index symbols from the exact final archives
        id: symbols
        if: always() && steps.download_extension.outcome == 'success' && steps.download_core.outcome == 'success' && steps.core_validation.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 tools/create_linux_symbols.py \
            "$RUNNER_TEMP/archives/postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz" \
            "$RUNNER_TEMP/archives/pgvector-$PGVECTOR_VERSION-postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz" \
            --output-dir "$RUNNER_TEMP/archives/debug-symbols"
          python3 tools/check_linux_symbols.py "$RUNNER_TEMP/archives/debug-symbols/index.json" \
            "$RUNNER_TEMP/archives/postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz" \
            "$RUNNER_TEMP/archives/pgvector-$PGVECTOR_VERSION-postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz"
      - name: Run final archive loader and PostgreSQL diagnostics
        id: diagnostics
        if: always() && steps.download_extension.outcome == 'success' && steps.download_core.outcome == 'success' && steps.core_validation.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          if [[ '${{ steps.symbols.outcome }}' != success ]]; then
            echo 'Final archive symbol index is unavailable.' >&2
            exit 1
          fi
          case "$PG_ARCHITECTURE" in x86_64) docker_platform=linux/amd64 ;; arm64) docker_platform=linux/arm64 ;; esac
          docker build --platform "$docker_platform" -f scripts/linux/diagnostics.Dockerfile -t pg-binaries-linux-diagnostics .
          mkdir -p "$RUNNER_TEMP/diagnostics-evidence"
          docker run --rm --platform "$docker_platform" \
            -e GITHUB_RUN_ID -e GITHUB_REPOSITORY -e GITHUB_SERVER_URL -e GITHUB_SHA \
            -e DIAGNOSTICS_EVIDENCE_DIR=/evidence \
            -v "$GITHUB_WORKSPACE:/repo:ro" -v "$RUNNER_TEMP/archives:/archives:ro" \
            -v "$RUNNER_TEMP/diagnostics-evidence:/evidence" \
            pg-binaries-linux-diagnostics bash /repo/scripts/linux/diagnostics-in-container.sh \
            /archives "$PG_VERSION" "$PG_ARCHITECTURE" "$PGVECTOR_VERSION"
      - name: Create receipt, records and import verified evidence
        id: records
        if: always()
        continue-on-error: true
        env:
          VERIFY_OUTCOME: ${{ steps.verification.outcome }}
          NOHOST_OUTCOME: ${{ steps.nohost.outcome }}
          DIAGNOSTICS_OUTCOME: ${{ steps.diagnostics.outcome }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/bundle"
          core_dir="$bundle/pilot"
          publication="$core_dir/publication"
          mkdir -p "$publication"
          for archive in "$RUNNER_TEMP/archives"/postgresql-*.tar.gz* "$RUNNER_TEMP/archives"/pgvector-*.tar.gz*; do
            if [[ -f "$archive" ]]; then cp "$archive" "$core_dir/"; fi
          done
          if [[ -d "$RUNNER_TEMP/archives/publication/static-analysis" ]]; then cp -R "$RUNNER_TEMP/archives/publication/static-analysis" "$publication/"; fi
          if [[ -d "$RUNNER_TEMP/archives/debug-symbols" ]]; then cp -R "$RUNNER_TEMP/archives/debug-symbols" "$core_dir/"; fi
          if [[ -f "$RUNNER_TEMP/archives/build-input-identity.json" ]]; then cp "$RUNNER_TEMP/archives/build-input-identity.json" "$core_dir/"; fi
          if [[ -d "$RUNNER_TEMP/diagnostics-evidence" ]]; then mkdir -p "$core_dir/diagnostics"; cp -R "$RUNNER_TEMP/diagnostics-evidence/." "$core_dir/diagnostics/"; fi
          python3 - "$publication/current-steps.json" <<'PY'
          import json, os, pathlib, sys
          pathlib.Path(sys.argv[1]).write_text(json.dumps({
              "archive-suite": os.environ["VERIFY_OUTCOME"],
              "diagnostics": os.environ["DIAGNOSTICS_OUTCOME"],
              "no-host-userspace": os.environ["NOHOST_OUTCOME"],
          }, sort_keys=True) + "\n")
          PY
          core="$core_dir/postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz"
          vector="$core_dir/pgvector-$PGVECTOR_VERSION-postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz"
          if [[ -s "$core" && -s "$core.sha256" && -s "$vector" && -s "$vector.sha256" ]]; then
            image=$(docker image inspect --format '{{.Id}}' pg-binaries-linux-verifier 2>/dev/null || true)
            if [[ "$image" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              clean=false; dependencies=failure
              if [[ "$VERIFY_OUTCOME" == success && "$NOHOST_OUTCOME" == success ]]; then clean=true; dependencies=success; fi
              case "$PG_ARCHITECTURE" in x86_64) docker_platform=linux/amd64 ;; arm64) docker_platform=linux/arm64 ;; esac
              distribution=$(docker run --rm --platform "$docker_platform" --entrypoint sh pg-binaries-linux-verifier -c '. /etc/os-release; printf "%s" "$NAME"')
              distribution_version=$(docker run --rm --platform "$docker_platform" --entrypoint sh pg-binaries-linux-verifier -c '. /etc/os-release; printf "%s" "$VERSION_ID"')
              python3 tools/create_linux_publication_receipt.py \
                --archives "$core_dir" --receipt "$publication/current-receipt.json" \
                --profile-id "linux-publication-current-$PG_ARCHITECTURE" --postgresql-version "$PG_VERSION" \
                --architecture "$PG_ARCHITECTURE" --endpoint current --kernel-release "$(uname -r)" \
                --distribution "$distribution" --distribution-version "$distribution_version" \
                --image-id "$image" --dependency-check-profile linux-runtime-v1 \
                --dependency-check-result "$dependencies" --clean-system "$clean" \
                --step-results "$publication/current-steps.json"
              python3 tools/emit_linux_publication_records.py --archives "$core_dir" \
                --receipt "$publication/current-receipt.json" --output "$publication/records"
              python3 tools/import_linux_publication_run.py --core-artifact "$bundle" \
                --run-id "$GITHUB_RUN_ID" --architecture "$PG_ARCHITECTURE" --postgresql-version "$PG_VERSION"
              echo 'records_imported=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo 'Archive-bound records unavailable; preserving available build and verification outcomes.'
          echo 'records_imported=false' >> "$GITHUB_OUTPUT"
          if [[ -s "$core" || -s "$vector" ]]; then
            python3 tools/import_linux_publication_run.py --core-artifact "$bundle" \
              --run-id "$GITHUB_RUN_ID" --architecture "$PG_ARCHITECTURE" --postgresql-version "$PG_VERSION"
          fi
      - name: Upload archives, provenance and verification outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgvector-linux-selected-${{ needs.select.outputs.postgresql_version }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/bundle/**
            support/evidence/linux-publication-${{ github.run_id }}/**
            support/verification/postgresql-${{ needs.select.outputs.postgresql_version }}-linux-${{ needs.select.outputs.architecture }}-current-paired-${{ github.run_id }}.json
            support/verification/pgvector-${{ needs.select.outputs.extension_version }}-postgresql-${{ needs.select.outputs.postgresql_version }}-linux-${{ needs.select.outputs.architecture }}-current-${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
      - name: Require final verification, no-host check, diagnostics and records
        if: always()
        env:
          CORE_RESOLUTION: ${{ needs.build.outputs.core_resolution }}
          EXTENSION_BUILD: ${{ needs.build.outputs.extension_build }}
          VERIFICATION: ${{ steps.verification.outcome }}
          NOHOST: ${{ steps.nohost.outcome }}
          DIAGNOSTICS: ${{ steps.diagnostics.outcome }}
          RECORDS: ${{ steps.records.outputs.records_imported }}
        run: |
          set -euo pipefail
          if [[ "$CORE_RESOLUTION" != success || "$EXTENSION_BUILD" != success || "$VERIFICATION" != success || "$NOHOST" != success || "$DIAGNOSTICS" != success || "$RECORDS" != true ]]; then
            echo "Selected pgvector Linux publication incomplete: core=$CORE_RESOLUTION build=$EXTENSION_BUILD verify=$VERIFICATION no-host=$NOHOST diagnostics=$DIAGNOSTICS records=$RECORDS." >&2
            exit 1
          fi
