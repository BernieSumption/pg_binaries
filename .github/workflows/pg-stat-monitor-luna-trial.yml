name: pg_stat_monitor Luna build iteration

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  trial:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check trial scripts
        run: bash -n scripts/pg_stat_monitor/*.sh
      - name: Download the PostgreSQL 18.6 x86-64 candidate archive
        uses: actions/download-artifact@v4
        with:
          name: linux-publication-x86_64-evidence
          run-id: 39081368117
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/core
      - name: Build unmodified upstream source in Docker
        run: bash scripts/pg_stat_monitor/linux-build.sh "$RUNNER_TEMP/core/pilot" "$RUNNER_TEMP/extension"
      - name: Verify final archives in Alpine
        run: bash scripts/pg_stat_monitor/linux-verify.sh "$RUNNER_TEMP/extension" "$RUNNER_TEMP/core/pilot"
      - name: Retain trial archive and static report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-stat-monitor-trial-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/extension/*.tar.gz
            ${{ runner.temp }}/extension/*.sha256
            ${{ runner.temp }}/extension/static-analysis/*.json
          if-no-files-found: warn
          retention-days: 7
