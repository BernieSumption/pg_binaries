name: pg_cron selected macOS publication

on:
  workflow_call:
    inputs:
      architecture:
        description: Native macOS architecture
        required: true
        type: string
      postgresql_version:
        description: Exact selected PostgreSQL release
        required: false
        type: string
        default: '18.6'
      extension_version:
        description: Exact selected pg_cron release
        required: false
        type: string
        default: '1.6.8'
  workflow_dispatch:
    inputs:
      architecture:
        description: Native macOS architecture
        required: true
        type: choice
        options: [arm64, x86_64]
        default: arm64
      postgresql_version:
        description: Exact selected PostgreSQL release
        required: true
        type: string
        default: '18.6'
      extension_version:
        description: Exact selected pg_cron release
        required: true
        type: string
        default: '1.6.8'

permissions:
  actions: read
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      architecture: ${{ steps.target.outputs.architecture }}
      platform: ${{ steps.target.outputs.platform }}
      postgresql_version: ${{ steps.target.outputs.postgresql_version }}
      extension_version: ${{ steps.target.outputs.extension_version }}
      target: ${{ steps.target.outputs.target }}
      runner: ${{ steps.target.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate the selected pg_cron target
        id: target
        env:
          ARCHITECTURE: ${{ inputs.architecture }}
          POSTGRESQL_VERSION: ${{ inputs.postgresql_version }}
          EXTENSION_VERSION: ${{ inputs.extension_version }}
        run: |
          set -euo pipefail
          [[ "$ARCHITECTURE" == arm64 || "$ARCHITECTURE" == x86_64 ]] || {
            echo "Unsupported macOS architecture: $ARCHITECTURE" >&2
            exit 1
          }
          [[ "$EXTENSION_VERSION" == 1.6.8 ]] || {
            echo 'This selected pg_cron macOS workflow supports pg_cron 1.6.8.' >&2
            exit 1
          }
          target="tools/pgcron_macos_targets/${POSTGRESQL_VERSION}-${ARCHITECTURE}.json"
          python3 tools/extension_archive_plan.py \
            --project pg_cron --platform "macos-$ARCHITECTURE" \
            --postgresql-version "$POSTGRESQL_VERSION" --github-output "$GITHUB_OUTPUT" \
            > "$RUNNER_TEMP/selection.json"
          python3 - "$target" "$ARCHITECTURE" "$POSTGRESQL_VERSION" "$RUNNER_TEMP/selection.json" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts/pg_cron")
          from macos_target import load_target
          target_path = Path(sys.argv[1])
          target = load_target(target_path)
          selection = json.loads(Path(sys.argv[4]).read_text())
          if target["architecture"] != sys.argv[2] or target["postgresql_version"] != sys.argv[3]:
              raise SystemExit("selected target does not match requested PostgreSQL release and architecture")
          if selection.get("selected_version") != target["pg_cron_version"]:
              raise SystemExit("selected pg_cron release does not match the configured macOS recipe")
          print(f"target={target_path}")
          print(f"architecture={target['architecture']}")
          print(f"platform={target['platform']}")
          print(f"postgresql_version={target['postgresql_version']}")
          print(f"extension_version={target['pg_cron_version']}")
          print("runner=macos-15" if target["architecture"] == "arm64" else "runner=macos-15-intel")
          PY

  build:
    needs: select
    runs-on: ${{ needs.select.outputs.runner }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the checked PostgreSQL core archive
        id: core
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/core-archives" "$RUNNER_TEMP/pgcron-build"
          cp '${{ needs.select.outputs.target }}' "$RUNNER_TEMP/pgcron-build/base-target.json"
          bash scripts/macos/resolve-core.sh \
            "$RUNNER_TEMP/pgcron-build/base-target.json" "$RUNNER_TEMP/core-archives"
      - name: Build and package pg_cron against the resolved core
        id: package
        if: always() && steps.core.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          bash scripts/pg_cron/build-macos.sh \
            "$RUNNER_TEMP/core-archives" "$RUNNER_TEMP/core-archives/target.json" \
            "$RUNNER_TEMP/pgcron-build" 2>&1 | tee "$RUNNER_TEMP/pgcron-build/build-log.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pgcron-macos-${{ needs.select.outputs.architecture }}-build-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/core-archives/**
            ${{ runner.temp }}/pgcron-build/**
          if-no-files-found: warn
          retention-days: 7
      - name: Require core resolution and archive build to pass
        if: always()
        run: |
          if [[ '${{ steps.core.outcome }}' != success || '${{ steps.package.outcome }}' != success ]]; then
            echo 'Checked PostgreSQL core resolution and pg_cron archive build must both pass.' >&2
            exit 1
          fi

  verify:
    needs: [select, build]
    if: always() && needs.select.result == 'success'
    runs-on: ${{ needs.select.outputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check pg_cron publication and target tooling
        run: python3 -m unittest tests/test_emit_pgcron_macos_publication.py tests/test_import_pgcron_macos_publication.py tests/test_pg_cron_macos_target.py
      - name: Download core and extension archives from the build runner
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pgcron-macos-${{ needs.select.outputs.architecture }}-build-${{ github.run_id }}
          path: ${{ runner.temp }}/pgcron-bundle
      - name: Prepare fresh-runner verification inputs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/core-archives" "$RUNNER_TEMP/pgcron-publication"
          if [[ -d "$RUNNER_TEMP/pgcron-bundle/core-archives" ]]; then cp -a "$RUNNER_TEMP/pgcron-bundle/core-archives/." "$RUNNER_TEMP/core-archives/"; fi
          if [[ -d "$RUNNER_TEMP/pgcron-bundle/pgcron-build" ]]; then cp -a "$RUNNER_TEMP/pgcron-bundle/pgcron-build/." "$RUNNER_TEMP/pgcron-publication/"; fi
      - name: Relocate, inspect and exercise the final archives on the fresh runner
        id: archive_suite
        if: always() && steps.download.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          bash scripts/pg_cron/verify-macos.sh \
            "$RUNNER_TEMP/core-archives" "$RUNNER_TEMP/pgcron-publication" \
            "$RUNNER_TEMP/core-archives/target.json" "$RUNNER_TEMP/pgcron-publication" \
            2>&1 | tee "$RUNNER_TEMP/pgcron-publication/verification-log.txt"
      - name: Validate static and Mach-O reports against final archive bytes
        id: static_analysis
        if: always() && steps.download.outcome == 'success'
        continue-on-error: true
        env:
          ARCHITECTURE: ${{ needs.select.outputs.architecture }}
          POSTGRESQL_VERSION: ${{ needs.select.outputs.postgresql_version }}
          EXTENSION_VERSION: ${{ needs.select.outputs.extension_version }}
        run: |
          python3 - "$RUNNER_TEMP/pgcron-publication/static-analysis.json" \
            "$RUNNER_TEMP/pgcron-publication/pg-cron-macho-inspection.json" \
            "$RUNNER_TEMP/core-archives/postgresql-${POSTGRESQL_VERSION}-macos-${ARCHITECTURE}.tar.gz" \
            "$RUNNER_TEMP/pgcron-publication/pg_cron-${EXTENSION_VERSION}-postgresql-${POSTGRESQL_VERSION}-macos-${ARCHITECTURE}.tar.gz" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          static_path, macho_path, *archives = map(pathlib.Path, sys.argv[1:])
          expected = {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in archives}
          static = json.loads(static_path.read_text())
          actual = static.get("archives", [])
          if isinstance(actual, list):
              actual = {item["basename"]: item["sha256"] for item in actual}
          if static.get("passed") is not True or not static.get("inspected_files") or actual != expected:
              raise SystemExit("PostgreSQL static analysis does not bind the final archive bytes")
          macho = json.loads(macho_path.read_text())
          libpq = {
              dependency: resolved
              for dependency, resolved in macho.get("dependencies", {}).items()
              if dependency.startswith("@rpath/libpq.5")
          }
          if (macho.get("passed") is not True or macho.get("archives") != expected
                  or len(libpq) != 1
                  or not pathlib.PurePosixPath(next(iter(libpq))).name.startswith("libpq.5.")
                  or pathlib.PurePosixPath(next(iter(libpq))).suffix != ".dylib"
                  or pathlib.PurePosixPath(next(iter(libpq.values()))).name
                      != pathlib.PurePosixPath(next(iter(libpq))).name
                  or not next(iter(libpq.values())).startswith("lib/")
                  or "@loader_path" not in macho.get("module_rpaths", [])):
              raise SystemExit("pg_cron Mach-O closure does not pass against final archive bytes")
          PY
      - name: Emit archive-bound verification attempt and receipt
        id: evidence
        if: always()
        continue-on-error: true
        env:
          ARCHIVE_SUITE_OUTCOME: ${{ steps.archive_suite.outcome }}
          STATIC_ANALYSIS_OUTCOME: ${{ steps.static_analysis.outcome }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 tools/emit_pgcron_macos_publication.py \
            --target-config "$RUNNER_TEMP/core-archives/target.json" \
            --core-archives "$RUNNER_TEMP/core-archives" \
            --archives "$RUNNER_TEMP/pgcron-publication" \
            --output "$RUNNER_TEMP/pgcron-publication" \
            --os-version "$(sw_vers -productVersion)" \
            --image-id "${ImageOS:-unknown}/${ImageVersion:-unknown}" \
            --archive-suite-result "${ARCHIVE_SUITE_OUTCOME:-failure}" \
            --static-analysis-result "${STATIC_ANALYSIS_OUTCOME:-failure}"
      - name: Import retained evidence when an attempt was emitted
        if: always()
        continue-on-error: true
        run: |
          if [[ -f "$RUNNER_TEMP/pgcron-publication/publication/attempt.json" ]]; then
            python3 tools/import_pgcron_macos_publication.py \
              --target-config "$RUNNER_TEMP/core-archives/target.json" \
              --core-artifact "$RUNNER_TEMP/core-archives" \
              --extension-artifact "$RUNNER_TEMP/pgcron-publication" \
              --run-id "$GITHUB_RUN_ID"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pgcron-macos-${{ needs.select.outputs.architecture }}-publication-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/core-archives/**
            ${{ runner.temp }}/pgcron-publication/*.tar.gz
            ${{ runner.temp }}/pgcron-publication/*.sha256
            ${{ runner.temp }}/pgcron-publication/*.json
            ${{ runner.temp }}/pgcron-publication/*.txt
            ${{ runner.temp }}/pgcron-publication/publication/**
            support/evidence/pgcron-macos-publication-${{ github.run_id }}/${{ needs.select.outputs.architecture }}/**
            support/verification/pg_cron-${{ needs.select.outputs.extension_version }}-postgresql-${{ needs.select.outputs.postgresql_version }}-macos-${{ needs.select.outputs.architecture }}-current-${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 7
      - name: Require fresh-runner verification to pass
        if: always()
        run: |
          if [[ '${{ needs.build.result }}' != success || '${{ steps.download.outcome }}' != success || '${{ steps.archive_suite.outcome }}' != success || '${{ steps.static_analysis.outcome }}' != success ]]; then
            echo 'pg_cron archive suite and static/Mach-O analysis must both pass on the fresh runner.' >&2
            exit 1
          fi
