name: Address Standardizer 3.7.0 PostgreSQL 15.19, 16.15 and 17.11 Linux candidate publication

on:
  workflow_dispatch:
    inputs:
      postgresql_version:
        description: PostgreSQL version
        type: choice
        options: ['15.19', '16.15', '17.11']
        default: '17.11'
        required: true
      architecture:
        description: Linux architecture
        type: choice
        options: [x86_64, arm64]
        default: x86_64
        required: true
  push:
    branches: [spike]
    paths:
      - '.github/workflows/address-standardizer-linux-15-17-publication.yml'
      - 'scripts/address_standardizer/linux-*'
      - 'scripts/address_standardizer/linux-probe.sql'
      - 'tools/check_elf_dependencies.py'
      - 'tools/emit_address_standardizer_linux_publication.py'
      - 'tools/import_address_standardizer_linux_publication.py'
      - 'tests/test_address_standardizer_linux_publication.py'
      - 'support/verification-profiles.json'
      - 'support.json'
      - 'support/postgresql-releases.json'

permissions:
  actions: read
  contents: read

jobs:
  scope_15_x86_64:
    if: github.event_name != 'workflow_dispatch' || (inputs.postgresql_version == '15.19' && inputs.architecture == 'x86_64')
    uses: ./.github/workflows/profile-change-scope.yml
    with:
      profile_id: address-standardizer-publication-linux-x86_64-15.19
  scope_15_arm64:
    if: github.event_name != 'workflow_dispatch' || (inputs.postgresql_version == '15.19' && inputs.architecture == 'arm64')
    uses: ./.github/workflows/profile-change-scope.yml
    with:
      profile_id: address-standardizer-publication-linux-arm64-15.19
  scope_16_x86_64:
    if: github.event_name != 'workflow_dispatch' || (inputs.postgresql_version == '16.15' && inputs.architecture == 'x86_64')
    uses: ./.github/workflows/profile-change-scope.yml
    with:
      profile_id: address-standardizer-publication-linux-x86_64-16.15
  scope_16_arm64:
    if: github.event_name != 'workflow_dispatch' || (inputs.postgresql_version == '16.15' && inputs.architecture == 'arm64')
    uses: ./.github/workflows/profile-change-scope.yml
    with:
      profile_id: address-standardizer-publication-linux-arm64-16.15
  scope_17_x86_64:
    if: github.event_name != 'workflow_dispatch' || (inputs.postgresql_version == '17.11' && inputs.architecture == 'x86_64')
    uses: ./.github/workflows/profile-change-scope.yml
    with:
      profile_id: address-standardizer-publication-linux-x86_64-17.11
  scope_17_arm64:
    if: github.event_name != 'workflow_dispatch' || (inputs.postgresql_version == '17.11' && inputs.architecture == 'arm64')
    uses: ./.github/workflows/profile-change-scope.yml
    with:
      profile_id: address-standardizer-publication-linux-arm64-17.11

  plan:
    needs: [scope_15_x86_64, scope_15_arm64, scope_16_x86_64, scope_16_arm64, scope_17_x86_64, scope_17_arm64]
    if: always()
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      has_targets: ${{ steps.targets.outputs.has_targets }}
    steps:
      - id: targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          PG_VERSION: ${{ inputs.postgresql_version }}
          ARCHITECTURE: ${{ inputs.architecture }}
          RUN_15_X86_64: ${{ needs.scope_15_x86_64.outputs.should_run }}
          RUN_15_ARM64: ${{ needs.scope_15_arm64.outputs.should_run }}
          RUN_16_X86_64: ${{ needs.scope_16_x86_64.outputs.should_run }}
          RUN_16_ARM64: ${{ needs.scope_16_arm64.outputs.should_run }}
          RUN_17_X86_64: ${{ needs.scope_17_x86_64.outputs.should_run }}
          RUN_17_ARM64: ${{ needs.scope_17_arm64.outputs.should_run }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          versions = {"15.19": "15", "16.15": "16", "17.11": "17"}
          targets = []
          for version, prefix in versions.items():
              for architecture in ("x86_64", "arm64"):
                  if os.environ["EVENT_NAME"] == "workflow_dispatch":
                      selected = version == os.environ["PG_VERSION"] and architecture == os.environ["ARCHITECTURE"]
                  else:
                      suffix = "X86_64" if architecture == "x86_64" else "ARM64"
                      selected = os.environ[f"RUN_{prefix}_{suffix}"] == "true"
                  if selected:
                      targets.append({"postgresql_version": version, "architecture": architecture})
          has_targets = bool(targets)
          if not targets:
              targets = [{"postgresql_version": "17.11", "architecture": "x86_64"}]
          print("has_targets=" + str(has_targets).lower())
          print("matrix=" + json.dumps({"include": targets}, separators=(",", ":")))
          PY

  publish:
    needs: plan
    if: needs.plan.outputs.has_targets == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      PG_ARCHITECTURE: ${{ matrix.architecture }}
      PG_VERSION: ${{ matrix.postgresql_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate candidate evidence tooling
        run: python -B -m unittest tests/test_address_standardizer_linux_publication.py
      - name: Download pinned PostgreSQL core archive
        uses: actions/download-artifact@v4
        with:
          name: linux-publication-${{ matrix.architecture }}-evidence
          run-id: ${{ matrix.postgresql_version == '15.19' && '39082151857' || matrix.postgresql_version == '16.15' && '39082147531' || '39082111630' }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/core
      - name: Build final archive from pinned upstream sources
        id: build
        continue-on-error: true
        run: bash scripts/address_standardizer/linux-build.sh "$RUNNER_TEMP/core/pilot" "$RUNNER_TEMP/address-standardizer"
      - name: Run relocated Alpine SQL probe and inspect ELF closure
        id: verify
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          bash scripts/address_standardizer/linux-verify.sh "$RUNNER_TEMP/address-standardizer" "$RUNNER_TEMP/core/pilot" 2>&1 | tee "$RUNNER_TEMP/address-standardizer/probe-output.txt"
      - name: Emit attempt and archive-bound verification record
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/address-standardizer/publication"
          python tools/emit_address_standardizer_linux_publication.py \
            --archives "$RUNNER_TEMP/address-standardizer" --core-archives "$RUNNER_TEMP/core/pilot" \
            --output "$RUNNER_TEMP/address-standardizer/publication" --architecture "$PG_ARCHITECTURE" \
            --postgresql-version "$PG_VERSION" --build-result "${BUILD_RESULT:-skipped}" --verify-result "${VERIFY_RESULT:-skipped}" \
            --image-id "$(docker image inspect pg-binaries-address-standardizer-alpine-probe --format '{{.Id}}' 2>/dev/null || echo unavailable)" \
            --kernel-release "$(uname -r)"
      - name: Validate and retain candidate evidence
        if: always()
        run: python tools/import_address_standardizer_linux_publication.py --core-archives "$RUNNER_TEMP/core/pilot" --archives "$RUNNER_TEMP/address-standardizer" --run-id "$GITHUB_RUN_ID"
      - name: Upload candidate archive and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: address-standardizer-3.7.0-postgresql-${{ matrix.postgresql_version }}-linux-${{ matrix.architecture }}-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/address-standardizer/*.tar.gz
            ${{ runner.temp }}/address-standardizer/*.sha256
            ${{ runner.temp }}/address-standardizer/*.txt
            ${{ runner.temp }}/address-standardizer/*.json
            ${{ runner.temp }}/address-standardizer/static-analysis/**
            ${{ runner.temp }}/address-standardizer/publication/**
            support/evidence/address-standardizer-linux-publication-${{ github.run_id }}/**
          if-no-files-found: warn
          retention-days: 7
      - name: Require relocated archive tests and ELF closure to pass
        if: always()
        run: test '${{ steps.verify.outcome }}' = success
