name: pgAudit Linux feasibility pilot
on:
  push:
    branches: [spike]
    paths:
      - '.github/workflows/pgaudit-linux-pilot.yml'
      - 'scripts/pgaudit/**'
      - 'scripts/linux/**'
      - 'tools/check_elf_dependencies.py'
      - 'tools/source_archive.py'
      - 'support.json'
      - 'support/postgresql-releases.json'

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 70
    permissions:
      contents: read
    env:
      PG_ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v4
      - name: Build exact PostgreSQL 18.6 core archive
        id: core_build
        run: scripts/linux/build.sh "$RUNNER_TEMP/core"
      - name: Build pgAudit 18.0 from upstream source
        id: pgaudit_build
        run: bash scripts/pgaudit/build.sh "$RUNNER_TEMP/core" "$RUNNER_TEMP/pgaudit"
      - name: Verify final archives in Alpine 3.22
        id: pgaudit_verify
        run: bash scripts/pgaudit/verify.sh "$RUNNER_TEMP/core" "$RUNNER_TEMP/pgaudit"
      - name: Record core archive identity
        id: archive_identity
        run: cp "$RUNNER_TEMP/core/postgresql-18.6-linux-$PG_ARCHITECTURE.tar.gz.sha256" "$RUNNER_TEMP/pgaudit/"
      - name: Record raw attempt outcomes
        if: always()
        env:
          CORE_BUILD_OUTCOME: ${{ steps.core_build.outcome }}
          PGAUDIT_BUILD_OUTCOME: ${{ steps.pgaudit_build.outcome }}
          PGAUDIT_VERIFY_OUTCOME: ${{ steps.pgaudit_verify.outcome }}
          ARCHIVE_IDENTITY_OUTCOME: ${{ steps.archive_identity.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pgaudit-attempt"
          python3 - "$RUNNER_TEMP/pgaudit-attempt/step-outcomes.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          result = {
              "schema_version": 1,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "source_revision": os.environ["GITHUB_SHA"],
              "postgresql_version": "18.6",
              "pgaudit_version": "18.0",
              "architecture": os.environ["PG_ARCHITECTURE"],
              "steps": {
                  "core_build": os.environ["CORE_BUILD_OUTCOME"],
                  "pgaudit_build": os.environ["PGAUDIT_BUILD_OUTCOME"],
                  "pgaudit_verify": os.environ["PGAUDIT_VERIFY_OUTCOME"],
                  "archive_identity": os.environ["ARCHIVE_IDENTITY_OUTCOME"],
              },
          }
          Path(sys.argv[1]).write_text(json.dumps(result, indent=2, sort_keys=True) + "\n",
                                       encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pgaudit-linux-18.6-${{ matrix.architecture }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pgaudit-attempt/step-outcomes.json
            ${{ runner.temp }}/pgaudit/*.tar.gz
            ${{ runner.temp }}/pgaudit/*.sha256
            ${{ runner.temp }}/pgaudit/static-analysis/*.json
          if-no-files-found: warn
          retention-days: 3
