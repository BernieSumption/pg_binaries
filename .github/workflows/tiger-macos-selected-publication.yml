name: TIGER Geocoder selected macOS publication

on:
  workflow_call:
    inputs:
      postgresql_version:
        required: true
        type: string
      extension_version:
        required: true
        type: string
      architecture:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      postgresql_version:
        description: Selected PostgreSQL release
        required: true
        type: choice
        options: ['16.15', '17.11', '18.6']
        default: '18.6'
      extension_version:
        description: TIGER Geocoder release
        required: true
        type: choice
        options: ['2025.2']
        default: '2025.2'
      architecture:
        description: Native macOS architecture
        required: true
        type: choice
        options: [arm64, x86_64]
        default: arm64

permissions:
  actions: read
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      postgresql_version: ${{ steps.target.outputs.postgresql_version }}
      architecture: ${{ steps.target.outputs.architecture }}
      runner: ${{ steps.target.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - id: target
        env:
          PG_VERSION: ${{ inputs.postgresql_version }}
          EXT_VERSION: ${{ inputs.extension_version }}
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          set -euo pipefail
          [[ "$PG_VERSION" == 16.15 || "$PG_VERSION" == 17.11 || "$PG_VERSION" == 18.6 ]]
          [[ "$EXT_VERSION" == 2025.2 ]]
          [[ "$ARCHITECTURE" == arm64 || "$ARCHITECTURE" == x86_64 ]]
          python3 tools/extension_archive_plan.py --project "PostGIS TIGER Geocoder" \
            --extension-version "$EXT_VERSION" --platform "macos-$ARCHITECTURE" \
            --postgresql-version "$PG_VERSION" --github-output "$GITHUB_OUTPUT" \
            > "$RUNNER_TEMP/selection.json"
          echo "architecture=$ARCHITECTURE" >> "$GITHUB_OUTPUT"
          if [[ "$ARCHITECTURE" == arm64 ]]; then echo 'runner=macos-15' >> "$GITHUB_OUTPUT"; else echo 'runner=macos-15-intel' >> "$GITHUB_OUTPUT"; fi

  postgis:
    needs: select
    uses: ./.github/workflows/postgis-macos-selected-publication.yml
    with:
      postgresql_version: ${{ needs.select.outputs.postgresql_version }}
      extension_version: '3.6.4'
      architecture: ${{ needs.select.outputs.architecture }}

  build:
    needs: [select, postgis]
    runs-on: ${{ needs.select.outputs.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact core used by the selected PostGIS build
        uses: actions/download-artifact@v4
        with:
          name: postgis-macos-${{ needs.select.outputs.architecture }}-${{ needs.select.outputs.postgresql_version }}-build-${{ github.run_id }}
          path: ${{ runner.temp }}/postgis-bundle
      - name: Stage the PostGIS core archive and target
        env:
          PG_VERSION: ${{ needs.select.outputs.postgresql_version }}
          ARCHITECTURE: ${{ needs.select.outputs.architecture }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tiger/core" "$RUNNER_TEMP/tiger/output"
          core="postgresql-$PG_VERSION-macos-$ARCHITECTURE.tar.gz"
          cp "$RUNNER_TEMP/postgis-bundle/core/$core" "$RUNNER_TEMP/tiger/core/"
          cp "$RUNNER_TEMP/postgis-bundle/core/$core.sha256" "$RUNNER_TEMP/tiger/core/"
          cp "$RUNNER_TEMP/postgis-bundle/core/target.json" "$RUNNER_TEMP/tiger/core/"
      - name: Build and package TIGER Geocoder 2025.2
        env:
          PG_VERSION: ${{ needs.select.outputs.postgresql_version }}
          ARCHITECTURE: ${{ needs.select.outputs.architecture }}
        run: bash scripts/tiger/macos-build.sh "$RUNNER_TEMP/tiger/core" "$RUNNER_TEMP/tiger/output" "$PG_VERSION" "$ARCHITECTURE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiger-macos-${{ needs.select.outputs.architecture }}-${{ needs.select.outputs.postgresql_version }}-build-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/tiger/core/**
            ${{ runner.temp }}/tiger/output/**
          if-no-files-found: warn
          retention-days: 7

  verify:
    needs: [select, postgis, build]
    if: always() && needs.select.result == 'success' && needs.postgis.result == 'success' && needs.build.result == 'success'
    runs-on: ${{ needs.select.outputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download TIGER build archives
        uses: actions/download-artifact@v4
        with:
          name: tiger-macos-${{ needs.select.outputs.architecture }}-${{ needs.select.outputs.postgresql_version }}-build-${{ github.run_id }}
          path: ${{ runner.temp }}/tiger
      - name: Download exact PostGIS prerequisite archive
        uses: actions/download-artifact@v4
        with:
          name: postgis-macos-${{ needs.select.outputs.architecture }}-${{ needs.select.outputs.postgresql_version }}-build-${{ github.run_id }}
          path: ${{ runner.temp }}/postgis-bundle
      - name: Relocate and exercise the final PostGIS and TIGER archives
        env:
          PG_VERSION: ${{ needs.select.outputs.postgresql_version }}
          ARCHITECTURE: ${{ needs.select.outputs.architecture }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tiger/verification/postgis"
          cp "$RUNNER_TEMP/postgis-bundle/output/postgis-3.6.4-postgresql-$PG_VERSION-macos-$ARCHITECTURE.tar.gz" "$RUNNER_TEMP/tiger/verification/postgis/"
          cp "$RUNNER_TEMP/postgis-bundle/output/postgis-3.6.4-postgresql-$PG_VERSION-macos-$ARCHITECTURE.tar.gz.sha256" "$RUNNER_TEMP/tiger/verification/postgis/"
          bash scripts/tiger/macos-verify.sh \
            "$RUNNER_TEMP/tiger/core" \
            "$RUNNER_TEMP/tiger/verification/postgis/postgis-3.6.4-postgresql-$PG_VERSION-macos-$ARCHITECTURE.tar.gz" \
            "$RUNNER_TEMP/tiger/output/postgis_tiger_geocoder-2025.2-postgresql-$PG_VERSION-macos-$ARCHITECTURE.tar.gz" \
            "$RUNNER_TEMP/tiger/verification" "$PG_VERSION" "$ARCHITECTURE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiger-macos-${{ needs.select.outputs.architecture }}-${{ needs.select.outputs.postgresql_version }}-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/tiger/**
          if-no-files-found: warn
          retention-days: 30
