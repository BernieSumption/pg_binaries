name: Address Standardizer Windows feasibility probe

on:
  workflow_dispatch:
  push:
    branches: [spike]
    paths:
      - '.github/workflows/address-standardizer-windows-probe.yml'
      - 'scripts/address_standardizer/windows-probe.ps1'
      - 'scripts/address_standardizer/probe.sql'

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Run pinned Windows feasibility probe
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_OUTPUT: ${{ runner.temp }}/address-standardizer-results
        run: ./scripts/address_standardizer/windows-probe.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: address-standardizer-windows-x86_64-probe
          path: ${{ runner.temp }}/address-standardizer-results/**
          if-no-files-found: warn
          retention-days: 3
