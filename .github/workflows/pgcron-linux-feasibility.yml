name: pg_cron Linux feasibility
on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Native runner architecture
        required: true
        default: x86_64
        type: choice
        options: [x86_64, arm64]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(github.event_name == 'push' && '["x86_64"]' || format('["{0}"]', inputs.architecture)) }}
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    env:
      PG_ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v4
      - name: Reuse a verified PostgreSQL 18.6 core archive when available
        id: core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/reuse_linux_core_artifact.py \
            --postgresql-version 18.6 --architecture "$PG_ARCHITECTURE" \
            --output "$RUNNER_TEMP/core" --github-output "$GITHUB_OUTPUT"
      - name: Build PostgreSQL 18.6 core archive when reuse is unavailable
        if: steps.core.outputs.reused != 'true'
        id: core_build
        run: scripts/linux/build.sh "$RUNNER_TEMP/core"
      - name: Build pg_cron 1.6.8 from pinned upstream source
        id: extension_build
        run: bash scripts/pg_cron/build.sh "$RUNNER_TEMP/core" "$RUNNER_TEMP/pg_cron"
      - name: Verify relocated archive and scheduled background worker in Alpine 3.22
        id: extension_verify
        run: bash scripts/pg_cron/verify.sh "$RUNNER_TEMP/core" "$RUNNER_TEMP/pg_cron"
      - name: Record PostgreSQL core archive identity
        id: archive_identity
        run: cp "$RUNNER_TEMP/core/postgresql-18.6-linux-$PG_ARCHITECTURE.tar.gz.sha256" "$RUNNER_TEMP/pg_cron/"
      - name: Record pilot outcomes
        if: always()
        env:
          CORE_REUSE_OUTCOME: ${{ steps.core.outcome }}
          CORE_BUILD_OUTCOME: ${{ steps.core_build.outcome }}
          EXTENSION_BUILD_OUTCOME: ${{ steps.extension_build.outcome }}
          EXTENSION_VERIFY_OUTCOME: ${{ steps.extension_verify.outcome }}
          ARCHIVE_IDENTITY_OUTCOME: ${{ steps.archive_identity.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pg-cron-attempt"
          python3 - "$RUNNER_TEMP/pg-cron-attempt/step-outcomes.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          result = {
              "schema_version": 1,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "source_revision": os.environ["GITHUB_SHA"],
              "postgresql_version": "18.6",
              "pg_cron_version": "1.6.8",
              "architecture": os.environ["PG_ARCHITECTURE"],
              "steps": {
                  "core_reuse": os.environ["CORE_REUSE_OUTCOME"],
                  "core_build": os.environ["CORE_BUILD_OUTCOME"],
                  "extension_build": os.environ["EXTENSION_BUILD_OUTCOME"],
                  "extension_verify": os.environ["EXTENSION_VERIFY_OUTCOME"],
                  "archive_identity": os.environ["ARCHIVE_IDENTITY_OUTCOME"],
              },
          }
          Path(sys.argv[1]).write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pg-cron-linux-18.6-${{ matrix.architecture }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pg-cron-attempt/step-outcomes.json
            ${{ runner.temp }}/pg_cron/*.tar.gz
            ${{ runner.temp }}/pg_cron/*.sha256
            ${{ runner.temp }}/pg_cron/static-analysis/*.json
          if-no-files-found: warn
          retention-days: 3
