name: HypoPG macOS arm64 feasibility

on:
  workflow_dispatch:
  push:
    branches: [spike]
    paths:
      - '.github/workflows/hypopg-macos-arm64-feasibility.yml'
      - 'scripts/hypopg/macos-feasibility.sh'
      - 'scripts/hypopg/macos-probe.sql'
      - 'scripts/macos/static_analysis.py'

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download the passed PostgreSQL 18.6 Apple Silicon artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-pilot-archives
          run-id: 39075939632
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/core-archives
      - name: Build and verify HypoPG against the archived core
        run: bash scripts/hypopg/macos-feasibility.sh "$RUNNER_TEMP/core-archives" "$RUNNER_TEMP/hypopg-feasibility"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hypopg-macos-arm64-feasibility-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hypopg-feasibility/*.tar.gz
            ${{ runner.temp }}/hypopg-feasibility/*.sha256
            ${{ runner.temp }}/hypopg-feasibility/*.json
            ${{ runner.temp }}/hypopg-feasibility/*.txt
          if-no-files-found: warn
          retention-days: 7
