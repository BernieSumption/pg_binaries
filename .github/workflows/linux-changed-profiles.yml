name: Linux changed-profile scheduler

on:
  workflow_dispatch:
    inputs:
      project:
        description: Optional exact project for a targeted rerun
        required: false
        type: string
      postgresql_version:
        description: Optional exact selected PostgreSQL release
        required: false
        type: string
      architecture:
        description: Optional Linux architecture
        required: false
        type: string
  push:
    branches: [spike]

permissions:
  actions: read
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      core_targets: ${{ steps.plan.outputs.core_targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          REQUEST_PROJECT: ${{ inputs.project }}
          REQUEST_POSTGRESQL_VERSION: ${{ inputs.postgresql_version }}
          REQUEST_ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          set -euo pipefail
          filters=()
          if [[ -n "$REQUEST_PROJECT" ]]; then filters+=(--project "$REQUEST_PROJECT"); fi
          if [[ -n "$REQUEST_POSTGRESQL_VERSION" ]]; then filters+=(--postgresql-version "$REQUEST_POSTGRESQL_VERSION"); fi
          if [[ -n "$REQUEST_ARCHITECTURE" ]]; then filters+=(--architecture "$REQUEST_ARCHITECTURE"); fi
          before_root="$RUNNER_TEMP/profile-before"
          if [[ -z "$EVENT_BEFORE" || "$EVENT_BEFORE" =~ ^0+$ ]]; then
            python3 tools/linux_changed_profiles.py \
              --current-root "$GITHUB_WORKSPACE" \
              "${filters[@]}" \
              --github-output "$GITHUB_OUTPUT"
          elif ! git worktree add --detach "$before_root" "$EVENT_BEFORE"; then
            echo 'Could not materialize the event base; selecting all routed Linux targets.' >&2
            python3 tools/linux_changed_profiles.py \
              --current-root "$GITHUB_WORKSPACE" \
              "${filters[@]}" \
              --github-output "$GITHUB_OUTPUT"
          else
            python3 tools/linux_changed_profiles.py \
              --before-root "$before_root" \
              --current-root "$GITHUB_WORKSPACE" \
              "${filters[@]}" \
              --github-output "$GITHUB_OUTPUT"
          fi

  publish:
    needs: select
    if: needs.select.outputs.targets != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.select.outputs.targets) }}
    uses: ./.github/workflows/selected-extension-publication.yml
    with:
      project: ${{ matrix.project }}
      extension_version: ${{ matrix.extension_version }}
      postgresql_version: ${{ matrix.postgresql_version }}
      platform: ${{ matrix.platform }}

  publish-core:
    needs: select
    if: needs.select.outputs.core_targets != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.select.outputs.core_targets) }}
    uses: ./.github/workflows/postgresql-linux-selected-publication.yml
    with:
      postgresql_version: ${{ matrix.postgresql_version }}
      architecture: ${{ matrix.platform == 'linux-arm64' && 'arm64' || 'x86_64' }}
