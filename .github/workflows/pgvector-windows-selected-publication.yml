name: pgvector selected Windows publication

on:
  push:
    branches: [spike]
    paths:
      - .github/workflows/pgvector-windows-selected-publication.yml
      - scripts/windows/diagnostics.ps1
  workflow_call:
    inputs:
      postgresql_version:
        description: Exact selected PostgreSQL release
        required: true
        type: string
      extension_version:
        description: Exact selected pgvector release
        required: true
        type: string
  workflow_dispatch:
    inputs:
      postgresql_version:
        description: Exact selected PostgreSQL release
        required: true
        type: string
      extension_version:
        description: Exact selected pgvector release
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      postgresql_version: ${{ steps.plan.outputs.postgresql_version }}
      extension_version: ${{ steps.plan.outputs.selected_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate the exact selected target
        id: plan
        env:
          POSTGRESQL_VERSION: ${{ inputs.postgresql_version || '18.6' }}
          EXTENSION_VERSION: ${{ inputs.extension_version || '0.8.7' }}
        run: |
          set -euo pipefail
          test -n "$POSTGRESQL_VERSION"
          test -n "$EXTENSION_VERSION"
          python3 tools/extension_archive_plan.py \
            --project pgvector --platform windows-x86_64 \
            --postgresql-version "$POSTGRESQL_VERSION" --extension-version "$EXTENSION_VERSION" \
            --github-output "$GITHUB_OUTPUT" > "$RUNNER_TEMP/selection.json"
          selected=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["selected_version"])' "$RUNNER_TEMP/selection.json")
          if [[ "$selected" != "$EXTENSION_VERSION" || "$selected" != '0.8.7' ]]; then
            echo "Windows recipe supports pgvector 0.8.7; planner selected $selected." >&2
            exit 1
          fi

  build:
    needs: select
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      PG_VERSION: ${{ needs.select.outputs.postgresql_version }}
      PGVECTOR_VERSION: ${{ needs.select.outputs.extension_version }}
      BUILD_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve the checked PostgreSQL core pin
        id: core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $identity = python tools/windows_core_pin.py --postgresql-version $env:PG_VERSION --github-output
          if ($LASTEXITCODE -ne 0) { throw 'Checked PostgreSQL core pin is invalid.' }
          $identity | Add-Content $env:GITHUB_OUTPUT
      - name: Download the checked PostgreSQL core archive and symbols
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $coreDir = Join-Path $env:RUNNER_TEMP 'core'
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          $producerDir = Join-Path $env:RUNNER_TEMP 'core-producer'
          New-Item -ItemType Directory -Force $coreDir | Out-Null
          gh run download ${{ steps.core.outputs.run_id }} --repo $env:GITHUB_REPOSITORY --name '${{ steps.core.outputs.artifact_name }}' --dir $producerDir
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the checked PostgreSQL core artifact.' }
          $archiveName = '${{ steps.core.outputs.archive_name }}'
          Copy-Item (Join-Path $producerDir $archiveName) (Join-Path 'dist/windows' $archiveName) -Force
          Copy-Item (Join-Path $producerDir "$archiveName.sha256") (Join-Path 'dist/windows' "$archiveName.sha256") -Force
          python tools/stage_windows_core_symbols.py $producerDir (Join-Path $env:RUNNER_TEMP 'core-symbols') $archiveName
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage symbols for the checked PostgreSQL core archive.' }
      - name: Fetch and build pgvector against the checked PostgreSQL core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $coreName = '${{ steps.core.outputs.archive_name }}'
          $coreArchive = Join-Path 'dist/windows' $coreName
          $sourceUrl = python tools/source_archive.py pgvector $env:PGVECTOR_VERSION tar.gz --field url
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the selected pgvector source archive.' }
          $sourceArchive = Join-Path $env:RUNNER_TEMP "pgvector-$env:PGVECTOR_VERSION.tar.gz"
          Invoke-WebRequest -Uri $sourceUrl -OutFile $sourceArchive
          ./scripts/pgvector/windows-build.ps1 -CoreArchive $coreArchive -CoreSha256 '${{ steps.core.outputs.sha256 }}' -CoreSymbolsDirectory (Join-Path $env:RUNNER_TEMP 'core-symbols') -SourceArchive $sourceArchive -PostgreSQLVersion $env:PG_VERSION -PgvectorVersion $env:PGVECTOR_VERSION -OutputDirectory dist/windows
          if ($LASTEXITCODE -ne 0) { throw 'Selected pgvector Windows build failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: pgvector-windows-built-${{ needs.select.outputs.postgresql_version }}-${{ github.run_id }}
          path: |
            dist/windows/postgresql-${{ needs.select.outputs.postgresql_version }}-windows-x86_64.tar.gz
            dist/windows/postgresql-${{ needs.select.outputs.postgresql_version }}-windows-x86_64.tar.gz.sha256
            dist/windows/pgvector-${{ needs.select.outputs.extension_version }}-postgresql-${{ needs.select.outputs.postgresql_version }}-windows-x86_64.tar.gz
            dist/windows/pgvector-${{ needs.select.outputs.extension_version }}-postgresql-${{ needs.select.outputs.postgresql_version }}-windows-x86_64.tar.gz.sha256
            dist/windows/debug-symbols/**
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: [select, build]
    if: always() && needs.select.result == 'success'
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PG_VERSION: ${{ needs.select.outputs.postgresql_version }}
      PGVECTOR_VERSION: ${{ needs.select.outputs.extension_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the built archive bytes
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pgvector-windows-built-${{ needs.select.outputs.postgresql_version }}-${{ github.run_id }}
          path: dist/windows
      - name: Verify transferred PDBs against final archive bytes
        id: symbols
        if: always() && steps.download.outcome == 'success'
        continue-on-error: true
        run: python tools/create_windows_symbols.py "dist/windows/postgresql-$env:PG_VERSION-windows-x86_64.tar.gz" "dist/windows/pgvector-$env:PGVECTOR_VERSION-postgresql-$env:PG_VERSION-windows-x86_64.tar.gz" --output-dir dist/windows/debug-symbols --verify-only
      - name: Verify final archives after relocation and PostgreSQL extension use
        id: archive_verify
        if: always() && steps.download.outcome == 'success'
        continue-on-error: true
        env:
          PE_STATIC_ANALYSIS_REPORT: ${{ runner.temp }}/pgvector-windows-verification/static-analysis.json
        run: ./scripts/windows/verify.ps1
      - name: Verify representative Windows failure diagnostics
        id: diagnostics
        if: always() && steps.download.outcome == 'success'
        continue-on-error: true
        run: ./scripts/windows/diagnostics.ps1 -ArchiveDirectory dist/windows -PostgreSQLVersion $env:PG_VERSION -PgvectorVersion $env:PGVECTOR_VERSION -ReportPath (Join-Path $env:RUNNER_TEMP 'pgvector-windows-verification/diagnostics.json')
      - name: Emit and retain archive-bound records or the failed attempt
        id: evidence
        if: always()
        continue-on-error: true
        env:
          ARCHIVE_OUTCOME: ${{ steps.archive_verify.outcome }}
          SYMBOLS_OUTCOME: ${{ steps.symbols.outcome }}
          DIAGNOSTICS_OUTCOME: ${{ steps.diagnostics.outcome }}
        run: |
          $recordDir = Join-Path $env:RUNNER_TEMP 'pgvector-windows-verification'
          New-Item -ItemType Directory -Force $recordDir | Out-Null
          $raw = [ordered]@{
            run_id = $env:GITHUB_RUN_ID
            source_revision = $env:GITHUB_SHA
            steps = [ordered]@{
              'archive-suite' = $(if ($env:ARCHIVE_OUTCOME) { $env:ARCHIVE_OUTCOME } else { 'skipped' })
              symbols = $(if ($env:SYMBOLS_OUTCOME) { $env:SYMBOLS_OUTCOME } else { 'skipped' })
              diagnostics = $(if ($env:DIAGNOSTICS_OUTCOME) { $env:DIAGNOSTICS_OUTCOME } else { 'skipped' })
            }
          }
          $raw | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 (Join-Path $recordDir 'publication-attempt.json')
          $results = [ordered]@{}
          foreach ($case in $raw.steps.Keys) {
            $results[$case] = switch ($raw.steps[$case]) {
              'success' { 'passed' }
              'failure' { 'failed' }
              default { 'skipped' }
            }
          }
          $stepsPath = Join-Path $recordDir 'publication-steps.json'
          $results | ConvertTo-Json -Depth 2 | Set-Content -Encoding utf8 $stepsPath
          $pgArchive = Join-Path 'dist/windows' "postgresql-$env:PG_VERSION-windows-x86_64.tar.gz"
          $vectorArchive = Join-Path 'dist/windows' "pgvector-$env:PGVECTOR_VERSION-postgresql-$env:PG_VERSION-windows-x86_64.tar.gz"
          $reportPaths = @(
            (Join-Path $recordDir 'static-analysis.json'),
            (Join-Path 'dist/windows/debug-symbols' 'index.json'),
            (Join-Path $recordDir 'diagnostics.json')
          )
          if (@($results.Values | Where-Object { $_ -ne 'passed' }).Count -eq 0 -and
              (Test-Path $pgArchive -PathType Leaf) -and (Test-Path $vectorArchive -PathType Leaf) -and
              @($reportPaths | Where-Object { -not (Test-Path $_ -PathType Leaf) }).Count -eq 0) {
            $imageId = "$env:ImageOS/$env:ImageVersion"
            python tools/emit_windows_publication_records.py --archives dist/windows --output (Join-Path $recordDir 'publication') --postgresql-version $env:PG_VERSION --revision $env:GITHUB_SHA --os-version ([System.Environment]::OSVersion.Version.ToString()) --image-id $imageId --step-results $stepsPath --static-report $reportPaths[0] --symbol-report $reportPaths[1] --diagnostic-report $reportPaths[2] --dependency-checks-passed ($env:ARCHIVE_OUTCOME -eq 'success').ToString().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0) { throw 'Windows publication record emission failed' }
          }
          python tools/import_windows_publication.py --build-artifact dist/windows --verification-artifact $recordDir --run-id $env:GITHUB_RUN_ID --postgresql-version $env:PG_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Windows publication evidence import failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pgvector-windows-verification-${{ needs.select.outputs.postgresql_version }}-${{ github.run_id }}
          path: |
            dist/windows/verification/*.json
            ${{ runner.temp }}/pgvector-windows-verification/*.json
            ${{ runner.temp }}/pgvector-windows-verification/publication/*.json
            support/evidence/windows-publication-${{ github.run_id }}/**
            support/verification/*-current-${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 7
      - name: Require fresh-runner verification and retained publication evidence
        if: always()
        run: |
          if ('${{ needs.build.result }}' -ne 'success' -or '${{ steps.download.outcome }}' -ne 'success' -or
              '${{ steps.symbols.outcome }}' -ne 'success' -or '${{ steps.archive_verify.outcome }}' -ne 'success' -or
              '${{ steps.diagnostics.outcome }}' -ne 'success' -or '${{ steps.evidence.outcome }}' -ne 'success') {
            throw 'Selected Windows pgvector verification and retained evidence must pass'
          }
