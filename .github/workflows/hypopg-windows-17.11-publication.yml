name: hypopg 1.4.3 PostgreSQL 17.11 Windows x86-64 candidate publication

on:
  workflow_dispatch:
  push:
    branches: [spike]
    paths:
      - '.gitattributes'
      - '.github/workflows/profile-change-scope.yml'
      - 'tools/profile_change_gate.py'
      - 'tests/test_profile_change_gate.py'
      - '.github/workflows/hypopg-windows-17.11-publication.yml'
      - 'scripts/hypopg/windows-feasibility.ps1'
      - 'scripts/hypopg/verify-windows-publication.ps1'
      - 'scripts/hypopg/probe.sql'
      - 'tools/windows_core_pin.py'
      - 'support/windows-core-pins/17.11-x86_64.json'
      - 'tools/check_hypopg_windows_archive.py'
      - 'tools/check_pe_dependencies.py'
      - 'tools/coverage.py'
      - 'tools/emit_hypopg_windows_publication.py'
      - 'tools/import_hypopg_windows_publication.py'
      - 'tests/test_check_pe_dependencies.py'
      - 'tests/test_hypopg_windows_publication.py'
      - 'support/verification-profiles.json'
      - 'support/postgresql-releases.json'
      - 'support.json'

permissions:
  actions: read
  contents: read

jobs:
  profile_scope:
    uses: ./.github/workflows/profile-change-scope.yml
    with:
      profile_id: hypopg-publication-windows-x86_64-17.11

  build:
    needs: profile_scope
    if: needs.profile_scope.outputs.should_run == 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load pinned PostgreSQL core identity
        id: core_pin
        run: python tools/windows_core_pin.py --postgresql-version 17.11 --github-output >> $env:GITHUB_OUTPUT
      - name: Test archive inspection and evidence import
        run: python -B -m unittest tests/test_hypopg_windows_publication.py
      - name: Download the current-profile PostgreSQL 17.11 core archive
        uses: actions/download-artifact@v4
        with:
          name: windows-postgresql-17.11-pilot
          run-id: ${{ steps.core_pin.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/core-archives
      - name: Build upstream source and package extension
        id: archive
        continue-on-error: true
        run: ./scripts/hypopg/windows-feasibility.ps1 -CoreArchiveDirectory "$env:RUNNER_TEMP/core-archives" -OutputDirectory "$env:RUNNER_TEMP/hypopg-build" -PostgreSQLVersion 17.11 -BuildOnly
      - name: Upload final core and extension archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hypopg-windows-17.11-build-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/core-archives/**
            ${{ runner.temp }}/hypopg-build/**
          if-no-files-found: warn
          retention-days: 7
      - name: Require package build to pass
        if: always()
        run: |
          if ('${{ steps.archive.outcome }}' -ne 'success') { throw 'HypoPG Windows archive build failed.' }

  verify:
    needs: [profile_scope, build]
    if: always() && needs.profile_scope.outputs.should_run == 'true'
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download final archives from the build runner
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: hypopg-windows-17.11-build-${{ github.run_id }}
          path: ${{ runner.temp }}/hypopg-bundle
      - name: Prepare verification inputs
        if: always()
        run: |
          $coreDir = Join-Path $env:RUNNER_TEMP 'core-archives'
          $extensionDir = Join-Path $env:RUNNER_TEMP 'hypopg-extension'
          New-Item -ItemType Directory -Force $coreDir,$extensionDir | Out-Null
          if (Test-Path (Join-Path $env:RUNNER_TEMP 'hypopg-bundle/core-archives')) {
            Copy-Item (Join-Path $env:RUNNER_TEMP 'hypopg-bundle/core-archives/*') $coreDir -Force
          }
          if (Test-Path (Join-Path $env:RUNNER_TEMP 'hypopg-bundle/hypopg-build')) {
            Copy-Item (Join-Path $env:RUNNER_TEMP 'hypopg-bundle/hypopg-build/*') $extensionDir -Force
          }
          if (Test-Path (Join-Path $extensionDir 'hypopg.pdb')) {
            $verificationDir = Join-Path $env:RUNNER_TEMP 'hypopg-verification'
            New-Item -ItemType Directory -Force $verificationDir | Out-Null
            Copy-Item (Join-Path $extensionDir 'hypopg.pdb') $verificationDir -Force
          }
      - name: Inspect and exercise downloaded archives after relocation
        id: verification
        if: always() && needs.build.result == 'success' && steps.download.outcome == 'success'
        continue-on-error: true
        run: ./scripts/hypopg/verify-windows-publication.ps1 -CoreArchiveDirectory "$env:RUNNER_TEMP/core-archives" -ExtensionArchiveDirectory "$env:RUNNER_TEMP/hypopg-extension" -OutputDirectory "$env:RUNNER_TEMP/hypopg-verification" -PostgreSQLVersion 17.11
      - name: Emit archive-bound attempt and verification record
        if: always()
        env:
          ARCHIVE_RESULT: ${{ steps.verification.outcome }}
          STATIC_RESULT: ${{ steps.verification.outcome }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'hypopg-verification'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $version = (Get-CimInstance Win32_OperatingSystem).Version
          $image = "$([Environment]::GetEnvironmentVariable('ImageOS'))/$([Environment]::GetEnvironmentVariable('ImageVersion'))"
          python tools/emit_hypopg_windows_publication.py --postgresql-version 17.11 --core-archives (Join-Path $env:RUNNER_TEMP 'core-archives') --archives (Join-Path $env:RUNNER_TEMP 'hypopg-extension') --output $dir --os-version $version --image-id $image --archive-suite-result $env:ARCHIVE_RESULT --static-analysis-result $env:STATIC_RESULT
      - name: Validate and retain publication evidence
        if: always()
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'hypopg-verification'
          $attemptPath = Join-Path $dir 'publication/attempt.json'
          if (Test-Path $attemptPath) {
            $attempt = Get-Content $attemptPath -Raw | ConvertFrom-Json
            if ($attempt.archives) {
              python tools/import_hypopg_windows_publication.py --postgresql-version 17.11 --core-artifact (Join-Path $env:RUNNER_TEMP 'core-archives') --extension-artifact (Join-Path $env:RUNNER_TEMP 'hypopg-extension') --run-id $env:GITHUB_RUN_ID
            }
          }
      - name: Upload candidate archive and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hypopg-1.4.3-postgresql-17.11-windows-x86_64-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/core-archives/*.tar.gz
            ${{ runner.temp }}/core-archives/*.sha256
            ${{ runner.temp }}/hypopg-extension/*
            ${{ runner.temp }}/hypopg-verification/*
            support/evidence/hypopg-windows-publication-${{ github.run_id }}/**
            support/verification/hypopg-1.4.3-postgresql-17.11-windows-x86_64-current-${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 7
      - name: Require fresh-runner verification to pass
        if: always()
        run: |
          if ('${{ needs.build.result }}' -ne 'success' -or '${{ steps.download.outcome }}' -ne 'success' -or '${{ steps.verification.outcome }}' -ne 'success') { throw 'HypoPG Windows fresh-runner verification failed.' }
