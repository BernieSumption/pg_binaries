name: pg_jsonschema macOS source feasibility probe

on:
  workflow_dispatch:
  push:
    branches: [spike]
    paths:
      - '.github/workflows/pg-jsonschema-macos-probe.yml'
      - 'scripts/pg_jsonschema/**'

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: macos-15-intel
          - architecture: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Build unmodified upstream source and run SQL probe
        run: bash scripts/pg_jsonschema/macos-probe.sh "$RUNNER_TEMP/results" "${{ matrix.architecture }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pg-jsonschema-macos-${{ matrix.architecture }}-feasibility
          path: ${{ runner.temp }}/results/**
          if-no-files-found: warn
          retention-days: 3
