name: Address Standardizer 3.7.0 PostgreSQL 18.6 Linux candidate publication

on:
  workflow_dispatch:
  push:
    branches: [spike]
    paths:
      - '.github/workflows/address-standardizer-linux-publication.yml'
      - 'scripts/address_standardizer/linux-*'
      - 'scripts/address_standardizer/linux-probe.sql'
      - 'tools/check_elf_dependencies.py'
      - 'tools/emit_address_standardizer_linux_publication.py'
      - 'tools/import_address_standardizer_linux_publication.py'
      - 'tests/test_address_standardizer_linux_publication.py'
      - 'support/verification-profiles.json'
      - 'support.json'
      - 'support/postgresql-releases.json'

permissions:
  actions: read
  contents: read

jobs:
  scope_x86_64:
    uses: ./.github/workflows/profile-change-scope.yml
    with:
      profile_id: address-standardizer-publication-linux-x86_64-18.6

  scope_arm64:
    uses: ./.github/workflows/profile-change-scope.yml
    with:
      profile_id: address-standardizer-publication-linux-arm64-18.6

  publish_x86_64:
    needs: scope_x86_64
    if: needs.scope_x86_64.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PG_ARCHITECTURE: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate candidate evidence tooling
        run: python -B -m unittest tests/test_address_standardizer_linux_publication.py
      - name: Download pinned PostgreSQL 18.6 core archive
        uses: actions/download-artifact@v4
        with:
          name: linux-publication-x86_64-evidence
          run-id: 39081368117
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/core/pilot
      - name: Build final archive from pinned upstream sources
        id: build
        continue-on-error: true
        run: bash scripts/address_standardizer/linux-build.sh "$RUNNER_TEMP/core/pilot" "$RUNNER_TEMP/address-standardizer"
      - name: Run relocated Alpine SQL probe and inspect ELF closure
        id: verify
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: bash scripts/address_standardizer/linux-verify.sh "$RUNNER_TEMP/address-standardizer" "$RUNNER_TEMP/core/pilot" 2>&1 | tee "$RUNNER_TEMP/address-standardizer/probe-output.txt"
      - name: Emit attempt and archive-bound verification record
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/address-standardizer/publication"
          python tools/emit_address_standardizer_linux_publication.py \
            --archives "$RUNNER_TEMP/address-standardizer" --core-archives "$RUNNER_TEMP/core/pilot" \
            --output "$RUNNER_TEMP/address-standardizer/publication" --architecture x86_64 \
            --build-result "${BUILD_RESULT:-skipped}" --verify-result "${VERIFY_RESULT:-skipped}" \
            --image-id "$(docker image inspect pg-binaries-address-standardizer-alpine-probe --format '{{.Id}}' 2>/dev/null || echo unavailable)" \
            --kernel-release "$(uname -r)"
      - name: Validate and retain candidate evidence
        if: always()
        run: python tools/import_address_standardizer_linux_publication.py --core-archives "$RUNNER_TEMP/core/pilot" --archives "$RUNNER_TEMP/address-standardizer" --run-id "$GITHUB_RUN_ID"
      - name: Upload candidate archive and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: address-standardizer-3.7.0-postgresql-18.6-linux-x86_64-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/address-standardizer/*.tar.gz
            ${{ runner.temp }}/address-standardizer/*.sha256
            ${{ runner.temp }}/address-standardizer/*.txt
            ${{ runner.temp }}/address-standardizer/*.json
            ${{ runner.temp }}/address-standardizer/static-analysis/**
            ${{ runner.temp }}/address-standardizer/publication/**
            support/evidence/address-standardizer-linux-publication-${{ github.run_id }}/**
          if-no-files-found: warn
          retention-days: 7
      - name: Require relocated archive tests and ELF closure to pass
        if: always()
        run: test '${{ steps.verify.outcome }}' = success

  publish_arm64:
    needs: scope_arm64
    if: needs.scope_arm64.outputs.should_run == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      PG_ARCHITECTURE: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate candidate evidence tooling
        run: python -B -m unittest tests/test_address_standardizer_linux_publication.py
      - name: Download pinned PostgreSQL 18.6 core archive
        uses: actions/download-artifact@v4
        with:
          name: linux-publication-arm64-evidence
          run-id: 39081368117
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/core/pilot
      - name: Build final archive from pinned upstream sources
        id: build
        continue-on-error: true
        run: bash scripts/address_standardizer/linux-build.sh "$RUNNER_TEMP/core/pilot" "$RUNNER_TEMP/address-standardizer"
      - name: Run relocated Alpine SQL probe and inspect ELF closure
        id: verify
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: bash scripts/address_standardizer/linux-verify.sh "$RUNNER_TEMP/address-standardizer" "$RUNNER_TEMP/core/pilot" 2>&1 | tee "$RUNNER_TEMP/address-standardizer/probe-output.txt"
      - name: Emit attempt and archive-bound verification record
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/address-standardizer/publication"
          python tools/emit_address_standardizer_linux_publication.py \
            --archives "$RUNNER_TEMP/address-standardizer" --core-archives "$RUNNER_TEMP/core/pilot" \
            --output "$RUNNER_TEMP/address-standardizer/publication" --architecture arm64 \
            --build-result "${BUILD_RESULT:-skipped}" --verify-result "${VERIFY_RESULT:-skipped}" \
            --image-id "$(docker image inspect pg-binaries-address-standardizer-alpine-probe --format '{{.Id}}' 2>/dev/null || echo unavailable)" \
            --kernel-release "$(uname -r)"
      - name: Validate and retain candidate evidence
        if: always()
        run: python tools/import_address_standardizer_linux_publication.py --core-archives "$RUNNER_TEMP/core/pilot" --archives "$RUNNER_TEMP/address-standardizer" --run-id "$GITHUB_RUN_ID"
      - name: Upload candidate archive and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: address-standardizer-3.7.0-postgresql-18.6-linux-arm64-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/address-standardizer/*.tar.gz
            ${{ runner.temp }}/address-standardizer/*.sha256
            ${{ runner.temp }}/address-standardizer/*.txt
            ${{ runner.temp }}/address-standardizer/*.json
            ${{ runner.temp }}/address-standardizer/static-analysis/**
            ${{ runner.temp }}/address-standardizer/publication/**
            support/evidence/address-standardizer-linux-publication-${{ github.run_id }}/**
          if-no-files-found: warn
          retention-days: 7
      - name: Require relocated archive tests and ELF closure to pass
        if: always()
        run: test '${{ steps.verify.outcome }}' = success
