name: collection macOS arm64 feasibility

on:
  workflow_dispatch:
  push:
    branches: [spike]
    paths:
      - .github/workflows/collection-macos-arm64-feasibility.yml
      - scripts/collection/macos-feasibility.sh
      - scripts/collection/check_macos_evidence.py
      - scripts/collection/probe.sql
      - scripts/macos/static_analysis.py
      - tools/check_extension_redistribution.py
      - tools/publication_preflight.py
      - tests/test_collection_macos_evidence.py

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check collection macOS evidence validation
        run: python3 -m unittest tests/test_collection_macos_evidence.py
      - name: Download the verified PostgreSQL 18.6 Apple Silicon artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-pilot-archives
          run-id: 39093804232
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/core-archives
      - name: Prepare collection evidence directory
        run: mkdir -p "$RUNNER_TEMP/collection-macos"
      - name: Build, relocate, analyse and exercise both collection releases
        id: archive_suite
        run: |
          set -o pipefail
          bash scripts/collection/macos-feasibility.sh \
            "$RUNNER_TEMP/core-archives" "$RUNNER_TEMP/collection-macos" 2>&1 \
            | tee "$RUNNER_TEMP/collection-macos/build-log.txt"
      - name: Validate archive checksums, metadata and Mach-O reports
        id: evidence_check
        if: ${{ always() && steps.archive_suite.outcome == 'success' }}
        run: python3 scripts/collection/check_macos_evidence.py "$RUNNER_TEMP/core-archives" "$RUNNER_TEMP/collection-macos"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collection-macos-arm64-feasibility-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/collection-macos/*.tar.gz
            ${{ runner.temp }}/collection-macos/*.sha256
            ${{ runner.temp }}/collection-macos/*.json
            ${{ runner.temp }}/collection-macos/*.txt
            ${{ runner.temp }}/collection-macos/*.log
          if-no-files-found: warn
          retention-days: 7
