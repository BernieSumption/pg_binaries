name: pgTAP selected PostgreSQL Linux publication

on:
  workflow_call:
    inputs:
      postgresql_version:
        description: Exact selected PostgreSQL release
        required: true
        type: string
      architecture:
        description: Exact selected Linux architecture
        required: true
        type: string
      extension_version:
        description: Exact selected pgTAP release
        required: true
        type: string
  workflow_dispatch:
    inputs:
      postgresql_version:
        description: Exact selected PostgreSQL release
        required: true
        type: string
      architecture:
        description: Exact selected Linux architecture
        required: true
        type: string
      extension_version:
        description: Exact selected pgTAP release
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      postgresql_version: ${{ steps.plan.outputs.postgresql_version }}
      extension_version: ${{ steps.plan.outputs.selected_version }}
      architecture: ${{ steps.plan.outputs.architecture }}
    steps:
      - uses: actions/checkout@v4
      - name: Plan the exact selected target
        id: plan
        env:
          POSTGRESQL_VERSION: ${{ inputs.postgresql_version }}
          EXTENSION_VERSION: ${{ inputs.extension_version }}
          REQUESTED_ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          set -euo pipefail
          test -n "$POSTGRESQL_VERSION"
          test -n "$REQUESTED_ARCHITECTURE"
          test -n "$EXTENSION_VERSION"
          case "$REQUESTED_ARCHITECTURE" in x86_64|arm64) ;; *) echo "Unsupported Linux architecture: $REQUESTED_ARCHITECTURE" >&2; exit 2 ;; esac
          python3 tools/extension_archive_plan.py \
            --project pgtap --platform "linux-$REQUESTED_ARCHITECTURE" \
            --postgresql-version "$POSTGRESQL_VERSION" --extension-version "$EXTENSION_VERSION" \
            --github-output "$GITHUB_OUTPUT" > "$RUNNER_TEMP/selection.json"
          selected_version=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["selected_version"])' "$RUNNER_TEMP/selection.json")
          if [[ "$selected_version" != '1.3.4' ]]; then
            echo "The selected pgTAP release is $selected_version; the Linux recipe supports only 1.3.4." >&2
            exit 1
          fi
          echo "architecture=$REQUESTED_ARCHITECTURE" >> "$GITHUB_OUTPUT"

  build:
    needs: select
    runs-on: ${{ needs.select.outputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    outputs:
      core_resolution: ${{ steps.core_resolution.outcome }}
      extension_build: ${{ steps.extension_build.outcome }}
    env:
      PG_VERSION: ${{ needs.select.outputs.postgresql_version }}
      PG_ARCHITECTURE: ${{ needs.select.outputs.architecture }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve a checked PostgreSQL core or build the selected release
        id: core_resolution
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scripts/linux/resolve-core.sh "$PG_VERSION" "$PG_ARCHITECTURE" "$RUNNER_TEMP/core/pilot" \
            linux-changed-profiles.yml "pgtap-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}" \
            linux-changed-profiles.yml "hypopg-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}" \
            linux-changed-profiles.yml "pg-jsonschema-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}" \
            selected-extension-publication.yml "pgtap-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}" \
            selected-extension-publication.yml "hypopg-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}" \
            selected-extension-publication.yml "pg-jsonschema-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}" \
            pgtap-linux-selected-publication.yml "pgtap-linux-core-$PG_VERSION-$PG_ARCHITECTURE-{run_id}" \
            linux-publication.yml "linux-publication-$PG_ARCHITECTURE-evidence"
      - name: Build selected pgTAP archive against that core
        id: extension_build
        if: always() && steps.core_resolution.outcome == 'success'
        continue-on-error: true
        run: PG_VERSION="$PG_VERSION" PG_ARCHITECTURE="$PG_ARCHITECTURE" scripts/pgtap/build.sh "$RUNNER_TEMP/core/pilot" "$RUNNER_TEMP/pgtap"
      - name: Upload selected extension archive and build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgtap-linux-built-${{ needs.select.outputs.postgresql_version }}-${{ needs.select.outputs.architecture }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pgtap/*.tar.gz
            ${{ runner.temp }}/pgtap/*.sha256
            ${{ runner.temp }}/pgtap/*.txt
            ${{ runner.temp }}/pgtap/*.json
            ${{ runner.temp }}/pgtap/static-analysis/**
          if-no-files-found: warn
          retention-days: 7
      - name: Upload exact resolved PostgreSQL core and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgtap-linux-core-${{ needs.select.outputs.postgresql_version }}-${{ needs.select.outputs.architecture }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/core/pilot/*.tar.gz
            ${{ runner.temp }}/core/pilot/*.sha256
            ${{ runner.temp }}/core/pilot/core-resolution.json
          if-no-files-found: warn
          retention-days: 7

  verify:
    needs: [select, build]
    if: always() && needs.select.result == 'success' && needs.build.result == 'success'
    runs-on: ${{ needs.select.outputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      PG_VERSION: ${{ needs.select.outputs.postgresql_version }}
      PG_ARCHITECTURE: ${{ needs.select.outputs.architecture }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download selected pgTAP archive
        id: download_extension
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pgtap-linux-built-${{ needs.select.outputs.postgresql_version }}-${{ needs.select.outputs.architecture }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pgtap
      - name: Download exact resolved PostgreSQL core archive
        id: download_core
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pgtap-linux-core-${{ needs.select.outputs.postgresql_version }}-${{ needs.select.outputs.architecture }}-${{ github.run_id }}
          path: ${{ runner.temp }}/core/pilot
      - name: Validate transferred core identity and provenance
        id: core_validation
        if: always() && steps.download_core.outcome == 'success'
        continue-on-error: true
        run: |
          python tools/linux_core_resolution.py \
            --validate-record "$RUNNER_TEMP/core/pilot/core-resolution.json" \
            --archive "$RUNNER_TEMP/core/pilot/postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz" \
            --postgresql-version "$PG_VERSION" --architecture "$PG_ARCHITECTURE"
      - name: Verify final archives on this fresh runner
        id: verification
        if: always() && steps.download_extension.outcome == 'success' && steps.download_core.outcome == 'success' && steps.core_validation.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          PG_VERSION="$PG_VERSION" PG_ARCHITECTURE="$PG_ARCHITECTURE" \
            scripts/pgtap/verify.sh "$RUNNER_TEMP/core/pilot" "$RUNNER_TEMP/pgtap" \
            2>&1 | tee "$RUNNER_TEMP/pgtap/probe-output.txt"
      - name: Record build and verification outcomes
        if: always()
        env:
          CORE_RESOLUTION: ${{ needs.build.outputs.core_resolution }}
          EXTENSION_BUILD: ${{ needs.build.outputs.extension_build }}
          CORE_DOWNLOAD: ${{ steps.download_core.outcome }}
          EXTENSION_DOWNLOAD: ${{ steps.download_extension.outcome }}
          CORE_VALIDATION: ${{ steps.core_validation.outcome }}
          VERIFICATION: ${{ steps.verification.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/pgtap-publication"
          python3 - "$RUNNER_TEMP/pgtap-publication/current-steps.json" "$RUNNER_TEMP/pgtap-publication/build-outcomes.json" <<'PY'
          import json, os, sys
          values = {
              "core-resolution": os.environ.get("CORE_RESOLUTION") or "skipped",
              "extension-build": os.environ.get("EXTENSION_BUILD") or "skipped",
              "core-download": os.environ.get("CORE_DOWNLOAD") or "skipped",
              "extension-download": os.environ.get("EXTENSION_DOWNLOAD") or "skipped",
              "core-validation": os.environ.get("CORE_VALIDATION") or "skipped",
              "archive-suite": os.environ.get("VERIFICATION") or "skipped",
          }
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump({"pgtap-archive-suite": values["archive-suite"]}, stream, indent=2, sort_keys=True)
              stream.write("\n")
          with open(sys.argv[2], "w", encoding="utf-8") as stream:
              json.dump(values, stream, indent=2, sort_keys=True)
              stream.write("\n")
          PY
      - name: Create target-bound receipt and verification record
        id: receipt
        if: always()
        continue-on-error: true
        env:
          VERIFY_OUTCOME: ${{ steps.verification.outcome }}
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/core/pilot/postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz"
          extension="$RUNNER_TEMP/pgtap/pgtap-1.3.4-postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz"
          if [[ ! -f "$core" || ! -f "$core.sha256" || ! -f "$extension" || ! -f "$extension.sha256" ]]; then
            echo 'Archives are unavailable; retaining step outcomes without a receipt.'
            echo 'has_receipt=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          image=$(docker image inspect --format '{{.Id}}' pg-binaries-pgtap-verifier 2>/dev/null || true)
          if [[ ! "$image" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'Verifier image identity is unavailable; retaining step outcomes without a receipt.' >&2
            echo 'has_receipt=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          clean=false
          dependencies=failure
          if [[ "$VERIFY_OUTCOME" == success ]]; then clean=true; dependencies=success; fi
          case "$PG_ARCHITECTURE" in x86_64) docker_platform=linux/amd64 ;; arm64) docker_platform=linux/arm64 ;; esac
          distribution=$(docker run --rm --platform "$docker_platform" --entrypoint sh pg-binaries-pgtap-verifier -c '. /etc/os-release; printf "%s" "$NAME"')
          distribution_version=$(docker run --rm --platform "$docker_platform" --entrypoint sh pg-binaries-pgtap-verifier -c '. /etc/os-release; printf "%s" "$VERSION_ID"')
          python3 tools/create_extension_publication_receipt.py \
            --archives "$RUNNER_TEMP/pgtap" --core-archives "$RUNNER_TEMP/core/pilot" \
            --receipt "$RUNNER_TEMP/pgtap-publication/current-receipt.json" \
            --profile-id "pgtap-publication-linux-$PG_ARCHITECTURE-$PG_VERSION" \
            --project pgtap --version 1.3.4 --postgresql-version "$PG_VERSION" \
            --architecture "$PG_ARCHITECTURE" --endpoint current \
            --kernel-release "$(uname -r)" --distribution "$distribution" \
            --distribution-version "$distribution_version" --image-id "$image" \
            --dependency-check-result "$dependencies" --clean-system "$clean" \
            --step-results "$RUNNER_TEMP/pgtap-publication/current-steps.json"
          python3 tools/emit_extension_publication_records.py \
            --archives "$RUNNER_TEMP/pgtap" --core-archives "$RUNNER_TEMP/core/pilot" \
            --receipt "$RUNNER_TEMP/pgtap-publication/current-receipt.json" \
            --output "$RUNNER_TEMP/pgtap-publication/records"
          echo 'has_receipt=true' >> "$GITHUB_OUTPUT"
      - name: Import and validate exact publication evidence
        id: import
        if: always() && steps.receipt.outcome == 'success' && steps.receipt.outputs.has_receipt == 'true'
        continue-on-error: true
        run: |
          python3 tools/import_linux_pgtap_publication.py \
            --core-artifact "$RUNNER_TEMP/core" --pgtap-artifact "$RUNNER_TEMP" \
            --run-id "$GITHUB_RUN_ID" --architecture "$PG_ARCHITECTURE" --postgresql-version "$PG_VERSION"
      - name: Upload exact archives, provenance and available outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgtap-linux-selected-${{ needs.select.outputs.postgresql_version }}-${{ needs.select.outputs.architecture }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/core/pilot/*.tar.gz
            ${{ runner.temp }}/core/pilot/*.sha256
            ${{ runner.temp }}/core/pilot/core-resolution.json
            ${{ runner.temp }}/pgtap/*.tar.gz
            ${{ runner.temp }}/pgtap/*.sha256
            ${{ runner.temp }}/pgtap/*.txt
            ${{ runner.temp }}/pgtap/*.json
            ${{ runner.temp }}/pgtap/static-analysis/**
            ${{ runner.temp }}/pgtap-publication/**
            support/evidence/pgtap-publication-${{ github.run_id }}/${{ needs.select.outputs.architecture }}/${{ needs.select.outputs.postgresql_version }}/**
            support/verification/pgtap-1.3.4-postgresql-${{ needs.select.outputs.postgresql_version }}-linux-${{ needs.select.outputs.architecture }}-current-${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 7
      - name: Require build, provenance, verification and import to pass
        if: always()
        env:
          CORE_RESOLUTION: ${{ needs.build.outputs.core_resolution }}
          EXTENSION_BUILD: ${{ needs.build.outputs.extension_build }}
          CORE_DOWNLOAD: ${{ steps.download_core.outcome }}
          EXTENSION_DOWNLOAD: ${{ steps.download_extension.outcome }}
          CORE_VALIDATION: ${{ steps.core_validation.outcome }}
          VERIFICATION: ${{ steps.verification.outcome }}
          RECEIPT: ${{ steps.receipt.outcome }}
          IMPORT: ${{ steps.import.outcome }}
        run: |
          set -euo pipefail
          for result in "$CORE_RESOLUTION" "$EXTENSION_BUILD" "$CORE_DOWNLOAD" "$EXTENSION_DOWNLOAD" "$CORE_VALIDATION" "$VERIFICATION" "$RECEIPT" "$IMPORT"; do
            if [[ "$result" != success ]]; then
              echo "Selected pgTAP Linux publication did not pass: $CORE_RESOLUTION/$EXTENSION_BUILD/$CORE_DOWNLOAD/$EXTENSION_DOWNLOAD/$CORE_VALIDATION/$VERIFICATION/$RECEIPT/$IMPORT" >&2
              exit 1
            fi
          done
