name: PostGIS conda-forge macOS arm64 dependency feasibility
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Confirm native arm64 runner
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
      - name: Install micromamba
        run: brew install micromamba
      - name: Resolve conda-forge spatial dependencies and inspect Mach-O files
        run: |
          mkdir -p "$RUNNER_TEMP/postgis-conda-macos-arm64"
          bash experiments/postgis-conda-macos-arm64-2026-10-21/inspect.sh \
            "$RUNNER_TEMP/postgis-conda-macos-arm64"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgis-conda-macos-arm64-feasibility-${{ github.run_id }}
          path: ${{ runner.temp }}/postgis-conda-macos-arm64/**
          if-no-files-found: warn
          retention-days: 3
