name: pg_ivm selected macOS publication

on:
  workflow_call:
    inputs:
      postgresql_version:
        required: true
        type: string
      extension_version:
        required: true
        type: string
      architecture:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      postgresql_version:
        description: Selected PostgreSQL release
        required: true
        type: choice
        options: ['17.11', '18.6']
      extension_version:
        description: Selected pg_ivm release
        required: true
        type: string
        default: '1.16'
      architecture:
        description: Native macOS architecture
        required: true
        type: choice
        options: [arm64, x86_64]

permissions:
  actions: read
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      postgresql_version: ${{ steps.target.outputs.postgresql_version }}
      extension_version: ${{ steps.target.outputs.extension_version }}
      architecture: ${{ steps.target.outputs.architecture }}
      runner: ${{ steps.target.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate the selected extension target
        id: target
        env:
          POSTGRESQL_VERSION: ${{ inputs.postgresql_version }}
          EXTENSION_VERSION: ${{ inputs.extension_version }}
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          set -euo pipefail
          python3 tools/select_extension_work.py \
            --project pg_ivm --version "$EXTENSION_VERSION" \
            --platform "macos-$ARCHITECTURE" --postgresql-version "$POSTGRESQL_VERSION" \
            --github-output "$GITHUB_OUTPUT" > "$RUNNER_TEMP/selected-work.json"
          if [[ "$EXTENSION_VERSION" != 1.16 || ! "$POSTGRESQL_VERSION" =~ ^(17\.11|18\.6)$ || ! "$ARCHITECTURE" =~ ^(arm64|x86_64)$ ]]; then
            echo 'The pg_ivm recipe supports 1.16 on PostgreSQL 17.11 and 18.6 for both native macOS architectures.' >&2
            exit 2
          fi
          python3 - "$RUNNER_TEMP/selected-work.json" "$POSTGRESQL_VERSION" "$ARCHITECTURE" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          work=json.load(open(sys.argv[1],encoding='utf-8'))
          pg,arch=sys.argv[2:4]
          if (work.get('project') != 'pg_ivm' or work.get('version') != '1.16'
                  or work.get('postgresql_version') != pg or work.get('platform') != f'macos-{arch}'):
              raise SystemExit('selected work does not match the exact requested target')
          with open(sys.argv[4],'a',encoding='utf-8') as out:
              out.write(f'postgresql_version={pg}\nextension_version=1.16\narchitecture={arch}\n')
              out.write('runner=macos-15\n' if arch == 'arm64' else 'runner=macos-15-intel\n')
          PY

  build:
    needs: select
    runs-on: ${{ needs.select.outputs.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Create the selected PostgreSQL core target
        run: |
          mkdir -p "$RUNNER_TEMP/pgivm/core" "$RUNNER_TEMP/pgivm/build"
          python3 - "$RUNNER_TEMP/pgivm/base-target.json" <<'PY'
          import json, os
          p=os.environ['RUNNER_TEMP']+'/pgivm/base-target.json'
          pg='${{ needs.select.outputs.postgresql_version }}'; arch='${{ needs.select.outputs.architecture }}'
          with open(p,'w',encoding='utf-8') as f:
              json.dump({'postgresql_version':pg,'platform':f'macos-{arch}','architecture':arch,
                         'core_archive':{'basename':f'postgresql-{pg}-macos-{arch}.tar.gz'}},f)
              f.write('\n')
          PY
      - name: Resolve or build and check the exact PostgreSQL archive
        id: core
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/macos/resolve-core.sh "$RUNNER_TEMP/pgivm/base-target.json" "$RUNNER_TEMP/pgivm/core"
      - name: Build pg_ivm from unmodified upstream source against the resolved core
        id: package
        if: always() && steps.core.outcome == 'success'
        continue-on-error: true
        run: bash scripts/pg_ivm/macos-build-publication.sh "$RUNNER_TEMP/pgivm/core" "$RUNNER_TEMP/pgivm/core/target.json" "$RUNNER_TEMP/pgivm/build"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pgivm-macos-${{ needs.select.outputs.postgresql_version }}-${{ needs.select.outputs.architecture }}-build-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pgivm/core/**
            ${{ runner.temp }}/pgivm/build/**
          if-no-files-found: warn
          retention-days: 7
      - name: Require core and extension builds to pass
        if: always()
        run: test '${{ steps.core.outcome }}' = success && test '${{ steps.package.outcome }}' = success

  verify:
    needs: [select, build]
    if: always() && needs.select.result == 'success'
    runs-on: ${{ needs.select.outputs.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check selected pg_ivm publication evidence adapters
        run: python3 -m unittest tests/test_pgivm_macos_selected_publication.py tests/test_emit_pgivm_macos_publication.py tests/test_import_pgivm_macos_publication.py
      - name: Download core and extension archives from the build runner
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pgivm-macos-${{ needs.select.outputs.postgresql_version }}-${{ needs.select.outputs.architecture }}-build-${{ github.run_id }}
          path: ${{ runner.temp }}/pgivm-bundle
      - name: Prepare fresh-runner verification inputs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/pgivm/core" "$RUNNER_TEMP/pgivm/archive" "$RUNNER_TEMP/pgivm/verification"
          if [[ -d "$RUNNER_TEMP/pgivm-bundle/core" ]]; then cp -a "$RUNNER_TEMP/pgivm-bundle/core/." "$RUNNER_TEMP/pgivm/core/"; fi
          if [[ -d "$RUNNER_TEMP/pgivm-bundle/build" ]]; then cp -a "$RUNNER_TEMP/pgivm-bundle/build/." "$RUNNER_TEMP/pgivm/archive/"; fi
      - name: Inspect the final archives on the fresh runner
        id: static_analysis
        if: always() && steps.download.outcome == 'success'
        continue-on-error: true
        run: bash scripts/pg_ivm/macos-verify-publication.sh "$RUNNER_TEMP/pgivm/core/target.json" "$RUNNER_TEMP/pgivm/core" "$RUNNER_TEMP/pgivm/archive" "$RUNNER_TEMP/pgivm/verification" static-analysis
      - name: Assemble and exercise the final archives on the fresh runner
        id: archive_suite
        if: always() && steps.download.outcome == 'success'
        continue-on-error: true
        run: bash scripts/pg_ivm/macos-verify-publication.sh "$RUNNER_TEMP/pgivm/core/target.json" "$RUNNER_TEMP/pgivm/core" "$RUNNER_TEMP/pgivm/archive" "$RUNNER_TEMP/pgivm/verification" archive-suite
      - name: Emit archive-bound publication evidence
        id: evidence
        if: always()
        continue-on-error: true
        env:
          ARCHIVE_SUITE_OUTCOME: ${{ steps.archive_suite.outcome }}
          STATIC_ANALYSIS_OUTCOME: ${{ steps.static_analysis.outcome }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 tools/emit_pgivm_macos_publication.py \
            --target "$RUNNER_TEMP/pgivm/core/target.json" \
            --core-archives "$RUNNER_TEMP/pgivm/core" --archives "$RUNNER_TEMP/pgivm/archive" \
            --output "$RUNNER_TEMP/pgivm/verification" \
            --os-version "$(sw_vers -productVersion)" --image-id "${ImageOS:-unknown}/${ImageVersion:-unknown}" \
            --archive-suite-result "${ARCHIVE_SUITE_OUTCOME:-failure}" \
            --static-analysis-result "${STATIC_ANALYSIS_OUTCOME:-failure}"
      - name: Validate and retain selected-target evidence
        id: import
        if: always()
        continue-on-error: true
        run: |
          if [[ -f "$RUNNER_TEMP/pgivm/verification/publication/attempt.json" ]]; then
            python3 tools/import_pgivm_macos_publication.py --target "$RUNNER_TEMP/pgivm/core/target.json" \
              --core-artifact "$RUNNER_TEMP/pgivm/core" --pgivm-artifact "$RUNNER_TEMP/pgivm/verification" --run-id "$GITHUB_RUN_ID"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pgivm-macos-${{ needs.select.outputs.postgresql_version }}-${{ needs.select.outputs.architecture }}-verification-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pgivm/verification/**
            support/evidence/pgivm-macos-publication-${{ github.run_id }}/${{ needs.select.outputs.architecture }}/**
            support/verification/pg_ivm-1.16-postgresql-${{ needs.select.outputs.postgresql_version }}-macos-${{ needs.select.outputs.architecture }}-current-${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 7
      - name: Require build and fresh-runner publication evidence to pass
        if: always()
        run: |
          if [[ '${{ needs.build.result }}' != success || '${{ steps.download.outcome }}' != success || '${{ steps.archive_suite.outcome }}' != success || '${{ steps.static_analysis.outcome }}' != success || '${{ steps.evidence.outcome }}' != success || '${{ steps.import.outcome }}' != success ]]; then
            echo 'The exact build, fresh-runner archive suite, static analysis, and evidence import must pass.' >&2
            exit 1
          fi
