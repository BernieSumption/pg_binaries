name: pg_ivm Linux feasibility pilot
on:
  push:
    branches: [spike]
    paths:
      - '.github/workflows/pgivm-linux-pilot.yml'
      - 'scripts/pg_ivm/**'
      - 'scripts/linux/**'
      - 'tools/check_elf_dependencies.py'
      - 'support.json'
      - 'support/postgresql-releases.json'
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 70
    permissions:
      contents: read
    env:
      PG_ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v4
      - name: Build PostgreSQL 18.6 core archive
        id: core_build
        run: scripts/linux/build.sh "$RUNNER_TEMP/core"
      - name: Build pg_ivm 1.16 from upstream source
        id: extension_build
        run: bash scripts/pg_ivm/build.sh "$RUNNER_TEMP/core" "$RUNNER_TEMP/pg_ivm"
      - name: Verify relocated archives and ELF closure in Alpine 3.22
        id: extension_verify
        run: bash scripts/pg_ivm/verify.sh "$RUNNER_TEMP/core" "$RUNNER_TEMP/pg_ivm"
      - name: Record PostgreSQL core archive identity
        id: archive_identity
        run: cp "$RUNNER_TEMP/core/postgresql-18.6-linux-$PG_ARCHITECTURE.tar.gz.sha256" "$RUNNER_TEMP/pg_ivm/"
      - name: Record pilot outcomes
        if: always()
        env:
          CORE_BUILD_OUTCOME: ${{ steps.core_build.outcome }}
          EXTENSION_BUILD_OUTCOME: ${{ steps.extension_build.outcome }}
          EXTENSION_VERIFY_OUTCOME: ${{ steps.extension_verify.outcome }}
          ARCHIVE_IDENTITY_OUTCOME: ${{ steps.archive_identity.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pg-ivm-attempt"
          python3 - "$RUNNER_TEMP/pg-ivm-attempt/step-outcomes.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          result = {
              "schema_version": 1,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "source_revision": os.environ["GITHUB_SHA"],
              "postgresql_version": "18.6",
              "pg_ivm_version": "1.16",
              "architecture": os.environ["PG_ARCHITECTURE"],
              "steps": {
                  "core_build": os.environ["CORE_BUILD_OUTCOME"],
                  "extension_build": os.environ["EXTENSION_BUILD_OUTCOME"],
                  "extension_verify": os.environ["EXTENSION_VERIFY_OUTCOME"],
                  "archive_identity": os.environ["ARCHIVE_IDENTITY_OUTCOME"],
              },
          }
          Path(sys.argv[1]).write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pg-ivm-linux-18.6-${{ matrix.architecture }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pg-ivm-attempt/step-outcomes.json
            ${{ runner.temp }}/pg_ivm/*.tar.gz
            ${{ runner.temp }}/pg_ivm/*.sha256
            ${{ runner.temp }}/pg_ivm/static-analysis/*.json
          if-no-files-found: warn
          retention-days: 3
