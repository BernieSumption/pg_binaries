name: HypoPG selected PostgreSQL macOS x86_64 publication

on:
  workflow_call:
    inputs:
      postgresql_version:
        description: Exact selected PostgreSQL release
        required: true
        type: string
      extension_version:
        description: Exact selected HypoPG release
        required: false
        type: string
  workflow_dispatch:
    inputs:
      postgresql_version:
        description: Selected PostgreSQL release
        required: true
        type: string
        default: '18.6'
      extension_version:
        description: Optional HypoPG version selector
        required: false
        type: string
        default: ''
  push:
    branches: [spike]
    paths:
      - '.github/workflows/hypopg-macos-x86_64-selected-publication.yml'
      - 'tools/hypopg_macos_pins/18.6-x86_64-selected.json'
      - 'scripts/hypopg/macos-feasibility.sh'
      - 'scripts/macos/core-prefix.sh'
      - 'scripts/macos/resolve-core.sh'
      - 'tools/macos_core_target_config.py'
      - 'tools/actions_candidate_discovery.py'

permissions:
  actions: read
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      postgresql_version: ${{ steps.plan.outputs.postgresql_version }}
      extension_version: ${{ steps.plan.outputs.selected_version }}
      pin_path: ${{ steps.plan.outputs.pin_path }}
      work_group_id: ${{ steps.work.outputs.group_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate the requested target and core profile
        id: plan
        env:
          POSTGRESQL_VERSION: ${{ inputs.postgresql_version }}
          EXTENSION_VERSION: ${{ inputs.extension_version }}
        run: |
          set -euo pipefail
          if [[ -z "$POSTGRESQL_VERSION" ]]; then
            POSTGRESQL_VERSION=18.6
          fi
          args=(--project HypoPG --platform macos-x86_64 --postgresql-version "$POSTGRESQL_VERSION")
          if [[ -n "$EXTENSION_VERSION" ]]; then args+=(--extension-version "$EXTENSION_VERSION"); fi
          python3 tools/extension_archive_plan.py "${args[@]}" --github-output "$GITHUB_OUTPUT" > "$RUNNER_TEMP/selection.json"
          selected_version=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["selected_version"])' "$RUNNER_TEMP/selection.json")
          if [[ "$selected_version" != '1.4.3' ]]; then
            echo "The selected HypoPG release is $selected_version; the macOS recipe and publication tools support only 1.4.3." >&2
            exit 1
          fi
          pin_path="tools/hypopg_macos_pins/${POSTGRESQL_VERSION}-x86_64-selected.json"
          if [[ ! -f "$pin_path" ]]; then
            echo "No checked macOS x86_64 core archive is configured for PostgreSQL $POSTGRESQL_VERSION." >&2
            exit 1
          fi
          python3 - "$pin_path" "$POSTGRESQL_VERSION" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          from hypopg_macos_target import load_target_config
          target = load_target_config(Path(sys.argv[1]))
          if target.postgresql_version != sys.argv[2] or target.architecture != "x86_64":
              raise SystemExit("pinned core target does not match the selected request")
          PY
          echo "pin_path=$pin_path" >> "$GITHUB_OUTPUT"
      - name: Resolve selected build work and prerequisites
        id: work
        env:
          POSTGRESQL_VERSION: ${{ steps.plan.outputs.postgresql_version }}
          EXTENSION_VERSION: ${{ steps.plan.outputs.selected_version }}
        run: |
          set -euo pipefail
          python3 tools/select_extension_work.py \
            --project HypoPG --version "$EXTENSION_VERSION" \
            --platform macos-x86_64 --postgresql-version "$POSTGRESQL_VERSION" \
            --github-output "$GITHUB_OUTPUT" > "$RUNNER_TEMP/selected-work.json"

  build:
    needs: select
    if: needs.select.result == 'success'
    runs-on: macos-15-intel
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve a checked core archive or build the selected PostgreSQL release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/macos/resolve-core.sh "${{ needs.select.outputs.pin_path }}" "$RUNNER_TEMP/core-archives"
      - name: Build the HypoPG archive against the selected core
        id: package
        continue-on-error: true
        env:
          HYPOPG_BUILD_ONLY: 'true'
        run: bash scripts/hypopg/macos-feasibility.sh "$RUNNER_TEMP/core-archives" "$RUNNER_TEMP/hypopg-publication" "$RUNNER_TEMP/core-archives/target.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hypopg-macos-x86_64-${{ needs.select.outputs.postgresql_version }}-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/core-archives/*.tar.gz
            ${{ runner.temp }}/core-archives/*.sha256
            ${{ runner.temp }}/core-archives/target.json
            ${{ runner.temp }}/hypopg-publication/*.tar.gz
            ${{ runner.temp }}/hypopg-publication/*.sha256
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve package-step failure
        if: always()
        run: test '${{ steps.package.outcome }}' = success

  verify:
    needs: [select, build]
    if: always() && needs.select.result == 'success'
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download final core and extension archives from the build job
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: hypopg-macos-x86_64-${{ needs.select.outputs.postgresql_version }}-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/hypopg-bundle
      - name: Prepare verification input directories
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/core-archives" "$RUNNER_TEMP/hypopg-publication"
          if [[ -d "$RUNNER_TEMP/hypopg-bundle/core-archives" ]]; then cp -a "$RUNNER_TEMP/hypopg-bundle/core-archives/." "$RUNNER_TEMP/core-archives/"; fi
          if [[ -d "$RUNNER_TEMP/hypopg-bundle/hypopg-publication" ]]; then cp -a "$RUNNER_TEMP/hypopg-bundle/hypopg-publication/." "$RUNNER_TEMP/hypopg-publication/"; fi
      - name: Inspect final archives on the fresh runner
        id: static_analysis
        if: always() && steps.download.outcome == 'success'
        continue-on-error: true
        run: bash scripts/hypopg/verify-macos-publication.sh static-analysis "$RUNNER_TEMP/core-archives" "$RUNNER_TEMP/hypopg-publication" "$RUNNER_TEMP/hypopg-publication" "$RUNNER_TEMP/core-archives/target.json"
      - name: Assemble and exercise the relocated final archives on the fresh runner
        id: archive_suite
        if: always() && steps.download.outcome == 'success'
        continue-on-error: true
        run: bash scripts/hypopg/verify-macos-publication.sh archive-suite "$RUNNER_TEMP/core-archives" "$RUNNER_TEMP/hypopg-publication" "$RUNNER_TEMP/hypopg-publication" "$RUNNER_TEMP/core-archives/target.json"
      - name: Finalize archive receipt and verification record
        if: always()
        env:
          ARCHIVE_SUITE_OUTCOME: ${{ steps.archive_suite.outcome }}
          STATIC_ANALYSIS_OUTCOME: ${{ steps.static_analysis.outcome }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/core-archives" "$RUNNER_TEMP/hypopg-publication"
          image_id="${ImageOS:?runner image OS missing}/${ImageVersion:?runner image version missing}"
          os_version="$(sw_vers -productVersion)"
          python3 tools/emit_hypopg_macos_x86_64_publication.py \
            --target-config "$RUNNER_TEMP/core-archives/target.json" \
            --core-archives "$RUNNER_TEMP/core-archives" \
            --archives "$RUNNER_TEMP/hypopg-publication" \
            --output "$RUNNER_TEMP/hypopg-publication" \
            --os-version "$os_version" --image-id "$image_id" \
            --archive-suite-result "$ARCHIVE_SUITE_OUTCOME" \
            --static-analysis-result "$STATIC_ANALYSIS_OUTCOME"
      - name: Validate and retain archive-bound publication evidence
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/hypopg-publication/publication/attempt.json" ]]; then
            python3 tools/import_hypopg_macos_x86_64_publication.py \
              --target-config "$RUNNER_TEMP/core-archives/target.json" \
              --core-artifact "$RUNNER_TEMP/core-archives" \
              --hypopg-artifact "$RUNNER_TEMP/hypopg-publication" \
              --run-id "$GITHUB_RUN_ID"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hypopg-macos-x86_64-${{ needs.select.outputs.postgresql_version }}-publication-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hypopg-publication/*.tar.gz
            ${{ runner.temp }}/hypopg-publication/*.sha256
            ${{ runner.temp }}/hypopg-publication/*.json
            ${{ runner.temp }}/hypopg-publication/*.txt
            ${{ runner.temp }}/hypopg-publication/publication/**
            support/evidence/hypopg-macos-publication-${{ github.run_id }}/x86_64/**
            support/verification/hypopg-1.4.3-postgresql-${{ needs.select.outputs.postgresql_version }}-macos-x86_64-current-${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 7
      - name: Require both fresh-runner verification cases to pass
        if: always()
        run: |
          if [[ '${{ steps.archive_suite.outcome }}' != success || '${{ steps.static_analysis.outcome }}' != success ]]; then
            echo 'HypoPG macOS archive-suite and static-analysis cases must both pass.' >&2
            exit 1
          fi
