name: Windows PostgreSQL 18 pilot

on:
  workflow_dispatch:
  push:
    branches: [spike]
    paths:
      - '.github/workflows/windows-pilot.yml'
      - 'scripts/windows/**'
      - 'tests/schema.sql'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Meson and Ninja
        run: python -m pip install --disable-pip-version-check meson ninja
      - name: Install PostgreSQL libraries
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install icu:x64-windows zlib:x64-windows lz4:x64-windows zstd:x64-windows openssl:x64-windows
      - name: Build and package
        shell: cmd
        run: scripts\windows\build.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: windows-postgresql-18.6-pilot
          path: dist/windows/*
          retention-days: 7
          if-no-files-found: error

  verify:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-postgresql-18.6-pilot
          path: dist/windows
      - name: Verify packaged archives after relocation
        run: ./scripts/windows/verify.ps1
