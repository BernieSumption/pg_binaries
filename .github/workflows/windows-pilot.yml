name: Windows PostgreSQL pilot

on:
  workflow_dispatch:
    inputs:
      postgresql_version:
        description: Supported PostgreSQL minor version to build
        required: true
        default: '18.6'
        type: string
  push:
    branches: [spike]
    paths:
      - '.github/workflows/windows-pilot.yml'
      - 'scripts/windows/**'
      - 'support.json'
      - 'support/postgresql-releases.json'
      - 'inventory.json'
      - 'support/verification-profiles.json'
      - 'tools/plan_work.py'
      - 'tools/source_archive.py'
      - 'tools/check_source_identity.py'
      - 'tools/discover_builtins.py'
      - 'tools/create_windows_symbols.py'
      - 'tools/emit_windows_pilot_records.py'
      - 'tools/check_pe_dependencies.py'
      - 'tools/map_vcpkg_dlls.py'
      - 'tests/schema.sql'
      - 'tests/builtins/**'
      - 'tests/extensions/**'
      - 'tests/test_create_windows_symbols.py'
      - 'tests/test_emit_windows_pilot_records.py'
      - 'tests/test_check_pe_dependencies.py'
      - 'tests/test_map_vcpkg_dlls.py'
      - 'tests/test_profile_change_gate.py'
      - 'tools/profile_change_gate.py'

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.profile_gate.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Test profile-change gate
        run: python3 -m unittest tests/test_profile_change_gate.py
      - name: Check whether the Windows profile changed
        id: profile_gate
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before_root="$RUNNER_TEMP/profile-before"
          if [[ ! "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || ! git fetch --no-tags --depth=1 origin "$BEFORE_SHA" \
            || ! git worktree add --detach "$before_root" "$BEFORE_SHA"; then
            echo 'Base commit unavailable; running the platform workflow.' >&2
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 tools/profile_change_gate.py \
            --before-root "$before_root" \
            --current-root "$GITHUB_WORKSPACE" \
            --profile-id windows-publication-current-x86_64 >> "$GITHUB_OUTPUT"

  select:
    needs: scope
    if: ${{ needs.scope.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      postgresql_version: ${{ steps.select.outputs.postgresql_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select supported Windows build version
        id: select
        env:
          PG_VERSION_INPUT: ${{ inputs.postgresql_version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            selection=(--select-pilot "$PG_VERSION_INPUT")
          else
            selection=(--select-next-pilot)
          fi
          python3 tools/plan_work.py "${selection[@]}" --platform windows-x86_64 > "$RUNNER_TEMP/selection.json"
          python3 - "$RUNNER_TEMP/selection.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              result = json.load(stream)
          if result.get("platform") != "windows-x86_64" or not result.get("work") or not result.get("snapshot_as_of"):
              raise SystemExit("Windows pilot selection is missing required planner fields")
          with open(sys.argv[2], "a", encoding="utf-8") as output:
              output.write(f"postgresql_version={result['postgresql_version']}\n")
          PY

  build:
    needs: select
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      PG_VERSION: ${{ needs.select.outputs.postgresql_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Windows build evidence helpers
        run: python -m unittest tests/test_create_windows_symbols.py tests/test_map_vcpkg_dlls.py
      - name: Install Meson and Ninja
        run: python -m pip install --disable-pip-version-check meson ninja
      - name: Provide Flex and Bison for the PostgreSQL build
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'win_flex_bison-2.5.25.zip'
          $tools = Join-Path $env:RUNNER_TEMP 'win_flex_bison-2.5.25'
          Invoke-WebRequest 'https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip' -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '8d324b62be33604b2c45ad1dd34ab93d722534448f55a16ca7292de32b6ac135') {
            throw "WinFlexBison checksum mismatch: $actual"
          }
          Expand-Archive $archive -DestinationPath $tools
          $flex = Get-ChildItem $tools -Recurse -Filter win_flex.exe | Select-Object -First 1
          if (-not $flex -or -not (Test-Path (Join-Path $flex.DirectoryName 'win_bison.exe'))) {
            throw 'WinFlexBison executables missing from archive'
          }
          Add-Content -Path $env:GITHUB_PATH -Value $flex.DirectoryName
      - name: Install PostgreSQL libraries
        run: |
          $vcpkgRevision = '9e593bb18ea69cc5095e012465dcd675a822ed0d'
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg-$vcpkgRevision"
          git init $vcpkgRoot
          git -C $vcpkgRoot remote add origin https://github.com/microsoft/vcpkg.git
          git -C $vcpkgRoot fetch --depth=1 origin $vcpkgRevision
          git -C $vcpkgRoot checkout --detach FETCH_HEAD
          $actualRevision = (git -C $vcpkgRoot rev-parse HEAD).Trim()
          if ($actualRevision -ne $vcpkgRevision) { throw "vcpkg checkout revision mismatch: $actualRevision" }
          & (Join-Path $vcpkgRoot 'bootstrap-vcpkg.bat') -disableMetrics
          $env:VCPKG_INSTALLATION_ROOT = $vcpkgRoot
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_INSTALLATION_ROOT=$vcpkgRoot"
          & (Join-Path $vcpkgRoot 'vcpkg.exe') install icu:x64-windows zlib:x64-windows lz4:x64-windows zstd:x64-windows openssl:x64-windows libxml2:x64-windows libxslt:x64-windows
      - name: Build and package
        shell: cmd
        run: scripts\windows\build.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: windows-postgresql-${{ needs.select.outputs.postgresql_version }}-pilot
          path: |
            dist/windows/*.tar.gz
            dist/windows/*.sha256
            dist/windows/debug-symbols/**
          retention-days: 1
          if-no-files-found: error

  verify:
    needs: [select, build]
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PG_VERSION: ${{ needs.select.outputs.postgresql_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: windows-postgresql-${{ needs.select.outputs.postgresql_version }}-pilot
          path: dist/windows
      - name: Verify packaged archives after relocation
        id: archive_verify
        env:
          PE_STATIC_ANALYSIS_REPORT: ${{ runner.temp }}/verification-records/static-analysis.json
        run: ./scripts/windows/verify.ps1
      - name: Verify PDBs against downloaded archive bytes
        id: symbols
        run: python tools/create_windows_symbols.py "dist/windows/postgresql-${env:PG_VERSION}-windows-x86_64.tar.gz" "dist/windows/pgvector-0.8.7-postgresql-${env:PG_VERSION}-windows-x86_64.tar.gz" --output-dir dist/windows/debug-symbols --verify-only
      - name: Verify representative Windows failure diagnostics
        id: diagnostics
        run: ./scripts/windows/diagnostics.ps1 -ArchiveDirectory dist/windows -PostgreSQLVersion $env:PG_VERSION -PgvectorVersion 0.8.7 -ReportPath (Join-Path $env:RUNNER_TEMP 'verification-records/diagnostics.json')
      - name: Check Windows record emitters
        id: emitter_tests
        run: python -m unittest tests/test_emit_windows_pilot_records.py tests/test_emit_windows_publication_records.py
      - name: Finalize checksum-bound current Windows records
        if: ${{ always() }}
        env:
          GITHUB_SHA: ${{ github.sha }}
          CHECK_OUTCOMES: ${{ steps.archive_verify.outcome }},${{ steps.symbols.outcome }},${{ steps.diagnostics.outcome }},${{ steps.emitter_tests.outcome }}
          DEPENDENCY_CHECKS_PASSED: ${{ steps.archive_verify.outcome == 'success' }}
        run: |
          if (-not $env:PG_VERSION) {
            Write-Host 'No current-OS verification record: PostgreSQL version was not selected'
            exit 0
          }
          $archiveDir = 'dist/windows'
          $pgArchive = Join-Path $archiveDir "postgresql-$env:PG_VERSION-windows-x86_64.tar.gz"
          $vectorArchive = Join-Path $archiveDir "pgvector-0.8.7-postgresql-$env:PG_VERSION-windows-x86_64.tar.gz"
          $required = @($pgArchive, "$pgArchive.sha256", $vectorArchive, "$vectorArchive.sha256")
          if (@($required | Where-Object { -not (Test-Path $_ -PathType Leaf) }).Count -gt 0) {
            Write-Host 'No current-OS verification record: archive bytes or checksum sidecars are unavailable'
            exit 0
          }
          $osVersion = [System.Environment]::OSVersion.Version.ToString()
          $imageOS = [Environment]::GetEnvironmentVariable('ImageOS')
          $imageVersion = [Environment]::GetEnvironmentVariable('ImageVersion')
          if (-not $osVersion -or -not $imageOS -or -not $imageVersion) {
            Write-Host 'No current-OS verification record: concrete runner environment identity is unavailable'
            exit 0
          }
          $imageId = "$imageOS/$imageVersion"
          $outcomes = $env:CHECK_OUTCOMES -split ','
          if ($outcomes -contains 'failure') { $outcome = 'failed' }
          elseif (@($outcomes | Where-Object { $_ -ne 'success' }).Count -eq 0) { $outcome = 'passed' }
          else { $outcome = 'skipped' }
          python tools/emit_windows_pilot_records.py --archives $archiveDir --output (Join-Path $archiveDir 'verification') --postgresql-version $env:PG_VERSION --os-version $osVersion --image-id $imageId --outcome $outcome --dependency-checks-passed $env:DEPENDENCY_CHECKS_PASSED.ToLowerInvariant() --static-report (Join-Path $env:RUNNER_TEMP 'verification-records/static-analysis.json')
          if ($LASTEXITCODE -ne 0) { throw 'Windows pilot record finalization failed' }
      - name: Finalize archive-bound Windows publication case records
        if: ${{ always() }}
        env:
          ARCHIVE_SUITE_OUTCOME: ${{ steps.archive_verify.outcome }}
          SYMBOLS_OUTCOME: ${{ steps.symbols.outcome }}
          DIAGNOSTICS_OUTCOME: ${{ steps.diagnostics.outcome }}
        run: |
          $recordDir = Join-Path $env:RUNNER_TEMP 'verification-records'
          New-Item -ItemType Directory -Force $recordDir | Out-Null
          $raw = [ordered]@{
            run_id = $env:GITHUB_RUN_ID
            source_revision = $env:GITHUB_SHA
            steps = [ordered]@{
              'archive-suite' = $env:ARCHIVE_SUITE_OUTCOME
              symbols = $env:SYMBOLS_OUTCOME
              diagnostics = $env:DIAGNOSTICS_OUTCOME
            }
          }
          $raw | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 (Join-Path $recordDir 'publication-attempt.json')
          $results = [ordered]@{}
          foreach ($case in $raw.steps.Keys) {
            $results[$case] = switch ($raw.steps[$case]) {
              'success' { 'passed' }
              'failure' { 'failed' }
              default { 'skipped' }
            }
          }
          $results | ConvertTo-Json -Depth 2 | Set-Content -Encoding utf8 (Join-Path $recordDir 'publication-steps.json')
          $archiveDir = 'dist/windows'
          $pgArchive = Join-Path $archiveDir "postgresql-$env:PG_VERSION-windows-x86_64.tar.gz"
          $vectorArchive = Join-Path $archiveDir "pgvector-0.8.7-postgresql-$env:PG_VERSION-windows-x86_64.tar.gz"
          if (-not (Test-Path $pgArchive -PathType Leaf) -or -not (Test-Path $vectorArchive -PathType Leaf)) {
            Write-Host 'No archive-bound publication record: final archive bytes are unavailable'
            exit 0
          }
          $imageId = "$([Environment]::GetEnvironmentVariable('ImageOS'))/$([Environment]::GetEnvironmentVariable('ImageVersion'))"
          $osVersion = [System.Environment]::OSVersion.Version.ToString()
          $dependencyChecksPassed = ($env:ARCHIVE_SUITE_OUTCOME -eq 'success').ToString().ToLowerInvariant()
          python tools/emit_windows_publication_records.py --archives $archiveDir --output (Join-Path $recordDir 'publication') --postgresql-version $env:PG_VERSION --revision $env:GITHUB_SHA --os-version $osVersion --image-id $imageId --step-results (Join-Path $recordDir 'publication-steps.json') --static-report (Join-Path $recordDir 'static-analysis.json') --symbol-report (Join-Path $archiveDir 'debug-symbols/index.json') --diagnostic-report (Join-Path $recordDir 'diagnostics.json') --dependency-checks-passed $dependencyChecksPassed
          if ($LASTEXITCODE -ne 0) { throw 'Windows publication record finalization failed' }
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: windows-postgresql-${{ needs.select.outputs.postgresql_version }}-pilot-verification
          path: |
            dist/windows/verification/*.json
            ${{ runner.temp }}/verification-records/*.json
            ${{ runner.temp }}/verification-records/publication/*.json
          retention-days: 1
          if-no-files-found: warn
