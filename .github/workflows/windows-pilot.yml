name: Windows PostgreSQL pilot

on:
  workflow_dispatch:
    inputs:
      postgresql_version:
        description: Supported PostgreSQL minor version to build
        required: true
        default: '18.6'
        type: string
  push:
    branches: [spike]
    paths:
      - '.github/workflows/windows-pilot.yml'
      - 'scripts/windows/**'
      - 'support.json'
      - 'support/postgresql-releases.json'
      - 'inventory.json'
      - 'support/verification-profiles.json'
      - 'tools/plan_work.py'
      - 'tools/discover_builtins.py'
      - 'tools/create_windows_symbols.py'
      - 'tools/emit_windows_pilot_records.py'
      - 'tools/check_pe_dependencies.py'
      - 'tests/schema.sql'
      - 'tests/builtins/**'
      - 'tests/extensions/**'
      - 'tests/test_create_windows_symbols.py'
      - 'tests/test_emit_windows_pilot_records.py'
      - 'tests/test_check_pe_dependencies.py'

permissions:
  contents: read

concurrency:
  group: windows-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      postgresql_version: ${{ steps.select.outputs.postgresql_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select supported Windows build version
        id: select
        env:
          PG_VERSION_INPUT: ${{ inputs.postgresql_version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            selection=(--select-pilot "$PG_VERSION_INPUT")
          else
            selection=(--select-next-pilot)
          fi
          python3 tools/plan_work.py "${selection[@]}" --platform windows-x86_64 > "$RUNNER_TEMP/selection.json"
          python3 - "$RUNNER_TEMP/selection.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              result = json.load(stream)
          if result.get("platform") != "windows-x86_64" or not result.get("work") or not result.get("snapshot_as_of"):
              raise SystemExit("Windows pilot selection is missing required planner fields")
          with open(sys.argv[2], "a", encoding="utf-8") as output:
              output.write(f"postgresql_version={result['postgresql_version']}\n")
          PY

  build:
    needs: select
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      PG_VERSION: ${{ needs.select.outputs.postgresql_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Windows symbol-index helper
        run: python -m unittest tests/test_create_windows_symbols.py
      - name: Install Meson and Ninja
        run: python -m pip install --disable-pip-version-check meson ninja
      - name: Provide Flex and Bison for the PostgreSQL build
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'win_flex_bison-2.5.25.zip'
          $tools = Join-Path $env:RUNNER_TEMP 'win_flex_bison-2.5.25'
          Invoke-WebRequest 'https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip' -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '8d324b62be33604b2c45ad1dd34ab93d722534448f55a16ca7292de32b6ac135') {
            throw "WinFlexBison checksum mismatch: $actual"
          }
          Expand-Archive $archive -DestinationPath $tools
          $flex = Get-ChildItem $tools -Recurse -Filter win_flex.exe | Select-Object -First 1
          if (-not $flex -or -not (Test-Path (Join-Path $flex.DirectoryName 'win_bison.exe'))) {
            throw 'WinFlexBison executables missing from archive'
          }
          Add-Content -Path $env:GITHUB_PATH -Value $flex.DirectoryName
      - name: Install PostgreSQL libraries
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install icu:x64-windows zlib:x64-windows lz4:x64-windows zstd:x64-windows openssl:x64-windows libxml2:x64-windows libxslt:x64-windows
      - name: Build and package
        shell: cmd
        run: scripts\windows\build.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: windows-postgresql-${{ needs.select.outputs.postgresql_version }}-pilot
          path: |
            dist/windows/*.tar.gz
            dist/windows/*.sha256
            dist/windows/debug-symbols/**
          retention-days: 1
          if-no-files-found: error

  verify:
    needs: [select, build]
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PG_VERSION: ${{ needs.select.outputs.postgresql_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-postgresql-${{ needs.select.outputs.postgresql_version }}-pilot
          path: dist/windows
      - name: Verify packaged archives after relocation
        id: archive_verify
        env:
          PE_STATIC_ANALYSIS_REPORT: ${{ runner.temp }}/verification-records/static-analysis.json
        run: ./scripts/windows/verify.ps1
      - name: Verify PDBs against downloaded archive bytes
        id: symbols
        run: python tools/create_windows_symbols.py "dist/windows/postgresql-${env:PG_VERSION}-windows-x86_64.tar.gz" "dist/windows/pgvector-0.8.7-postgresql-${env:PG_VERSION}-windows-x86_64.tar.gz" --output-dir dist/windows/debug-symbols --verify-only
      - name: Check Windows pilot record emitter
        id: emitter_tests
        run: python -m unittest tests/test_emit_windows_pilot_records.py
      - name: Finalize checksum-bound current Windows records
        if: ${{ always() }}
        env:
          GITHUB_SHA: ${{ github.sha }}
          CHECK_OUTCOMES: ${{ steps.archive_verify.outcome }},${{ steps.symbols.outcome }},${{ steps.emitter_tests.outcome }}
          DEPENDENCY_CHECKS_PASSED: ${{ steps.archive_verify.outcome == 'success' }}
        run: |
          if (-not $env:PG_VERSION) {
            Write-Host 'No current-OS verification record: PostgreSQL version was not selected'
            exit 0
          }
          $archiveDir = 'dist/windows'
          $pgArchive = Join-Path $archiveDir "postgresql-$env:PG_VERSION-windows-x86_64.tar.gz"
          $vectorArchive = Join-Path $archiveDir "pgvector-0.8.7-postgresql-$env:PG_VERSION-windows-x86_64.tar.gz"
          $required = @($pgArchive, "$pgArchive.sha256", $vectorArchive, "$vectorArchive.sha256")
          if (@($required | Where-Object { -not (Test-Path $_ -PathType Leaf) }).Count -gt 0) {
            Write-Host 'No current-OS verification record: archive bytes or checksum sidecars are unavailable'
            exit 0
          }
          $osVersion = [System.Environment]::OSVersion.Version.ToString()
          $imageOS = [Environment]::GetEnvironmentVariable('ImageOS')
          $imageVersion = [Environment]::GetEnvironmentVariable('ImageVersion')
          if (-not $osVersion -or -not $imageOS -or -not $imageVersion) {
            Write-Host 'No current-OS verification record: concrete runner environment identity is unavailable'
            exit 0
          }
          $imageId = "$imageOS/$imageVersion"
          $outcomes = $env:CHECK_OUTCOMES -split ','
          if ($outcomes -contains 'failure') { $outcome = 'failed' }
          elseif (@($outcomes | Where-Object { $_ -ne 'success' }).Count -eq 0) { $outcome = 'passed' }
          else { $outcome = 'skipped' }
          python tools/emit_windows_pilot_records.py --archives $archiveDir --output (Join-Path $archiveDir 'verification') --postgresql-version $env:PG_VERSION --os-version $osVersion --image-id $imageId --outcome $outcome --dependency-checks-passed $env:DEPENDENCY_CHECKS_PASSED.ToLowerInvariant() --static-report (Join-Path $env:RUNNER_TEMP 'verification-records/static-analysis.json')
          if ($LASTEXITCODE -ne 0) { throw 'Windows pilot record finalization failed' }
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: windows-postgresql-${{ needs.select.outputs.postgresql_version }}-pilot-verification
          path: |
            dist/windows/verification/*.json
            ${{ runner.temp }}/verification-records/static-analysis.json
          retention-days: 1
          if-no-files-found: warn
