name: Linux publication verification
on:
  workflow_dispatch:
    inputs:
      postgresql_version:
        description: Selected PostgreSQL minor to verify
        required: true
        default: '18.6'
        type: string
  push:
    branches: [spike]
    paths:
      - '.github/workflows/linux-publication.yml'
      - 'scripts/linux/Dockerfile'
      - 'scripts/linux/build.sh'
      - 'scripts/linux/build-in-container.sh'
      - 'tools/source_archive.py'
      - 'tools/check_source_identity.py'
      - 'support.json'
      - 'support/postgresql-releases.json'
      - 'scripts/linux/bundle-glibc-in-container.sh'
      - 'scripts/linux/launcher.c'
      - 'scripts/linux/verify*'
      - 'scripts/linux/diagnostics*'
      - 'support/verification-profiles.json'
      - 'tests/schema.sql'
      - 'tests/builtins/**'
      - 'tests/extensions/pgvector.sql'
      - 'tools/check_elf_dependencies.py'
      - 'tools/stage_extension_archive.py'
      - 'tools/create_linux_publication_receipt.py'
      - 'tools/emit_linux_publication_records.py'
      - 'tools/read_combined_verification_phases.py'
      - 'scripts/postgis/**'
      - 'scripts/tiger/**'
      - 'scripts/hypopg/build*'
      - 'scripts/hypopg/verify*'
      - 'scripts/hypopg/Dockerfile'
      - 'scripts/hypopg/probe.sql'
      - 'scripts/pgtap/build*'
      - 'scripts/pgtap/verify*'
      - 'scripts/pgtap/Dockerfile'
      - 'scripts/pgtap/probe.sql'
      - 'scripts/pg_ivm/**'
      - 'tools/check_postgis_license_inventory.py'
      - 'tools/write_postgis_license_inventory.py'
      - 'tools/create_extension_publication_receipt.py'
      - 'tools/emit_extension_publication_records.py'
      - 'tools/write_linux_license_inventory.py'
      - 'tools/profile_change_gate.py'
      - 'tests/test_profile_change_gate.py'
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.profile_gate.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Test profile-change gate
        run: python3 -m unittest tests/test_profile_change_gate.py
      - name: Check whether a Linux publication profile changed
        id: profile_gate
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before_root="$RUNNER_TEMP/profile-before"
          if [[ ! "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || ! git fetch --no-tags --depth=1 origin "$BEFORE_SHA" \
            || ! git worktree add --detach "$before_root" "$BEFORE_SHA"; then
            echo 'Base commit unavailable; running the Linux publication workflow.' >&2
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          profile_ids=(
            linux-publication-current-x86_64 linux-publication-current-arm64
            postgis-publication-current-x86_64 postgis-publication-current-arm64
            tiger-publication-current-x86_64 tiger-publication-current-arm64
            hypopg-publication-current-x86_64 hypopg-publication-current-arm64
            pgtap-publication-current-x86_64 pgtap-publication-current-arm64
            pgivm-publication-current-x86_64 pgivm-publication-current-arm64
          )
          for profile_id in "${profile_ids[@]}"; do
            result=$(python3 tools/profile_change_gate.py \
              --before-root "$before_root" \
              --current-root "$GITHUB_WORKSPACE" \
              --profile-id "$profile_id") || {
              echo "Cannot resolve current Linux profile $profile_id; running the workflow." >&2
              echo 'should_run=true' >> "$GITHUB_OUTPUT"
              exit 0
            }
            if [[ "$result" == should_run=true ]]; then
              echo 'should_run=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo 'should_run=false' >> "$GITHUB_OUTPUT"

# profile-section: job-setup begin
  verify:
    needs: scope
    if: ${{ needs.scope.outputs.should_run == 'true' }}
    name: verify (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
            docker_platform: linux/amd64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            docker_platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      PG_VERSION: ${{ inputs.postgresql_version || '18.6' }}
      PG_ARCHITECTURE: ${{ matrix.architecture }}
# profile-section: job-setup end
    steps:
      - uses: actions/checkout@v4
      # profile-section: archive-builds begin
      - name: Build exact PostgreSQL and pgvector archives
        id: build
        run: scripts/linux/build.sh "$RUNNER_TEMP/pilot"
      - name: Build PostGIS 3.6.4 against the publication PostgreSQL archive
        if: ${{ always() && steps.build.outcome == 'success' }}
        id: postgis_build
        run: bash scripts/postgis/build.sh "$RUNNER_TEMP/pilot" "$RUNNER_TEMP/postgis"
      - name: Build TIGER Geocoder 2025.2 against the publication PostgreSQL archive
        if: ${{ always() && steps.postgis_build.outcome == 'success' && (startsWith(env.PG_VERSION, '16.') || startsWith(env.PG_VERSION, '17.') || startsWith(env.PG_VERSION, '18.')) }}
        id: tiger_build
        run: bash scripts/tiger/build.sh "$RUNNER_TEMP/pilot" "$RUNNER_TEMP/tiger"
      # profile-section: archive-builds end
      # profile-section: pgtap-build begin
      - name: Build pgTAP 1.3.4 against the publication PostgreSQL archive
        if: ${{ always() && steps.build.outcome == 'success' }}
        id: pgtap_build
        run: bash scripts/pgtap/build.sh "$RUNNER_TEMP/pilot" "$RUNNER_TEMP/pgtap"
      # profile-section: pgtap-build end
      # profile-section: hypopg-build begin
      - name: Build HypoPG 1.4.3 against the publication PostgreSQL archive
        if: ${{ always() && steps.build.outcome == 'success' }}
        id: hypopg_build
        run: bash scripts/hypopg/build.sh "$RUNNER_TEMP/pilot" "$RUNNER_TEMP/hypopg"
      # profile-section: hypopg-build end
      # profile-section: pgivm-build begin
      - name: Build pg_ivm 1.16 against the selected PostgreSQL archive
        if: ${{ always() && steps.build.outcome == 'success' && (startsWith(env.PG_VERSION, '15.') || startsWith(env.PG_VERSION, '16.') || startsWith(env.PG_VERSION, '17.') || startsWith(env.PG_VERSION, '18.')) }}
        id: pgivm_build
        run: PG_VERSION="$PG_VERSION" bash scripts/pg_ivm/build.sh "$RUNNER_TEMP/pilot" "$RUNNER_TEMP/pg_ivm"
      # profile-section: pgivm-build end
      # profile-section: core-current begin
      - name: Check launch without host shell or C library
        if: ${{ always() && steps.build.outcome == 'success' }}
        id: nohost
        run: bash scripts/linux/verify-no-host-userspace.sh "$RUNNER_TEMP/pilot" "$PG_VERSION" "$PG_ARCHITECTURE"
      # profile-section: core-current end
      # profile-section: combined-current begin
      - name: Verify assembled archives in one Alpine 3.22 container
        if: ${{ always() && steps.build.outcome == 'success' }}
        id: combined_verify
        run: bash scripts/linux/verify-combined.sh "$RUNNER_TEMP/pilot" "$RUNNER_TEMP/postgis" "$RUNNER_TEMP/tiger" "$RUNNER_TEMP/combined-verification"
      - name: Map combined verification phases to case outcomes
        if: ${{ always() }}
        id: phase_outcomes
        env:
          VERIFICATION_SKIPPED: ${{ steps.combined_verify.outcome == 'skipped' }}
        run: |
          set -euo pipefail
          args=(--status "$RUNNER_TEMP/combined-verification/status/phases.tsv")
          if [[ "$VERIFICATION_SKIPPED" == true ]]; then args+=(--verification-skipped); fi
          outcomes=$(python3 tools/read_combined_verification_phases.py "${args[@]}")
          printf 'outcomes=%s\n' "$outcomes" >> "$GITHUB_OUTPUT"
      # profile-section: combined-current end
      # profile-section: hypopg-verify begin
      - name: Verify relocated HypoPG archive and runtime closure in Alpine 3.22
        if: ${{ always() && steps.hypopg_build.outcome == 'success' }}
        id: hypopg_verify
        run: bash scripts/hypopg/verify.sh "$RUNNER_TEMP/pilot" "$RUNNER_TEMP/hypopg"
      # profile-section: hypopg-verify end
      # profile-section: pgtap-verify begin
      - name: Verify relocated pgTAP archive and runtime closure in Alpine 3.22
        if: ${{ always() && steps.pgtap_build.outcome == 'success' }}
        id: pgtap_verify
        run: bash scripts/pgtap/verify.sh "$RUNNER_TEMP/pilot" "$RUNNER_TEMP/pgtap"
      # profile-section: pgtap-verify end
      # profile-section: pgivm-verify begin
      - name: Verify relocated pg_ivm 1.16 archive and runtime closure in Alpine 3.22
        if: ${{ always() && steps.pgivm_build.outcome == 'success' }}
        id: pgivm_verify
        run: PG_VERSION="$PG_VERSION" bash scripts/pg_ivm/verify.sh "$RUNNER_TEMP/pilot" "$RUNNER_TEMP/pg_ivm"
      # profile-section: pgivm-verify end
      # profile-section: core-current-report begin
      - name: Record current-OS publication case results
        if: ${{ always() }}
        env:
          ARCHIVE_OUTCOME: ${{ fromJSON(steps.phase_outcomes.outputs.outcomes).core }}
          NOHOST_OUTCOME: ${{ steps.nohost.outcome }}
          DIAGNOSTICS_OUTCOME: ${{ fromJSON(steps.phase_outcomes.outputs.outcomes).diagnostics }}
        run: |
          set -euo pipefail
          archive_dir="$RUNNER_TEMP/pilot"
          mkdir -p "$archive_dir/publication"
          printf '{"archive-suite":"%s","diagnostics":"%s","no-host-userspace":"%s"}\n' \
            "$ARCHIVE_OUTCOME" "$DIAGNOSTICS_OUTCOME" "$NOHOST_OUTCOME" \
            > "$archive_dir/publication/current-steps.json"
          if [[ ! -f "$archive_dir/postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz" || \
                ! -f "$archive_dir/pgvector-0.8.7-postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz" ]]; then
            echo "No current-OS record: archive bytes are unavailable"
            exit 0
          fi
          image_id=$(docker image inspect pg-binaries-linux-verifier --format '{{.Id}}' 2>/dev/null || true)
          if [[ -z "$image_id" ]]; then image_id=unknown; fi
          clean=false
          dependencies=failure
          if [[ "$ARCHIVE_OUTCOME" == success ]]; then clean=true; dependencies=success; fi
          distribution=$(docker run --rm --platform "${{ matrix.docker_platform }}" \
            --entrypoint sh pg-binaries-linux-verifier -c '. /etc/os-release; printf "%s" "$NAME"')
          distribution_version=$(docker run --rm --platform "${{ matrix.docker_platform }}" \
            --entrypoint sh pg-binaries-linux-verifier -c '. /etc/os-release; printf "%s" "$VERSION_ID"')
          python3 tools/create_linux_publication_receipt.py \
            --archives "$archive_dir" --receipt "$archive_dir/publication/current-receipt.json" \
            --profile-id "linux-publication-current-$PG_ARCHITECTURE" \
            --postgresql-version "$PG_VERSION" --architecture "$PG_ARCHITECTURE" --endpoint current \
            --kernel-release "$(uname -r)" --distribution "$distribution" \
            --distribution-version "$distribution_version" --image-id "$image_id" \
            --dependency-check-profile linux-runtime-v1 --dependency-check-result "$dependencies" \
            --clean-system "$clean" --step-results "$archive_dir/publication/current-steps.json"
          python3 tools/emit_linux_publication_records.py \
            --archives "$archive_dir" --receipt "$archive_dir/publication/current-receipt.json" \
            --output "$archive_dir/publication/records"
      # profile-section: core-current-report end
      # profile-section: postgis-report begin
      - name: Record PostGIS publication step outcome
        if: ${{ always() }}
        env:
          VERIFY_OUTCOME: ${{ fromJSON(steps.phase_outcomes.outputs.outcomes).postgis }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/postgis-publication"
          printf '{"archive-suite":"%s"}\n' "$VERIFY_OUTCOME" \
            > "$RUNNER_TEMP/postgis-publication/current-steps.json"
      - name: Emit PostGIS publication records
        if: ${{ always() }}
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/pilot/postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz"
          extension="$RUNNER_TEMP/postgis/postgis-3.6.4-postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz"
          if [[ ! -f "$core" || ! -f "$core.sha256" || ! -f "$extension" || ! -f "$extension.sha256" ]]; then
            echo 'No publication record: assembled archive bytes or sidecars are unavailable'
            exit 0
          fi
          python3 - "$core" "$RUNNER_TEMP/pilot/publication/records" "$PG_VERSION" "$PG_ARCHITECTURE" "$GITHUB_RUN_ID" "$GITHUB_SHA" <<'PYCODE'
          import hashlib
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools')
          import coverage
          core, records, pg_version, architecture, run_id, revision = sys.argv[1:]
          digest = hashlib.sha256(Path(core).read_bytes()).hexdigest()
          support = coverage.load_json(Path('support.json'))
          name = f'postgresql-{pg_version}-linux-{architecture}-current-{run_id}.json'
          record = coverage.load_json(Path(records) / name)
          coverage.validate_verification_record(record, support, Path('.'))
          if (record['sha256'] != digest
                  or record['ci']['run_id'] != run_id
                  or record['test_revision'] != revision):
              raise SystemExit('PostGIS core differs from publication record')
          PYCODE
          publication="$RUNNER_TEMP/postgis-publication"
          image=$(docker image inspect --format '{{.Id}}' pg-binaries-linux-verifier 2>/dev/null || true)
          if [[ ! "$image" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'No PostGIS publication record: verifier image identity is unavailable'
            exit 0
          fi
          clean=false
          dependencies=failure
          if [[ "$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(all(v == "success" for v in d.values()))' "$publication/current-steps.json")" = True ]]; then
            clean=true
            dependencies=success
          fi
          distribution=$(docker run --rm --platform "${{ matrix.docker_platform }}" \
            --entrypoint sh pg-binaries-linux-verifier -c '. /etc/os-release; printf "%s" "$NAME"')
          distribution_version=$(docker run --rm --platform "${{ matrix.docker_platform }}" \
            --entrypoint sh pg-binaries-linux-verifier -c '. /etc/os-release; printf "%s" "$VERSION_ID"')
          python3 tools/create_extension_publication_receipt.py \
            --archives "$RUNNER_TEMP/postgis" --core-archives "$RUNNER_TEMP/pilot" \
            --receipt "$publication/current-receipt.json" \
            --profile-id "postgis-publication-current-$PG_ARCHITECTURE" \
            --project PostGIS --version 3.6.4 --postgresql-version "$PG_VERSION" \
            --architecture "$PG_ARCHITECTURE" --endpoint current \
            --kernel-release "$(uname -r)" --distribution "$distribution" \
            --distribution-version "$distribution_version" --image-id "$image" \
            --dependency-check-result "$dependencies" --clean-system "$clean" \
            --step-results "$publication/current-steps.json"
          python3 tools/emit_extension_publication_records.py \
            --archives "$RUNNER_TEMP/postgis" --core-archives "$RUNNER_TEMP/pilot" \
            --receipt "$publication/current-receipt.json" --output "$publication/records"
      # profile-section: postgis-report end
      # profile-section: tiger-report begin
      - name: Record TIGER publication step outcome
        if: ${{ always() && (startsWith(env.PG_VERSION, '16.') || startsWith(env.PG_VERSION, '17.') || startsWith(env.PG_VERSION, '18.')) }}
        env:
          VERIFY_OUTCOME: ${{ fromJSON(steps.phase_outcomes.outputs.outcomes).tiger }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tiger-publication"
          printf '{"archive-suite":"%s"}\n' "$VERIFY_OUTCOME" \
            > "$RUNNER_TEMP/tiger-publication/current-steps.json"
      - name: Emit TIGER publication records
        if: ${{ always() && (startsWith(env.PG_VERSION, '16.') || startsWith(env.PG_VERSION, '17.') || startsWith(env.PG_VERSION, '18.')) }}
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/pilot/postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz"
          postgis="$RUNNER_TEMP/postgis/postgis-3.6.4-postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz"
          tiger="$RUNNER_TEMP/tiger/postgis_tiger_geocoder-2025.2-postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz"
          if [[ ! -f "$core" || ! -f "$core.sha256" || ! -f "$postgis" || ! -f "$postgis.sha256" || ! -f "$tiger" || ! -f "$tiger.sha256" ]]; then
            echo 'No TIGER publication record: assembled archive bytes or sidecars are unavailable'
            exit 0
          fi
          python3 - "$core" "$postgis" "$RUNNER_TEMP/postgis-publication/records" "$PG_VERSION" "$PG_ARCHITECTURE" "$GITHUB_RUN_ID" "$GITHUB_SHA" <<'PYCODE'
          import hashlib
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import coverage
          core, postgis, records, pg_version, architecture, run_id, revision = sys.argv[1:]
          support = coverage.load_json(Path('support.json'))
          core_sha = hashlib.sha256(Path(core).read_bytes()).hexdigest()
          postgis_sha = hashlib.sha256(Path(postgis).read_bytes()).hexdigest()
          name = f'postgis-3.6.4-postgresql-{pg_version}-linux-{architecture}-current-{run_id}.json'
          record = coverage.load_json(Path(records) / name)
          coverage.validate_verification_record(record, support, Path('.'))
          if (record['sha256'] != postgis_sha
                  or record['assembled_core']['sha256'] != core_sha
                  or record['ci']['run_id'] != run_id
                  or record['test_revision'] != revision):
              raise SystemExit('TIGER prerequisite differs from PostGIS publication record')
          PYCODE
          publication="$RUNNER_TEMP/tiger-publication"
          image=$(docker image inspect --format '{{.Id}}' pg-binaries-linux-verifier 2>/dev/null || true)
          if [[ ! "$image" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'No TIGER publication record: verifier image identity is unavailable'
            exit 0
          fi
          clean=false
          dependencies=failure
          if [[ "$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(all(v == "success" for v in d.values()))' "$publication/current-steps.json")" = True ]]; then
            clean=true
            dependencies=success
          fi
          distribution=$(docker run --rm --platform "${{ matrix.docker_platform }}" \
            --entrypoint sh pg-binaries-linux-verifier -c '. /etc/os-release; printf "%s" "$NAME"')
          distribution_version=$(docker run --rm --platform "${{ matrix.docker_platform }}" \
            --entrypoint sh pg-binaries-linux-verifier -c '. /etc/os-release; printf "%s" "$VERSION_ID"')
          python3 tools/create_extension_publication_receipt.py \
            --archives "$RUNNER_TEMP/tiger" --core-archives "$RUNNER_TEMP/pilot" \
            --prerequisite-archive "PostGIS=$postgis" \
            --receipt "$publication/current-receipt.json" \
            --profile-id "tiger-publication-current-$PG_ARCHITECTURE" \
            --project 'PostGIS TIGER Geocoder' --version 2025.2 --postgresql-version "$PG_VERSION" \
            --architecture "$PG_ARCHITECTURE" --endpoint current \
            --kernel-release "$(uname -r)" --distribution "$distribution" \
            --distribution-version "$distribution_version" --image-id "$image" \
            --dependency-check-result "$dependencies" --clean-system "$clean" \
            --step-results "$publication/current-steps.json"
          python3 tools/emit_extension_publication_records.py \
            --archives "$RUNNER_TEMP/tiger" --core-archives "$RUNNER_TEMP/pilot" \
            --prerequisite-archive "PostGIS=$postgis" \
            --receipt "$publication/current-receipt.json" --output "$publication/records"
      # profile-section: tiger-report end
      # profile-section: hypopg-report begin
      - name: Record HypoPG publication step outcome
        if: ${{ always() }}
        env:
          VERIFY_OUTCOME: ${{ steps.hypopg_verify.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hypopg-publication"
          printf '{"archive-suite":"%s"}\n' "$VERIFY_OUTCOME" \
            > "$RUNNER_TEMP/hypopg-publication/current-steps.json"
      - name: Emit HypoPG publication records
        if: ${{ always() }}
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/pilot/postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz"
          extension="$RUNNER_TEMP/hypopg/hypopg-1.4.3-postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz"
          if [[ ! -f "$core" || ! -f "$core.sha256" || ! -f "$extension" || ! -f "$extension.sha256" ]]; then
            echo 'No HypoPG publication record: assembled archive bytes or sidecars are unavailable'
            exit 0
          fi
          python3 - "$core" "$RUNNER_TEMP/pilot/publication/records" "$PG_VERSION" "$PG_ARCHITECTURE" "$GITHUB_RUN_ID" "$GITHUB_SHA" <<'PYCODE'
          import hashlib
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools')
          import coverage
          core, records, pg_version, architecture, run_id, revision = sys.argv[1:]
          digest = hashlib.sha256(Path(core).read_bytes()).hexdigest()
          support = coverage.load_json(Path('support.json'))
          name = f'postgresql-{pg_version}-linux-{architecture}-current-{run_id}.json'
          record = coverage.load_json(Path(records) / name)
          coverage.validate_verification_record(record, support, Path('.'))
          if (record['sha256'] != digest
                  or record['ci']['run_id'] != run_id
                  or record['test_revision'] != revision):
              raise SystemExit('HypoPG core differs from publication record')
          PYCODE
          publication="$RUNNER_TEMP/hypopg-publication"
          image=$(docker image inspect --format '{{.Id}}' pg-binaries-hypopg-verifier 2>/dev/null || true)
          if [[ ! "$image" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'No HypoPG publication record: verifier image identity is unavailable'
            exit 0
          fi
          clean=false
          dependencies=failure
          if [[ "$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(all(v == "success" for v in d.values()))' "$publication/current-steps.json")" = True ]]; then
            clean=true
            dependencies=success
          fi
          distribution=$(docker run --rm --platform "${{ matrix.docker_platform }}" \
            --entrypoint sh pg-binaries-hypopg-verifier -c '. /etc/os-release; printf "%s" "$NAME"')
          distribution_version=$(docker run --rm --platform "${{ matrix.docker_platform }}" \
            --entrypoint sh pg-binaries-hypopg-verifier -c '. /etc/os-release; printf "%s" "$VERSION_ID"')
          python3 tools/create_extension_publication_receipt.py \
            --archives "$RUNNER_TEMP/hypopg" --core-archives "$RUNNER_TEMP/pilot" \
            --receipt "$publication/current-receipt.json" \
            --profile-id "hypopg-publication-current-$PG_ARCHITECTURE" \
            --project HypoPG --version 1.4.3 --postgresql-version "$PG_VERSION" \
            --architecture "$PG_ARCHITECTURE" --endpoint current \
            --kernel-release "$(uname -r)" --distribution "$distribution" \
            --distribution-version "$distribution_version" --image-id "$image" \
            --dependency-check-result "$dependencies" --clean-system "$clean" \
            --step-results "$publication/current-steps.json"
          python3 tools/emit_extension_publication_records.py \
            --archives "$RUNNER_TEMP/hypopg" --core-archives "$RUNNER_TEMP/pilot" \
            --receipt "$publication/current-receipt.json" --output "$publication/records"
      # profile-section: hypopg-report end
      # profile-section: pgtap-report begin
      - name: Record pgTAP publication outcomes and emit archive-bound evidence
        if: ${{ always() }}
        env:
          CORE_BUILD_OUTCOME: ${{ steps.build.outcome }}
          PGTAP_BUILD_OUTCOME: ${{ steps.pgtap_build.outcome }}
          PGTAP_VERIFY_OUTCOME: ${{ steps.pgtap_verify.outcome }}
        run: |
          set -euo pipefail
          publication="$RUNNER_TEMP/pgtap-publication"
          mkdir -p "$publication"
          image=$(docker image inspect --format '{{.Id}}' pg-binaries-pgtap-verifier 2>/dev/null || true)
          if [[ ! "$image" =~ ^sha256:[0-9a-f]{64}$ ]]; then image=unknown; fi
          IMAGE_ID="$image" python3 - "$publication/attempt.json" "$publication/current-steps.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          core = os.environ["CORE_BUILD_OUTCOME"]
          build = os.environ["PGTAP_BUILD_OUTCOME"]
          verify = os.environ["PGTAP_VERIFY_OUTCOME"]
          image = os.environ["IMAGE_ID"]
          suite = "failure" if "failure" in (build, verify) or (
              build == verify == "success" and image == "unknown") else (
              "success" if build == verify == "success" else "skipped")
          attempt = {
              "schema_version": 1,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "source_revision": os.environ["GITHUB_SHA"],
              "postgresql_version": os.environ["PG_VERSION"],
              "architecture": os.environ["PG_ARCHITECTURE"],
              "verifier_image_id": image,
              "steps": {
                  "core_build": core,
                  "pgtap_build": build,
                  "pgtap_verify": verify,
              },
          }
          Path(sys.argv[1]).write_text(json.dumps(attempt, indent=2, sort_keys=True) + "\n",
                                       encoding="utf-8")
          Path(sys.argv[2]).write_text(json.dumps({"pgtap-archive-suite": suite},
                                                   sort_keys=True) + "\n",
                                       encoding="utf-8")
          PY
          core="$RUNNER_TEMP/pilot/postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz"
          extension="$RUNNER_TEMP/pgtap/pgtap-1.3.4-postgresql-$PG_VERSION-linux-$PG_ARCHITECTURE.tar.gz"
          if [[ ! -f "$core" || ! -f "$core.sha256" || ! -f "$extension" || ! -f "$extension.sha256" ]]; then
            echo 'No pgTAP publication record: assembled archive bytes or sidecars are unavailable'
            exit 0
          fi
          clean=false
          dependencies=failure
          if [[ "$(python3 -c 'import json,sys; print(next(iter(json.load(open(sys.argv[1])).values())) == "success")' "$publication/current-steps.json")" == True ]]; then
            clean=true
            dependencies=success
          fi
          distribution='Alpine Linux'
          distribution_version=3.22
          if [[ "$image" != unknown ]]; then
            distribution=$(docker run --rm --platform "${{ matrix.docker_platform }}" \
              --entrypoint sh pg-binaries-pgtap-verifier -c '. /etc/os-release; printf "%s" "$NAME"')
            distribution_version=$(docker run --rm --platform "${{ matrix.docker_platform }}" \
              --entrypoint sh pg-binaries-pgtap-verifier -c '. /etc/os-release; printf "%s" "$VERSION_ID"')
          fi
          python3 tools/create_extension_publication_receipt.py \
            --archives "$RUNNER_TEMP/pgtap" --core-archives "$RUNNER_TEMP/pilot" \
            --receipt "$publication/current-receipt.json" \
            --profile-id "pgtap-publication-current-$PG_ARCHITECTURE" \
            --project pgtap --version 1.3.4 --postgresql-version "$PG_VERSION" \
            --architecture "$PG_ARCHITECTURE" --endpoint current \
            --kernel-release "$(uname -r)" --distribution "$distribution" \
            --distribution-version "$distribution_version" --image-id "$image" \
            --dependency-check-result "$dependencies" --clean-system "$clean" \
            --step-results "$publication/current-steps.json"
          python3 tools/emit_extension_publication_records.py \
            --archives "$RUNNER_TEMP/pgtap" --core-archives "$RUNNER_TEMP/pilot" \
            --receipt "$publication/current-receipt.json" --output "$publication/records"
      # profile-section: pgtap-report end
