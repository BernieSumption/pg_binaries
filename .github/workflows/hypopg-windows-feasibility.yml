name: HypoPG Windows x86-64 feasibility

on:
  workflow_dispatch:
  push:
    branches: [spike]
    paths:
      - '.github/workflows/hypopg-windows-feasibility.yml'
      - 'scripts/hypopg/windows-feasibility.ps1'
      - 'scripts/hypopg/probe.sql'
      - 'support/windows-core-pins/18.6-x86_64.json'
      - 'tools/windows_core_pin.py'
      - 'tools/check_extension_redistribution.py'
      - 'tools/check_pe_dependencies.py'
      - 'tests/test_hypopg_windows_feasibility.py'

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load pinned PostgreSQL core identity
        id: core_pin
        run: python tools/windows_core_pin.py --github-output >> $env:GITHUB_OUTPUT
      - name: Download the pinned PostgreSQL 18.6 Windows core
        uses: actions/download-artifact@v4
        with:
          name: windows-postgresql-18.6-pilot
          run-id: ${{ steps.core_pin.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/hypopg-core
      - name: Build, relocate and verify HypoPG 1.4.3
        id: probe
        continue-on-error: true
        run: ./scripts/hypopg/windows-feasibility.ps1 -CoreArchiveDirectory "$env:RUNNER_TEMP/hypopg-core" -OutputDirectory "$env:RUNNER_TEMP/hypopg-windows-feasibility"
      - name: Upload feasibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hypopg-windows-x86-64-feasibility-${{ github.run_id }}
          path: ${{ runner.temp }}/hypopg-windows-feasibility/**
          if-no-files-found: warn
          retention-days: 7
      - name: Require the feasibility probe to pass
        if: always()
        run: |
          if ('${{ steps.probe.outcome }}' -ne 'success') {
            throw 'The HypoPG Windows feasibility probe failed.'
          }
