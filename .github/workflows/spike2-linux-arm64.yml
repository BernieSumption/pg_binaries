name: Spike 2 Linux ARM64

"on":
  push:
    branches: [spike-2]
    paths: [.github/workflows/spike2-linux-arm64.yml]
  workflow_dispatch:
    inputs:
      operation:
        description: Build everything, retry one package, or verify selected runs
        required: true
        type: choice
        options: [full, retry-extension, verify]
      package:
        description: Package key for retry-extension
        required: false
        type: string
      postgresql_run:
        description: PostgreSQL build run ID for retry-extension
        required: false
        type: string
      runs:
        description: Ordered comma-separated run IDs for verify
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.selection.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - id: selection
        name: Validate request and select packages
        env:
          OPERATION: ${{ inputs.operation }}
          PACKAGE: ${{ inputs.package }}
          POSTGRESQL_RUN: ${{ inputs.postgresql_run }}
          RUNS: ${{ inputs.runs }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          support = json.loads(Path("support.json").read_text(encoding="utf-8"))
          packages = list(support["packages"])
          operation = os.environ["OPERATION"] or "bootstrap"
          if operation == "retry-extension":
              package = os.environ["PACKAGE"]
              if package not in packages or not os.environ["POSTGRESQL_RUN"].isdigit():
                  raise SystemExit("retry-extension needs a selected package and PostgreSQL run ID")
              packages = [package]
          elif operation == "verify":
              runs = [item.strip() for item in os.environ["RUNS"].split(",")]
              if not runs or any(not item.isdigit() for item in runs):
                  raise SystemExit("verify needs ordered, comma-separated run IDs")
              packages = []
          elif operation == "bootstrap":
              packages = []
          elif operation != "full":
              raise SystemExit(f"unknown operation: {operation}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("packages=" + json.dumps(packages, separators=(",", ":")) + "\n")
          PY

  postgresql:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'full'
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex curl ca-certificates file patchelf pkg-config \
            libicu-dev liblz4-dev libzstd-dev libssl-dev libxml2-dev libxslt1-dev \
            zlib1g-dev uuid-dev python3 musl-tools binutils \
            libgeos-dev libproj-dev proj-data libgdal-dev gdal-data libjson-c-dev \
            libsfcgal-dev libprotobuf-c-dev protobuf-c-compiler libreadline-dev \
            libclang-dev
      - name: Build and package PostgreSQL
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/output"
          sudo mkdir -p /opt/postgresql
          sudo chown "$USER":"$(id -gn)" /opt/postgresql
          cat > "$RUNNER_TEMP/postgresql-build.sh" <<'SH'
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dependencies"
          python3 build.py --target linux-arm64 postgresql-build "$RUNNER_TEMP/dependencies" "$RUNNER_TEMP/build" /opt/postgresql
          python3 build.py --target linux-arm64 postgresql-package /opt/postgresql "$RUNNER_TEMP/dependencies" "$RUNNER_TEMP/output"
          version=$(python3 -c 'import json; print(json.load(open("support.json"))["postgresql"]["version"])')
          archive="$RUNNER_TEMP/output/postgresql-$version-linux-arm64.tar.gz"
          development="$RUNNER_TEMP/output/postgresql-development-$version-linux-arm64.tar.gz"
          python3 build.py --target linux-arm64 archive-check "$archive"
          python3 build.py --target linux-arm64 build-record postgresql "$archive" "$RUNNER_TEMP/output/record.json" --revision "$GITHUB_SHA" --development-archive "$development"
          SH
          python3 -m verification.measure --disk-path / "$RUNNER_TEMP/output/metrics.json" -- bash "$RUNNER_TEMP/postgresql-build.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: spike2-linux-arm64-postgresql
          path: ${{ runner.temp }}/output/
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike2-linux-arm64-postgresql-metrics
          path: ${{ runner.temp }}/output/metrics.json
          if-no-files-found: warn

  extensions:
    needs: [prepare, postgresql]
    if: always() && needs.prepare.result == 'success' && (needs.postgresql.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'retry-extension'))
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.prepare.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install extension build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex curl ca-certificates file patchelf pkg-config \
            libicu-dev liblz4-dev libzstd-dev libssl-dev libxml2-dev libxslt1-dev \
            zlib1g-dev uuid-dev python3 musl-tools binutils \
            libgeos-dev libproj-dev proj-data libgdal-dev gdal-data libjson-c-dev \
            libsfcgal-dev libprotobuf-c-dev protobuf-c-compiler libreadline-dev \
            libclang-dev
      - name: Select PostgreSQL build
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          POSTGRESQL_RUN: ${{ inputs.postgresql_run }}
        run: |
          set -euo pipefail
          run_id="$GITHUB_RUN_ID"
          if [[ "$OPERATION" == retry-extension ]]; then run_id="$POSTGRESQL_RUN"; fi
          python3 build.py --target linux-arm64 select-runs "$RUNNER_TEMP/postgresql-selection" --run "$run_id" --component postgresql
          development=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["components"]["postgresql"]["development_archive"])' "$RUNNER_TEMP/postgresql-selection/selection.json")
          mkdir -p "$RUNNER_TEMP/development"
          tar -xzf "$development" -C "$RUNNER_TEMP/development"
          sudo mkdir -p /opt/postgresql
          sudo cp -a "$RUNNER_TEMP/development/postgresql/." /opt/postgresql/
          sudo chown -R "$USER":"$(id -gn)" /opt/postgresql
          test -x /opt/postgresql/bin/pg_config
      - name: Build extension package
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/output"
          cat > "$RUNNER_TEMP/extension-build.sh" <<'SH'
          set -euo pipefail
          python3 build.py --target linux-arm64 extension-build "$PACKAGE" /opt/postgresql "$RUNNER_TEMP/output"
          version=$(python3 -c 'import json; print(json.load(open("support.json"))["postgresql"]["version"])')
          archive="$RUNNER_TEMP/output/$PACKAGE-postgresql-$version-linux-arm64.tar.gz"
          postgres=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["components"]["postgresql"]["archive"])' "$RUNNER_TEMP/postgresql-selection/selection.json")
          python3 build.py --target linux-arm64 archive-check "$postgres" "$archive"
          python3 build.py --target linux-arm64 build-record "$PACKAGE" "$archive" "$RUNNER_TEMP/output/record.json" --revision "$GITHUB_SHA" --postgresql-archive "$postgres"
          SH
          python3 -m verification.measure --disk-path / "$RUNNER_TEMP/output/metrics.json" -- bash "$RUNNER_TEMP/extension-build.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: spike2-linux-arm64-${{ matrix.package }}
          path: ${{ runner.temp }}/output/
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike2-linux-arm64-${{ matrix.package }}-metrics
          path: ${{ runner.temp }}/output/metrics.json
          if-no-files-found: warn

  verify:
    needs: [prepare, postgresql, extensions]
    if: always() && needs.prepare.result == 'success' && (inputs.operation == 'full' || inputs.operation == 'verify')
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Verify selected archives in a fresh runner
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          RUNS: ${{ inputs.runs }}
        run: |
          set -euo pipefail
          command=(python3 build.py --target linux-arm64 select-runs "$RUNNER_TEMP/selected" --verify)
          if [[ "$OPERATION" == full ]]; then
            command+=(--run "$GITHUB_RUN_ID")
          else
            IFS=',' read -ra run_ids <<< "$RUNS"
            for run_id in "${run_ids[@]}"; do command+=(--run "$run_id"); done
          fi
          "${command[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike2-linux-arm64-verification
          path: ${{ runner.temp }}/selected/
          if-no-files-found: warn
          compression-level: 0
