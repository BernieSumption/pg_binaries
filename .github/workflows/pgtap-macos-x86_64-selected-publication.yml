name: pgTAP selected PostgreSQL macOS x86_64 publication

on:
  workflow_call:
    inputs:
      postgresql_version:
        required: true
        type: string
      extension_version:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      postgresql_version:
        description: Selected PostgreSQL release
        required: true
        type: string
        default: '18.6'
      extension_version:
        description: Optional pgTAP release selector
        required: false
        type: string
        default: ''

permissions:
  actions: read
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      postgresql_version: ${{ steps.plan.outputs.postgresql_version }}
      extension_version: ${{ steps.plan.outputs.selected_version }}
      work_group_id: ${{ steps.work.outputs.group_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate the selected target
        id: plan
        env:
          POSTGRESQL_VERSION: ${{ inputs.postgresql_version }}
          EXTENSION_VERSION: ${{ inputs.extension_version }}
        run: |
          set -euo pipefail
          if [[ -z "$POSTGRESQL_VERSION" ]]; then
            POSTGRESQL_VERSION=$(python3 -c 'import json; print(json.load(open("experiments/pgtap-macos-x86_64-target-trial/target.json"))["postgresql_version"])')
          fi
          args=(--project pgtap --platform macos-x86_64 --postgresql-version "$POSTGRESQL_VERSION")
          if [[ -n "$EXTENSION_VERSION" ]]; then args+=(--extension-version "$EXTENSION_VERSION"); fi
          python3 tools/extension_archive_plan.py "${args[@]}" --github-output "$GITHUB_OUTPUT" > "$RUNNER_TEMP/selection.json"
          selected_version=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["selected_version"])' "$RUNNER_TEMP/selection.json")
          if [[ "$selected_version" != '1.3.4' ]]; then
            echo "The selected pgTAP release is $selected_version; the macOS recipe and publication tools support only 1.3.4." >&2
            exit 1
          fi
      - name: Resolve selected build work and prerequisites
        id: work
        env:
          POSTGRESQL_VERSION: ${{ steps.plan.outputs.postgresql_version }}
          EXTENSION_VERSION: ${{ steps.plan.outputs.selected_version }}
        run: |
          set -euo pipefail
          python3 tools/select_extension_work.py \
            --project pgtap --version "$EXTENSION_VERSION" \
            --platform macos-x86_64 --postgresql-version "$POSTGRESQL_VERSION" \
            --github-output "$GITHUB_OUTPUT" > "$RUNNER_TEMP/selected-work.json"
          python3 - "$RUNNER_TEMP/selected-work.json" "$POSTGRESQL_VERSION" "$EXTENSION_VERSION" <<'PY'
          import json, sys
          work=json.load(open(sys.argv[1],encoding='utf-8'))
          pg,version=sys.argv[2:4]
          if (work.get('project') != 'pgtap' or work.get('version') != version
                  or work.get('postgresql_version') != pg
                  or work.get('platform') != 'macos-x86_64'
                  or work.get('architecture') != 'x86_64'):
              raise SystemExit('selected work does not match the exact requested target')
          PY

  build:
    needs: select
    if: needs.select.result == 'success'
    runs-on: macos-15-intel
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Create the selected PostgreSQL core base target
        env:
          POSTGRESQL_VERSION: ${{ needs.select.outputs.postgresql_version }}
        run: |
          python3 tools/pgtap_macos_target.py --postgresql-version "$POSTGRESQL_VERSION" \
            --architecture x86_64 --output "$RUNNER_TEMP/pgtap-base-target.json"
      - name: Retrieve a checked core archive or build the selected PostgreSQL release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/macos/resolve-core.sh "$RUNNER_TEMP/pgtap-base-target.json" "$RUNNER_TEMP/core-archives"
      - name: Build and package pgTAP against the selected core archive
        id: package
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/pgtap-build"
          bash scripts/pgtap/macos-feasibility.sh "$RUNNER_TEMP/core-archives" "$RUNNER_TEMP/pgtap-build" "$RUNNER_TEMP/core-archives/target.json" --build-only 2>&1 | tee "$RUNNER_TEMP/pgtap-build/build-log.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pgtap-macos-x86_64-${{ needs.select.outputs.postgresql_version }}-build-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/core-archives/**
            ${{ runner.temp }}/pgtap-build/**
          if-no-files-found: warn
          retention-days: 7
      - name: Require package build to pass
        if: always()
        run: test '${{ steps.package.outcome }}' = success

  verify:
    needs: [select, build]
    if: always() && needs.select.result == 'success'
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check pgTAP publication evidence tooling
        run: python3 -m unittest tests/test_pgtap_macos_publication.py tests/test_pgtap_macos_fresh_runner_boundary.py
      - name: Download final core and pgTAP archives from the build runner
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pgtap-macos-x86_64-${{ needs.select.outputs.postgresql_version }}-build-${{ github.run_id }}
          path: ${{ runner.temp }}/pgtap-bundle
      - name: Prepare verification inputs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/core-archives" "$RUNNER_TEMP/pgTAP-publication"
          if [[ -d "$RUNNER_TEMP/pgtap-bundle/core-archives" ]]; then cp -a "$RUNNER_TEMP/pgtap-bundle/core-archives/." "$RUNNER_TEMP/core-archives/"; fi
          if [[ -d "$RUNNER_TEMP/pgtap-bundle/pgtap-build" ]]; then cp -a "$RUNNER_TEMP/pgtap-bundle/pgtap-build/." "$RUNNER_TEMP/pgTAP-publication/"; fi
      - name: Inspect final core and pgTAP archives on the fresh runner
        id: static_analysis
        if: always() && steps.download.outcome == 'success'
        continue-on-error: true
        run: bash scripts/pgtap/verify-macos-publication.sh static-analysis "$RUNNER_TEMP/core-archives" "$RUNNER_TEMP/pgTAP-publication" "$RUNNER_TEMP/pgTAP-publication" "$RUNNER_TEMP/core-archives/target.json"
      - name: Assemble and exercise the final archives on the fresh runner
        id: archive_suite
        if: always() && steps.download.outcome == 'success'
        continue-on-error: true
        run: bash scripts/pgtap/verify-macos-publication.sh archive-suite "$RUNNER_TEMP/core-archives" "$RUNNER_TEMP/pgTAP-publication" "$RUNNER_TEMP/pgTAP-publication" "$RUNNER_TEMP/core-archives/target.json"
      - name: Finalize archive receipt and verification record
        if: always()
        env:
          ARCHIVE_SUITE_OUTCOME: ${{ steps.archive_suite.outcome }}
          STATIC_ANALYSIS_OUTCOME: ${{ steps.static_analysis.outcome }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          image_id="${ImageOS:?runner image OS missing}/${ImageVersion:?runner image version missing}"
          os_version="$(sw_vers -productVersion)"
          python3 tools/emit_pgtap_macos_publication.py \
            --target-config "$RUNNER_TEMP/core-archives/target.json" \
            --core-archives "$RUNNER_TEMP/core-archives" \
            --archives "$RUNNER_TEMP/pgTAP-publication" \
            --output "$RUNNER_TEMP/pgTAP-publication" \
            --os-version "$os_version" --image-id "$image_id" \
            --archive-suite-result "$ARCHIVE_SUITE_OUTCOME" \
            --static-analysis-result "$STATIC_ANALYSIS_OUTCOME"
      - name: Validate and retain archive-bound publication evidence
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/pgTAP-publication/publication/attempt.json" ]]; then
            python3 tools/import_pgtap_macos_publication.py \
              --target-config "$RUNNER_TEMP/core-archives/target.json" \
              --core-artifact "$RUNNER_TEMP/core-archives" \
              --pgtap-artifact "$RUNNER_TEMP/pgTAP-publication" \
              --run-id "$GITHUB_RUN_ID"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pgtap-macos-x86_64-${{ needs.select.outputs.postgresql_version }}-publication-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pgTAP-publication/*.tar.gz
            ${{ runner.temp }}/pgTAP-publication/*.sha256
            ${{ runner.temp }}/pgTAP-publication/*.json
            ${{ runner.temp }}/pgTAP-publication/*.txt
            ${{ runner.temp }}/pgTAP-publication/publication/**
            support/evidence/pgtap-macos-publication-${{ github.run_id }}/x86_64/**
            support/verification/pgtap-1.3.4-postgresql-${{ needs.select.outputs.postgresql_version }}-macos-x86_64-current-${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 7
      - name: Require both fresh-runner verification cases to pass
        if: always()
        run: |
          if [[ '${{ needs.build.result }}' != success || '${{ steps.download.outcome }}' != success || '${{ steps.archive_suite.outcome }}' != success || '${{ steps.static_analysis.outcome }}' != success ]]; then
            echo 'pgTAP macOS archive-suite and static-analysis cases must both pass on the fresh runner.' >&2
            exit 1
          fi
